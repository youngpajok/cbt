  {s:"스프레드시트",q:"다음 중 문자 위치를 찾는 함수식의 결과로 옳은 것은? (FIND는 대/소문자 구분·와일드카드 불가, SEARCH는 구분 안 함·와일드카드 가능)\n\n=SEARCH(\"P?J\",\"YoungPaJok CBT\")",o:["0", "1", "#VALUE!", "6"],a:3,e:"SEARCH는 <b>와일드카드(?,*)</b>를 지원하므로 '?'가 한 글자를 대신해 패턴과 일치하는 시작 위치 <b>6</b>를 찾는다. FIND는 와일드카드를 지원하지 않아 같은 식에서 #VALUE!가 난다."},
  {s:"스프레드시트",q:"아래 시트에서 부서가 '영업부'인 직원의 급여 합계를 [F2]에 구하려 한다. 입력할 수식으로 옳은 것은?",o:["=DSUM(B2:B4,\"영업부\",D2:D4)", "=SUMIF(D2:D4,\"영업부\",B2:B4)", "=COUNTIF(B2:B4,\"영업부\")", "=SUMIF(B2:B4,\"영업부\",D2:D4)"],a:3,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">이름</td><td class=\"hd\">부서</td><td class=\"hd\">직급</td><td class=\"hd\">급여</td></tr><tr><td class=\"rh\">2</td><td>김하나</td><td class=\"l\">인사부</td><td>대리</td><td>4,200,000</td></tr><tr><td class=\"rh\">3</td><td>윤서준</td><td class=\"l\">인사부</td><td>과장</td><td>4,800,000</td></tr><tr><td class=\"rh\">4</td><td>정우진</td><td class=\"l\">영업부</td><td>사원</td><td>2,600,000</td></tr></table>",e:"SUMIF(<b>조건범위, 조건, 합계범위</b>) → 부서(B)에서 '영업부'를 찾아 급여(D)를 더한다."},
  {s:"스프레드시트",q:"다음 그림과 같이 [목표값 찾기]를 설정했을 때, 그 의미로 옳은 것은?",o:["평균(E4)이 30이 되려면 노트북 판매량(B4)이 얼마가 되어야 하는가?", "노트북 판매량(B4)이 30이 되려면 평균(E4)이 얼마가 되어야 하는가?", "노트북 판매량을 30으로 바꾸면 평균(E4)은 얼마가 되는가?", "평균이 30이 되려면 노트북 외 나머지 제품 판매량은 얼마가 되어야 하는가?"],a:0,fig:"<div class=\"figwrap\"><table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th></tr><tr><td class=\"rh\">1</td><td class=\"tt\" colspan=\"5\">제품별 판매현황</td></tr><tr><td class=\"rh\">3</td><td class=\"hd\">품목</td><td class=\"hd\">노트북</td><td class=\"hd\">프린터</td><td class=\"hd\">스캐너</td><td class=\"hd\">평균</td></tr><tr><td class=\"rh\">4</td><td class=\"hd\">판매량</td><td>50</td><td>37</td><td>18</td><td>35.0</td></tr></table><div class=\"dlg\"><div class=\"tb\"><span>목표값 찾기</span><span class=\"x\">? ✕</span></div><div class=\"bd\"><div class=\"row\"><span>수식 셀(E):</span><span class=\"inp\">$E$4</span></div><div class=\"row\"><span>찾는 값(V):</span><span class=\"inp\">30</span></div><div class=\"row\"><span>값을 바꿀 셀(C):</span><span class=\"inp\">$B$4</span></div><div class=\"btns\"><span class=\"btn pri\">확인</span><span class=\"btn\">취소</span></div></div></div></div>",e:"목표값 찾기는 <b>수식 셀(E4·평균)이 찾는 값(30)</b>이 되도록 <b>값을 바꿀 셀(B4·노트북)</b>을 역산한다."},
  {s:"스프레드시트",q:"다음 중 문자 위치를 찾는 함수식의 결과로 옳은 것은? (FIND는 대/소문자 구분·와일드카드 불가, SEARCH는 구분 안 함·와일드카드 가능)\n\n=FIND(\"\",\"YOUNGPAJOK MASTER\")",o:["0", "#VALUE!", "1", "17"],a:2,e:"찾을 문자열이 <b>빈 문자열(\"\")</b>이면 FIND·SEARCH 모두 시작 위치인 <b>1</b>을 반환한다. 예: =FIND(\"\",\"YOUNGPAJOK MASTER\") → 1."},
  {s:"스프레드시트",q:"다음 중 REPT 함수로 문자를 반복한 결과로 옳은 것은?\n\n=REPT(\"★\",5)&REPT(\"☆\",5-5)",o:["★★★★★★", "★★★★★", "☆☆☆☆☆", "★★★★1"],a:1,e:"★를 5번, ☆를 0번 이어 붙여 5칸 별점을 만든다 → ★★★★★"},
  {s:"스프레드시트",q:"다음 중 날짜 함수 수식의 실행 결과로 옳은 것은?\n\n=EDATE(\"2025-04-13\",5)",o:["2025-09-14", "2025-09-01", "2025-09-13", "2025-09-10"],a:2,e:"EDATE는 기준일에서 지정한 개월 수(5개월) 뒤의 '같은 날'을 반환한다 → <b>2025-09-13</b>."},
  {s:"스프레드시트",q:"다음 중 수식의 실행 결과가 옳지 않은 것은?",o:["=ROUND(123.642,2) → 123.64", "=TRUNC(-6.5) → -7", "=MOD(4,5) → 4", "=INT(-2.1) → -3"],a:1,e:"=TRUNC(-6.5)의 올바른 결과는 -6이다. (INT=내림, TRUNC=절사, MOD=n-d×INT(n/d), ROUND=반올림)"},
  {s:"스프레드시트",q:"아래 표에서 전체 판매 금액(수량×단가의 합계)을 한 번에 구하려고 한다. 가장 적절한 수식은? (참고: 총액 212,000원)",o:["=SUM(B2:B4)*SUM(C2:C4)", "=SUMPRODUCT(B2:B4+C2:C4)", "=SUMPRODUCT(B2:B4,C2:C4)", "=SUM(B2:B4*C2:C4)"],a:2,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">품목</td><td class=\"hd\">수량</td><td class=\"hd\">단가</td></tr><tr><td class=\"rh\">2</td><td>자</td><td>9</td><td>15,000</td></tr><tr><td class=\"rh\">3</td><td>풀</td><td>8</td><td>4,000</td></tr><tr><td class=\"rh\">4</td><td>연필</td><td>3</td><td>15,000</td></tr></table>",e:"<b>SUMPRODUCT(배열1, 배열2)</b>는 대응하는 원소끼리 곱한 뒤 모두 더한다 → <b>212,000</b>원. =SUM(B*C)는 일반 입력 시 배열이 아니라 오류/단일값이 되고(배열 입력해야 함), SUM(B)*SUM(C)는 합끼리 곱해 의미가 다르다."},
  {s:"스프레드시트",q:"다음 수식의 실행 결과로 옳은 것은?\n\n=IF(MOD(A1,4)=0,\"배수\",\"아님\")   (단, [A1]=31)",o:["배수", "아님", "0", "TRUE"],a:1,e:"MOD(31,4)=3 → 아님"},
  {s:"스프레드시트",q:"셀 값이 1,000 이상이면 '빨강', 1,000 미만 500 이상이면 '파랑', 500 미만이면 색을 지정하지 않고, 모든 구간에서 천 단위 구분 기호(,)와 소수 이하 첫째 자리까지 표시하려고 한다. 사용자 지정 표시 형식으로 옳은 것은? (예: 1234.56 → 1,234.6, 432 → 432.0)",o:["[빨강][>=1000]#,##0.0;[파랑][>=500]#,##0.0", "[빨강][>=1000]#,##0.0;[파랑][>=500]#,##0.0;#,##0.0", "[>=1000]<빨강>#,##0.0;[>=500]<파랑>#,##0.0;#,##0.0", "[빨강][>=1000]#,###.#;[파랑][>=500]#,###.#;#,###.#"],a:1,e:"사용자 지정 형식은 <b>[조건·색]양수서식;[조건·색]서식;나머지서식</b> 구조로, 색과 조건은 대괄호 [빨강][>=1000] 안에 넣는다. 소수 첫째 자리는 0을 써서 <b>#,##0.0</b>으로 해야 432가 432.0으로 나온다(#,###.#은 432를 432.로 만들어 틀림). 꺾쇠<>로 색을 넣는 문법은 없다. 정답: <b>[빨강][>=1000]#,##0.0;[파랑][>=500]#,##0.0;#,##0.0</b>"},
  {s:"스프레드시트",q:"아래 표에서 전체 판매 금액(수량×단가의 합계)을 한 번에 구하려고 한다. 가장 적절한 수식은? (참고: 총액 185,000원)",o:["=SUM(B2:B4*C2:C4)", "=SUMPRODUCT(B2:B4+C2:C4)", "=SUM(B2:B4)*SUM(C2:C4)", "=SUMPRODUCT(B2:B4,C2:C4)"],a:3,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">품목</td><td class=\"hd\">수량</td><td class=\"hd\">단가</td></tr><tr><td class=\"rh\">2</td><td>자</td><td>7</td><td>6,000</td></tr><tr><td class=\"rh\">3</td><td>연필</td><td>9</td><td>13,000</td></tr><tr><td class=\"rh\">4</td><td>지우개</td><td>2</td><td>13,000</td></tr></table>",e:"<b>SUMPRODUCT(배열1, 배열2)</b>는 대응하는 원소끼리 곱한 뒤 모두 더한다 → <b>185,000</b>원. =SUM(B*C)는 일반 입력 시 배열이 아니라 오류/단일값이 되고(배열 입력해야 함), SUM(B)*SUM(C)는 합끼리 곱해 의미가 다르다."}
 ]},
{ name:'기출 6회', q:[
  {s:"컴퓨터일반",q:"다음 중 생성형 AI를 학습에 활용할 때 바람직한 태도로 옳은 것은?",o:["답변을 그대로 복사해 과제로 제출한다.", "결과의 사실 여부와 출처를 스스로 확인한 뒤 참고한다.", "개인정보·회사 기밀을 자유롭게 입력한다.", "저작권이 있는 자료를 출처 없이 가져다 쓴다."],a:1,e:"생성형 AI 결과는 <b>사실·출처를 확인한 뒤 참고</b>해야 하며, 개인정보·저작권에 유의한다."},
  {s:"컴퓨터일반",q:"다음 중 데이터와 AI에 대한 설명으로 옳지 않은 것은?",o:["빅데이터는 대용량·다양성·빠른 생성 속도를 특징으로 한다.", "AI 모델의 성능은 학습 데이터의 양과 질에 큰 영향을 받는다.", "데이터 레이블링은 학습 데이터에 정답(라벨)을 붙이는 작업이다.", "학습 데이터가 편향되어도 AI 결과는 항상 공정하게 나온다."],a:3,e:"학습 데이터가 편향되면 <b>AI 결과도 편향</b>된다(편향 입력→편향 출력)."},
  {s:"컴퓨터일반",q:"다음 중 모바일 기기·서비스 용어에 대한 설명으로 옳지 않은 것은?",o:["테더링은 스마트폰 데이터를 다른 기기와 공유한다.", "앱 마켓에서 응용 프로그램을 내려받아 설치한다.", "QR 코드는 2차원 바코드로 많은 정보를 담는다.", "비행기 모드는 저장 공간을 자동으로 늘려 준다."],a:3,e:"비행기 모드는 무선 통신(이동통신·Wi-Fi·블루투스)을 끄는 기능으로 저장 공간과 무관하다."},
  {s:"컴퓨터일반",q:"다음 중 웹 브라우저의 기능으로 옳지 않은 것은?",o:["웹 페이지를 열어 표시한다.", "즐겨찾기를 등록·관리한다.", "방문 기록을 저장한다.", "스프레드시트 수식을 계산한다."],a:3,e:"스프레드시트 수식 계산은 엑셀 같은 표 계산 프로그램의 기능이다. 웹 브라우저는 페이지 표시·즐겨찾기·기록 관리 등을 한다."},
  {s:"컴퓨터일반",q:"다음에서 설명하는 AI 기술로 옳은 것은?\n\n컴퓨터가 사람의 언어를 이해하고 생성하도록 하여 번역·요약·질의응답 등에 활용되는 기술이다.",o:["자연어 처리(NLP)", "컴퓨터 비전", "로보틱스", "블록체인"],a:0,e:"언어를 이해·생성하는 기술은 <b>자연어 처리(NLP)</b>다."},
  {s:"컴퓨터일반",q:"다음 중 현실과 가상이 융합된 3차원 디지털 공간에서 아바타를 통해 사회·경제·문화 활동을 하는 것을 의미하는 것은?",o:["메타버스", "유비쿼터스", "인트라넷", "블록체인"],a:0,e:"아바타로 활동하는 3차원 가상 융합 공간은 <b>메타버스</b>다."},
  {s:"컴퓨터일반",q:"다음 중 16진수 2A를 10진수로 변환한 값으로 옳은 것은?",o:["32", "40", "42", "52"],a:2,e:"2A₁₆ = 2×16 + 10 = <b>42</b>다."},
  {s:"컴퓨터일반",q:"다음 중 Windows의 바로 가기(Shortcut) 아이콘에 대한 설명으로 옳지 않은 것은?",o:["바로 가기 아이콘을 삭제해도 원본 파일에는 영향을 주지 않는다.", "한 원본 파일에 대해 여러 개의 바로 가기를 만들 수 있다.", "바로 가기 아이콘의 확장자는 <b>.LNK</b>이며 아이콘 왼쪽 아래에 화살표가 표시된다.", "바로 가기 아이콘을 다른 컴퓨터로 복사하면 원본 파일도 함께 복사된다."],a:3,e:"바로 가기는 원본의 '위치 정보(링크)'만 담고 있어 복사해도 원본은 따라가지 않는다. 그래서 링크가 끊기면 실행되지 않는다. 확장자는 .LNK, 원본과 독립적으로 삭제·다중 생성이 가능하다."},
  {s:"컴퓨터일반",q:"다음 중 DRAM과 SRAM을 비교한 설명으로 옳지 않은 것은?",o:["DRAM은 주기적인 재충전(Refresh)이 필요하다.", "SRAM은 DRAM보다 접근 속도가 빠르다.", "DRAM은 SRAM보다 집적도가 높아 대용량 주기억장치에 적합하다.", "SRAM은 가격이 저렴하고 소비 전력이 적어 주기억장치로 널리 쓰인다."],a:3,e:"SRAM은 빠르지만 가격이 비싸고 집적도가 낮아 주로 '캐시'에 쓰인다. 저렴·대용량이라 주기억장치로 널리 쓰이는 것은 DRAM이다."},
  {s:"컴퓨터일반",q:"다음 중 사운드·동영상 파일에 대한 설명으로 옳지 않은 것은?",o:["WAV는 비압축 오디오로 파일 크기가 크다.", "MIDI는 음의 높이·길이·세기 등 연주 정보를 저장해 용량이 작다.", "MP3는 MPEG 오디오 계층3을 이용한 손실 압축 음악 파일이다.", "MIDI는 사람의 목소리나 자연의 소리를 그대로 녹음해 저장하는 방식이다."],a:3,e:"사람 목소리·자연의 소리를 녹음하는 것은 <b>WAV 등 파형 방식</b>이다. MIDI는 연주 정보만 저장한다."},
  {s:"컴퓨터일반",q:"다음 중 프로세스 상태 전이에 대한 설명으로 옳지 않은 것은?",o:["준비(Ready)는 CPU 할당을 기다리는 상태다.", "실행(Run)은 CPU를 할당받아 명령을 수행하는 상태다.", "대기(Block)는 입출력 등 사건을 기다리는 상태다.", "디스패치(Dispatch)는 실행 상태에서 준비 상태로 CPU를 뺏기는 것이다."],a:3,e:"디스패치는 <b>준비→실행</b>으로 CPU를 할당받는 것이다. 실행→준비는 '타임아웃'이다."},
  {s:"컴퓨터일반",q:"다음 중 데이터 처리를 중앙 서버가 아니라 데이터가 발생하는 현장(단말) 가까이에서 처리하는 기술을 의미하는 것은?",o:["엣지 컴퓨팅", "클라우드 컴퓨팅", "그리드 컴퓨팅", "양자 컴퓨팅"],a:0,e:"현장 가까이에서 처리하는 것은 <b>엣지 컴퓨팅</b>이다."},
  {s:"컴퓨터일반",q:"다음 중 운영체제(OS)에 해당하지 않는 것은?",o:["Windows", "Linux", "macOS", "Microsoft Excel"],a:3,e:"Excel은 응용 소프트웨어(표 계산 프로그램)이다. Windows·Linux·macOS는 운영체제이다."},
  {s:"컴퓨터일반",q:"다음에서 설명하는 것으로 옳은 것은?\n\n방대한 텍스트로 학습하여 사람과 유사하게 문장을 이해하고 생성하는 대규모 인공지능 언어 모델이다.",o:["LLM(대규모 언어 모델)", "DBMS", "OLAP", "RPA"],a:0,e:"대규모 언어 모델은 <b>LLM</b>이다."},
  {s:"컴퓨터일반",q:"다음 중 무선 주파수를 이용해 태그에 저장된 정보를 비접촉으로 읽어 들이는 인식 기술을 의미하는 것은?",o:["RFID", "OCR", "OMR", "MICR"],a:0,e:"무선 주파수로 태그를 비접촉 인식하는 것은 <b>RFID</b>다."},
  {s:"컴퓨터일반",q:"다음 중 직렬 전송과 병렬 전송에 대한 설명으로 옳은 것은?",o:["직렬 전송은 한 줄로 한 비트씩 차례로 보내 원거리에 유리하다.", "병렬 전송은 한 비트씩 차례로 보내는 방식이다.", "직렬 전송이 병렬 전송보다 항상 빠르다.", "병렬 전송은 거리가 멀수록 비용이 적게 든다."],a:0,e:"직렬 전송은 한 선으로 1비트씩 보내 선이 적어 원거리·저비용에 유리하다. 병렬 전송은 여러 선으로 동시에 보내 근거리에서 빠르다."},
  {s:"컴퓨터일반",q:"다음 중 샘플링 22kHz, 양자화 8비트, 스테레오(2채널)로 60초간 녹음한 비압축 디지털 오디오의 용량으로 가장 가까운 것은?",o:["약 20.1MB", "약 1.3MB", "약 5.0MB", "약 2.5MB"],a:3,e:"오디오 용량 = 샘플링 주파수 × (양자화 비트÷8) × 채널 수 × 시간 = 22,000 × 1 × 2 × 60 = <b>2,640,000 Byte</b> ≒ 약 2.5MB."},
  {s:"컴퓨터일반",q:"다음은 7비트 ASCII 코드에 짝수 패리티 비트를 '오른쪽 끝 1비트'로 붙인 8비트 코드이다. 전송 중 오류가 발생한(패리티가 어긋난) 것은?",o:["00011011", "00010110", "00000110", "10100101"],a:1,e:"짝수 패리티는 8비트 전체에서 1의 개수가 짝수가 되도록 패리티 비트를 정한다. 정답 코드 <b>00010110</b>는 1의 개수가 3개로 짝수가 아니어서 오류이다. (패리티 비트는 1비트 오류의 '발생 여부'만 검출하고 위치는 못 찾는다.)"},
  {s:"컴퓨터일반",q:"다음 중 8비트 2진수 00011100의 2의 보수로 옳은 것은?",o:["11100100", "00011011", "00011101", "11100011"],a:0,e:"2의 보수 = 1의 보수(비트 반전=11100011) + 1 = <b>11100100</b>."},
  {s:"컴퓨터일반",q:"다음 중 가로 1280픽셀 × 세로 480픽셀, 한 픽셀을 8비트로 표현하는 비압축 비트맵 이미지의 용량으로 옳은 것은? (1KB=1,024Byte)",o:["200KB", "4,800KB", "1,200KB", "600KB"],a:3,e:"비트맵 용량 = 가로×세로×색 깊이(비트)÷8 = 1280×480×8÷8 = <b>614,400 Byte</b> ≒ 600KB."},
  {s:"스프레드시트",q:"다음 중 3차원 차트로 작성할 수 없는 것으로만 바르게 묶은 것은?",o:["세로 막대형, 꺾은선형, 원형", "분산형, 주식형, 방사형", "영역형, 세로 막대형, 가로 막대형", "꺾은선형, 영역형, 원형"],a:1,e:"3차원으로 작성할 수 없는 대표 차트는 <b>분산형·주식형·방사형</b>(및 도넛형)이다."},
  {s:"스프레드시트",q:"다음 중 중첩(결합) 수식에 대한 설명으로 옳지 않은 것은?",o:["=ROUND(AVERAGEIFS(L3:L11,I3:I11,\"남\",J3:J11,\"<>과장\"),-3)은 조건부 평균을 백의 자리에서 반올림한다.", "=TEXT(DSUM(A2:E10,\"금액\",G1:G2),\"₩#,##0원\")은 집계 결과를 통화 서식 문자로 바꾼다.", "=LEFT(A4,4)&\"학번\"의 결과는 숫자로 취급되어 오른쪽에 정렬된다.", "=IF(COUNTIF(B2:B8,\"완료\")>=5,\"달성\",\"미달\")은 '완료'가 5개 이상이면 '달성'이다."],a:2,e:"&로 연결한 결과는 항상 <b>문자</b>라 <b>왼쪽 정렬</b>된다."},
  {s:"스프레드시트",q:"다음 중 워크시트 탭(시트 탭)에 대한 작업으로 옳지 않은 것은?",o:["탭을 더블클릭하면 시트 이름을 바꿀 수 있다.", "탭을 드래그하면 시트 순서를 옮길 수 있다.", "Ctrl을 누른 채 탭을 드래그하면 시트가 복사된다.", "시트 탭에는 색을 지정할 수 없다."],a:3,e:"시트 탭은 바로 가기 메뉴의 '탭 색'으로 색을 지정할 수 있다. 이름 바꾸기(더블클릭), 이동(드래그), 복사(Ctrl+드래그)는 모두 가능하다."},
  {s:"스프레드시트",q:"다음 중 자동 채우기와 연속 데이터에 대한 설명으로 옳지 않은 것은?",o:["문자만 든 셀을 드래그하면 그대로 복사되고, '1월'처럼 문자+숫자면 숫자 부분이 증가한다.", "날짜 데이터는 채우기 핸들을 드래그하면 기본적으로 1일씩 증가한다.", "'월, 화, 수' 같은 사용자 지정 목록도 자동 채우기로 입력할 수 있다.", "숫자 두 셀(10, 20)을 범위로 선택해 드래그해도 두 값이 번갈아 복사될 뿐 증가하지 않는다."],a:3,e:"숫자 두 셀을 선택해 드래그하면 두 값의 <b>차이(10)만큼 등차로 증가</b>한다(10,20,30…)."},
  {s:"스프레드시트",q:"다음 중 셀 참조에 대한 설명으로 옳지 않은 것은?",o:["상대 참조(A1)는 복사하면 위치에 따라 주소가 바뀐다.", "절대 참조($A$1)는 복사해도 주소가 바뀌지 않는다.", "혼합 참조($A1, A$1)는 행·열 중 하나만 고정한다.", "F4 키를 누르면 절대→혼합→상대 순으로만 한 방향으로 바뀐다."],a:3,e:"F4는 <b>절대→행고정→열고정→상대</b>로 순환하며 바뀐다(한 방향 아님)."},
  {s:"스프레드시트",q:"다음 중 그림의 고급 필터 조건에 대한 해석으로 옳은 것은?",o:["직위가 '과장'이고 급여가 평균 이상", "직위가 '과장'이거나 급여가 평균 이상", "직위가 '과장'이고 급여가 400 이상", "직위가 '과장'이거나 급여가 400 이상"],a:2,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">직위</td><td class=\"hd\">급여</td></tr><tr><td class=\"rh\">2</td><td class=\"l\">과장</td><td class=\"l\">>=400</td></tr></table>",e:"같은 행에 둔 조건은 <b>AND</b>로 결합된다: 과장 <b>그리고</b> 급여 400 이상."},
  {s:"스프레드시트",q:"다음 중 날짜·시간 함수에 대한 설명으로 옳지 않은 것은?",o:["=TODAY()는 오늘 날짜, =NOW()는 현재 날짜와 시간을 반환한다.", "=WEEKDAY(날짜,2)는 월요일을 1로 시작하는 요일 번호를 반환한다.", "=DATEDIF(시작,종료,\"Y\")는 두 날짜 사이의 만 연수를 구한다.", "=EOMONTH(날짜,0)은 해당 월의 첫째 날 날짜를 반환한다."],a:3,e:"=EOMONTH(날짜,0)은 해당 월의 <b>마지막 날</b>을 반환한다(첫날 아님)."},
  {s:"스프레드시트",q:"다음 중 차트의 구성 요소에 대한 설명으로 옳지 않은 것은?",o:["차트 영역은 전체를 감싸는 가장 바깥 영역, 그림 영역은 축과 계열이 그려지는 안쪽 영역이다.", "데이터 레이블은 각 요소의 값·항목 이름·계열 이름 등을 직접 표시한다.", "추세선은 데이터 변화 추세를 예측하는 선으로 회귀 분석이라고도 한다.", "범례는 계열을 색·기호로 설명하며, 원형 차트에서는 가로·세로 축이 범례를 대신한다."],a:3,e:"원형 차트는 <b>가로·세로 축이 없다</b>."},
  {s:"스프레드시트",q:"다음 중 SUBSTITUTE 함수를 사용한 수식의 실행 결과로 옳은 것은?\n\n=SUBSTITUTE(\"73-90-63-95\",\"-\",\":\",2)",o:["73:90:63:95", "73-90-63:95", "73:90:63-95", "73-90:63-95"],a:3,e:"네 번째 인수 2은(는) 2번째 '-'만 ':'로 바꾼다 → <b>73-90:63-95</b>. (인수를 생략하면 모든 '-'를 바꾼다.)"},
  {s:"스프레드시트",q:"다음 중 REPT 함수로 문자를 반복한 결과로 옳은 것은?\n\n=REPT(\"★\",2)&REPT(\"☆\",5-2)",o:["★★★☆☆", "★★☆☆1", "★★", "★★☆☆☆"],a:3,e:"★를 2번, ☆를 3번 이어 붙여 5칸 별점을 만든다 → ★★☆☆☆"},
  {s:"스프레드시트",q:"다음 수식의 실행 결과로 옳은 것은?\n\n=IF(MOD(A1,5)=0,\"배수\",\"아님\")   (단, [A1]=86)",o:["배수", "아님", "0", "TRUE"],a:1,e:"MOD(86,5)=1 → 아님"},
  {s:"스프레드시트",q:"다음 중 REPT 함수로 문자를 반복한 결과로 옳은 것은?\n\n=REPT(\"▣\",INT(69/10))",o:["▣▣▣▣▣", "▣▣▣▣▣▣▣", "▣▣▣", "▣▣▣▣▣▣"],a:3,e:"INT(69/10)=6이므로 '▣'를 <b>6번</b> 반복한다 → ▣▣▣▣▣▣"},
  {s:"스프레드시트",q:"셀 [A1:A5]에 다음 값이 입력되어 있다: 22, 41, 68, 85, 95\n다음 수식(제1사분위수)의 결과로 옳은 것은?\n\n=QUARTILE.INC(A1:A5, 1)",o:["42", "40", "41", "68"],a:2,e:"QUARTILE.INC(범위, 1)는 제1사분위수(하위 25% 지점)를 구하며 PERCENTILE.INC(범위,0.25)와 같다. 정렬된 값에서 결과는 <b>41</b>이다."},
  {s:"스프레드시트",q:"아래 시트에서 입력값에 주어진 표시 형식을 적용했을 때, [C2]의 결과로 옳은 것은?",o:["1", "1,235", "12.5%", "005"],a:1,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">입력값</td><td class=\"hd\">표시 형식</td><td class=\"hd\">결과</td></tr><tr><td class=\"rh\">2</td><td>1234567</td><td class=\"l\">#,##0,</td><td>?</td></tr></table>",e:"천 단위 콤마 뒤 쉼표는 천 단위 생략 → 1,235(천 단위 반올림)"},
  {s:"스프레드시트",q:"다음 중 문자 위치를 찾는 함수식의 결과로 옳은 것은? (FIND는 대/소문자 구분·와일드카드 불가, SEARCH는 구분 안 함·와일드카드 가능)\n\n=FIND(\"k\",\"YOUNGPAJOK\")",o:["1", "#VALUE!", "10", "0"],a:1,e:"FIND는 <b>대/소문자를 구분</b>한다. 대상 \"YOUNGPAJOK\"에 소문자 'k'가 없으면 <b>#VALUE! 오류</b>가 난다. 대소문자를 무시하려면 SEARCH를 써야 한다 (=SEARCH(\"k\",\"YOUNGPAJOK\") → 10)."},
  {s:"스프레드시트",q:"왼쪽 기준표([F2:G6], 오름차순)를 이용해 점수 45점의 등급을 구하려고 한다. 가장 적절한 수식은? (구간의 최저점 이상이면 해당 등급)",o:["=VLOOKUP(45,$F$2:$G$6,2,TRUE)", "=VLOOKUP(45,$F$2:$G$6,2,0)", "=VLOOKUP(45,$F$2:$G$6,2,FALSE)", "=HLOOKUP(45,$F$2:$G$6,2,TRUE)"],a:0,fig:"<table class=\"xg\"><tr><th></th><th>F</th><th>G</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">기준점수</td><td class=\"hd\">등급</td></tr><tr><td class=\"rh\">2</td><td>0</td><td class=\"l\">F</td></tr><tr><td class=\"rh\">3</td><td>60</td><td class=\"l\">D</td></tr><tr><td class=\"rh\">4</td><td>70</td><td class=\"l\">C</td></tr><tr><td class=\"rh\">5</td><td>80</td><td class=\"l\">B</td></tr><tr><td class=\"rh\">6</td><td>90</td><td class=\"l\">A</td></tr></table>",e:"구간(범위) 조회는 네 번째 인수를 <b>TRUE(생략 가능, 근사일치)</b>로 두고 기준표가 <b>오름차순</b>이어야 한다. 45점 → <b>F</b>등급. FALSE(정확히 일치)는 기준표에 없는 값이면 #N/A가 난다."},
  {s:"스프레드시트",q:"다음 수식의 실행 결과로 옳은 것은?\n\n=IF(MOD(A1,5)=0,\"배수\",\"아님\")   (단, [A1]=67)",o:["배수", "아님", "0", "TRUE"],a:1,e:"MOD(67,5)=2 → 아님"},
  {s:"스프레드시트",q:"다음 중 문자 위치를 찾는 함수식의 결과로 옳은 것은? (FIND는 대/소문자 구분·와일드카드 불가, SEARCH는 구분 안 함·와일드카드 가능)\n\n=SEARCH(\"P?J\",\"YoungPaJok CBT\")",o:["#VALUE!", "0", "6", "1"],a:2,e:"SEARCH는 <b>와일드카드(?,*)</b>를 지원하므로 '?'가 한 글자를 대신해 패턴과 일치하는 시작 위치 <b>6</b>를 찾는다. FIND는 와일드카드를 지원하지 않아 같은 식에서 #VALUE!가 난다."},
  {s:"스프레드시트",q:"셀 [A1:A5]에 다음 값이 입력되어 있다: 36, 37, 38, 47, 61\n다음 수식(제1사분위수)의 결과로 옳은 것은?\n\n=QUARTILE.INC(A1:A5, 1)",o:["36", "38", "31", "37"],a:3,e:"QUARTILE.INC(범위, 1)는 제1사분위수(하위 25% 지점)를 구하며 PERCENTILE.INC(범위,0.25)와 같다. 정렬된 값에서 결과는 <b>37</b>이다."},
  {s:"스프레드시트",q:"셀 값이 5,000 이상이면 '녹색', 5,000 미만 300 이상이면 '자홍', 300 미만이면 색을 지정하지 않고, 모든 구간에서 천 단위 구분 기호(,)와 소수 이하 첫째 자리까지 표시하려고 한다. 사용자 지정 표시 형식으로 옳은 것은? (예: 1234.56 → 1,234.6, 432 → 432.0)",o:["[녹색][>=5000]#,##0.0;[자홍][>=300]#,##0.0", "[녹색][>=5000]#,##0.0;[자홍][>=300]#,##0.0;#,##0.0", "[녹색][>=5000]#,###.#;[자홍][>=300]#,###.#;#,###.#", "[>=5000]<녹색>#,##0.0;[>=300]<자홍>#,##0.0;#,##0.0"],a:1,e:"사용자 지정 형식은 <b>[조건·색]양수서식;[조건·색]서식;나머지서식</b> 구조로, 색과 조건은 대괄호 [녹색][>=5000] 안에 넣는다. 소수 첫째 자리는 0을 써서 <b>#,##0.0</b>으로 해야 432가 432.0으로 나온다(#,###.#은 432를 432.로 만들어 틀림). 꺾쇠<>로 색을 넣는 문법은 없다. 정답: <b>[녹색][>=5000]#,##0.0;[자홍][>=300]#,##0.0;#,##0.0</b>"}
 ]},
{ name:'기출 7회', q:[
  {s:"컴퓨터일반",q:"다음 중 플래시 메모리에 대한 설명으로 옳지 않은 것은?",o:["전원이 꺼져도 데이터가 유지되는 비휘발성 메모리다.", "EEPROM의 일종으로 블록 단위로 지우고 쓴다.", "USB 메모리·SSD·메모리 카드 등에 사용된다.", "읽기·쓰기 속도가 느려 주기억장치로만 사용된다."],a:3,e:"플래시 메모리는 <b>보조기억장치</b>로 널리 쓰인다. 주기억장치로만 쓰는 것이 아니다."},
  {s:"컴퓨터일반",q:"다음에서 설명하는 (가)에 해당하는 것으로 옳은 것은?\n\n(가) CPU와 주기억장치 사이에 위치하여 두 장치의 속도 차이를 줄이기 위해 쓰는 고속 기억장치로, 자주 쓰는 내용을 미리 가져다 둔다.",o:["가상 메모리", "연관 메모리", "캐시 메모리", "플래시 메모리"],a:2,e:"CPU와 주기억장치의 속도 차를 줄이는 고속 메모리는 <b>캐시 메모리</b>다."},
  {s:"컴퓨터일반",q:"다음 중 Windows의 '빠른 지원·원격 데스크톱'에 대한 설명으로 옳은 것은?",o:["원격에서 다른 PC에 접속해 화면을 제어할 수 있다.", "바이러스를 치료하는 기능이다.", "디스크 용량을 늘리는 기능이다.", "프린터 토너를 절약하는 기능이다."],a:0,e:"원격 데스크톱·빠른 지원은 네트워크로 다른 컴퓨터에 접속해 화면을 제어·지원하는 기능이다."},
  {s:"컴퓨터일반",q:"다음 중 자연어 처리(NLP) 기술이 활용되는 사례로 보기 어려운 것은?",o:["기계 번역", "챗봇 상담", "음성 비서의 명령 이해", "하드디스크 조각 모음"],a:3,e:"디스크 조각 모음은 <b>저장장치 관리</b>로 자연어 처리와 무관하다."},
  {s:"컴퓨터일반",q:"다음 중 Windows 11의 '가상 데스크톱(작업 보기)'에 대한 설명으로 옳은 것은?",o:["가상 데스크톱마다 서로 다른 운영체제를 설치해 부팅할 수 있다.", "<b>Win+Tab</b>으로 작업 보기를 열어 데스크톱을 추가·전환·삭제할 수 있다.", "하나의 가상 데스크톱에서 연 프로그램은 다른 데스크톱에서는 실행할 수 없다.", "가상 데스크톱을 추가하면 물리적 모니터가 한 대 더 연결된다."],a:1,e:"가상 데스크톱은 하나의 OS 안에서 작업 공간만 여러 개로 나누는 기능이다. Win+Tab(작업 보기)에서 추가·전환·삭제하며, 바탕화면별로 창을 분리해 쓸 수 있다. 서로 다른 OS나 추가 모니터와는 무관하다."},
  {s:"컴퓨터일반",q:"다음 중 FAT32와 NTFS의 비교로 옳지 않은 것은?",o:["NTFS는 FAT32보다 보안(접근 권한)·압축·암호화에서 우수하다.", "FAT32는 단일 파일 최대 크기가 4GB로 제한된다.", "NTFS는 대용량 볼륨과 파일 복구(저널링)에 유리하다.", "FAT32는 NTFS보다 접근 권한 설정과 디스크 할당량 관리가 더 정교하다."],a:3,e:"접근 권한·디스크 할당량 관리는 <b>NTFS</b>가 더 정교하다. FAT32는 이런 기능이 없다."},
  {s:"컴퓨터일반",q:"다음 중 ASCII 코드에 대한 설명으로 옳은 것은?",o:["패리티 비트를 포함하면 8비트가 되며 오류 검출에 활용할 수 있다.", "한 문자를 4비트로 표현하여 16가지 문자를 나타낸다.", "대형 컴퓨터의 표준 코드로 한글을 기본으로 지원한다.", "제어 문자는 포함하지 않고 영문자와 숫자만 표현한다."],a:0,e:"ASCII는 7비트(128가지)이며, 앞에 패리티 비트 1개를 더해 8비트로 쓰면 오류 검출이 가능하다. 제어 문자(0~31)도 포함하며, 한글 전용 코드는 아니다."},
  {s:"컴퓨터일반",q:"다음 중 컴퓨터 세대별 소자 연결로 옳지 않은 것은?",o:["1세대 — 진공관", "2세대 — 트랜지스터", "3세대 — 집적회로(IC)", "4세대 — 진공관"],a:3,e:"4세대는 고밀도 집적회로(LSI/VLSI)이다. 진공관은 1세대 소자이다."},
  {s:"컴퓨터일반",q:"다음 중 웹 사이트 방문 정보를 이용자 컴퓨터에 저장해 두는 작은 파일을 의미하는 것은?",o:["쿠키(Cookie)", "캐시(Cache)", "북마크", "히스토리"],a:0,e:"방문 정보를 저장하는 작은 파일은 <b>쿠키</b>다."},
  {s:"컴퓨터일반",q:"다음 중 가까운 거리에서 기기 간 접촉만으로 데이터를 주고받는 10cm 이내의 근거리 무선 통신 기술을 의미하는 것은?",o:["NFC", "Bluetooth", "Wi-Fi", "LTE"],a:0,e:"10cm 이내 접촉식 근거리 통신은 <b>NFC</b>다."},
  {s:"컴퓨터일반",q:"다음 중 정보 보안의 3대 요소에 대한 설명으로 옳지 않은 것은?",o:["기밀성은 인가된 사용자만 정보에 접근하도록 한다.", "무결성은 정보가 위·변조되지 않도록 한다.", "가용성은 인가된 사용자가 필요할 때 자원을 사용할 수 있게 한다.", "부인 방지는 정보를 누구나 자유롭게 열람하게 한다."],a:3,e:"정보 보안 3요소는 기밀성·무결성·가용성이다. 부인 방지(행위를 부인하지 못하게 함)는 별도 요소이며, '누구나 자유롭게 열람'은 기밀성에 반한다."},
  {s:"컴퓨터일반",q:"다음 중 보안 위협·악성 코드에 대한 설명으로 옳지 않은 것은?",o:["피싱은 가짜 사이트·메일로 개인정보를 가로채는 수법이다.", "스니핑은 네트워크를 지나는 데이터를 몰래 엿보는 행위다.", "랜섬웨어는 파일을 암호화하고 금전을 요구하는 악성 코드다.", "스푸핑은 시스템 자원을 과부하시켜 서비스를 마비시키는 공격이다."],a:3,e:"자원을 과부하시켜 서비스를 마비시키는 것은 <b>DoS/DDoS</b>다. 스푸핑은 주소·신원을 위장하는 수법이다."},
  {s:"컴퓨터일반",q:"다음 중 인터넷 서비스와 설명의 연결로 옳지 않은 것은?",o:["FTP — 파일 송·수신 서비스", "Telnet/SSH — 원격 접속 서비스", "DNS — 도메인 이름을 IP로 변환", "HTTP — 전자우편 송신 전용"],a:3,e:"HTTP는 웹 페이지(하이퍼텍스트)를 주고받는 프로토콜이다. 전자우편 송신은 SMTP가 담당한다."},
  {s:"컴퓨터일반",q:"다음 중 운영체제의 운영 방식에 대한 설명으로 옳지 않은 것은?",o:["일괄 처리는 데이터를 모았다가 한꺼번에 처리하는 방식이다.", "실시간 처리는 데이터 발생 즉시 처리해 결과를 돌려주는 방식이다.", "시분할 시스템은 CPU 시간을 조각내어 여러 사용자가 동시에 쓰는 것처럼 보이게 한다.", "분산 처리 시스템은 하나의 컴퓨터가 여러 작업을 순서대로 처리하는 방식이다."],a:3,e:"분산 처리는 <b>여러 대의 컴퓨터를 네트워크로 연결</b>해 작업을 나눠 처리하는 방식이다."},
  {s:"컴퓨터일반",q:"다음 중 NTFS 파일 시스템에 대한 설명으로 옳지 않은 것은?",o:["파일·폴더 접근 권한(보안) 설정, 파일 압축·암호화를 지원한다.", "파티션(볼륨) 크기는 최대 256TB, 단일 파일은 최대 16TB까지 지원한다.", "파일 이름은 공백 포함 최대 255자이나 \\ / : * ? \" < > | 는 쓸 수 없다.", "파일명의 대소문자를 구분하여 Report.txt와 report.txt를 다른 파일로 취급한다."],a:3,e:"NTFS는 파일명의 대소문자를 <b>구분하지 않아</b> 같은 파일로 취급한다(표시만 입력대로 유지)."},
  {s:"컴퓨터일반",q:"다음 (가)~(다)가 설명하는 기억장치를 바르게 연결한 것으로 옳은 것은?\n\n(가) 전원이 꺼져도 내용이 보존되며 BIOS 등을 저장한다.\n(나) 전원이 꺼지면 내용이 지워지는 휘발성 메모리다.\n(다) 주소가 아닌 내용(데이터)으로 검색하는 기억장치다.",o:["(가) RAM — (나) ROM — (다) 캐시 메모리", "(가) ROM — (나) RAM — (다) 연관 메모리", "(가) 캐시 메모리 — (나) 연관 메모리 — (다) RAM", "(가) ROM — (나) 연관 메모리 — (다) RAM"],a:1,e:"(가) 비휘발성=<b>ROM</b>, (나) 휘발성=<b>RAM</b>, (다) 내용 검색=<b>연관(연상) 메모리</b>."},
  {s:"컴퓨터일반",q:"다음 두 8비트 값에 비트 단위 OR 연산을 수행한 결과로 옳은 것은?\n\n10010010 OR 10110011",o:["10010010", "10110011", "00100001", "01101101"],a:1,e:"비트 OR은 각 자리에서 하나라도 1이면 1 → <b>10110011</b>."},
  {s:"컴퓨터일반",q:"다음은 7비트 ASCII 코드에 홀수 패리티 비트를 '오른쪽 끝 1비트'로 붙인 8비트 코드이다. 전송 중 오류가 발생한(패리티가 어긋난) 것은?",o:["10101100", "00011100", "10100001", "01011011"],a:0,e:"홀수 패리티는 8비트 전체에서 1의 개수가 홀수가 되도록 패리티 비트를 정한다. 정답 코드 <b>10101100</b>는 1의 개수가 4개로 홀수가 아니어서 오류이다. (패리티 비트는 1비트 오류의 '발생 여부'만 검출하고 위치는 못 찾는다.)"},
  {s:"컴퓨터일반",q:"다음은 7비트 ASCII 코드에 짝수 패리티 비트를 '오른쪽 끝 1비트'로 붙인 8비트 코드이다. 전송 중 오류가 발생한(패리티가 어긋난) 것은?",o:["01001001", "01101001", "11000101", "01101100"],a:0,e:"짝수 패리티는 8비트 전체에서 1의 개수가 짝수가 되도록 패리티 비트를 정한다. 정답 코드 <b>01001001</b>는 1의 개수가 3개로 짝수가 아니어서 오류이다. (패리티 비트는 1비트 오류의 '발생 여부'만 검출하고 위치는 못 찾는다.)"},
  {s:"컴퓨터일반",q:"다음 두 8비트 값에 비트 단위 OR 연산을 수행한 결과로 옳은 것은?\n\n00110010 OR 00011000",o:["00101010", "00111010", "11001101", "00010000"],a:1,e:"비트 OR은 각 자리에서 하나라도 1이면 1 → <b>00111010</b>."},
  {s:"스프레드시트",q:"다음 중 조회 함수에 대한 설명으로 옳지 않은 것은?",o:["=VLOOKUP(값,범위,열번호,0)에서 네 번째 인수 0(FALSE)은 정확히 일치를 뜻한다.", "VLOOKUP의 네 번째 인수를 1(TRUE)로 쓰면 범위의 첫 열이 오름차순 정렬되어 있어야 한다.", "HLOOKUP은 범위의 첫 '열'에서 값을 찾아 아래로 이동한다.", "=INDEX(범위,행,열)과 MATCH를 결합하면 VLOOKUP이 못 하는 왼쪽 방향 조회도 가능하다."],a:2,e:"HLOOKUP은 첫 <b>행</b>에서 찾아 <b>아래로</b> 이동한다(첫 열은 VLOOKUP)."},
  {s:"스프레드시트",q:"다음 중 이미지 파일 형식에 대한 설명으로 옳지 않은 것은?",o:["GIF는 최대 256색까지 표현할 수 있다", "PNG는 반투명 표현이 가능한 알파채널을 지원한다", "JPG(JPEG)는 규격상 손실·무손실 압축을 모두 지원한다", "GIF는 트루컬러(약 1,677만 색)를 표현할 수 있다"],a:3,e:"GIF는 최대 256색까지만 표현 가능하다. 트루컬러를 표현할 수 있는 것은 JPG·PNG다. ★ MPEG 계열 규격 핵심 비교표 MPEG-1 ~ MPEG-21 완전 정리 구분 주요 내용"},
  {s:"스프레드시트",q:"다음 수식의 실행 결과로 옳은 것은?\n\n=IF(MOD(A1,2)=0,\"짝수\",\"홀수\")   (단, [A1] 셀의 값은 15이다)",o:["0", "짝수", "홀수", "#VALUE!"],a:2,e:"MOD(15,2)=1 → 0이 아니므로 거짓 → <b>'홀수'</b>를 반환한다."},
  {s:"스프레드시트",q:"다음 중 조건부 서식의 규칙 유형에 대한 설명으로 옳지 않은 것은?",o:["셀 강조 규칙으로 특정 값보다 크거나 같은 셀 등에 서식을 준다.", "데이터 막대·색조·아이콘 집합으로 값의 크기를 시각화한다.", "상위/하위 규칙으로 상위 10% 등에 서식을 줄 수 있다.", "조건부 서식 규칙은 한 범위에 한 개만 적용할 수 있다."],a:3,e:"한 범위에 <b>여러 규칙</b>을 적용할 수 있고 우선순위를 관리한다."},
  {s:"스프레드시트",q:"다음 중 결과값이 나머지 셋과 다른 것은?",o:["=ROUND(2.4,0)", "=ROUNDUP(2.01,0)", "=INT(2.9)", "=TRUNC(2.9)"],a:1,e:"교재 해설 참고"},
  {s:"스프레드시트",q:"다음 중 차트의 축과 눈금에 대한 설명으로 옳지 않은 것은?",o:["값 축의 최소·최대·주 단위를 사용자가 지정할 수 있다.", "값 축에 로그 눈금을 적용할 수 있다.", "가로(항목) 축과 세로(값) 축을 서로 교차시키는 위치를 바꿀 수 있다.", "세로(값) 축의 눈금 간격을 바꾸면 원본 데이터 값도 함께 바뀐다."],a:3,e:"축 눈금은 <b>표시 방식</b>일 뿐 <b>원본 데이터 값은 바뀌지 않는다</b>."},
  {s:"스프레드시트",q:"다음 중 데이터 입력 및 자동 채우기에 대한 설명으로 옳지 않은 것은?",o:["한 셀에 여러 줄을 입력하려면 Alt+Enter, 선택한 여러 셀에 같은 값을 한 번에 입력하려면 Ctrl+Enter를 쓴다.", "숫자를 문자열로 입력하려면 앞에 작은따옴표(')를 붙이고, 분수는 '0 1/2'처럼 정수부와 공백을 둔다.", "오늘 날짜는 Ctrl+Shift+;, 현재 시각은 Ctrl+;로 입력한다.", "채우기 핸들로 숫자 한 셀을 드래그하면 복사되고, Ctrl을 누른 채 드래그하면 1씩 증가한다."],a:2,e:"오늘 날짜 <b>Ctrl+;</b>, 현재 시각 <b>Ctrl+Shift+;</b>로 두 단축키가 바뀌어 있다."},
  {s:"스프레드시트",q:"다음 중 그림과 같은 [데이터 표]에 대한 설명으로 옳지 않은 것은?",o:["한 개 또는 두 개의 입력값 변화에 따른 수식 결과를 한 번에 보여 준다.", "행 입력 셀·열 입력 셀에 변화시킬 셀 주소를 지정한다.", "데이터 표의 결과는 배열 수식({ })으로 입력되어 일부만 수정·삭제할 수 없다.", "원본 수식 값이 바뀌어도 데이터 표의 결과는 다시 계산되지 않는다."],a:3,fig:"<div class=\"dlg\"><div class=\"tb\"><span>데이터 표</span><span class=\"x\">? ✕</span></div><div class=\"bd\"><div class=\"row\"><span>행 입력 셀(R):</span><span class=\"inp\">$B$1</span></div><div class=\"row\"><span>열 입력 셀(C):</span><span class=\"inp\">$B$2</span></div><div class=\"btns\"><span class=\"btn pri\">확인</span><span class=\"btn\">취소</span></div></div></div>",e:"원본이 바뀌면 데이터 표 결과도 <b>자동 재계산</b>된다."},
  {s:"스프레드시트",q:"다음 수식의 실행 결과로 옳은 것은?\n\n=IF(MOD(A1,3)=0,\"배수\",\"아님\")   (단, [A1]=79)",o:["배수", "아님", "0", "TRUE"],a:1,e:"MOD(79,3)=1 → 아님"},
  {s:"스프레드시트",q:"왼쪽 기준표([F2:G6], 오름차순)를 이용해 점수 23점의 등급을 구하려고 한다. 가장 적절한 수식은? (구간의 최저점 이상이면 해당 등급)",o:["=VLOOKUP(23,$F$2:$G$6,2,FALSE)", "=HLOOKUP(23,$F$2:$G$6,2,TRUE)", "=VLOOKUP(23,$F$2:$G$6,2,TRUE)", "=VLOOKUP(23,$F$2:$G$6,2,0)"],a:2,fig:"<table class=\"xg\"><tr><th></th><th>F</th><th>G</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">기준점수</td><td class=\"hd\">등급</td></tr><tr><td class=\"rh\">2</td><td>0</td><td class=\"l\">F</td></tr><tr><td class=\"rh\">3</td><td>60</td><td class=\"l\">D</td></tr><tr><td class=\"rh\">4</td><td>70</td><td class=\"l\">C</td></tr><tr><td class=\"rh\">5</td><td>80</td><td class=\"l\">B</td></tr><tr><td class=\"rh\">6</td><td>90</td><td class=\"l\">A</td></tr></table>",e:"구간(범위) 조회는 네 번째 인수를 <b>TRUE(생략 가능, 근사일치)</b>로 두고 기준표가 <b>오름차순</b>이어야 한다. 23점 → <b>F</b>등급. FALSE(정확히 일치)는 기준표에 없는 값이면 #N/A가 난다."},
  {s:"스프레드시트",q:"아래 시트에서 입력값에 주어진 표시 형식을 적용했을 때, [C2]의 결과로 옳은 것은?",o:["3.14", "2025년 3월", "12.5%", "1"],a:3,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">입력값</td><td class=\"hd\">표시 형식</td><td class=\"hd\">결과</td></tr><tr><td class=\"rh\">2</td><td>1000000</td><td class=\"l\">0,,</td><td>?</td></tr></table>",e:"쉼표 2개는 백만 단위 생략 → 1"},
  {s:"스프레드시트",q:"셀 값이 2,000 이상이면 '녹색', 2,000 미만 800 이상이면 '파랑', 800 미만이면 색을 지정하지 않고, 모든 구간에서 천 단위 구분 기호(,)와 소수 이하 첫째 자리까지 표시하려고 한다. 사용자 지정 표시 형식으로 옳은 것은? (예: 1234.56 → 1,234.6, 432 → 432.0)",o:["[녹색][>=2000]#,##0.0;[파랑][>=800]#,##0.0;#,##0.0", "[녹색][>=2000]#,##0.0;[파랑][>=800]#,##0.0", "[>=2000]<녹색>#,##0.0;[>=800]<파랑>#,##0.0;#,##0.0", "[녹색][>=2000]#,###.#;[파랑][>=800]#,###.#;#,###.#"],a:0,e:"사용자 지정 형식은 <b>[조건·색]양수서식;[조건·색]서식;나머지서식</b> 구조로, 색과 조건은 대괄호 [녹색][>=2000] 안에 넣는다. 소수 첫째 자리는 0을 써서 <b>#,##0.0</b>으로 해야 432가 432.0으로 나온다(#,###.#은 432를 432.로 만들어 틀림). 꺾쇠<>로 색을 넣는 문법은 없다. 정답: <b>[녹색][>=2000]#,##0.0;[파랑][>=800]#,##0.0;#,##0.0</b>"},
  {s:"스프레드시트",q:"다음 수식의 실행 결과로 옳은 것은?\n\n=IF(MOD(A1,5)=0,\"배수\",\"아님\")   (단, [A1]=14)",o:["배수", "아님", "0", "TRUE"],a:1,e:"MOD(14,5)=4 → 아님"},
  {s:"스프레드시트",q:"셀 값이 5,000 이상이면 '녹색', 5,000 미만 500 이상이면 '빨강', 500 미만이면 색을 지정하지 않고, 모든 구간에서 천 단위 구분 기호(,)와 소수 이하 첫째 자리까지 표시하려고 한다. 사용자 지정 표시 형식으로 옳은 것은? (예: 1234.56 → 1,234.6, 432 → 432.0)",o:["[녹색][>=5000]#,##0.0;[빨강][>=500]#,##0.0", "[녹색][>=5000]#,###.#;[빨강][>=500]#,###.#;#,###.#", "[녹색][>=5000]#,##0.0;[빨강][>=500]#,##0.0;#,##0.0", "[>=5000]<녹색>#,##0.0;[>=500]<빨강>#,##0.0;#,##0.0"],a:2,e:"사용자 지정 형식은 <b>[조건·색]양수서식;[조건·색]서식;나머지서식</b> 구조로, 색과 조건은 대괄호 [녹색][>=5000] 안에 넣는다. 소수 첫째 자리는 0을 써서 <b>#,##0.0</b>으로 해야 432가 432.0으로 나온다(#,###.#은 432를 432.로 만들어 틀림). 꺾쇠<>로 색을 넣는 문법은 없다. 정답: <b>[녹색][>=5000]#,##0.0;[빨강][>=500]#,##0.0;#,##0.0</b>"},
  {s:"스프레드시트",q:"셀 [A1:A9]에 다음 값이 입력되어 있다: 23, 58, 61, 64, 69, 87, 88, 92, 96\n다음 수식(제2사분위수)의 결과로 옳은 것은?\n\n=QUARTILE.INC(A1:A9, 2)",o:["69", "70", "68", "87"],a:0,e:"QUARTILE.INC(범위, 2)는 제2사분위수(하위 50% 지점)를 구하며 PERCENTILE.INC(범위,0.5)와 같다. 정렬된 값에서 결과는 <b>69</b>이다."},
  {s:"스프레드시트",q:"다음 중 SUBSTITUTE 함수를 사용한 수식의 실행 결과로 옳은 것은?\n\n=SUBSTITUTE(\"58-55-11-55\",\"-\",\":\",2)",o:["58-55-11:55", "58-55:11-55", "58:55:11:55", "58:55:11-55"],a:1,e:"네 번째 인수 2은(는) 2번째 '-'만 ':'로 바꾼다 → <b>58-55:11-55</b>. (인수를 생략하면 모든 '-'를 바꾼다.)"},
  {s:"스프레드시트",q:"다음 중 문자 위치를 찾는 함수식의 결과로 옳은 것은? (FIND는 대/소문자 구분·와일드카드 불가, SEARCH는 구분 안 함·와일드카드 가능)\n\n=FIND(\"Y\",\"YoungPaJok CBT\")",o:["#VALUE!", "2", "0", "1"],a:3,e:"FIND(찾을문자, 대상)은 앞에서부터 문자가 처음 나오는 <b>위치(1부터)</b>를 반환한다. \"YoungPaJok CBT\"에서 'Y'의 위치는 <b>1</b>. (공백도 한 글자로 센다.)"},
  {s:"스프레드시트",q:"다음 중 REPT 함수로 문자를 반복한 결과로 옳은 것은?\n\n=REPT(\"●\",INT(44/10))",o:["●●●●", "●●●", "●●●●●", "●●"],a:0,e:"INT(44/10)=4이므로 '●'를 <b>4번</b> 반복한다 → ●●●●"},
  {s:"스프레드시트",q:"왼쪽 기준표([F2:G6], 오름차순)를 이용해 점수 42점의 등급을 구하려고 한다. 가장 적절한 수식은? (구간의 최저점 이상이면 해당 등급)",o:["=VLOOKUP(42,$F$2:$G$6,2,FALSE)", "=VLOOKUP(42,$F$2:$G$6,2,0)", "=HLOOKUP(42,$F$2:$G$6,2,TRUE)", "=VLOOKUP(42,$F$2:$G$6,2,TRUE)"],a:3,fig:"<table class=\"xg\"><tr><th></th><th>F</th><th>G</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">기준점수</td><td class=\"hd\">등급</td></tr><tr><td class=\"rh\">2</td><td>0</td><td class=\"l\">F</td></tr><tr><td class=\"rh\">3</td><td>60</td><td class=\"l\">D</td></tr><tr><td class=\"rh\">4</td><td>70</td><td class=\"l\">C</td></tr><tr><td class=\"rh\">5</td><td>80</td><td class=\"l\">B</td></tr><tr><td class=\"rh\">6</td><td>90</td><td class=\"l\">A</td></tr></table>",e:"구간(범위) 조회는 네 번째 인수를 <b>TRUE(생략 가능, 근사일치)</b>로 두고 기준표가 <b>오름차순</b>이어야 한다. 42점 → <b>F</b>등급. FALSE(정확히 일치)는 기준표에 없는 값이면 #N/A가 난다."},
  {s:"스프레드시트",q:"아래 시트에서 부서가 '영업부'인 직원의 급여 합계를 [F2]에 구하려 한다. 입력할 수식으로 옳은 것은?",o:["=SUMIF(D2:D4,\"영업부\",B2:B4)", "=DSUM(B2:B4,\"영업부\",D2:D4)", "=SUMIF(B2:B4,\"영업부\",D2:D4)", "=COUNTIF(B2:B4,\"영업부\")"],a:2,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">이름</td><td class=\"hd\">부서</td><td class=\"hd\">직급</td><td class=\"hd\">급여</td></tr><tr><td class=\"rh\">2</td><td>최나래</td><td class=\"l\">기획부</td><td>대리</td><td>4,900,000</td></tr><tr><td class=\"rh\">3</td><td>이두리</td><td class=\"l\">영업부</td><td>과장</td><td>4,900,000</td></tr><tr><td class=\"rh\">4</td><td>김하나</td><td class=\"l\">영업부</td><td>사원</td><td>3,300,000</td></tr></table>",e:"SUMIF(<b>조건범위, 조건, 합계범위</b>) → 부서(B)에서 '영업부'를 찾아 급여(D)를 더한다."}
 ]},
{ name:'기출 8회', q:[
  {s:"컴퓨터일반",q:"다음 중 컴퓨터의 처리 속도 단위가 빠른(짧은) 것부터 느린(긴) 순서로 옳은 것은?",o:["ps < ns < μs < ms", "ms < μs < ns < ps", "ns < ps < ms < μs", "μs < ns < ps < ms"],a:0,e:"시간 단위는 피코초(ps) < 나노초(ns) < 마이크로초(μs) < 밀리초(ms) 순으로, 왼쪽일수록 더 짧은(빠른) 시간이다."},
  {s:"컴퓨터일반",q:"다음 중 클라우드 컴퓨팅에 대한 설명으로 옳지 않은 것은?",o:["자원을 인터넷을 통해 빌려 쓰고 사용한 만큼 비용을 낸다.", "장소에 구애받지 않고 접속해 데이터를 이용할 수 있다.", "서비스 형태에 IaaS·PaaS·SaaS가 있다.", "반드시 내 컴퓨터에만 데이터를 저장하는 방식이다."],a:3,e:"클라우드는 데이터를 인터넷 상의 서버(클라우드)에 저장해 어디서나 접근하는 방식이다. 내 컴퓨터에만 저장한다는 설명은 틀리다."},
  {s:"컴퓨터일반",q:"다음 중 전자상거래(e-Commerce)에 대한 설명으로 옳지 않은 것은?",o:["시간·공간의 제약 없이 거래할 수 있다.", "B2C는 기업과 소비자 간 거래를 뜻한다.", "전자 결제·전자 화폐 등을 이용한다.", "반드시 오프라인 매장을 방문해야만 결제할 수 있다."],a:3,e:"전자상거래는 온라인에서 결제까지 이루어지므로 오프라인 매장 방문이 필수가 아니다. 시간·공간 제약 없이 거래할 수 있는 것이 장점이다."},
  {s:"컴퓨터일반",q:"다음 중 에러 검출·교정 코드에 대한 설명으로 옳지 않은 것은?",o:["패리티 비트는 오류 '검출'만 가능하고 교정은 불가능하다.", "해밍 코드는 오류 검출과 '교정'이 모두 가능하다.", "CRC(순환 중복 검사)는 블록 단위 오류 검출에 쓰인다.", "패리티 비트는 1비트의 오류를 스스로 검출하고 교정까지 수행한다."],a:3,e:"패리티 비트는 오류 <b>검출만</b> 가능하고 교정은 못 한다. 교정이 되는 것은 해밍 코드다."},
  {s:"컴퓨터일반",q:"다음 중 Windows의 폴더 옵션(파일 탐색기 옵션)에서 설정할 수 있는 것으로 옳지 않은 것은?",o:["숨김 파일·폴더의 표시 여부", "알려진 파일 형식의 확장명 숨기기", "한 번 클릭으로 열기/두 번 클릭으로 열기", "모니터의 화면 해상도"],a:3,e:"화면 해상도는 [설정]-[디스플레이]에서 변경한다. 폴더 옵션에서는 숨김 파일 표시, 확장명 숨기기, 클릭 방식 등을 설정한다."},
  {s:"컴퓨터일반",q:"다음 중 프로토콜에 대한 설명으로 옳지 않은 것은?",o:["TCP는 데이터를 패킷으로 나누고 오류를 제어하는 연결형 프로토콜이다.", "IP는 패킷의 주소를 지정하고 경로를 설정한다.", "HTTP는 웹 문서를 주고받는 프로토콜이다.", "ICMP는 전자우편을 수신하는 프로토콜이다."],a:3,e:"전자우편 수신은 <b>POP3/IMAP</b>이다. ICMP는 오류·상태 메시지 전송 프로토콜이다."},
  {s:"컴퓨터일반",q:"다음 중 보조기억장치에 대한 설명으로 옳지 않은 것은?",o:["SSD는 반도체(플래시)를 사용해 HDD보다 빠르고 충격에 강하다.", "HDD는 플래터를 회전시켜 자기적으로 데이터를 기록한다.", "Blu-ray는 DVD보다 저장 용량이 크다.", "SSD는 기계적 구동부(모터·헤드)가 있어 소음과 발열이 HDD보다 크다."],a:3,e:"SSD는 <b>구동부가 없어</b> 소음·발열·충격에 강하다. 구동부가 있는 것은 HDD다."},
  {s:"컴퓨터일반",q:"다음 중 사물인터넷(IoT)에 대한 설명으로 옳은 것은?",o:["사물에 센서와 통신 기능을 넣어 인터넷으로 연결·제어하는 기술이다.", "컴퓨터 없이 종이에만 정보를 기록하는 방식이다.", "인터넷을 사용하지 않는 폐쇄형 통신이다.", "사람만 직접 조작해야 작동하는 기술이다."],a:0,e:"IoT는 각종 사물에 센서·통신 기능을 부여해 인터넷으로 연결하고 데이터를 주고받아 자동으로 제어하는 기술이다."},
  {s:"컴퓨터일반",q:"다음 중 CPU의 명령어 처리 단계(인출-해석-실행)와 관련된 설명으로 옳지 않은 것은?",o:["인출(Fetch) 단계에서 PC가 가리키는 명령어를 주기억장치에서 읽어 IR에 저장한다.", "해석(Decode) 단계에서 제어장치가 명령어의 종류와 주소를 분석한다.", "실행(Execute) 단계에서 ALU가 실제 연산을 수행한다.", "한 명령을 인출하는 동안 다음 명령을 동시에 실행하면 처리 속도가 느려진다."],a:3,e:"인출과 실행을 겹쳐 수행하는 '파이프라이닝'은 오히려 처리 속도를 높인다. 나머지 인출·해석·실행 단계 설명은 모두 옳다."},
  {s:"컴퓨터일반",q:"PC에 IP 주소를 '수동(고정)'으로 설정할 때 반드시 입력해야 하는 값이 아닌 것은?",o:["DHCP 서버 주소", "IP 주소", "서브넷 마스크", "기본 게이트웨이"],a:0,e:"수동(고정) IP 설정 시에는 IP 주소·서브넷 마스크·기본 게이트웨이·DNS 서버 주소를 직접 입력한다. DHCP 서버 주소는 IP를 '자동'으로 받을 때 쓰는 것으로 수동 설정 시 입력하지 않는다."},
  {s:"컴퓨터일반",q:"다음에서 설명하는 Windows 11 기능으로 옳은 것은?\n\n하나의 모니터에서 여러 개의 바탕 화면을 만들어, 업무용·개인용처럼 작업 공간을 분리해 전환하며 쓸 수 있는 기능이다.",o:["스냅 레이아웃", "가상 데스크톱", "작업 보기 타임라인", "포커스 세션"],a:1,e:"여러 바탕 화면을 만들어 전환하는 기능은 <b>가상 데스크톱</b>이다."},
  {s:"컴퓨터일반",q:"다음 중 RAM에 대한 설명으로 옳지 않은 것은?",o:["DRAM은 재충전(리프레시)이 필요하고 집적도가 높아 주기억장치에 쓰인다.", "SRAM은 재충전이 필요 없고 속도가 빨라 캐시 메모리에 쓰인다.", "SRAM은 DRAM보다 가격이 비싸고 소비 전력이 크다.", "DRAM은 SRAM보다 속도가 빠르고 구조가 단순하다."],a:3,e:"속도는 <b>SRAM이 DRAM보다 빠르다</b>. DRAM은 느리지만 집적도가 높고 저렴하다."},
  {s:"컴퓨터일반",q:"다음 중 시간과 장소에 구애받지 않고 언제 어디서나 네트워크에 접속하여 컴퓨터를 사용할 수 있는 환경을 의미하는 것은?",o:["유비쿼터스", "엑스트라넷", "인트라넷", "방화벽"],a:0,e:"언제 어디서나 접속 가능한 환경은 <b>유비쿼터스</b>다."},
  {s:"컴퓨터일반",q:"다음 중 한글 코드에 대한 설명으로 옳지 않은 것은?",o:["조합형은 초성·중성·종성에 코드를 부여해 조합한다.", "완성형은 완성된 글자마다 하나의 코드를 부여한다.", "유니코드는 한글·영문 등 모든 문자를 2바이트로 표현한다.", "완성형은 조합형보다 적은 글자 수를 표현하면서 코드가 더 복잡하다."],a:3,e:"완성형은 자주 쓰는 완성 글자에 코드를 부여해 처리와 정렬이 '단순'하다. 코드가 복잡한 쪽은 조합형이 아니라 표현상 트레이드오프이며, ④의 '완성형이 더 복잡'은 틀린 설명이다."},
  {s:"컴퓨터일반",q:"다음 중 컴퓨터 바이러스·악성코드에 대한 설명으로 옳지 않은 것은?",o:["웜(Worm)은 네트워크를 통해 스스로 복제·전파된다.", "트로이 목마는 정상 프로그램으로 위장해 침투한다.", "백신 프로그램은 바이러스를 검사·치료한다.", "최신 백신을 설치하면 모든 신종 악성코드를 100% 차단한다."],a:3,e:"백신도 알려지지 않은 신종(제로데이) 악성코드는 완벽히 막지 못한다. '100% 차단'은 과장이다."},
  {s:"컴퓨터일반",q:"다음 중 운영체제의 핵심으로, 메모리·프로세스·장치 등 시스템 자원을 관리하는 부분을 의미하는 것은?",o:["커널", "셸", "컴파일러", "드라이버"],a:0,e:"자원 관리를 담당하는 운영체제 핵심은 <b>커널</b>이다."},
  {s:"컴퓨터일반",q:"다음 두 8비트 값에 비트 단위 AND 연산을 수행한 결과로 옳은 것은?\n\n00100010 AND 00110101",o:["00110111", "00010111", "00100000", "11011101"],a:2,e:"비트 AND은 각 자리에서 둘 다 1일 때만 1 → <b>00100000</b>."},
  {s:"컴퓨터일반",q:"다음 중 8비트 2진수 00011011의 2의 보수로 옳은 것은?",o:["00011010", "00011100", "11100100", "11100101"],a:3,e:"2의 보수 = 1의 보수(비트 반전=11100100) + 1 = <b>11100101</b>."},
  {s:"컴퓨터일반",q:"다음 중 샘플링 48kHz, 양자화 16비트, 모노(1채널)로 10초간 녹음한 비압축 디지털 오디오의 용량으로 가장 가까운 것은?",o:["약 0.5MB", "약 0.9MB", "약 1.8MB", "약 14.6MB"],a:1,e:"오디오 용량 = 샘플링 주파수 × (양자화 비트÷8) × 채널 수 × 시간 = 48,000 × 2 × 1 × 10 = <b>960,000 Byte</b> ≒ 약 0.9MB."},
  {s:"컴퓨터일반",q:"다음 중 샘플링 48kHz, 양자화 8비트, 스테레오(2채널)로 60초간 녹음한 비압축 디지털 오디오의 용량으로 가장 가까운 것은?",o:["약 2.7MB", "약 11.0MB", "약 43.9MB", "약 5.5MB"],a:3,e:"오디오 용량 = 샘플링 주파수 × (양자화 비트÷8) × 채널 수 × 시간 = 48,000 × 1 × 2 × 60 = <b>5,760,000 Byte</b> ≒ 약 5.5MB."},
  {s:"스프레드시트",q:"다음 중 그림과 같은 [통합] 도구에 대한 설명으로 옳지 않은 것은?",o:["'모든 참조 영역'에 다른 통합 문서의 워크시트도 추가할 수 있다.", "요약 함수로 합계·개수·평균·최대·최소·곱·표준편차 등을 쓸 수 있다.", "'원본 데이터에 연결'을 체크하지 않아도 원본이 바뀌면 결과가 항상 자동 갱신된다.", "'사용할 레이블'의 첫 행·왼쪽 열을 선택하면 레이블 위치가 달라도 같은 항목끼리 통합된다."],a:2,fig:"<div class=\"dlg\"><div class=\"tb\"><span>통합</span><span class=\"x\">? ✕</span></div><div class=\"bd\"><div class=\"row\"><span>함수(F):</span><span class=\"sel\">합계</span></div><div class=\"row\"><span>참조(R):</span><span class=\"inp\"></span></div><div class=\"row\" style=\"align-items:flex-start\"><span>모든 참조 영역:</span><div class=\"area\" style=\"flex:1\"></div></div><div style=\"font-size:.72rem;color:#333;font-weight:700\">사용할 레이블</div><div class=\"ck\"><i class=\"on\"></i> 첫 행(T)</div><div class=\"ck\"><i class=\"on\"></i> 왼쪽 열(L)</div><div class=\"ck\"><i class=\"\"></i> 원본 데이터에 연결(S)</div><div class=\"btns\"><span class=\"btn pri\">확인</span><span class=\"btn\">닫기</span></div></div></div>",e:"'원본 데이터에 연결'을 <b>체크해야</b> 원본 변경이 자동 반영된다."},
  {s:"스프레드시트",q:"다음 중 그림과 같은 [부분합]에 대한 설명으로 옳지 않은 것은?",o:["부분합을 실행하면 정보 행이 표시되고 윤곽(개요) 기호가 자동 설정된다.", "'새로운 값으로 대치'가 체크된 채 다시 실행하면 이전 결과 위에 새 결과가 누적된다.", "그룹화할 '지점' 필드는 부분합 전에 정렬되어 있어야 한다.", "'모두 제거'를 누르면 부분합과 윤곽 기호가 함께 사라진다."],a:1,fig:"<div class=\"dlg\"><div class=\"tb\"><span>부분합</span><span class=\"x\">? ✕</span></div><div class=\"bd\"><div class=\"row\"><span>그룹화할 항목(A):</span><span class=\"sel\">지점</span></div><div class=\"row\"><span>사용할 함수(U):</span><span class=\"sel\">합계</span></div><div class=\"row\" style=\"align-items:flex-start\"><span>부분합 계산 항목(D):</span><div class=\"area\" style=\"flex:1;padding:.22rem .35rem;font-size:.72rem;line-height:1.5\">☐ 지점<br>☐ 입고<br>☐ 출고<br>☑ 재고</div></div><div class=\"ck\"><i class=\"on\"></i> 새로운 값으로 대치(C)</div><div class=\"ck\"><i class=\"\"></i> 그룹 사이에서 페이지 나누기(P)</div><div class=\"ck\"><i class=\"on\"></i> 데이터 아래에 요약 표시(S)</div><div class=\"btns\"><span class=\"btn\">모두 제거(R)</span><span class=\"btn pri\">확인</span><span class=\"btn\">취소</span></div></div></div>",e:"'새로운 값으로 대치'가 체크되면 <b>이전 결과가 지워지고 교체</b>된다. 중첩하려면 해제해야 한다."},
  {s:"스프레드시트",q:"다음 중 '틀 고정'에 대한 설명으로 옳지 않은 것은?",o:["화면을 스크롤해도 지정한 행/열이 항상 보이도록 고정한다.", "셀을 선택하고 틀 고정하면 그 셀의 '위쪽 행'과 '왼쪽 열'이 고정된다.", "'첫 행 고정', '첫 열 고정'을 바로 적용할 수 있다.", "틀 고정 상태는 인쇄할 때도 각 페이지에 반복 적용된다."],a:3,e:"틀 고정은 '화면'에만 적용되고 인쇄에는 반영되지 않는다. 인쇄 시 제목 행을 반복하려면 [페이지 설정]-[시트]의 '반복할 행/열'을 사용한다."},
  {s:"스프레드시트",q:"다음 중 그림과 같은 [셀 서식]-[맞춤] 탭에 대한 설명으로 옳지 않은 것은?",o:["'텍스트 줄 바꿈'을 켜면 긴 텍스트가 셀 안에서 여러 줄로 표시된다.", "'셀에 맞춤'을 켜면 글꼴 크기를 줄여 셀 너비에 맞춘다.", "'셀 병합'으로 여러 셀을 하나로 합칠 수 있다.", "텍스트 방향(각도)은 설정할 수 없고 항상 가로로만 표시된다."],a:3,fig:"<div class=\"dlg\"><div class=\"tb\"><span>셀 서식 — 맞춤</span><span class=\"x\">? ✕</span></div><div class=\"bd\"><div class=\"row\"><span>텍스트 맞춤:</span><span class=\"sel\">가로/세로</span></div><div class=\"ck\"><i class=\"on\"></i> 텍스트 줄 바꿈</div><div class=\"ck\"><i class=\"\"></i> 셀에 맞춤</div><div class=\"ck\"><i class=\"\"></i> 셀 병합</div><div class=\"row\"><span>방향(각도):</span><span class=\"sel\">0도</span></div><div class=\"btns\"><span class=\"btn pri\">확인</span><span class=\"btn\">취소</span></div></div></div>",e:"맞춤 탭에서 텍스트를 <b>-90°~90° 회전(각도)</b>할 수 있다."},
  {s:"스프레드시트",q:"다음 중 매크로 기록과 실행에 대한 설명으로 옳지 않은 것은?",o:["기록 시 셀 참조는 기본이 절대 참조이며, '상대 참조로 기록'을 켜면 상대 참조로 기록된다.", "매크로는 기본적으로 '개인용 매크로 통합 문서'나 '현재 통합 문서'에 저장할 수 있다.", "기록된 매크로는 Visual Basic Editor에서 코드를 수정할 수 있다.", "매크로 이름에는 한글을 쓸 수 없고 반드시 영문으로만 지정해야 한다."],a:3,e:"매크로 이름에 <b>한글도 사용 가능</b>하다(첫 글자만 문자면 됨)."},
  {s:"스프레드시트",q:"다음 중 텍스트 함수에 대한 설명으로 옳지 않은 것은?",o:["=LEFT(\"2025학번\",4) → 2025, =RIGHT(\"2025학번\",2) → 학번", "=MID(\"abcdef\",3,2) → cd", "=LEN(\"대한민국\") → 4, =LEN(\"EXCEL 365\") → 9", "=TRIM은 단어 사이 공백을 모두 제거하고, =UPPER는 소문자를 대문자로 바꾼다."],a:3,e:"=TRIM은 <b>단어 사이 공백은 하나만 남기고</b> 양 끝과 중복 공백만 제거한다(모두 제거 아님)."},
  {s:"스프레드시트",q:"다음 중 차트의 데이터 편집에 대한 설명으로 옳지 않은 것은?",o:["[데이터 선택]에서 계열의 추가·제거·순서 변경, 행/열 바꾸기를 할 수 있다.", "숨겨진 셀의 데이터는 기본적으로 차트에 표시되지 않으나 옵션으로 표시할 수 있다.", "빈 셀을 '간격' '0' '선으로 연결' 중 어떻게 표시할지 설정할 수 있다.", "차트에 표시된 계열을 삭제하면 워크시트의 원본 데이터도 함께 삭제된다."],a:3,e:"차트 계열을 삭제해도 <b>원본 데이터는 삭제되지 않는다</b>."},
  {s:"스프레드시트",q:"직위[C3:C11]·급여[E3:E11]일 때 수식 설명으로 옳지 않은 것은?",o:["=COUNTIF(C3:C11,\"<>대리\")는 '대리'가 아닌 인원수를 센다.", "=COUNTIF(E3:E11,\">=\"&AVERAGE(E3:E11))처럼 연산자만 따옴표로 묶고 &로 함수를 잇는다.", "와일드카드 ?는 한 글자, *는 길이 무관 문자열을 뜻한다.", "조건에 \">=AVERAGE(E3:E11)\"처럼 통째로 묶어도 평균 이상이 정상 계산된다."],a:3,e:"통째로 묶으면 <b>문자 그대로 인식돼 오류</b>. \">=\"&AVERAGE(...) 형태여야 한다."},
  {s:"스프레드시트",q:"아래 표에서 전체 판매 금액(수량×단가의 합계)을 한 번에 구하려고 한다. 가장 적절한 수식은? (참고: 총액 266,000원)",o:["=SUM(B2:B5*C2:C5)", "=SUMPRODUCT(B2:B5,C2:C5)", "=SUMPRODUCT(B2:B5+C2:C5)", "=SUM(B2:B5)*SUM(C2:C5)"],a:1,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">품목</td><td class=\"hd\">수량</td><td class=\"hd\">단가</td></tr><tr><td class=\"rh\">2</td><td>노트</td><td>9</td><td>7,000</td></tr><tr><td class=\"rh\">3</td><td>자</td><td>9</td><td>15,000</td></tr><tr><td class=\"rh\">4</td><td>풀</td><td>4</td><td>15,000</td></tr><tr><td class=\"rh\">5</td><td>펜</td><td>2</td><td>4,000</td></tr></table>",e:"<b>SUMPRODUCT(배열1, 배열2)</b>는 대응하는 원소끼리 곱한 뒤 모두 더한다 → <b>266,000</b>원. =SUM(B*C)는 일반 입력 시 배열이 아니라 오류/단일값이 되고(배열 입력해야 함), SUM(B)*SUM(C)는 합끼리 곱해 의미가 다르다."},
  {s:"스프레드시트",q:"다음 중 수식의 실행 결과가 옳지 않은 것은?",o:["=MOD(7,-4) → -1", "=INT(-6.4) → -7", "=TRUNC(-2.9) → -1", "=ROUND(897.006,2) → 897.01"],a:2,e:"=TRUNC(-2.9)의 올바른 결과는 -2이다. (INT=내림, TRUNC=절사, MOD=n-d×INT(n/d), ROUND=반올림)"},
  {s:"스프레드시트",q:"다음 수식의 실행 결과로 옳은 것은?\n\n=IF(MOD(A1,2)=0,\"짝수\",\"홀수\")   (단, [A1]=80)",o:["짝수", "홀수", "0", "#VALUE!"],a:0,e:"MOD(80,2)=0 → 짝수"},
  {s:"스프레드시트",q:"아래 시트에서 입력값에 주어진 표시 형식을 적용했을 때, [C2]의 결과로 옳은 것은?",o:["2025년 3월", "005", "1,235", "크다"],a:0,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">입력값</td><td class=\"hd\">표시 형식</td><td class=\"hd\">결과</td></tr><tr><td class=\"rh\">2</td><td>2025-03-05</td><td class=\"l\">yyyy\"년\" m\"월\"</td><td>?</td></tr></table>",e:"연·월 서식 적용"},
  {s:"스프레드시트",q:"다음 그림과 같이 [목표값 찾기]를 설정했을 때, 그 의미로 옳은 것은?",o:["평균(E4)이 50이 되려면 노트북 판매량(B4)이 얼마가 되어야 하는가?", "노트북 판매량(B4)이 50이 되려면 평균(E4)이 얼마가 되어야 하는가?", "노트북 판매량을 50으로 바꾸면 평균(E4)은 얼마가 되는가?", "평균이 50이 되려면 노트북 외 나머지 제품 판매량은 얼마가 되어야 하는가?"],a:0,fig:"<div class=\"figwrap\"><table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th></tr><tr><td class=\"rh\">1</td><td class=\"tt\" colspan=\"5\">제품별 판매현황</td></tr><tr><td class=\"rh\">3</td><td class=\"hd\">품목</td><td class=\"hd\">노트북</td><td class=\"hd\">프린터</td><td class=\"hd\">스캐너</td><td class=\"hd\">평균</td></tr><tr><td class=\"rh\">4</td><td class=\"hd\">판매량</td><td>80</td><td>39</td><td>14</td><td>44.33</td></tr></table><div class=\"dlg\"><div class=\"tb\"><span>목표값 찾기</span><span class=\"x\">? ✕</span></div><div class=\"bd\"><div class=\"row\"><span>수식 셀(E):</span><span class=\"inp\">$E$4</span></div><div class=\"row\"><span>찾는 값(V):</span><span class=\"inp\">50</span></div><div class=\"row\"><span>값을 바꿀 셀(C):</span><span class=\"inp\">$B$4</span></div><div class=\"btns\"><span class=\"btn pri\">확인</span><span class=\"btn\">취소</span></div></div></div></div>",e:"목표값 찾기는 <b>수식 셀(E4·평균)이 찾는 값(50)</b>이 되도록 <b>값을 바꿀 셀(B4·노트북)</b>을 역산한다."},
  {s:"스프레드시트",q:"셀 [A1:A5]에 다음 값이 입력되어 있다: 38, 45, 54, 70, 81\n다음 수식(50% 지점(백분위수))의 결과로 옳은 것은?\n\n=PERCENTILE.INC(A1:A5, 0.5)",o:["54", "53", "70", "55"],a:0,e:"PERCENTILE.INC(범위, 0.5)는 데이터를 오름차순 정렬했을 때 하위 50% 위치의 값을 구한다. 정렬된 5개 값에서 그 위치의 값은 <b>54</b>이다."},
  {s:"스프레드시트",q:"왼쪽 기준표([F2:G6], 오름차순)를 이용해 점수 23점의 등급을 구하려고 한다. 가장 적절한 수식은? (구간의 최저점 이상이면 해당 등급)",o:["=VLOOKUP(23,$F$2:$G$6,2,0)", "=VLOOKUP(23,$F$2:$G$6,2,TRUE)", "=HLOOKUP(23,$F$2:$G$6,2,TRUE)", "=VLOOKUP(23,$F$2:$G$6,2,FALSE)"],a:1,fig:"<table class=\"xg\"><tr><th></th><th>F</th><th>G</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">기준점수</td><td class=\"hd\">등급</td></tr><tr><td class=\"rh\">2</td><td>0</td><td class=\"l\">F</td></tr><tr><td class=\"rh\">3</td><td>60</td><td class=\"l\">D</td></tr><tr><td class=\"rh\">4</td><td>70</td><td class=\"l\">C</td></tr><tr><td class=\"rh\">5</td><td>80</td><td class=\"l\">B</td></tr><tr><td class=\"rh\">6</td><td>90</td><td class=\"l\">A</td></tr></table>",e:"구간(범위) 조회는 네 번째 인수를 <b>TRUE(생략 가능, 근사일치)</b>로 두고 기준표가 <b>오름차순</b>이어야 한다. 23점 → <b>F</b>등급. FALSE(정확히 일치)는 기준표에 없는 값이면 #N/A가 난다."},
  {s:"스프레드시트",q:"다음 수식의 실행 결과로 옳은 것은?\n\n=IFS(A1>=90,\"A\",A1>=80,\"B\",A1>=70,\"C\",TRUE,\"F\")   (단, [A1]=96)",o:["A", "B", "C", "F"],a:0,e:"96점은 해당 구간에 따라 'A'를 반환한다."},
  {s:"스프레드시트",q:"다음 중 SUBSTITUTE 함수를 사용한 수식의 실행 결과로 옳은 것은?\n\n=SUBSTITUTE(\"52-79-88-38\",\"-\",\".\")",o:["52.79.88.38", "52-79-88-38", "52.79-88-38", "52.79.88-38"],a:0,e:"SUBSTITUTE(문자열, 찾을값, 바꿀값)에서 네 번째 인수를 생략하면 '-'를 <b>모두</b> '.'로 바꾼다 → <b>52.79.88.38</b>."},
  {s:"스프레드시트",q:"셀 [A1:A9]에 다음 값이 입력되어 있다: 17, 35, 42, 53, 56, 79, 81, 90, 93\n다음 수식(제2사분위수)의 결과로 옳은 것은?\n\n=QUARTILE.INC(A1:A9, 2)",o:["57", "79", "55", "56"],a:3,e:"QUARTILE.INC(범위, 2)는 제2사분위수(하위 50% 지점)를 구하며 PERCENTILE.INC(범위,0.5)와 같다. 정렬된 값에서 결과는 <b>56</b>이다."},
  {s:"스프레드시트",q:"다음 중 문자 위치를 찾는 함수식의 결과로 옳은 것은? (FIND는 대/소문자 구분·와일드카드 불가, SEARCH는 구분 안 함·와일드카드 가능)\n\n=FIND(\"p\",\"YoungPaJok CBT\")",o:["0", "1", "6", "#VALUE!"],a:3,e:"FIND는 <b>대/소문자를 구분</b>한다. 대상 \"YoungPaJok CBT\"에 소문자 'p'가 없으면 <b>#VALUE! 오류</b>가 난다. 대소문자를 무시하려면 SEARCH를 써야 한다 (=SEARCH(\"p\",\"YoungPaJok CBT\") → 6)."},
  {s:"스프레드시트",q:"다음 중 SUBSTITUTE 함수를 사용한 수식의 실행 결과로 옳은 것은?\n\n=SUBSTITUTE(\"70-61-25-92\",\"-\",\"/\",2)",o:["70/61/25-92", "70/61/25/92", "70-61-25/92", "70-61/25-92"],a:3,e:"네 번째 인수 2은(는) 2번째 '-'만 '/'로 바꾼다 → <b>70-61/25-92</b>. (인수를 생략하면 모든 '-'를 바꾼다.)"}
 ]},
{ name:'기출 9회', q:[
  {s:"컴퓨터일반",q:"다음 중 웹 프로그래밍 언어에 대한 설명으로 옳지 않은 것은?",o:["HTML은 웹 문서의 구조를 작성하는 기본 언어다.", "ASP·JSP·PHP는 서버 측에서 실행되는 스크립트 언어다.", "JavaScript는 주로 클라이언트(브라우저) 측에서 실행된다.", "HTML5는 ActiveX·플러그인 없이는 오디오·비디오를 재생할 수 없다."],a:3,e:"HTML5는 <b>플러그인 없이</b> <audio>·<video> 태그로 멀티미디어를 재생한다."},
  {s:"컴퓨터일반",q:"다음 중 모바일 기기 관련 용어에 대한 설명으로 옳지 않은 것은?",o:["테더링은 스마트폰의 데이터를 다른 기기와 공유해 인터넷에 연결하는 기능이다.", "NFC는 10cm 이내 근거리 무선 통신 기술이다.", "GPS는 위성을 이용해 위치를 파악하는 시스템이다.", "증강현실(AR)은 현실과 완전히 분리된 가상 세계만 보여 준다."],a:3,e:"AR(증강현실)은 현실 화면 위에 가상 정보를 겹쳐 보여 준다. 현실과 분리된 완전 가상 세계는 VR이다."},
  {s:"컴퓨터일반",q:"다음 중 인터넷 주소와 도메인에 대한 설명으로 옳지 않은 것은?",o:["DNS는 도메인 이름을 IP 주소로 변환해 주는 시스템이다.", "URL은 자원의 위치를 나타내며 프로토콜://호스트/경로 형식이다.", "도메인에서 kr은 국가, co는 영리 기관을 뜻한다.", "IP 주소는 문자로 된 주소이고 도메인은 숫자로 된 주소다."],a:3,e:"IP는 <b>숫자</b>, 도메인은 <b>문자</b> 주소다. 지문은 반대다."},
  {s:"컴퓨터일반",q:"다음 중 데이터 전송 방식에 대한 설명으로 옳지 않은 것은?",o:["단방향(Simplex)은 한쪽 방향으로만 전송한다(예: 방송).", "반이중(Half-duplex)은 양방향이나 동시에는 한 방향만 전송한다(예: 무전기).", "전이중(Full-duplex)은 동시에 양방향 전송이 가능하다(예: 전화).", "반이중은 송수신을 동시에 할 수 있어 전화에 사용된다."],a:3,e:"반이중은 <b>동시 송수신 불가</b>(무전기). 동시 양방향은 전이중이다."},
  {s:"컴퓨터일반",q:"다음 중 운영체제의 처리 프로그램과 제어 프로그램의 구분으로 옳지 않은 것은?",o:["감시 프로그램 — 제어 프로그램", "작업 관리 프로그램 — 제어 프로그램", "언어 번역 프로그램 — 처리 프로그램", "데이터 관리 프로그램 — 처리 프로그램"],a:3,e:"데이터 관리 프로그램은 '제어 프로그램'에 속한다. 제어 프로그램: 감시·작업 관리·데이터 관리. 처리 프로그램: 언어 번역·서비스·문제 처리 프로그램."},
  {s:"컴퓨터일반",q:"다음 중 운영체제의 기능으로 옳지 않은 것은?",o:["프로세스·자원 관리", "입출력·파일 관리", "사용자 인터페이스 제공", "워드 문서의 맞춤법 교정"],a:3,e:"워드 문서의 맞춤법 교정은 워드프로세서(응용 프로그램)의 기능이다. 운영체제는 자원·파일·입출력 관리와 인터페이스 제공을 담당한다."},
  {s:"컴퓨터일반",q:"다음 중 암호화 방식에 대한 설명으로 옳지 않은 것은?",o:["대칭키(비밀키) 암호화는 암호화·복호화에 같은 키를 쓰며 속도가 빠르다.", "공개키(비대칭) 암호화는 공개키로 암호화하고 개인키로 복호화한다.", "대표적 공개키 알고리즘으로 RSA가 있다.", "공개키 암호화는 대칭키보다 속도가 빠르고 키 분배가 간단하다."],a:3,e:"공개키는 대칭키보다 <b>속도가 느리다</b>. 다만 키 분배·관리가 안전하다는 장점이 있다."},
  {s:"컴퓨터일반",q:"다음 중 소프트웨어 관련 용어에 대한 설명으로 옳지 않은 것은?",o:["프리웨어는 무료로 사용할 수 있는 소프트웨어다.", "셰어웨어는 기능·기간을 제한해 배포하고 정식 사용 시 비용을 낸다.", "번들은 특정 하드웨어·소프트웨어에 끼워 제공하는 프로그램이다.", "베타 버전은 정식 출시 후 오류를 수정해 배포하는 최종 완성판이다."],a:3,e:"베타 버전은 <b>정식 출시 전 테스트용</b> 버전이다. 오류 수정 후 배포하는 것은 패치다."},
  {s:"컴퓨터일반",q:"다음 중 2진수 1100과 1010의 XOR(배타적 논리합) 연산 결과로 옳은 것은?",o:["1110", "0110", "1000", "0100"],a:1,e:"XOR는 서로 다를 때 1 → 1100 ⊕ 1010 = <b>0110</b>."},
  {s:"컴퓨터일반",q:"다음 중 기억장치에 대한 설명으로 옳지 않은 것은?",o:["접근 속도는 레지스터 > 캐시 > 주기억장치 > 보조기억장치 순으로 빠르다.", "ROM은 비휘발성이며 BIOS 등 변경이 드문 내용을 저장한다.", "RAM은 휘발성이며 전원이 꺼지면 내용이 사라진다.", "연관(연상) 기억장치는 주소를 이용해 데이터를 찾는 기억장치다."],a:3,e:"연관 기억장치(CAM)는 <b>내용(데이터)으로</b> 검색하는 장치다. 주소로 찾는 것이 아니다."},
  {s:"컴퓨터일반",q:"다음 중 그래픽 기법에 대한 설명으로 옳지 않은 것은?",o:["모델링은 물체의 형상을 수학적으로 정의하는 과정이다.", "렌더링은 색·명암·질감을 입혀 사실감을 주는 과정이다.", "디더링은 제한된 색으로 다양한 색을 표현하도록 점을 섞는 기법이다.", "안티앨리어싱은 색상 수를 늘려 파일 용량을 키우는 기법이다."],a:3,e:"안티앨리어싱은 경계의 '계단 현상'을 부드럽게 다듬는 기법이다. 색상 수를 늘려 용량을 키우는 기법이 아니다."},
  {s:"컴퓨터일반",q:"다음 중 중앙처리장치(CPU)에 대한 설명으로 옳지 않은 것은?",o:["제어장치(CU)는 명령을 해석하고 각 장치에 제어 신호를 보낸다.", "연산장치(ALU)는 산술·논리 연산을 수행한다.", "레지스터는 CPU 내부의 고속 기억장치로 연산 결과 등을 잠시 저장한다.", "프로그램 카운터(PC)는 연산 결과의 상태(부호·자리올림)를 저장하는 레지스터다."],a:3,e:"프로그램 카운터는 <b>다음에 실행할 명령의 주소</b>를 저장한다. 상태를 저장하는 것은 상태 레지스터(PSW)다."},
  {s:"컴퓨터일반",q:"다음 중 하나의 작업을 여러 CPU가 나누어 동시에 처리하여 성능을 높이는 방식을 의미하는 것은?",o:["병렬 처리", "일괄 처리", "분산 처리", "실시간 처리"],a:0,e:"여러 CPU가 하나의 작업을 나눠 동시에 처리하는 것은 <b>병렬 처리</b>다."},
  {s:"컴퓨터일반",q:"다음 중 컴퓨터 비전(Computer Vision) 기술의 활용으로 보기 어려운 것은?",o:["얼굴 인식 출입", "자율주행차의 보행자 감지", "의료 영상 판독", "스프레드시트 수식 계산"],a:3,e:"스프레드시트 수식 계산은 컴퓨터 비전과 무관하다."},
  {s:"컴퓨터일반",q:"다음 중 IP 주소와 도메인에 대한 설명으로 옳지 않은 것은?",o:["IPv4는 32비트, IPv6는 128비트 주소 체계이다.", "DNS는 도메인 이름을 IP 주소로 변환해 준다.", "IPv6는 주소 부족 문제를 해결하기 위해 등장했다.", "IPv4는 16비트씩 8부분으로 구성된다."],a:3,e:"IPv4는 8비트씩 4부분(예: 192.168.0.1)으로 구성된 32비트 주소이다. 16비트씩 8부분은 IPv6(128비트)에 대한 설명이다."},
  {s:"컴퓨터일반",q:"다음 사례에 해당하는 보안 위협으로 옳은 것은?\n\n이용자가 '은행 보안 강화 안내' 메일의 링크를 눌러, 실제 은행과 똑같이 생긴 가짜 사이트에 로그인 정보를 입력했다가 계좌에서 돈이 빠져나갔다.",o:["스니핑(Sniffing)", "피싱(Phishing)", "DoS 공격", "스풀링(Spooling)"],a:1,e:"정상 사이트처럼 위장해 개인정보를 가로채는 수법은 <b>피싱</b>이다."},
  {s:"컴퓨터일반",q:"다음 중 가로 800픽셀 × 세로 768픽셀, 한 픽셀을 8비트로 표현하는 비압축 비트맵 이미지의 용량으로 옳은 것은? (1KB=1,024Byte)",o:["1,200KB", "600KB", "200KB", "4,800KB"],a:1,e:"비트맵 용량 = 가로×세로×색 깊이(비트)÷8 = 800×768×8÷8 = <b>614,400 Byte</b> ≒ 600KB."},
  {s:"컴퓨터일반",q:"다음은 7비트 ASCII 코드에 짝수 패리티 비트를 '오른쪽 끝 1비트'로 붙인 8비트 코드이다. 전송 중 오류가 발생한(패리티가 어긋난) 것은?",o:["11111100", "10100101", "01110111", "11110010"],a:3,e:"짝수 패리티는 8비트 전체에서 1의 개수가 짝수가 되도록 패리티 비트를 정한다. 정답 코드 <b>11110010</b>는 1의 개수가 5개로 짝수가 아니어서 오류이다. (패리티 비트는 1비트 오류의 '발생 여부'만 검출하고 위치는 못 찾는다.)"},
  {s:"컴퓨터일반",q:"다음 중 가로 800픽셀 × 세로 768픽셀, 한 픽셀을 24비트로 표현하는 비압축 비트맵 이미지의 용량으로 옳은 것은? (1KB=1,024Byte)",o:["1,800KB", "600KB", "3,600KB", "43,200KB"],a:0,e:"비트맵 용량 = 가로×세로×색 깊이(비트)÷8 = 800×768×24÷8 = <b>1,843,200 Byte</b> ≒ 1,800KB."},
  {s:"컴퓨터일반",q:"다음은 7비트 ASCII 코드에 홀수 패리티 비트를 '오른쪽 끝 1비트'로 붙인 8비트 코드이다. 전송 중 오류가 발생한(패리티가 어긋난) 것은?",o:["00011010", "10011111", "10101110", "11100101"],a:1,e:"홀수 패리티는 8비트 전체에서 1의 개수가 홀수가 되도록 패리티 비트를 정한다. 정답 코드 <b>10011111</b>는 1의 개수가 6개로 홀수가 아니어서 오류이다. (패리티 비트는 1비트 오류의 '발생 여부'만 검출하고 위치는 못 찾는다.)"},
  {s:"스프레드시트",q:"다음 중 그림과 같은 [매크로 기록]에 대한 설명으로 옳지 않은 것은?",o:["매크로 이름의 첫 글자는 문자여야 하며 공백은 쓸 수 없다.", "바로 가기 키로 Ctrl+소문자 또는 Ctrl+Shift+대문자를 지정할 수 있다.", "매크로 저장 위치로 '개인용 매크로 통합 문서'를 선택할 수 있다.", "바로 가기 키는 반드시 지정해야 하며 비워 둘 수 없다."],a:3,fig:"<div class=\"dlg\"><div class=\"tb\"><span>매크로 기록</span><span class=\"x\">? ✕</span></div><div class=\"bd\"><div class=\"row\"><span>매크로 이름:</span><span class=\"inp\">매크로1</span></div><div class=\"row\"><span>바로 가기 키: Ctrl+</span><span class=\"inp\"></span></div><div class=\"row\"><span>매크로 저장 위치:</span><span class=\"sel\">현재 통합 문서</span></div><div class=\"btns\"><span class=\"btn pri\">확인</span><span class=\"btn\">취소</span></div></div></div>",e:"바로 가기 키는 <b>선택 사항</b>으로 비워 둘 수 있다."},
  {s:"스프레드시트",q:"다음 중 셀 참조 방식에 대한 설명으로 옳지 않은 것은?",o:["상대참조는 자동 채우기 시 행과 열이 자동으로 변경된다", "절대참조는 $ 기호를 행과 열 앞에 모두 붙인다", "F4 키를 누르면 참조 방식이 상대→절대→행고정혼합→열고정혼합→상대 순으로 순환한다", "혼합참조는 행과 열이 모두 고정되어 자동 채우기 시 전혀 변하지 않는다"],a:3,e:"혼합참조는 행 또는 열 중 하나만 고정되고 나머지 하나는 상대참조처럼 변경된다. 행과 열이 모두 고정되는 것은 절대참조에 대한 설명이다. 80. 다음 중 인쇄 미리보기 화면에서 설정할 수 없는 것은?"},
  {s:"스프레드시트",q:"아래 시트에서 부서가 '영업부'인 직원의 급여 합계를 [F2] 셀에 구하려고 한다. 입력할 수식으로 옳은 것은?",o:["=SUMIF(B2:B4,\"영업부\",D2:D4)", "=SUMIF(D2:D4,\"영업부\",B2:B4)", "=DSUM(B2:B4,\"영업부\",D2:D4)", "=COUNTIF(B2:B4,\"영업부\")"],a:0,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">이름</td><td class=\"hd\">부서</td><td class=\"hd\">직급</td><td class=\"hd\">급여</td></tr><tr><td class=\"rh\">2</td><td>김하나</td><td class=\"l\">영업부</td><td>대리</td><td>3,200,000</td></tr><tr><td class=\"rh\">3</td><td>이두리</td><td class=\"l\">총무부</td><td>과장</td><td>3,800,000</td></tr><tr><td class=\"rh\">4</td><td>박세찬</td><td class=\"l\">영업부</td><td>사원</td><td>2,700,000</td></tr></table>",e:"SUMIF(<b>조건범위, 조건, 합계범위</b>) → 부서(B)에서 '영업부'를 찾아 급여(D)를 더한다."},
  {s:"스프레드시트",q:"다음 중 차트 종류에 대한 설명으로 옳지 않은 것은?",o:["원형 차트는 항상 한 개의 계열만 가지며 축이 없고, 조각을 분리해 강조할 수 있다.", "분산형(XY)은 가로 축이 항목 축이 아닌 값 축 형태이며 3차원으로 작성할 수 없다.", "히스토그램은 구간(계급)별 빈도를 막대로 나타내며 항목 간 구성비 비교에 가장 적합하다.", "방사형은 가운데에서 뻗은 값 축을 가지며 3차원으로 작성할 수 없다."],a:2,e:"히스토그램은 <b>구간별 빈도 분포</b>용으로 구성비 비교엔 부적합(구성비는 원형·누적 막대형)."},
  {s:"스프레드시트",q:"다음 중 '시트 보호' 시 설정할 수 있는 허용 작업으로 옳지 않은 것은?",o:["잠긴 셀 선택 허용", "잠기지 않은 셀 선택 허용", "셀 서식·행/열 삽입 허용", "워크시트 자체를 영구 삭제 허용"],a:3,e:"시트 보호에서는 잠긴/잠기지 않은 셀 선택, 셀 서식, 행·열 삽입·삭제, 정렬, 자동 필터 등의 '허용 여부'를 설정한다. 시트를 영구 삭제하는 허용 옵션은 없다."},
  {s:"스프레드시트",q:"다음 중 인쇄 및 페이지 설정에 대한 설명으로 옳지 않은 것은?",o:["[페이지 설정]-[시트] 탭에서 반복할 행을 $1:$1로 지정하면 매 페이지 1행이 반복 인쇄된다.", "화면의 확대/축소 비율(10~400%)을 바꾸면 실제 인쇄물 크기도 함께 바뀐다.", "'간단하게 인쇄'를 선택하면 테두리·그래픽이 인쇄되지 않는다.", "'인쇄 영역'은 [인쇄 미리 보기]-[페이지 설정]에서 비활성화되고 [페이지 레이아웃]-[시트] 탭에서 지정한다."],a:1,e:"화면 확대/축소는 <b>인쇄에 영향 없다</b>. 인쇄 배율은 [페이지 설정]-'확대/축소'에서 따로 지정한다."},
  {s:"스프레드시트",q:"다음 중 그림과 같이 필드를 배치한 피벗 테이블에 대한 설명으로 옳지 않은 것은?",o:["'행'에 부서, '열'에 분기, '값'에 매출 합계가 배치되어 교차 집계된다.", "값 영역의 요약 함수는 '값 필드 설정'에서 평균·개수 등으로 바꿀 수 있다.", "'행'과 '열'의 필드를 서로 드래그로 바꾸면 보고서 구조가 즉시 바뀐다.", "원본에서 일부 행을 삭제하면 피벗 테이블의 해당 값도 즉시 자동으로 지워진다."],a:3,fig:"<div class=\"dlg\"><div class=\"tb\"><span>피벗 테이블 필드</span><span class=\"x\">? ✕</span></div><div class=\"bd\"><div style=\"font-size:.72rem;color:#333\">보고서에 추가할 필드</div><div class=\"area\" style=\"padding:.25rem .4rem;font-size:.72rem;line-height:1.55\">☑ 부서<br>☑ 분기<br>☑ 매출</div><div class=\"row\"><span>필터</span><span class=\"sel\"></span></div><div class=\"row\"><span>열</span><span class=\"sel\">분기</span></div><div class=\"row\"><span>행</span><span class=\"sel\">부서</span></div><div class=\"row\"><span>값</span><span class=\"sel\">합계 : 매출</span></div><div class=\"btns\"><span class=\"btn pri\">확인</span><span class=\"btn\">취소</span></div></div></div>",e:"원본 변경은 <b>'새로 고침'</b> 전까지 피벗에 반영되지 않는다."},
  {s:"스프레드시트",q:"다음 중 그림과 같은 [새 서식 규칙]에 대한 설명으로 옳지 않은 것은?",o:["'다음을 포함하는 셀만 서식 지정'으로 값 범위 조건을 줄 수 있다.", "'수식을 사용하여 서식을 지정할 셀 결정'으로 수식 조건을 줄 수 있다.", "'상위 또는 하위 값만 서식 지정'으로 상위 10% 등을 지정할 수 있다.", "한 번 만든 규칙은 수정할 수 없고 삭제 후 다시 만들어야 한다."],a:3,fig:"<div class=\"dlg\"><div class=\"tb\"><span>새 서식 규칙</span><span class=\"x\">? ✕</span></div><div class=\"bd\"><div class=\"area\" style=\"padding:.3rem .4rem;font-size:.72rem;line-height:1.5\">▸ 셀 값을 기준으로 모든 셀 서식<br>▸ 다음을 포함하는 셀만 서식<br>▸ 상위/하위 값만 서식<br>▸ 수식을 사용하여 서식 결정</div><div class=\"btns\"><span class=\"btn pri\">확인</span><span class=\"btn\">취소</span></div></div></div>",e:"규칙은 <b>규칙 관리자에서 수정·우선순위 변경</b>이 가능하다."},
  {s:"스프레드시트",q:"셀 [A1:A5]에 다음 값이 입력되어 있다: 11, 21, 32, 44, 60\n다음 수식(제2사분위수)의 결과로 옳은 것은?\n\n=QUARTILE.INC(A1:A5, 2)",o:["33", "44", "31", "32"],a:3,e:"QUARTILE.INC(범위, 2)는 제2사분위수(하위 50% 지점)를 구하며 PERCENTILE.INC(범위,0.5)와 같다. 정렬된 값에서 결과는 <b>32</b>이다."},
  {s:"스프레드시트",q:"다음 중 REPT 함수로 문자를 반복한 결과로 옳은 것은?\n\n=REPT(\"★\",2)&REPT(\"☆\",5-2)",o:["★★★☆☆", "★★", "★★☆☆1", "★★☆☆☆"],a:3,e:"★를 2번, ☆를 3번 이어 붙여 5칸 별점을 만든다 → ★★☆☆☆"},
  {s:"스프레드시트",q:"아래 시트에서 부서가 '영업부'인 직원의 급여 합계를 [F2]에 구하려 한다. 입력할 수식으로 옳은 것은?",o:["=SUMIF(B2:B4,\"영업부\",D2:D4)", "=SUMIF(D2:D4,\"영업부\",B2:B4)", "=COUNTIF(B2:B4,\"영업부\")", "=DSUM(B2:B4,\"영업부\",D2:D4)"],a:0,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">이름</td><td class=\"hd\">부서</td><td class=\"hd\">직급</td><td class=\"hd\">급여</td></tr><tr><td class=\"rh\">2</td><td>이두리</td><td class=\"l\">총무부</td><td>대리</td><td>4,300,000</td></tr><tr><td class=\"rh\">3</td><td>최나래</td><td class=\"l\">총무부</td><td>대리</td><td>2,100,000</td></tr><tr><td class=\"rh\">4</td><td>김하나</td><td class=\"l\">인사부</td><td>사원</td><td>2,400,000</td></tr></table>",e:"SUMIF(<b>조건범위, 조건, 합계범위</b>) → 부서(B)에서 '영업부'를 찾아 급여(D)를 더한다."},
  {s:"스프레드시트",q:"다음 중 문자 위치를 찾는 함수식의 결과로 옳은 것은? (FIND는 대/소문자 구분·와일드카드 불가, SEARCH는 구분 안 함·와일드카드 가능)\n\n=FIND(\"Y\",\"YOUNGPAJOK\")",o:["0", "2", "#VALUE!", "1"],a:3,e:"FIND(찾을문자, 대상)은 앞에서부터 문자가 처음 나오는 <b>위치(1부터)</b>를 반환한다. \"YOUNGPAJOK\"에서 'Y'의 위치는 <b>1</b>. (공백도 한 글자로 센다.)"},
  {s:"스프레드시트",q:"왼쪽 기준표([F2:G6], 오름차순)를 이용해 점수 40점의 등급을 구하려고 한다. 가장 적절한 수식은? (구간의 최저점 이상이면 해당 등급)",o:["=VLOOKUP(40,$F$2:$G$6,2,FALSE)", "=HLOOKUP(40,$F$2:$G$6,2,TRUE)", "=VLOOKUP(40,$F$2:$G$6,2,TRUE)", "=VLOOKUP(40,$F$2:$G$6,2,0)"],a:2,fig:"<table class=\"xg\"><tr><th></th><th>F</th><th>G</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">기준점수</td><td class=\"hd\">등급</td></tr><tr><td class=\"rh\">2</td><td>0</td><td class=\"l\">F</td></tr><tr><td class=\"rh\">3</td><td>60</td><td class=\"l\">D</td></tr><tr><td class=\"rh\">4</td><td>70</td><td class=\"l\">C</td></tr><tr><td class=\"rh\">5</td><td>80</td><td class=\"l\">B</td></tr><tr><td class=\"rh\">6</td><td>90</td><td class=\"l\">A</td></tr></table>",e:"구간(범위) 조회는 네 번째 인수를 <b>TRUE(생략 가능, 근사일치)</b>로 두고 기준표가 <b>오름차순</b>이어야 한다. 40점 → <b>F</b>등급. FALSE(정확히 일치)는 기준표에 없는 값이면 #N/A가 난다."},
  {s:"스프레드시트",q:"왼쪽 기준표([F2:G6], 오름차순)를 이용해 점수 73점의 등급을 구하려고 한다. 가장 적절한 수식은? (구간의 최저점 이상이면 해당 등급)",o:["=HLOOKUP(73,$F$2:$G$6,2,TRUE)", "=VLOOKUP(73,$F$2:$G$6,2,0)", "=VLOOKUP(73,$F$2:$G$6,2,FALSE)", "=VLOOKUP(73,$F$2:$G$6,2,TRUE)"],a:3,fig:"<table class=\"xg\"><tr><th></th><th>F</th><th>G</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">기준점수</td><td class=\"hd\">등급</td></tr><tr><td class=\"rh\">2</td><td>0</td><td class=\"l\">F</td></tr><tr><td class=\"rh\">3</td><td>60</td><td class=\"l\">D</td></tr><tr><td class=\"rh\">4</td><td>70</td><td class=\"l\">C</td></tr><tr><td class=\"rh\">5</td><td>80</td><td class=\"l\">B</td></tr><tr><td class=\"rh\">6</td><td>90</td><td class=\"l\">A</td></tr></table>",e:"구간(범위) 조회는 네 번째 인수를 <b>TRUE(생략 가능, 근사일치)</b>로 두고 기준표가 <b>오름차순</b>이어야 한다. 73점 → <b>C</b>등급. FALSE(정확히 일치)는 기준표에 없는 값이면 #N/A가 난다."},
  {s:"스프레드시트",q:"아래 시트에서 입력값에 주어진 표시 형식을 적용했을 때, [C2]의 결과로 옳은 것은?",o:["12.5%", "1,235", "1", "3.14"],a:2,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">입력값</td><td class=\"hd\">표시 형식</td><td class=\"hd\">결과</td></tr><tr><td class=\"rh\">2</td><td>1000000</td><td class=\"l\">0,,</td><td>?</td></tr></table>",e:"쉼표 2개는 백만 단위 생략 → 1"},
  {s:"스프레드시트",q:"다음 중 날짜 함수 수식의 실행 결과로 옳은 것은?\n\n=EOMONTH(\"2025-10-24\",4)",o:["2026-02-27", "2025-10-24", "2026-02-28", "2026-02-01"],a:2,e:"EOMONTH은 4개월 뒤 달의 '마지막 날'을 반환한다 → <b>2026-02-28</b>."},
  {s:"스프레드시트",q:"셀 [A1:A5]에 다음 값이 입력되어 있다: 17, 26, 35, 72, 97\n다음 수식(75% 지점(백분위수))의 결과로 옳은 것은?\n\n=PERCENTILE.INC(A1:A5, 0.75)",o:["71", "73", "72", "97"],a:2,e:"PERCENTILE.INC(범위, 0.75)는 데이터를 오름차순 정렬했을 때 하위 75% 위치의 값을 구한다. 정렬된 5개 값에서 그 위치의 값은 <b>72</b>이다."},
  {s:"스프레드시트",q:"아래 표에서 전체 판매 금액(수량×단가의 합계)을 한 번에 구하려고 한다. 가장 적절한 수식은? (참고: 총액 127,000원)",o:["=SUMPRODUCT(B2:B4,C2:C4)", "=SUM(B2:B4)*SUM(C2:C4)", "=SUM(B2:B4*C2:C4)", "=SUMPRODUCT(B2:B4+C2:C4)"],a:0,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">품목</td><td class=\"hd\">수량</td><td class=\"hd\">단가</td></tr><tr><td class=\"rh\">2</td><td>자</td><td>4</td><td>10,000</td></tr><tr><td class=\"rh\">3</td><td>풀</td><td>3</td><td>3,000</td></tr><tr><td class=\"rh\">4</td><td>지우개</td><td>6</td><td>13,000</td></tr></table>",e:"<b>SUMPRODUCT(배열1, 배열2)</b>는 대응하는 원소끼리 곱한 뒤 모두 더한다 → <b>127,000</b>원. =SUM(B*C)는 일반 입력 시 배열이 아니라 오류/단일값이 되고(배열 입력해야 함), SUM(B)*SUM(C)는 합끼리 곱해 의미가 다르다."},
  {s:"스프레드시트",q:"아래 시트에서 부서가 '인사부'인 직원의 급여 합계를 [F2]에 구하려 한다. 입력할 수식으로 옳은 것은?",o:["=COUNTIF(B2:B4,\"인사부\")", "=SUMIF(D2:D4,\"인사부\",B2:B4)", "=SUMIF(B2:B4,\"인사부\",D2:D4)", "=DSUM(B2:B4,\"인사부\",D2:D4)"],a:2,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">이름</td><td class=\"hd\">부서</td><td class=\"hd\">직급</td><td class=\"hd\">급여</td></tr><tr><td class=\"rh\">2</td><td>오지민</td><td class=\"l\">영업부</td><td>대리</td><td>3,800,000</td></tr><tr><td class=\"rh\">3</td><td>이두리</td><td class=\"l\">총무부</td><td>사원</td><td>3,800,000</td></tr><tr><td class=\"rh\">4</td><td>박세찬</td><td class=\"l\">기획부</td><td>사원</td><td>4,200,000</td></tr></table>",e:"SUMIF(<b>조건범위, 조건, 합계범위</b>) → 부서(B)에서 '인사부'를 찾아 급여(D)를 더한다."},
  {s:"스프레드시트",q:"다음 중 수식의 실행 결과가 옳지 않은 것은?",o:["=TRUNC(-7.2) → -8", "=ROUND(826.247,2) → 826.25", "=MOD(4,4) → 0", "=INT(-6) → -6"],a:0,e:"=TRUNC(-7.2)의 올바른 결과는 -7이다. (INT=내림, TRUNC=절사, MOD=n-d×INT(n/d), ROUND=반올림)"}
 ]},
{ name:'기출 10회', q:[
  {s:"컴퓨터일반",q:"다음 중 스풀과 버퍼의 비교로 옳지 않은 것은?",o:["버퍼는 속도 차가 있는 두 장치 사이의 임시 저장 공간이다.", "스풀은 주로 디스크(보조기억장치)를 이용한다.", "버퍼는 주로 주기억장치(RAM)를 이용한다.", "스풀은 한 번에 하나의 작업만 저장할 수 있어 대기열을 만들 수 없다."],a:3,e:"스풀은 <b>여러 작업을 대기열(큐)</b>로 쌓을 수 있다."},
  {s:"컴퓨터일반",q:"다음 중 소프트웨어 설치·관리에 대한 설명으로 옳지 않은 것은?",o:["설치 시 저작권(라이선스)에 동의해야 하는 경우가 있다.", "사용하지 않는 프로그램은 제거해 공간을 확보할 수 있다.", "업데이트로 보안 취약점을 보완할 수 있다.", "프로그램을 삭제하려면 반드시 파일 탐색기에서 폴더만 지우면 완전히 제거된다."],a:3,e:"폴더만 지우면 레지스트리·관련 파일이 남을 수 있어, 설정의 '앱 제거'나 전용 제거 프로그램을 사용해야 깔끔히 삭제된다."},
  {s:"컴퓨터일반",q:"다음 중 운영체제(OS)와 구성 프로그램에 대한 설명으로 옳지 않은 것은?",o:["운영체제는 사용자와 하드웨어 사이의 인터페이스 역할을 하며 동작 중 주기억장치에 상주한다.", "처리 프로그램은 감시·작업 관리·데이터 관리 프로그램으로 구성된다.", "성능 평가에서 처리 능력·사용 가능도는 높을수록, 응답 시간은 짧을수록 좋다.", "언어 번역·서비스·문제 처리 프로그램은 모두 처리 프로그램에 속한다."],a:1,e:"감시·작업 관리·데이터 관리는 <b>제어 프로그램</b>이다(제감데작). 처리 프로그램은 언어 번역·서비스·문제 처리다."},
  {s:"컴퓨터일반",q:"다음 중 10진수 45를 2진수로 변환한 값과 2진수 101101을 10진수로 변환한 값을 바르게 짝지은 것은?",o:["101101₂ / 45", "101011₂ / 44", "110101₂ / 46", "101101₂ / 43"],a:0,e:"45 = 32+8+4+1 = 101101₂. 반대로 101101₂ = 32+8+4+1 = 45. 따라서 두 값이 서로 대응한다."},
  {s:"컴퓨터일반",q:"다음 중 이미지 파일 형식에 대한 설명으로 옳지 않은 것은?",o:["JPG는 손실 압축으로 사진 표현에 적합하다.", "GIF는 256색과 투명·애니메이션을 지원한다.", "PNG는 무손실 압축과 투명(알파)을 지원한다.", "BMP는 압축률이 높아 파일 크기가 가장 작다."],a:3,e:"BMP는 '무압축'이라 파일 크기가 큰 편이다. JPG(손실), GIF(256색·애니), PNG(무손실·투명)는 각각의 압축 특성을 갖는다."},
  {s:"컴퓨터일반",q:"다음 중 자동 가입·악성 봇을 막기 위해 사람만 풀 수 있는 문자·이미지 인증을 요구하는 기술을 의미하는 것은?",o:["캡차(CAPTCHA)", "방화벽", "디지털 서명", "프록시"],a:0,e:"사람과 봇을 구별하는 인증은 <b>캡차</b>다."},
  {s:"컴퓨터일반",q:"다음 중 클라우드 서비스 모델에 대한 설명으로 옳지 않은 것은?",o:["IaaS는 서버·스토리지 등 인프라를 제공한다.", "PaaS는 응용 프로그램 개발·실행 플랫폼을 제공한다.", "SaaS는 완성된 소프트웨어를 인터넷으로 제공한다.", "IaaS는 사용자가 직접 설치한 완성형 앱만 쓸 수 있는 모델이다."],a:3,e:"IaaS는 인프라(가상 서버·저장소·네트워크)를 제공하는 모델로, 사용자가 OS·미들웨어·앱을 직접 구성한다. 완성형 앱 제공은 SaaS이다."},
  {s:"컴퓨터일반",q:"다음 중 소리의 디지털화(샘플링)에 대한 설명으로 옳은 것은?",o:["샘플링 주파수가 높을수록 원음에 가깝고 파일 용량이 커진다.", "양자화 비트 수가 작을수록 음질이 좋아진다.", "샘플링은 디지털 소리를 아날로그로 바꾸는 과정이다.", "샘플링 주파수가 낮을수록 용량이 커진다."],a:0,e:"샘플링 주파수(Hz)가 높을수록 1초에 더 많이 표본화해 원음에 가깝고 용량이 커진다. 양자화 비트가 클수록 음질이 좋아진다. 샘플링은 아날로그→디지털 변환 과정이다."},
  {s:"컴퓨터일반",q:"다음 중 USB(범용 직렬 버스)에 대한 설명으로 옳지 않은 것은?",o:["주변 장치를 최대 127개까지 연결할 수 있다.", "핫 플러그인(Hot Plug-in)과 플러그 앤 플레이를 지원한다.", "전원이 켜진 상태에서 장치를 연결·제거할 수 있다.", "직렬이 아닌 병렬 방식으로 데이터를 전송한다."],a:3,e:"USB는 이름 그대로 '직렬(Serial)' 버스이다. 핫 플러그인·플러그 앤 플레이를 지원하며 여러 장치를 연결할 수 있다."},
  {s:"컴퓨터일반",q:"다음 중 ASCII 코드에 대한 설명으로 옳은 것은?",o:["8비트로 구성되어 256가지 문자를 표현한다.", "6비트로 영문 소문자까지 모두 표현한다.", "7비트로 128가지를 표현하며 데이터 통신·PC에서 주로 쓴다.", "16비트로 전 세계 문자를 표현하는 국제 표준이다."],a:2,e:"ASCII는 <b>7비트·128가지</b>다. 8비트 256가지는 EBCDIC, 16비트 국제표준은 유니코드다."},
  {s:"컴퓨터일반",q:"다음 중 Windows 11의 파일 탐색기에 대한 설명으로 옳지 않은 것은?",o:["하나의 창에서 '탭' 기능으로 여러 폴더를 열어 전환할 수 있다.", "<b>Alt+방향키</b>로 이전/다음 폴더로 이동하는 탐색 기록을 사용할 수 있다.", "파일을 선택하고 <b>F2</b>를 누르면 이름을 바꿀 수 있다.", "휴지통을 거치지 않고 영구 삭제하려면 <b>Shift+Insert</b>를 사용한다."],a:3,e:"휴지통을 거치지 않는 영구 삭제는 <b>Shift+Delete</b>이다. Shift+Insert는 붙여넣기 기능이다. 탐색기 탭, Alt+방향키 이동, F2 이름 바꾸기는 모두 옳다."},
  {s:"컴퓨터일반",q:"다음 중 방화벽(Firewall)에 대한 설명으로 옳지 않은 것은?",o:["외부로부터의 불법 침입을 차단하는 보안 시스템이다.", "내부와 외부 네트워크 사이에서 트래픽을 통제한다.", "내부에서 외부로 나가는 정보는 통제할 수 없고 외부 침입만 막는다.", "접근 규칙에 따라 패킷을 허용하거나 거부한다."],a:2,e:"방화벽은 <b>내부→외부 트래픽도 통제</b>할 수 있다(외부 침입만 막는 것이 아니다)."},
  {s:"컴퓨터일반",q:"다음 중 24비트 트루컬러로 표현할 수 있는 색상의 수로 옳은 것은?",o:["256", "약 6만 5천", "약 1,677만", "약 42억"],a:2,e:"24비트 = 2²⁴ ≈ <b>1,677만</b> 색이다."},
  {s:"컴퓨터일반",q:"다음 중 Windows의 '작업 표시줄'에 대한 설명으로 옳지 않은 것은?",o:["자주 쓰는 프로그램을 고정할 수 있다.", "위치를 화면 상·하·좌·우로 옮길 수 있다.", "자동 숨김을 설정할 수 있다.", "작업 표시줄에는 최대 5개의 아이콘만 고정할 수 있다."],a:3,e:"작업 표시줄에 고정할 수 있는 아이콘 수에 5개 같은 제한은 없다. 고정·위치 이동·자동 숨김은 모두 가능하다."},
  {s:"컴퓨터일반",q:"다음 중 TCP/IP의 각 프로토콜에 대한 설명으로 옳지 않은 것은?",o:["TCP는 데이터를 패킷으로 나누고 오류를 검사해 신뢰성 있는 전송을 담당한다.", "IP는 패킷의 주소를 지정하고 경로를 설정한다.", "TCP는 네트워크 계층, IP는 전송 계층에 해당한다.", "UDP는 TCP보다 신뢰성은 낮지만 속도가 빠르다."],a:2,e:"TCP는 '전송 계층', IP는 '인터넷(네트워크) 계층'에 해당한다. 보기 ③은 둘의 계층이 서로 바뀌었다."},
  {s:"컴퓨터일반",q:"다음 중 '가상 메모리(Virtual Memory)'에 대한 설명으로 옳은 것은?",o:["보조기억장치의 일부를 주기억장치처럼 사용해 실제보다 큰 주소 공간을 제공한다.", "CPU 내부에 두는 초고속 기억장치로 연산 속도를 높인다.", "자주 쓰는 데이터를 담아 두는 비휘발성 캐시이다.", "전원이 꺼지면 사라지는 ROM의 한 종류이다."],a:0,e:"가상 메모리는 하드디스크 등 보조기억장치의 공간을 주기억장치처럼 활용해, 물리적 RAM보다 큰 프로그램을 실행할 수 있게 한다. 속도는 느려질 수 있다."},
  {s:"컴퓨터일반",q:"다음 두 8비트 값에 비트 단위 XOR 연산을 수행한 결과로 옳은 것은?\n\n10011110 XOR 01001111",o:["11011111", "01100001", "11010001", "00001110"],a:2,e:"비트 XOR은 각 자리에서 서로 다르면 1 → <b>11010001</b>."},
  {s:"컴퓨터일반",q:"다음 중 가로 1280픽셀 × 세로 600픽셀, 한 픽셀을 24비트로 표현하는 비압축 비트맵 이미지의 용량으로 옳은 것은? (1KB=1,024Byte)",o:["750KB", "2,250KB", "54,000KB", "4,500KB"],a:1,e:"비트맵 용량 = 가로×세로×색 깊이(비트)÷8 = 1280×600×24÷8 = <b>2,304,000 Byte</b> ≒ 2,250KB."},
  {s:"컴퓨터일반",q:"다음 두 8비트 값에 비트 단위 OR 연산을 수행한 결과로 옳은 것은?\n\n10111010 OR 00010110",o:["00010010", "01000101", "10101100", "10111110"],a:3,e:"비트 OR은 각 자리에서 하나라도 1이면 1 → <b>10111110</b>."},
  {s:"컴퓨터일반",q:"다음 중 주소선(주소 버스)이 20개인 시스템이 직접 지정할 수 있는 최대 기억 공간(워드 수)으로 옳은 것은?",o:["2,097,152", "20,480", "524,288", "1,048,576"],a:3,e:"주소선 n개로 2ⁿ개의 주소를 지정한다 → 2^20 = <b>1,048,576</b>개."},
  {s:"스프레드시트",q:"다음 중 순위·반올림 결합 수식에 대한 설명으로 옳지 않은 것은?",o:["=RANK.EQ(B2,$B$2:$B$8,0)은 내림차순 순위(큰 값이 1등)를 구한다.", "순위 범위는 복사에 대비해 절대 참조로 고정하는 것이 좋다.", "=ROUND(AVERAGE(B2:B8),0)은 평균을 정수로 반올림한다.", "=RANK.EQ의 세 번째 인수를 0으로 하면 오름차순 순위가 된다."],a:3,e:"세 번째 인수 0은 <b>내림차순</b>, 0이 아니면 오름차순이다."},
  {s:"스프레드시트",q:"다음 중 조건 함수(IF·IFS·SWITCH)에 대한 설명으로 옳지 않은 것은?",o:["=IF(E3>=90,\"A\",IF(E3>=80,\"B\",\"C\"))는 IF를 중첩해 세 구간을 판정한다.", "IFS에서 나머지 전부를 처리하려면 마지막 조건 자리에 TRUE를 넣는다.", "SWITCH는 정확히 일치하는 경우뿐 아니라 부등호(>,<) 조건에도 쓸 수 있다.", "=IFERROR(VLOOKUP(A2,표,2,0),\"없음\")은 VLOOKUP 오류 시 '없음'을 반환한다."],a:2,e:"SWITCH는 <b>정확히 일치</b>만 비교하며 <b>부등호 조건 불가</b>."},
  {s:"스프레드시트",q:"다음 중 추세선의 종류로 보기 어려운 것은?",o:["선형", "지수", "로그", "방사형"],a:3,e:"추세선 종류에는 선형·지수·로그·다항식·거듭제곱·이동 평균이 있다. <b>방사형</b>은 차트 종류다."},
  {s:"스프레드시트",q:"다음 중 매크로에 대한 설명으로 옳지 않은 것은?",o:["이름의 첫 글자는 반드시 문자여야 하며 공백·마침표(.)는 쓸 수 없다.", "기본 바로 가기 키는 Ctrl+소문자, 대문자로 지정하면 Ctrl+Shift+대문자가 된다.", "매크로 바로 가기 키가 엑셀 기본 키와 겹치면 엑셀 기본 키가 우선한다.", "한 단계씩 실행은 F8, 매크로 실행은 F5다."],a:2,e:"겹치면 <b>매크로 바로 가기 키가 우선</b> 실행된다."},
  {s:"스프레드시트",q:"다음 중 통계 함수에 대한 설명으로 옳지 않은 것은?",o:["=RANK.EQ(값,범위,0)은 내림차순(큰 값이 1등) 순위를, 1은 오름차순 순위를 구한다.", "=COUNTA는 비어 있지 않은 모든 셀, =COUNTBLANK는 빈 셀의 개수를 센다.", "=LARGE(범위,2)는 두 번째로 큰 값, =SMALL(범위,2)는 두 번째로 작은 값을 구한다.", "=MEDIAN은 최빈값(가장 자주 나오는 값)을, =MODE.SNGL은 중앙값을 구한다."],a:3,e:"=MEDIAN은 <b>중앙값</b>, =MODE.SNGL은 <b>최빈값</b>이다. 지문은 반대다."},
  {s:"스프레드시트",q:"다음 중 틀 고정과 창 나누기에 대한 설명으로 옳지 않은 것은?",o:["틀 고정은 현재 셀 포인터의 위쪽 행과 왼쪽 열을 고정한다.", "창 나누기는 최대 4개 영역으로 나눌 수 있고 각 영역을 따로 스크롤할 수 있다.", "틀 고정선은 마우스로 드래그해 위치를 조절할 수 있다.", "틀 고정이나 창 나누기는 화면 표시 기능일 뿐 인쇄에는 영향을 주지 않는다."],a:2,e:"틀 고정선은 <b>드래그로 이동할 수 없다</b>(창 나누기선은 드래그 가능)."},
  {s:"스프레드시트",q:"다음 중 자동 필터에 대한 설명으로 옳지 않은 것은?",o:["필터는 조건에 맞는 행만 '표시'하고 나머지는 숨긴다.", "숫자·텍스트·날짜·색 기준으로 필터링할 수 있다.", "상위 10 자동 필터로 상위·하위 몇 개 항목만 표시할 수 있다.", "필터를 적용하면 조건에 맞지 않는 행이 영구히 삭제된다."],a:3,e:"자동 필터는 행을 <b>숨길 뿐 삭제하지 않는다</b>."},
  {s:"스프레드시트",q:"다음 중 워크시트 관리에 대한 설명으로 옳지 않은 것은?",o:["시트 탭을 Ctrl+드래그하면 시트가 복사된다.", "여러 시트를 그룹으로 묶으면 한 번의 입력이 모든 시트에 동시에 적용된다.", "시트 이름에는 \\ / ? * [ ] : 등을 쓸 수 없다.", "한 통합 문서에 들어갈 수 있는 시트 수는 최대 3개로 고정되어 있다."],a:3,e:"시트 수는 <b>메모리가 허용하는 범위에서 추가</b>할 수 있다(3개 고정 아님)."},
  {s:"스프레드시트",q:"셀 값이 1,000 이상이면 '파랑', 1,000 미만 500 이상이면 '자홍', 500 미만이면 색을 지정하지 않고, 모든 구간에서 천 단위 구분 기호(,)와 소수 이하 첫째 자리까지 표시하려고 한다. 사용자 지정 표시 형식으로 옳은 것은? (예: 1234.56 → 1,234.6, 432 → 432.0)",o:["[파랑][>=1000]#,##0.0;[자홍][>=500]#,##0.0", "[>=1000]<파랑>#,##0.0;[>=500]<자홍>#,##0.0;#,##0.0", "[파랑][>=1000]#,##0.0;[자홍][>=500]#,##0.0;#,##0.0", "[파랑][>=1000]#,###.#;[자홍][>=500]#,###.#;#,###.#"],a:2,e:"사용자 지정 형식은 <b>[조건·색]양수서식;[조건·색]서식;나머지서식</b> 구조로, 색과 조건은 대괄호 [파랑][>=1000] 안에 넣는다. 소수 첫째 자리는 0을 써서 <b>#,##0.0</b>으로 해야 432가 432.0으로 나온다(#,###.#은 432를 432.로 만들어 틀림). 꺾쇠<>로 색을 넣는 문법은 없다. 정답: <b>[파랑][>=1000]#,##0.0;[자홍][>=500]#,##0.0;#,##0.0</b>"},
  {s:"스프레드시트",q:"셀 값이 1,000 이상이면 '녹색', 1,000 미만 500 이상이면 '자홍', 500 미만이면 색을 지정하지 않고, 모든 구간에서 천 단위 구분 기호(,)와 소수 이하 첫째 자리까지 표시하려고 한다. 사용자 지정 표시 형식으로 옳은 것은? (예: 1234.56 → 1,234.6, 432 → 432.0)",o:["[녹색][>=1000]#,###.#;[자홍][>=500]#,###.#;#,###.#", "[녹색][>=1000]#,##0.0;[자홍][>=500]#,##0.0;#,##0.0", "[>=1000]<녹색>#,##0.0;[>=500]<자홍>#,##0.0;#,##0.0", "[녹색][>=1000]#,##0.0;[자홍][>=500]#,##0.0"],a:1,e:"사용자 지정 형식은 <b>[조건·색]양수서식;[조건·색]서식;나머지서식</b> 구조로, 색과 조건은 대괄호 [녹색][>=1000] 안에 넣는다. 소수 첫째 자리는 0을 써서 <b>#,##0.0</b>으로 해야 432가 432.0으로 나온다(#,###.#은 432를 432.로 만들어 틀림). 꺾쇠<>로 색을 넣는 문법은 없다. 정답: <b>[녹색][>=1000]#,##0.0;[자홍][>=500]#,##0.0;#,##0.0</b>"},
  {s:"스프레드시트",q:"다음 중 SUBSTITUTE 함수를 사용한 수식의 실행 결과로 옳은 것은?\n\n=SUBSTITUTE(\"70-77-27-69\",\"-\",\":\",1)",o:["70-77:27-69", "70:77-27-61", "70:77-27-69", "70:77:27:69"],a:2,e:"네 번째 인수 1은(는) 1번째 '-'만 ':'로 바꾼다 → <b>70:77-27-69</b>. (인수를 생략하면 모든 '-'를 바꾼다.)"},
  {s:"스프레드시트",q:"다음 중 SUBSTITUTE 함수를 사용한 수식의 실행 결과로 옳은 것은?\n\n=SUBSTITUTE(\"23-32-22-34\",\"-\",\".\",1)",o:["23.32.22.34", "23-32.22-34", "23.32-22-34", "23.32-22-31"],a:2,e:"네 번째 인수 1은(는) 1번째 '-'만 '.'로 바꾼다 → <b>23.32-22-34</b>. (인수를 생략하면 모든 '-'를 바꾼다.)"},
  {s:"스프레드시트",q:"아래 시트에서 입력값에 주어진 표시 형식을 적용했을 때, [C2]의 결과로 옳은 것은?",o:["(1,500)", "크다", "12.5%", "1,235"],a:0,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">입력값</td><td class=\"hd\">표시 형식</td><td class=\"hd\">결과</td></tr><tr><td class=\"rh\">2</td><td>-1500</td><td class=\"l\">#,##0;[빨강](#,##0)</td><td>?</td></tr></table>",e:"음수 구역 [빨강](#,##0) → 빨강 (1,500)"},
  {s:"스프레드시트",q:"왼쪽 기준표([F2:G6], 오름차순)를 이용해 점수 51점의 등급을 구하려고 한다. 가장 적절한 수식은? (구간의 최저점 이상이면 해당 등급)",o:["=VLOOKUP(51,$F$2:$G$6,2,FALSE)", "=VLOOKUP(51,$F$2:$G$6,2,0)", "=HLOOKUP(51,$F$2:$G$6,2,TRUE)", "=VLOOKUP(51,$F$2:$G$6,2,TRUE)"],a:3,fig:"<table class=\"xg\"><tr><th></th><th>F</th><th>G</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">기준점수</td><td class=\"hd\">등급</td></tr><tr><td class=\"rh\">2</td><td>0</td><td class=\"l\">F</td></tr><tr><td class=\"rh\">3</td><td>60</td><td class=\"l\">D</td></tr><tr><td class=\"rh\">4</td><td>70</td><td class=\"l\">C</td></tr><tr><td class=\"rh\">5</td><td>80</td><td class=\"l\">B</td></tr><tr><td class=\"rh\">6</td><td>90</td><td class=\"l\">A</td></tr></table>",e:"구간(범위) 조회는 네 번째 인수를 <b>TRUE(생략 가능, 근사일치)</b>로 두고 기준표가 <b>오름차순</b>이어야 한다. 51점 → <b>F</b>등급. FALSE(정확히 일치)는 기준표에 없는 값이면 #N/A가 난다."},
  {s:"스프레드시트",q:"왼쪽 기준표([F2:G6], 오름차순)를 이용해 점수 25점의 등급을 구하려고 한다. 가장 적절한 수식은? (구간의 최저점 이상이면 해당 등급)",o:["=VLOOKUP(25,$F$2:$G$6,2,FALSE)", "=HLOOKUP(25,$F$2:$G$6,2,TRUE)", "=VLOOKUP(25,$F$2:$G$6,2,0)", "=VLOOKUP(25,$F$2:$G$6,2,TRUE)"],a:3,fig:"<table class=\"xg\"><tr><th></th><th>F</th><th>G</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">기준점수</td><td class=\"hd\">등급</td></tr><tr><td class=\"rh\">2</td><td>0</td><td class=\"l\">F</td></tr><tr><td class=\"rh\">3</td><td>60</td><td class=\"l\">D</td></tr><tr><td class=\"rh\">4</td><td>70</td><td class=\"l\">C</td></tr><tr><td class=\"rh\">5</td><td>80</td><td class=\"l\">B</td></tr><tr><td class=\"rh\">6</td><td>90</td><td class=\"l\">A</td></tr></table>",e:"구간(범위) 조회는 네 번째 인수를 <b>TRUE(생략 가능, 근사일치)</b>로 두고 기준표가 <b>오름차순</b>이어야 한다. 25점 → <b>F</b>등급. FALSE(정확히 일치)는 기준표에 없는 값이면 #N/A가 난다."},
  {s:"스프레드시트",q:"다음 중 날짜 함수 수식의 실행 결과로 옳은 것은?\n\n=NETWORKDAYS(\"2025-04-24\",\"2025-05-06\")",o:["10", "8", "9", "13"],a:2,e:"NETWORKDAYS는 두 날짜 사이의 주말을 뺀 '근무일 수'(양끝 포함)를 센다 → <b>9</b>일."},
  {s:"스프레드시트",q:"다음 수식의 실행 결과로 옳은 것은?\n\n=IF(MOD(A1,2)=0,\"짝수\",\"홀수\")   (단, [A1]=37)",o:["짝수", "홀수", "0", "#VALUE!"],a:1,e:"MOD(37,2)=1 → 홀수"},
  {s:"스프레드시트",q:"다음 중 날짜 함수 수식의 실행 결과로 옳은 것은?\n\n=EOMONTH(\"2025-02-02\",0)",o:["2025-02-02", "2025-02-27", "2025-02-28", "2025-02-01"],a:2,e:"EOMONTH은 0개월 뒤 달의 '마지막 날'을 반환한다 → <b>2025-02-28</b>."},
  {s:"스프레드시트",q:"아래 시트에서 부서가 '총무부'인 직원의 급여 합계를 [F2]에 구하려 한다. 입력할 수식으로 옳은 것은?",o:["=SUMIF(D2:D4,\"총무부\",B2:B4)", "=COUNTIF(B2:B4,\"총무부\")", "=SUMIF(B2:B4,\"총무부\",D2:D4)", "=DSUM(B2:B4,\"총무부\",D2:D4)"],a:2,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">이름</td><td class=\"hd\">부서</td><td class=\"hd\">직급</td><td class=\"hd\">급여</td></tr><tr><td class=\"rh\">2</td><td>이두리</td><td class=\"l\">영업부</td><td>사원</td><td>3,200,000</td></tr><tr><td class=\"rh\">3</td><td>박세찬</td><td class=\"l\">기획부</td><td>과장</td><td>4,300,000</td></tr><tr><td class=\"rh\">4</td><td>윤서준</td><td class=\"l\">기획부</td><td>사원</td><td>2,900,000</td></tr></table>",e:"SUMIF(<b>조건범위, 조건, 합계범위</b>) → 부서(B)에서 '총무부'를 찾아 급여(D)를 더한다."},
  {s:"스프레드시트",q:"셀 [A1:A5]에 다음 값이 입력되어 있다: 18, 37, 61, 75, 91\n다음 수식(50% 지점(백분위수))의 결과로 옳은 것은?\n\n=PERCENTILE.INC(A1:A5, 0.5)",o:["75", "61", "60", "62"],a:1,e:"PERCENTILE.INC(범위, 0.5)는 데이터를 오름차순 정렬했을 때 하위 50% 위치의 값을 구한다. 정렬된 5개 값에서 그 위치의 값은 <b>61</b>이다."}
 ]},
{ name:'기출 11회', q:[
  {s:"컴퓨터일반",q:"다음 중 Windows 11의 '위젯(Widgets)'에 대한 설명으로 옳은 것은?",o:["<b>Win+W</b>로 위젯 보드를 열어 날씨·뉴스·일정 등을 확인한다.", "위젯은 제어판에서만 추가·삭제할 수 있다.", "위젯 보드는 바탕화면 전체를 차지하며 다른 작업과 동시에 볼 수 없다.", "위젯에는 사용자가 만든 문서 파일이 자동으로 등록된다."],a:0,e:"Win+W로 위젯 보드를 열어 날씨, 주식, 뉴스 등 정보 카드를 확인·관리한다. 보드는 화면 일부에 오버레이로 나타나며, 추가·제거는 위젯 보드 안에서 한다."},
  {s:"컴퓨터일반",q:"다음 중 BIOS(Basic Input Output System)에 대한 설명으로 옳지 않은 것은?",o:["ROM에 저장된 기본 입출력 시스템으로 부팅 시 하드웨어를 점검한다.", "POST(Power On Self Test)를 수행한다.", "최신 BIOS로 업데이트하는 것을 플래시 롬이라 한다.", "BIOS는 RAM에 저장되어 전원이 꺼지면 사라진다."],a:3,e:"BIOS는 ROM(비휘발성)에 저장되어 전원이 꺼져도 유지된다. 부팅 시 하드웨어를 점검(POST)하고 운영체제를 불러온다."},
  {s:"컴퓨터일반",q:"다음 중 멀티미디어 파일 형식의 분류로 옳지 않은 것은?",o:["이미지 — JPG, PNG, GIF", "오디오 — MP3, WAV", "동영상 — MP4, AVI", "문서 — MP3, AVI"],a:3,e:"MP3는 오디오, AVI는 동영상 형식이다. 문서 형식이 아니다."},
  {s:"컴퓨터일반",q:"다음 중 Windows 11의 바로 가기 키에 대한 설명으로 옳지 않은 것은?",o:["Win+A는 빠른 설정, Win+N은 알림 센터/달력을 연다.", "Win+Tab은 작업 보기(가상 데스크톱·타임라인)를 연다.", "Alt+F4는 활성 창을 닫고, Alt+Tab은 실행 중인 창을 전환한다.", "Win+L은 화면을 캡처하고, PrtScn은 컴퓨터를 잠근다."],a:3,e:"Win+L은 <b>화면 잠금</b>, PrtScn은 <b>화면 캡처</b>다. 지문은 반대로 설명했다."},
  {s:"컴퓨터일반",q:"다음 중 운영체제의 목적(성능 평가 항목)에 대한 설명으로 옳지 않은 것은?",o:["처리 능력(Throughput)은 일정 시간에 처리하는 작업량으로 높을수록 좋다.", "응답 시간(Turnaround Time)은 작업 의뢰 후 결과를 얻기까지의 시간으로 길수록 좋다.", "신뢰도(Reliability)는 주어진 문제를 정확하게 해결하는 정도다.", "사용 가능도(Availability)는 신속하게 사용할 수 있는 정도로 높을수록 좋다."],a:1,e:"응답 시간(반환 시간)은 <b>짧을수록</b> 좋다."},
  {s:"컴퓨터일반",q:"다음 중 신기술 용어에 대한 설명으로 옳지 않은 것은?",o:["IoT는 사물에 센서·통신 기능을 넣어 인터넷으로 연결하는 기술이다.", "빅데이터의 3V는 규모(Volume)·속도(Velocity)·다양성(Variety)이다.", "클라우드 컴퓨팅은 자원을 인터넷으로 빌려 쓰는 방식이다.", "메타버스는 데이터를 블록 단위로 연결해 위·변조를 막는 분산 장부 기술이다."],a:3,e:"데이터를 블록으로 연결해 위·변조를 막는 분산 장부 기술은 '블록체인'이다. 메타버스는 현실과 융합된 3차원 가상 세계를 뜻한다."},
  {s:"컴퓨터일반",q:"다음 중 무선 랜(Wi-Fi) 보안 방식으로 가장 안전한 것은?",o:["WPA3", "WEP", "개방형(인증 없음)", "WPA(TKIP)"],a:0,e:"무선 보안 강도는 WPA3 > WPA2 > WPA > WEP 순이며, 개방형은 암호화가 없어 가장 취약하다."},
  {s:"컴퓨터일반",q:"다음 중 시스템 소프트웨어와 응용 소프트웨어의 연결로 옳지 않은 것은?",o:["운영체제 — 시스템 소프트웨어", "컴파일러 — 시스템 소프트웨어", "장치 드라이버 — 시스템 소프트웨어", "워드프로세서 — 시스템 소프트웨어"],a:3,e:"워드프로세서·스프레드시트 등은 사용자의 작업을 돕는 '응용 소프트웨어'이다. 운영체제·언어 번역기·드라이버·유틸리티는 시스템 소프트웨어이다."},
  {s:"컴퓨터일반",q:"다음 중 BCD, ASCII, EBCDIC 코드의 비트 수를 바르게 나열한 것은?",o:["BCD 6비트 · ASCII 7비트 · EBCDIC 8비트", "BCD 4비트 · ASCII 8비트 · EBCDIC 16비트", "BCD 8비트 · ASCII 7비트 · EBCDIC 6비트", "BCD 6비트 · ASCII 8비트 · EBCDIC 7비트"],a:0,e:"BCD=6비트(64가지), ASCII=7비트(128가지), EBCDIC=8비트(256가지)이다. 이 순서로 표현 가능한 문자 수가 늘어난다."},
  {s:"컴퓨터일반",q:"다음 중 그레이(Gray) 코드에 대한 설명으로 옳은 것은?",o:["인접한 두 수를 표현할 때 한 비트만 바뀌어 아날로그-디지털 변환 등에서 오류를 줄인다.", "가중치가 있는 코드로 각 자리의 값을 더해 10진수를 구한다.", "자기 보수의 성질을 가져 뺄셈 연산에 유리한 8421 코드이다.", "한 문자를 반드시 8비트로 표현하는 문자 코드이다."],a:0,e:"그레이 코드는 이웃한 값 사이에 한 비트만 변하는 '비가중치 코드'로, 입출력 장치나 A/D 변환에서 변환 오류를 줄인다. 가중치·자기보수 성질은 없다."},
  {s:"컴퓨터일반",q:"다음 중 입력장치에 대한 설명으로 옳지 않은 것은?",o:["OMR은 광학 마크(표시)를 판독한다.", "OCR은 인쇄·손글씨 문자를 인식한다.", "바코드 판독기는 막대 모양 코드를 읽는다.", "플로터는 좌표를 읽어들이는 입력장치이다."],a:3,e:"플로터는 설계 도면 등을 그려 내는 '출력장치'이다."},
  {s:"컴퓨터일반",q:"다음 중 현실 세계의 모습 위에 가상의 정보나 이미지를 실시간으로 겹쳐 보여 주는 기술을 의미하는 것은?",o:["가상현실(VR)", "증강현실(AR)", "홀로그램", "텔레매틱스"],a:1,e:"현실에 가상 정보를 겹쳐 보여 주는 것은 <b>증강현실(AR)</b>이다. 완전한 가상 공간은 VR이다."},
  {s:"컴퓨터일반",q:"다음 중 중앙처리장치의 성능을 높이는 '캐시 적중률(Hit Ratio)'에 대한 설명으로 옳은 것은?",o:["CPU가 필요한 데이터를 캐시에서 찾은 비율로, 높을수록 성능이 좋아진다.", "주기억장치의 전체 용량을 뜻한다.", "하드디스크의 회전 속도를 뜻한다.", "낮을수록 처리 속도가 빨라진다."],a:0,e:"캐시 적중률은 CPU가 요청한 데이터가 캐시에 있었던 비율로, 높을수록 느린 주기억장치 접근이 줄어 전체 처리 속도가 빨라진다."},
  {s:"컴퓨터일반",q:"다음 중 전자우편 관련 프로토콜의 연결로 옳지 않은 것은?",o:["SMTP — 메일 송신", "POP3 — 메일 수신(가져오기)", "IMAP — 서버에 둔 채로 메일 관리", "MIME — 메일 암호화 전용 프로토콜"],a:3,e:"MIME은 멀티미디어·첨부 파일을 메일로 주고받게 하는 표준이다. 암호화 전용이 아니다."},
  {s:"컴퓨터일반",q:"다음 중 가상현실 관련 기술에 대한 설명으로 옳지 않은 것은?",o:["VR은 현실과 분리된 완전한 가상 환경을 체험하게 한다.", "AR은 현실 화면 위에 가상 정보를 겹쳐 보여 준다.", "MR은 현실과 가상을 결합해 상호작용하게 한다.", "VR은 현실 배경에 가상 객체만 덧씌우는 기술이다."],a:3,e:"현실 배경에 가상 객체를 덧씌우는 것은 AR(증강현실)이다. VR은 현실과 분리된 완전 가상 환경, MR(혼합현실)은 현실과 가상을 결합해 상호작용한다."},
  {s:"컴퓨터일반",q:"다음 중 인터넷 주소와 프로토콜에 대한 설명으로 옳지 않은 것은?",o:["HTTP는 웹 페이지를 주고받는 프로토콜이다.", "HTTPS는 보안이 적용된 HTTP이다.", "FTP는 파일을 주고받는 프로토콜이다.", "URL은 메일을 전송하는 프로토콜이다."],a:3,e:"URL은 자원의 위치를 나타내는 '주소'이다. 메일 송신 프로토콜은 SMTP이다."},
  {s:"컴퓨터일반",q:"다음 두 8비트 값에 비트 단위 AND 연산을 수행한 결과로 옳은 것은?\n\n01000010 AND 01011110",o:["01000010", "10111101", "00011100", "01011110"],a:0,e:"비트 AND은 각 자리에서 둘 다 1일 때만 1 → <b>01000010</b>."},
  {s:"컴퓨터일반",q:"다음 중 가로 1280픽셀 × 세로 720픽셀, 한 픽셀을 16비트로 표현하는 비압축 비트맵 이미지의 용량으로 옳은 것은? (1KB=1,024Byte)",o:["600KB", "3,600KB", "1,800KB", "900KB"],a:2,e:"비트맵 용량 = 가로×세로×색 깊이(비트)÷8 = 1280×720×16÷8 = <b>1,843,200 Byte</b> ≒ 1,800KB."},
  {s:"컴퓨터일반",q:"다음 두 8비트 값에 비트 단위 OR 연산을 수행한 결과로 옳은 것은?\n\n00000110 OR 10111000",o:["10111110", "11111001", "20222220", "00000000"],a:0,e:"비트 OR은 각 자리에서 하나라도 1이면 1 → <b>10111110</b>."},
  {s:"컴퓨터일반",q:"다음 중 주소선(주소 버스)이 16개인 시스템이 직접 지정할 수 있는 최대 기억 공간(워드 수)으로 옳은 것은?",o:["32,768", "65,536", "16,384", "131,072"],a:1,e:"주소선 n개로 2ⁿ개의 주소를 지정한다 → 2^16 = <b>65,536</b>개."},
  {s:"스프레드시트",q:"다음 중 논리 함수에 대한 설명으로 옳지 않은 것은?",o:["=AND(조건들)은 모두 참일 때만 TRUE다.", "=OR(조건들)은 하나라도 참이면 TRUE다.", "=NOT(TRUE)는 FALSE를 반환한다.", "=IFERROR(값,대체)는 값이 오류가 아닐 때 대체값을 반환한다."],a:3,e:"=IFERROR는 값이 <b>오류일 때</b> 대체값을 반환한다(오류가 아니면 원래 값)."},
  {s:"스프레드시트",q:"다음 중 추세선을 추가할 수 있는 차트로 옳은 것은?",o:["원형 차트", "도넛형 차트", "비누적 2차원 꺾은선형 차트", "3차원 세로 막대형 차트"],a:2,e:"추세선은 <b>비누적 2차원 막대형·꺾은선형·분산형·거품형</b> 등에 추가할 수 있다(원형·도넛·3차원 불가)."},
  {s:"스프레드시트",q:"다음 중 조건부 서식 규칙에 대한 설명으로 옳지 않은 것은?",o:["규칙 A(글꼴색 빨강)가 목록 위쪽, 규칙 B(채우기색 노랑)가 아래쪽에 있고 같은 셀에서 둘 다 만족하면, 서식 항목이 겹치지 않으므로 두 규칙이 모두 적용되어 빨간 글자에 노란 배경으로 표시된다", "규칙 A(채우기색 빨강)가 목록 위쪽, 규칙 B(채우기색 노랑)가 아래쪽에 있고 같은 셀에서 둘 다 만족하면, 채우기색 항목이 충돌하므로 아래쪽 규칙인 노란 배경이 최종 적용된다", "규칙 A에 '이 규칙이 참이면 중지'가 체크되어 있고 어떤 셀이 규칙 A를 만족하면, 그 셀에 대해서는 규칙 A보다 하위 순위 규칙은 검사하지 않는다", "새로 추가한 규칙은 기존 규칙보다 목록 위쪽(우선순위 상위)에 배치된다"],a:1,e:"서식 항목이 충돌하면 우선순위가 높은(목록 위쪽) 규칙이 적용된다. 지문은 반대로 아래쪽 규칙이 적용된다고 서술해 틀렸다. 차트 종류 총정리 (방사형·분산형 등) 차트 종류 핵심 특징 축 구성 방사형"},
  {s:"스프레드시트",q:"다음 중 [찾기 및 바꾸기] 대화상자의 옵션에 대한 설명으로 옳지 않은 것은?",o:["'대/소문자 구분'을 체크하면 A와 a를 다른 것으로 구분해 찾는다.", "'전체 셀 내용 일치'를 체크하면 찾을 내용과 셀 내용이 '정확히 같은' 셀만 찾는다.", "'찾는 위치'를 시트/통합 문서 중에서 선택할 수 있다.", "'대/소문자 구분'은 기본적으로 항상 켜져 있어 해제할 수 없다."],a:3,e:"'대/소문자 구분'은 기본적으로 '꺼져' 있어(대소문자 구분 안 함) 필요할 때 체크한다. 체크하면 A와 a를 다르게 처리한다."},
  {s:"스프레드시트",q:"다음 중 '통합 문서 보호'에 대한 설명으로 옳은 것은?",o:["시트의 삽입·삭제·이동·숨기기·이름 바꾸기 등 '구조' 변경을 막는다.", "셀에 입력된 데이터를 암호화한다.", "특정 셀의 값만 편집하지 못하게 한다.", "파일을 열 때 반드시 암호를 요구한다."],a:0,e:"'통합 문서 보호'는 시트 삽입·삭제·이동·숨기기·이름 바꾸기 같은 '구조' 변경을 막는다. 개별 셀 편집 제한은 '시트 보호', 파일 열기 암호는 '암호 설정'이 담당한다."},
  {s:"스프레드시트",q:"다음은 어떤 데이터 관리 기능에 대한 설명이다. 해당하는 기능으로 옳은 것은?\n\n조건을 워크시트의 별도 범위에 입력해 두고, 그 조건을 만족하는 행만 추출하거나 다른 위치에 복사할 수 있으며, 수식을 조건으로 사용할 수도 있다.",o:["자동 필터", "고급 필터", "부분합", "데이터 통합"],a:1,e:"조건 범위를 따로 두고 수식 조건·다른 위치 복사가 가능한 것은 <b>고급 필터</b>다."},
  {s:"스프레드시트",q:"다음 중 워크시트 인쇄에서 '간단하게 인쇄' 옵션을 선택했을 때의 결과로 옳은 것은?",o:["흑백으로만 인쇄된다", "테두리, 그래픽 등의 개체가 인쇄되지 않는다", "인쇄 배율이 자동으로 100%로 고정된다", "눈금선이 강제로 인쇄된다"],a:1,e:"'간단하게 인쇄'를 선택하면 테두리·그래픽 등 시각적 개체는 인쇄되지 않고 텍스트 위주로 빠르게 인쇄된다. 76. 다음 중 시트 보호에 대한 설명으로 옳은 것은?"},
  {s:"스프레드시트",q:"다음 중 셀 서식 표시 형식과 결과의 연결로 옳은 것은?",o:["형식 #,##0;[빨강](#,##0) · 값 -1234 → 빨강색 (1,234)", "형식 0.0 · 값 12.34 → 12.340", "형식 ##% · 값 0.5 → 0.5%", "형식 @\"님\" · 값 3 → 님3"],a:0,e:"음수 구역 [빨강](#,##0)에 따라 -1234는 <b>빨강 (1,234)</b>. 0.0→12.3, ##%→50%, @는 텍스트에만 적용된다."},
  {s:"스프레드시트",q:"다음 수식의 실행 결과로 옳은 것은?\n\n=IFS(A1>=90,\"A\",A1>=80,\"B\",A1>=70,\"C\",TRUE,\"F\")   (단, [A1]=27)",o:["A", "B", "C", "F"],a:3,e:"27점은 해당 구간에 따라 'F'를 반환한다."},
  {s:"스프레드시트",q:"왼쪽 기준표([F2:G6], 오름차순)를 이용해 점수 44점의 등급을 구하려고 한다. 가장 적절한 수식은? (구간의 최저점 이상이면 해당 등급)",o:["=VLOOKUP(44,$F$2:$G$6,2,FALSE)", "=HLOOKUP(44,$F$2:$G$6,2,TRUE)", "=VLOOKUP(44,$F$2:$G$6,2,0)", "=VLOOKUP(44,$F$2:$G$6,2,TRUE)"],a:3,fig:"<table class=\"xg\"><tr><th></th><th>F</th><th>G</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">기준점수</td><td class=\"hd\">등급</td></tr><tr><td class=\"rh\">2</td><td>0</td><td class=\"l\">F</td></tr><tr><td class=\"rh\">3</td><td>60</td><td class=\"l\">D</td></tr><tr><td class=\"rh\">4</td><td>70</td><td class=\"l\">C</td></tr><tr><td class=\"rh\">5</td><td>80</td><td class=\"l\">B</td></tr><tr><td class=\"rh\">6</td><td>90</td><td class=\"l\">A</td></tr></table>",e:"구간(범위) 조회는 네 번째 인수를 <b>TRUE(생략 가능, 근사일치)</b>로 두고 기준표가 <b>오름차순</b>이어야 한다. 44점 → <b>F</b>등급. FALSE(정확히 일치)는 기준표에 없는 값이면 #N/A가 난다."},
