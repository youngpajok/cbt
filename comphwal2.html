<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영파족 CBT · 컴퓨터활용능력 2급 필기 모의고사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@600;700;900&display=swap" rel="stylesheet">
<style>
:root{
 --navy:#173C7C;--navy-d:#0E2756;--navy-2:#1C4E9C;--gold:#F2C94C;--gold-d:#B8891A;--gold-l:#FDF7E8;--gold-b:#ECD08A;
 --bg:#F5F2EB;--paper:#FFFFFF;--line:#E6E0D2;--txt:#1E2433;--sub:#6B7080;
 --red:#C62828;--red-l:#FDECEC;--green:#2E7D32;--green-l:#E9F5EA;
 --sans:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;--serif:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{font-family:var(--sans);background:var(--bg);color:var(--txt);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}

/* ---------- 헤더 ---------- */
header{background:var(--navy-d);border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:6}
header .in{max-width:880px;margin:0 auto;padding:.65rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:.6rem}
.brand{display:flex;align-items:center;gap:.55rem;text-align:left}
.badge-logo{display:inline-flex;align-items:center;gap:.35rem;background:rgba(14,39,86,.6);border:1.5px solid #B8913A;border-radius:999px;padding:.45rem 1.1rem;color:#fff;font-weight:700;font-size:.88rem;letter-spacing:.04em;white-space:nowrap}
.badge-logo:hover{border-color:var(--gold)}
.badge-logo .y{color:var(--gold);font-weight:900}
.badge-logo i{font-style:normal;color:#fff}
.badge-logo .s b{color:var(--gold);font-weight:900}
.cbt{font-size:.72rem;font-weight:900;letter-spacing:.12em;color:var(--navy-d);background:var(--gold);padding:.2rem .45rem;border-radius:4px}
.hbtn{display:flex;gap:.3rem}
.hbtn button{border:1px solid rgba(255,255,255,.28);color:#fff;padding:.35rem .55rem;font-size:.8rem;border-radius:6px}
.hbtn button:hover{border-color:var(--gold);color:var(--gold)}

.wrap{width:100%;max-width:880px;margin:0 auto;padding:1.1rem 1rem 1.5rem;flex:1}

/* ---------- 공통 패널 ---------- */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:1.25rem;margin-bottom:1rem;box-shadow:0 1px 2px rgba(23,60,124,.04)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.95rem}
.ph h2{font-family:var(--serif);font-size:1.12rem;font-weight:700;color:var(--navy-d);display:flex;align-items:center;gap:.5rem}
.ph h2::before{content:"";width:.5rem;height:.5rem;background:var(--gold);transform:rotate(45deg);flex:none}
.ph small{font-size:.8rem;color:var(--sub)}

/* ---------- 히어로 ---------- */
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,#0F1D44 0%,#162D63 55%,#1B3A7A 100%);border-radius:18px;padding:1.8rem 1.6rem;margin-bottom:1rem;color:#fff;display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;min-height:300px}
.hero::before,.rhero::before{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.06);right:-90px;top:-130px}
.hero::after,.rhero::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.05);left:-110px;bottom:-160px;pointer-events:none}
.hero .pillb{margin-bottom:1rem}
.greet{display:inline-block;margin:.2rem 0 .7rem;font-size:.86rem;color:#fff;background:rgba(242,201,76,.14);border:1px solid rgba(242,201,76,.45);border-radius:8px;padding:.35rem .7rem}
.greet b{color:var(--gold)}
.log .who{font-weight:700;color:var(--gold-d);font-size:.78rem}
.qd{display:block;margin:.7rem 0 .1rem;padding:.75rem .95rem;background:var(--gold-l);border:1px solid var(--gold-b);border-radius:8px;font-size:.93em;line-height:1.8;font-weight:400}
.qt{width:100%;border-collapse:collapse;margin:.7rem 0 .1rem;font-size:.86em;font-weight:400;table-layout:fixed}
.qt td,.qt th{word-break:keep-all;overflow-wrap:anywhere}
@media(max-width:600px){.qt{font-size:.68em}.qt th,.qt td{padding:.35rem .1rem}.qt th:nth-child(1){width:24%}.qt th:nth-child(2){width:17%}.qt th:nth-child(3){width:25%}.qt th:nth-child(4){width:20%}.qt th:nth-child(5){width:14%}}
.qt th,.qt td{border:1px solid var(--line);padding:.4rem .3rem;text-align:center}
.qt th{background:var(--navy);color:#fff;font-weight:700}
.buy{position:relative;display:inline-flex;align-items:center;gap:.85rem;margin-top:1.2rem;padding:.75rem 1.1rem .75rem .8rem;border-radius:14px;text-decoration:none;color:var(--navy-d);
 background:linear-gradient(135deg,#FBE7A6 0%,#F2C94C 45%,#D9A53A 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 6px 18px rgba(0,0,0,.28);overflow:hidden;transition:transform .15s,box-shadow .15s}
.buy::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);transition:left .6s}
.buy:hover{transform:translateY(-2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 10px 24px rgba(0,0,0,.32)}
.buy:hover::after{left:120%}
.buy .bi{width:2.4rem;height:2.4rem;border-radius:10px;background:var(--navy-d);color:var(--gold);display:flex;align-items:center;justify-content:center;flex:none}
.buy .bi svg{width:1.3rem;height:1.3rem}
.buy .bt{display:flex;flex-direction:column;line-height:1.3;text-align:left}
.buy .bt small{font-size:.7rem;font-weight:700;letter-spacing:.08em;color:#6A4A0C}
.buy .bt b{font-size:1rem;font-weight:900;letter-spacing:-.01em}
.buy .ba{margin-left:.3rem;font-size:.82rem;font-weight:900;padding:.3rem .6rem;border-radius:999px;background:var(--navy-d);color:var(--gold);white-space:nowrap}
.promo{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;background:#fff;border:1.5px solid var(--gold-b);border-radius:14px;padding:1.15rem 1.3rem;margin-bottom:1rem;background-image:linear-gradient(120deg,#FFFBF0 0%,#FFFFFF 60%)}
.promo::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(#F2C94C,#C8962A)}
.promo .pt{flex:1;min-width:15rem}
.promo .pk{font-size:.72rem;font-weight:900;letter-spacing:.12em;color:var(--gold-d)}
.promo h3{font-size:1.08rem;font-weight:900;color:var(--navy-d);margin:.2rem 0 .3rem;word-break:keep-all}
.promo p{font-size:.85rem;color:var(--sub);line-height:1.6;word-break:keep-all}
.promo .pkg{display:flex;gap:.3rem;margin-top:.5rem;flex-wrap:wrap}
.promo .pkg span{font-size:.68rem;font-weight:900;letter-spacing:.08em;color:var(--navy);border:1px solid var(--navy);border-radius:4px;padding:.12rem .4rem}
.promo .buy{margin-top:0}
footer .fl{display:inline-block;margin-top:.45rem;color:var(--gold-d);font-weight:700;text-decoration:none;border-bottom:1px solid var(--gold-b)}
footer .fl:hover{color:var(--navy)}
footer .fy{display:inline-flex;align-items:center;gap:.4rem;margin-top:.5rem;color:var(--sub);text-decoration:none;font-size:.8rem}
footer .fy b{color:var(--navy-d)}footer .fy:hover b{text-decoration:underline}
footer .fy svg{width:1.35rem;height:auto;display:block}
.ctas{display:flex;align-items:stretch;gap:.6rem;flex-wrap:wrap;margin-top:1.2rem}
.ctas .buy{margin-top:0}
.yt{display:inline-flex;align-items:center;gap:.6rem;padding:.6rem 1rem;border-radius:14px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;text-decoration:none;transition:background .15s,border-color .15s}
.yt:hover{background:rgba(255,255,255,.15);border-color:#fff}
.yt svg{width:2rem;height:auto;flex:none}
.yt span{display:flex;flex-direction:column;line-height:1.3}
.yt small{font-size:.68rem;color:rgba(255,255,255,.75);font-weight:700;letter-spacing:.04em}
.yt b{font-size:.92rem;font-weight:900}
.ytl{display:inline-flex;align-items:center;gap:.4rem;margin-top:.6rem;font-size:.82rem;font-weight:700;color:var(--navy);text-decoration:none}
.ytl svg{width:1.3rem;height:auto}.ytl:hover{text-decoration:underline}
@media(max-width:600px){.ctas{flex-direction:column}.yt{justify-content:center}.buy{width:100%}.buy .bt b{font-size:.92rem}.promo .buy{width:100%}}
.seg{grid-template-columns:repeat(3,1fr)}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;margin-bottom:1rem}
.sc-card{position:relative;border:1.5px solid var(--line);border-radius:12px;padding:.9rem .9rem .8rem;text-align:left;background:#fff;display:flex;flex-direction:column;gap:.15rem;transition:border-color .15s}
.sc-card:hover{border-color:var(--gold-d)}
.sc-card.on{border-color:var(--navy);background:#EEF2FA;box-shadow:inset 0 -3px 0 var(--gold)}
.sc-card .sn{font-weight:900;color:var(--navy-d);font-size:1.02rem}
.sc-card .sm,.sc-card .sa{font-size:.78rem;color:var(--sub)}
.sc-card .mini{height:4px;background:#E2DFD6;border-radius:4px;overflow:hidden;margin-top:.35rem}.sc-card .mini div{height:100%;background:var(--gold)}
.sc-card .ck{position:absolute;top:.6rem;right:.6rem;width:1.3rem;height:1.3rem;border-radius:50%;border:1.5px solid var(--line);font-size:.72rem;display:flex;align-items:center;justify-content:center;color:transparent;background:#fff}
.sc-card.on .ck{background:var(--navy);border-color:var(--navy);color:var(--gold)}
.weak{align-self:flex-start;font-size:.64rem;font-weight:900;color:#fff;background:var(--red);padding:.1rem .45rem;border-radius:4px;margin-bottom:.2rem}
.opt{display:flex;align-items:center;gap:.7rem;margin-bottom:.6rem;flex-wrap:wrap}
.ol{width:5rem;font-size:.85rem;font-weight:700;color:var(--navy-d);flex:none}
.chipg{display:flex;gap:.35rem;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:.38rem .85rem;font-size:.82rem;background:#fff}
.chip:hover{border-color:var(--navy)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.sgo{width:100%;margin-top:.7rem;padding:.95rem;border-radius:10px;background:var(--navy);color:#fff;font-weight:900;font-size:1rem;box-shadow:inset 0 -3px 0 var(--gold)}
.sgo:hover{background:var(--navy-2)}.sgo span{color:var(--gold)}
@media(max-width:600px){.seg{grid-template-columns:1fr!important}.sgrid{grid-template-columns:repeat(2,1fr)}.ol{width:100%}#subjP .ph small{display:none}}
.upd{display:inline-block;font-size:.7rem;font-weight:900;color:var(--navy-d);background:var(--gold);padding:.1rem .45rem;border-radius:4px;margin-right:.35rem;vertical-align:1px}
.oth{display:grid;gap:.5rem;margin:0 0 .35rem;padding:.45rem .8rem .45rem calc(3.15rem + 1.5px);font-size:.8rem;font-weight:700;color:#fff;background:var(--navy);border-radius:8px}
.oth span{text-align:center}.oth.tl span:first-child{text-align:left}
.ot{flex:1;display:grid;gap:.5rem;align-items:center;min-width:0}
.ot span{text-align:center;border-left:1px dashed var(--line);padding:0 .2rem;word-break:keep-all;overflow-wrap:anywhere}
.ot span:first-child{border-left:0}.ot.tl span:first-child{text-align:left}
.otx{flex:1;min-width:0}
.inv{display:grid;grid-template-columns:1.2fr 1fr .9fr 1.3fr;border:1px solid var(--line);border-radius:6px;overflow:hidden;font-size:.82em;background:#fff;margin:.1rem 0;font-weight:400;color:var(--txt)}
.inv span{padding:.3rem .3rem;text-align:center;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.inv span:nth-child(4n+1){border-left:0}
.inv .h{background:#EEF2FA;color:var(--navy-d);font-weight:700;border-top:0}
.inv .neg{color:var(--red);font-weight:700}
.invl{display:block;font-size:.72rem;font-weight:700;color:var(--sub);margin:.25rem 0 .1rem}
@media(max-width:600px){.ot.tl{font-size:.8em}.oth{font-size:.72rem;padding-left:calc(2.95rem + 1.5px);gap:.3rem}.ot{gap:.3rem;font-size:.92em}.inv{font-size:.72em}}
.grs{display:flex;gap:1rem;flex-wrap:wrap;margin:.7rem 0 .2rem}
.grs figure{margin:0;text-align:center;font-size:.85rem;color:var(--sub);font-weight:400}
.gr{width:9.5rem;height:auto;display:block;background:#fff;border:1px solid var(--line);border-radius:6px}
.gopt{display:flex;align-items:center;gap:.9rem}.gopt b{min-width:5.5rem}.gopt .gr{width:7.5rem}
.hero .gbar{width:3.2rem;height:3px;background:var(--gold);border-radius:2px;margin:.2rem 0 1rem}
.stats{display:flex;gap:.55rem;flex-wrap:wrap}
.stats div{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);border-radius:10px;padding:.55rem .85rem;text-align:center;min-width:5.4rem}
.stats b{display:block;color:var(--gold);font-size:1.15rem;font-weight:900}
.stats span{font-size:.74rem;color:rgba(255,255,255,.8)}
.hero .hx{position:relative;z-index:1;align-self:center}
.eyebrow{display:block;font-size:.85rem;font-weight:500;color:rgba(255,255,255,.8);margin-bottom:.35rem}
.hero h1{font-size:2.3rem;line-height:1.25;font-weight:900;margin-bottom:.4rem;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p{font-size:.92rem;color:rgba(255,255,255,.82);margin-bottom:1rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chips span{font-size:.78rem;font-weight:700;padding:.3rem .65rem;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(242,201,76,.55);color:#fff}
.hero .char{position:relative;z-index:1;width:200px;flex:none;margin:-.6rem .4rem -1.8rem 0;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
.char img,.char svg{width:100%;height:auto;display:block}

/* ---------- 설정 ---------- */
.fld{display:flex;align-items:center;gap:.7rem;margin-bottom:.85rem;font-size:.92rem;font-weight:500}
.fld input{flex:1;padding:.65rem .8rem;border:1px solid var(--line);border-radius:8px;background:#FCFBF8}
.fld input:focus{outline:none;border-color:var(--gold-d);box-shadow:0 0 0 3px rgba(242,201,76,.25)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:.55rem;margin-bottom:.8rem}
.seg button{border:1.5px solid var(--line);padding:.8rem .9rem;border-radius:10px;text-align:left;font-weight:700;background:#fff}
.seg button small{display:block;font-weight:400;font-size:.78rem;color:var(--sub);margin-top:.15rem}
.seg button.on{border-color:var(--navy);background:var(--navy);color:#fff;box-shadow:inset 0 -3px 0 var(--gold)}
.seg button.on small{color:rgba(255,255,255,.75)}
.chk{display:flex;align-items:center;gap:.5rem;font-size:.92rem}
.chk input{width:1.1rem;height:1.1rem;accent-color:var(--navy)}

/* ---------- 회차 카드 ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.65rem}
.rd{position:relative;border:1px solid var(--line);border-radius:12px;padding:.85rem .9rem .8rem;text-align:left;display:flex;flex-direction:column;gap:.2rem;background:#fff;transition:border-color .15s,transform .15s}
.rd:hover{border-color:var(--gold-d);transform:translateY(-2px)}
.rd .rn{font-family:var(--serif);font-size:1.3rem;font-weight:900;color:var(--navy-d)}
.rd .rs{font-size:.78rem;color:var(--sub)}
.rd .rb{font-size:.82rem;font-weight:700;color:var(--sub);margin-top:.25rem}
.rd .rb.done{color:var(--navy)}
.rd .mini{height:4px;background:#EEE9DC;border-radius:4px;overflow:hidden;margin-top:.35rem}
.rd .mini div{height:100%;background:var(--gold)}
.rd .new{position:absolute;top:.6rem;right:.6rem;font-size:.66rem;font-weight:900;color:var(--navy-d);background:var(--gold);padding:.12rem .4rem;border-radius:4px}
.rd.done-card{border-color:var(--gold-b);background:var(--gold-l)}
.rd.off{background:#F7F5F0;cursor:default}.rd.off:hover{border-color:var(--line);transform:none}
.rd.off .rn{color:#B5B2A8}

.sp{display:grid;grid-template-columns:1fr 1fr;gap:.65rem}
.spb{border:1.5px solid var(--gold-b);border-radius:12px;padding:1rem;text-align:left;background:var(--gold-l);display:flex;gap:.75rem;align-items:center}
.spb:hover{border-color:var(--gold-d)}
.spb .ic{width:2.4rem;height:2.4rem;border-radius:10px;background:var(--navy);color:var(--gold);display:flex;align-items:center;justify-content:center;flex:none}
.spb .ic svg{width:1.3rem;height:1.3rem}
.spb b{display:block;color:var(--navy-d);font-size:1rem}.spb span{font-size:.8rem;color:var(--sub)}

/* ---------- 기록 ---------- */
.bars{display:flex;flex-direction:column;gap:.6rem;margin-bottom:.9rem}
.br{display:grid;grid-template-columns:5.6rem 1fr 5rem;align-items:center;gap:.6rem;font-size:.86rem}
.br .tr{height:.6rem;background:#EEE9DC;border-radius:6px;overflow:hidden}
.br .fl{height:100%;background:var(--navy)}.br .fl.lo{background:#D9675F}
.br .pc{text-align:right;color:var(--sub);font-variant-numeric:tabular-nums}
.log{font-size:.84rem;border-top:1px solid var(--line)}
.log .lr{display:grid;grid-template-columns:1fr auto auto;gap:.8rem;padding:.55rem 0;border-bottom:1px dashed var(--line);align-items:center}
.log .lr b{font-weight:700;color:var(--navy-d)}
.log .lr .t{color:var(--sub);font-size:.78rem}
.log .lr .sc{font-weight:700;font-variant-numeric:tabular-nums}
.empty-t{font-size:.88rem;color:var(--sub);margin-bottom:.6rem}
.btn-o{border:1.5px solid var(--navy);color:var(--navy);padding:.45rem .8rem;border-radius:8px;font-size:.84rem;font-weight:700;background:#fff}
.btn-o:hover{background:var(--navy);color:#fff}
.link{font-size:.8rem;color:var(--sub);text-decoration:underline;margin-top:.6rem}
.msg{min-height:1.3rem;font-size:.86rem;color:var(--red);margin-top:.5rem}

/* ---------- 시험 화면 ---------- */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:.7rem;margin-bottom:.85rem;flex-wrap:wrap}
.qtitle{display:flex;align-items:center;gap:.7rem}
.qtitle .mini-char{width:3.4rem;height:3.4rem;border-radius:50%;background:var(--navy);border:2px solid var(--gold);overflow:hidden;flex:none}
.qtitle .mini-char img{width:100%;height:100%;object-fit:cover;object-position:50% 50%}
.stitle{font-family:var(--serif);font-size:1.15rem;font-weight:900;color:var(--navy-d)}
.qhead small{font-size:.78rem;color:var(--sub)}
.timer{display:flex;align-items:center;gap:.65rem;background:#fff;padding:.55rem 1rem;border:1px solid var(--line);border-radius:10px;font-size:.88rem;line-height:1.5}
.timer svg{width:1.7rem;height:1.7rem;color:var(--navy)}
.timer b{margin-right:.35rem;color:var(--navy-d)}
#tm{color:var(--red);font-weight:700;font-variant-numeric:tabular-nums}
.timer.warn{border-color:var(--red);background:var(--red-l)}
.pbadge{background:var(--gold-l);border:1px solid var(--gold-b);color:var(--gold-d);font-size:.84rem;font-weight:700;padding:.45rem .85rem;border-radius:8px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.qbox{padding:1.5rem 1.5rem 1rem;min-height:300px}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--sub);margin-bottom:.8rem;gap:.5rem}
.tag{background:var(--navy);color:#fff;padding:.18rem .65rem;border-radius:6px;font-weight:700;font-size:.76rem}
.qno{font-variant-numeric:tabular-nums;font-weight:700;color:var(--navy-d)}
.star{border:1px solid var(--line);border-radius:999px;padding:.22rem .75rem;font-size:.8rem;color:var(--sub)}
.star.on{border-color:var(--gold-d);background:var(--gold-l);color:var(--gold-d);font-weight:700}
.src{font-size:.78rem;color:var(--sub);margin-bottom:.4rem}
.qtext{font-size:1.1rem;line-height:1.8;margin-bottom:1.15rem;word-break:keep-all;font-weight:500}
.qtext .n{font-family:var(--serif);font-weight:900;color:var(--navy);margin-right:.25rem}

  {s:"컴퓨터일반",q:"다음 중 네트워크 장비에 대한 설명으로 옳지 않은 것은?",o:["허브는 여러 기기를 연결하는 중계 장치다.", "리피터는 약해진 신호를 증폭·재생해 전송 거리를 늘린다.", "라우터는 네트워크 간 최적 경로를 설정해 데이터를 전달한다.", "게이트웨이는 신호를 증폭만 할 뿐 서로 다른 프로토콜은 변환하지 못한다."],a:3,e:"게이트웨이는 <b>서로 다른 프로토콜을 변환</b>해 다른 종류의 네트워크를 연결한다."},
  {s:"컴퓨터일반",q:"다음 중 RISC 프로세서에 대한 설명으로 옳은 것은?",o:["명령어의 종류가 많고 길이가 가변적이다.", "명령어 수가 적고 길이가 고정이며 레지스터가 많아 파이프라이닝에 유리하다.", "하나의 복잡한 명령으로 여러 작업을 처리하여 전력 소모가 크다.", "내부 구조(제어장치)가 복잡해 명령 해석 속도가 느리다."],a:1,e:"명령어가 적고 고정 길이, 레지스터가 많아 빠르고 저전력인 것이 <b>RISC</b>다. 나머지는 CISC의 특징이다."},
  {s:"컴퓨터일반",q:"다음 중 전원이 켜진 상태에서 장치를 연결하거나 분리해도 바로 인식되는 기능을 의미하는 것은?",o:["핫 플러그(핫 스와핑)", "플러그 앤 플레이", "멀티부팅", "하이버네이션"],a:0,e:"전원이 켜진 채 장치를 교체하는 것은 <b>핫 플러그(핫 스와핑)</b>다."},
  {s:"컴퓨터일반",q:"다음 중 생성형 AI 사용 시 유의할 점으로 옳지 않은 것은?",o:["생성물에 저작권·개인정보 문제가 있을 수 있으므로 주의한다.", "학습 데이터의 편향이 결과에 반영될 수 있다.", "잘못된 정보를 사실처럼 제시하는 환각(할루시네이션)에 유의한다.", "AI가 생성한 결과물은 검증 없이 그대로 보고서·논문에 인용해도 된다."],a:3,e:"AI 생성물은 <b>반드시 사실 확인·출처 검증</b> 후 활용해야 한다."},
  {s:"컴퓨터일반",q:"다음 중 Windows 11의 작업 관리자에 대한 설명으로 옳지 않은 것은?",o:["<b>Ctrl+Shift+Esc</b>로 바로 실행할 수 있다.", "'프로세스' 탭에서 CPU·메모리·디스크·네트워크 사용률을 확인할 수 있다.", "응답하지 않는 프로그램을 선택해 '작업 끝내기'로 강제 종료할 수 있다.", "작업 관리자에서는 시작프로그램을 사용 안 함으로 바꿀 수 없어 설정 앱에서만 가능하다."],a:3,e:"작업 관리자의 '시작프로그램' 탭에서 부팅 시 자동 실행 항목을 '사용 안 함'으로 바꿀 수 있다. Ctrl+Shift+Esc로 실행하며 자원 사용률 확인과 강제 종료가 가능하다."},
  {s:"컴퓨터일반",q:"다음 중 자료 표현 코드에 대한 설명으로 옳지 않은 것은?",o:["BCD 코드는 6비트로 영문 소문자를 표현할 수 없다.", "ASCII 코드는 7비트로 128가지를 표현하며 데이터 통신·PC에서 주로 쓴다.", "EBCDIC 코드는 8비트로 256가지를 표현한다.", "유니코드(Unicode)는 8비트로 전 세계 문자를 표현하는 국제 표준 코드다."],a:3,e:"유니코드는 <b>16비트(2바이트)</b>로 전 세계 문자를 표현한다(8비트 아님)."},
  {s:"컴퓨터일반",q:"다음 중 컴퓨터의 기본 구성 장치에 대한 설명으로 옳지 않은 것은?",o:["제어장치와 연산장치를 합쳐 중앙처리장치(CPU)라 한다.", "주기억장치는 실행 중인 프로그램과 데이터를 저장한다.", "입력장치에는 키보드·마우스·스캐너가 있다.", "모니터·프린터는 입력장치에 해당한다."],a:3,e:"모니터·프린터는 결과를 내보내는 '출력장치'이다."},
  {s:"컴퓨터일반",q:"다음 중 그래픽 기법에 대한 설명으로 옳지 않은 것은?",o:["디더링은 제한된 색으로 여러 색을 섞어 표현하는 기법이다.", "안티앨리어싱은 계단 현상을 완화해 경계를 부드럽게 한다.", "모핑은 두 이미지를 자연스럽게 변형·전환하는 기법이다.", "렌더링은 3차원 물체의 위치·형태만 선으로 그리는 기법이다."],a:3,e:"렌더링은 <b>색·질감·그림자 등을 입혀 사실감을 주는</b> 기법이다. 선으로만 그리는 것은 와이어프레임이다."},
  {s:"컴퓨터일반",q:"다음 중 작업 관리자(Ctrl+Shift+Esc)로 할 수 있는 작업으로 옳지 않은 것은?",o:["응답하지 않는 프로그램을 강제 종료할 수 있다.", "CPU·메모리·디스크 사용률을 확인할 수 있다.", "시작 프로그램의 사용/사용 안 함을 설정할 수 있다.", "하드디스크를 포맷하고 파티션을 나눌 수 있다."],a:3,e:"포맷·파티션은 <b>디스크 관리</b>에서 한다. 작업 관리자의 기능이 아니다."},
  {s:"컴퓨터일반",q:"다음 중 CISC와 RISC에 대한 설명으로 옳지 않은 것은?",o:["CISC는 명령어 종류가 많고 복잡하며 명령어 길이가 가변적이다.", "RISC는 명령어 수가 적고 고정 길이이며 처리 속도가 빠르다.", "RISC는 레지스터 수가 많고 파이프라이닝에 유리하다.", "CISC는 RISC보다 전력 소모가 적고 소형 임베디드 기기에 주로 쓰인다."],a:3,e:"저전력·소형 임베디드에 유리한 것은 <b>RISC</b>다. CISC는 구조가 복잡해 전력 소모가 크다."},
  {s:"컴퓨터일반",q:"다음 중 방화벽(Firewall)에 대한 설명으로 옳은 것은?",o:["외부와 내부 네트워크 사이에서 허가되지 않은 접근을 차단한다.", "이미 감염된 바이러스를 치료하는 소프트웨어이다.", "데이터를 압축해 전송 속도를 높이는 장치이다.", "손상된 파일을 복구하는 도구이다."],a:0,e:"방화벽은 네트워크 경계에서 규칙에 따라 허가되지 않은 트래픽을 차단해 내부를 보호한다. 바이러스 치료는 백신의 역할이다."},
  {s:"컴퓨터일반",q:"다음 중 기존 방식으로 다루기 힘든 대규모의 정형·비정형 데이터를 수집·분석하여 가치 있는 정보를 추출하는 기술을 의미하는 것은?",o:["빅데이터", "데이터베이스", "스프레드시트", "캐시"],a:0,e:"대규모 데이터를 분석해 가치를 뽑아내는 것은 <b>빅데이터</b>다."},
  {s:"컴퓨터일반",q:"다음 중 정보 보안의 3대 요건에 대한 설명으로 옳지 않은 것은?",o:["기밀성은 인가된 사용자만 정보에 접근하도록 한다.", "무결성은 인가되지 않은 수정·변조로부터 정보를 보호한다.", "가용성은 인가된 사용자가 필요할 때 정보를 쓸 수 있게 한다.", "부인 방지는 정보를 누구나 자유롭게 열람하도록 공개하는 것을 뜻한다."],a:3,e:"부인 방지는 <b>행위를 부인하지 못하게 증거를 남기는 것</b>이다. 자유 공개와는 무관하다."},
  {s:"컴퓨터일반",q:"다음 중 기억장치 용량 단위를 작은 것부터 큰 순서로 바르게 나열한 것은?",o:["KB < MB < GB < TB < PB", "MB < KB < GB < TB < PB", "KB < GB < MB < PB < TB", "GB < MB < KB < TB < PB"],a:0,e:"기억 용량 단위는 KB(2¹⁰B) < MB < GB < TB < PB 순으로 각각 1,024배씩 커진다."},
  {s:"컴퓨터일반",q:"다음 중 주기억장치와 보조기억장치에 대한 설명으로 옳지 않은 것은?",o:["주기억장치는 CPU가 직접 접근하며 속도가 빠르다.", "보조기억장치는 전원이 꺼져도 자료가 보존된다.", "RAM은 주기억장치, SSD·HDD는 보조기억장치이다.", "보조기억장치가 주기억장치보다 접근 속도가 빠르다."],a:3,e:"접근 속도는 주기억장치(RAM)가 보조기억장치(SSD·HDD)보다 빠르다. 대신 보조기억장치는 용량이 크고 비휘발성이다."},
  {s:"컴퓨터일반",q:"다음은 7비트 ASCII 코드에 홀수 패리티 비트를 '오른쪽 끝 1비트'로 붙인 8비트 코드이다. 전송 중 오류가 발생한(패리티가 어긋난) 것은?",o:["10111010", "01111100", "01010111", "01111000"],a:3,e:"홀수 패리티는 8비트 전체에서 1의 개수가 홀수가 되도록 패리티 비트를 정한다. 정답 코드 <b>01111000</b>는 1의 개수가 4개로 홀수가 아니어서 오류이다. (패리티 비트는 1비트 오류의 '발생 여부'만 검출하고 위치는 못 찾는다.)"},
  {s:"컴퓨터일반",q:"다음 중 샘플링 44kHz, 양자화 16비트, 모노(1채널)로 30초간 녹음한 비압축 디지털 오디오의 용량으로 가장 가까운 것은?",o:["약 1.3MB", "약 5.0MB", "약 2.5MB", "약 40.3MB"],a:2,e:"오디오 용량 = 샘플링 주파수 × (양자화 비트÷8) × 채널 수 × 시간 = 44,000 × 2 × 1 × 30 = <b>2,640,000 Byte</b> ≒ 약 2.5MB."},
  {s:"컴퓨터일반",q:"다음 중 주소선(주소 버스)이 20개인 시스템이 직접 지정할 수 있는 최대 기억 공간(워드 수)으로 옳은 것은?",o:["1,048,576", "524,288", "2,097,152", "20,480"],a:0,e:"주소선 n개로 2ⁿ개의 주소를 지정한다 → 2^20 = <b>1,048,576</b>개."},
  {s:"컴퓨터일반",q:"다음 중 8비트 2진수 00010011의 2의 보수로 옳은 것은?",o:["11101100", "11101101", "00010100", "00010010"],a:1,e:"2의 보수 = 1의 보수(비트 반전=11101100) + 1 = <b>11101101</b>."},
  {s:"스프레드시트",q:"다음 중 엑셀 오류 값과 원인의 연결로 옳지 않은 것은?",o:["#DIV/0! — 0 또는 빈 셀로 나눔", "#N/A — 참조할 값을 찾지 못함", "#NAME? — 함수 이름·정의되지 않은 이름 오류", "#REF! — 숫자가 들어갈 자리에 문자를 사용"],a:3,e:"#REF!는 <b>참조하던 셀이 삭제</b>되어 참조가 유효하지 않을 때다. 문자/숫자 형식 오류는 #VALUE!다."},
  {s:"스프레드시트",q:"다음 중 인쇄 영역과 페이지 나누기에 대한 설명으로 옳지 않은 것은?",o:["인쇄 영역을 설정하면 지정한 범위만 인쇄된다.", "페이지 나누기 미리 보기에서 파란 선을 드래그해 나눔 위치를 조정한다.", "수동으로 삽입한 페이지 나누기는 실선, 자동 나누기는 점선으로 표시된다.", "인쇄 영역은 한 번 설정하면 해제할 수 없다."],a:3,e:"인쇄 영역은 <b>'인쇄 영역 해제'로 언제든 해제</b>할 수 있다."},
  {s:"스프레드시트",q:"다음 중 '각 데이터 요소의 값이나 이름을 차트에 직접 표시'하는 구성 요소로 옳은 것은?",o:["데이터 레이블", "범례", "눈금선", "축 제목"],a:0,e:"값·이름을 직접 표시하는 것은 <b>데이터 레이블</b>이다."},
  {s:"스프레드시트",q:"다음 중 차트의 오차 막대에 대한 설명으로 옳지 않은 것은?",o:["데이터 표식의 오차·불확실도를 나타내며 고정값·백분율·표준 편차·표준 오차로 설정한다.", "분산형·거품형에서는 X값과 Y값 모두에 오차 막대를 표시할 수 있다.", "3차원 세로 막대형 차트에서도 Y 오차 막대를 표시할 수 있다.", "2차원 세로·가로 막대형·꺾은선형 계열에 Y 오차 막대를 추가할 수 있다."],a:2,e:"오차 막대는 <b>3차원 차트에서 사용 불가</b>하다."},
  {s:"스프레드시트",q:"다음 중 정렬에 대한 설명으로 옳지 않은 것은?",o:["영문 대·소문자를 구분하도록 옵션을 설정할 수 있으며, 오름차순에서 소문자가 대문자보다 우선한다.", "한글은 오름차순에서 사전 순(가나다)으로 정렬된다.", "숨겨진 행·열은 정렬에 포함되지 않는다.", "셀 색을 기준으로 정렬하면 지정한 색을 위쪽 또는 아래쪽에 모을 수 있다."],a:0,e:"대·소문자 구분 시 <b>대문자가 소문자보다 우선</b>(앞)한다. 지문은 반대다."},
  {s:"스프레드시트",q:"다음 중 부분합에 대한 설명으로 옳지 않은 것은?",o:["합계·개수·평균·최대·최소·곱·표준편차 등의 함수를 쓸 수 있다.", "'그룹 사이에서 페이지 나누기'를 체크하면 그룹마다 페이지가 나뉘어 인쇄된다.", "중첩 부분합은 '새로운 값으로 대치'를 해제하고 두 번째 함수로 다시 실행한다.", "부분합은 데이터 목록에 자동 필터가 설정되어 있어야만 실행된다."],a:3,e:"부분합은 <b>자동 필터와 무관</b>하며, 그룹 기준 정렬만 되어 있으면 실행된다."},
  {s:"스프레드시트",q:"다음 중 '전체에 대한 각 항목의 비율(구성비)'을 나타내기에 가장 적합한 차트는?",o:["원형 차트", "분산형 차트", "꺾은선형 차트", "주식형 차트"],a:0,e:"구성비 표현에는 <b>원형(또는 도넛형)</b> 차트가 적합하다."},
  {s:"스프레드시트",q:"다음 중 '시트 보호'와 셀의 '잠금' 속성에 대한 설명으로 옳은 것은?",o:["모든 셀은 기본적으로 '잠금'되어 있으나, 시트를 보호해야 잠금이 실제로 적용된다.", "셀의 '잠금'을 해제하면 시트를 보호해도 그 셀은 편집할 수 있다.", "시트를 보호하지 않아도 잠금된 셀은 편집할 수 없다.", "①과 ②가 모두 옳다."],a:3,e:"엑셀의 모든 셀은 기본적으로 '잠금' 상태이지만, '시트 보호'를 실행해야 잠금이 실제로 효력을 가진다. 미리 특정 셀의 잠금을 '해제'해 두면, 시트를 보호해도 그 셀만 입력할 수 있다. 따라서 ①·② 모두 옳다."},
  {s:"스프레드시트",q:"아래 표에서 전체 판매 금액(수량×단가의 합계)을 한 번에 구하려고 한다. 가장 적절한 수식은? (참고: 총액 107,000원)",o:["=SUMPRODUCT(B2:B4+C2:C4)", "=SUM(B2:B4)*SUM(C2:C4)", "=SUMPRODUCT(B2:B4,C2:C4)", "=SUM(B2:B4*C2:C4)"],a:2,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">품목</td><td class=\"hd\">수량</td><td class=\"hd\">단가</td></tr><tr><td class=\"rh\">2</td><td>자</td><td>4</td><td>14,000</td></tr><tr><td class=\"rh\">3</td><td>노트</td><td>2</td><td>12,000</td></tr><tr><td class=\"rh\">4</td><td>풀</td><td>3</td><td>9,000</td></tr></table>",e:"<b>SUMPRODUCT(배열1, 배열2)</b>는 대응하는 원소끼리 곱한 뒤 모두 더한다 → <b>107,000</b>원. =SUM(B*C)는 일반 입력 시 배열이 아니라 오류/단일값이 되고(배열 입력해야 함), SUM(B)*SUM(C)는 합끼리 곱해 의미가 다르다."},
  {s:"스프레드시트",q:"다음 중 REPT 함수로 문자를 반복한 결과로 옳은 것은?\n\n=REPT(\"★\",5)&REPT(\"☆\",5-5)",o:["★★★★★", "☆☆☆☆☆", "★★★★1", "★★★★★★"],a:0,e:"★를 5번, ☆를 0번 이어 붙여 5칸 별점을 만든다 → ★★★★★"},
  {s:"스프레드시트",q:"다음 중 수식의 실행 결과가 옳지 않은 것은?",o:["=MOD(-8,-3) → -2", "=INT(-6.6) → -7", "=TRUNC(-6.8) → -5", "=ROUND(689.423,-2) → 700"],a:2,e:"=TRUNC(-6.8)의 올바른 결과는 -6이다. (INT=내림, TRUNC=절사, MOD=n-d×INT(n/d), ROUND=반올림)"},
  {s:"스프레드시트",q:"다음 중 문자 위치를 찾는 함수식의 결과로 옳은 것은? (FIND는 대/소문자 구분·와일드카드 불가, SEARCH는 구분 안 함·와일드카드 가능)\n\n=FIND(\"Y\",\"YoungPaJok CBT\")",o:["1", "#VALUE!", "2", "0"],a:0,e:"FIND(찾을문자, 대상)은 앞에서부터 문자가 처음 나오는 <b>위치(1부터)</b>를 반환한다. \"YoungPaJok CBT\"에서 'Y'의 위치는 <b>1</b>. (공백도 한 글자로 센다.)"},
  {s:"스프레드시트",q:"셀 [A1:A5]에 다음 값이 입력되어 있다: 43, 66, 67, 75, 98\n다음 수식(50% 지점(백분위수))의 결과로 옳은 것은?\n\n=PERCENTILE.INC(A1:A5, 0.5)",o:["66", "68", "67", "75"],a:2,e:"PERCENTILE.INC(범위, 0.5)는 데이터를 오름차순 정렬했을 때 하위 50% 위치의 값을 구한다. 정렬된 5개 값에서 그 위치의 값은 <b>67</b>이다."},
  {s:"스프레드시트",q:"다음 중 문자 위치를 찾는 함수식의 결과로 옳은 것은? (FIND는 대/소문자 구분·와일드카드 불가, SEARCH는 구분 안 함·와일드카드 가능)\n\n=FIND(\"s\",\"YOUNGPAJOK STUDY\")",o:["0", "12", "#VALUE!", "1"],a:2,e:"FIND는 <b>대/소문자를 구분</b>한다. 대상 \"YOUNGPAJOK STUDY\"에 소문자 's'가 없으면 <b>#VALUE! 오류</b>가 난다. 대소문자를 무시하려면 SEARCH를 써야 한다 (=SEARCH(\"s\",\"YOUNGPAJOK STUDY\") → 12)."},
  {s:"스프레드시트",q:"아래 시트에서 부서가 '영업부'인 직원의 급여 합계를 [F2]에 구하려 한다. 입력할 수식으로 옳은 것은?",o:["=COUNTIF(B2:B4,\"영업부\")", "=DSUM(B2:B4,\"영업부\",D2:D4)", "=SUMIF(D2:D4,\"영업부\",B2:B4)", "=SUMIF(B2:B4,\"영업부\",D2:D4)"],a:3,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">이름</td><td class=\"hd\">부서</td><td class=\"hd\">직급</td><td class=\"hd\">급여</td></tr><tr><td class=\"rh\">2</td><td>김하나</td><td class=\"l\">영업부</td><td>사원</td><td>4,400,000</td></tr><tr><td class=\"rh\">3</td><td>최나래</td><td class=\"l\">영업부</td><td>과장</td><td>4,100,000</td></tr><tr><td class=\"rh\">4</td><td>정우진</td><td class=\"l\">기획부</td><td>사원</td><td>4,600,000</td></tr></table>",e:"SUMIF(<b>조건범위, 조건, 합계범위</b>) → 부서(B)에서 '영업부'를 찾아 급여(D)를 더한다."},
  {s:"스프레드시트",q:"셀 [A1:A5]에 다음 값이 입력되어 있다: 26, 38, 70, 79, 85\n다음 수식(제1사분위수)의 결과로 옳은 것은?\n\n=QUARTILE.INC(A1:A5, 1)",o:["39", "38", "37", "70"],a:1,e:"QUARTILE.INC(범위, 1)는 제1사분위수(하위 25% 지점)를 구하며 PERCENTILE.INC(범위,0.25)와 같다. 정렬된 값에서 결과는 <b>38</b>이다."},
  {s:"스프레드시트",q:"아래 시트에서 입력값에 주어진 표시 형식을 적용했을 때, [C2]의 결과로 옳은 것은?",o:["1,235", "2025년 3월", "(1,500)", "1"],a:3,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">입력값</td><td class=\"hd\">표시 형식</td><td class=\"hd\">결과</td></tr><tr><td class=\"rh\">2</td><td>1000000</td><td class=\"l\">0,,</td><td>?</td></tr></table>",e:"쉼표 2개는 백만 단위 생략 → 1"},
  {s:"스프레드시트",q:"아래 시트에서 부서가 '기획부'인 직원의 급여 합계를 [F2]에 구하려 한다. 입력할 수식으로 옳은 것은?",o:["=SUMIF(B2:B4,\"기획부\",D2:D4)", "=DSUM(B2:B4,\"기획부\",D2:D4)", "=COUNTIF(B2:B4,\"기획부\")", "=SUMIF(D2:D4,\"기획부\",B2:B4)"],a:0,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">이름</td><td class=\"hd\">부서</td><td class=\"hd\">직급</td><td class=\"hd\">급여</td></tr><tr><td class=\"rh\">2</td><td>한소라</td><td class=\"l\">영업부</td><td>대리</td><td>4,800,000</td></tr><tr><td class=\"rh\">3</td><td>오지민</td><td class=\"l\">기획부</td><td>사원</td><td>3,600,000</td></tr><tr><td class=\"rh\">4</td><td>김하나</td><td class=\"l\">인사부</td><td>사원</td><td>3,300,000</td></tr></table>",e:"SUMIF(<b>조건범위, 조건, 합계범위</b>) → 부서(B)에서 '기획부'를 찾아 급여(D)를 더한다."},
  {s:"스프레드시트",q:"아래 표에서 전체 판매 금액(수량×단가의 합계)을 한 번에 구하려고 한다. 가장 적절한 수식은? (참고: 총액 132,000원)",o:["=SUM(B2:B4*C2:C4)", "=SUMPRODUCT(B2:B4,C2:C4)", "=SUMPRODUCT(B2:B4+C2:C4)", "=SUM(B2:B4)*SUM(C2:C4)"],a:1,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">품목</td><td class=\"hd\">수량</td><td class=\"hd\">단가</td></tr><tr><td class=\"rh\">2</td><td>연필</td><td>3</td><td>6,000</td></tr><tr><td class=\"rh\">3</td><td>펜</td><td>8</td><td>13,000</td></tr><tr><td class=\"rh\">4</td><td>풀</td><td>2</td><td>5,000</td></tr></table>",e:"<b>SUMPRODUCT(배열1, 배열2)</b>는 대응하는 원소끼리 곱한 뒤 모두 더한다 → <b>132,000</b>원. =SUM(B*C)는 일반 입력 시 배열이 아니라 오류/단일값이 되고(배열 입력해야 함), SUM(B)*SUM(C)는 합끼리 곱해 의미가 다르다."},
  {s:"스프레드시트",q:"다음 중 REPT 함수로 문자를 반복한 결과로 옳은 것은?\n\n=REPT(\"▣\",INT(46/10))",o:["▣▣", "▣▣▣▣", "▣▣▣", "▣▣▣▣▣"],a:1,e:"INT(46/10)=4이므로 '▣'를 <b>4번</b> 반복한다 → ▣▣▣▣"}
 ]},
{ name:'기출 2회', q:[
  {s:"컴퓨터일반",q:"다음 중 각종 사물에 센서와 통신 기능을 내장하여 인터넷으로 서로 연결하고 정보를 주고받게 하는 기술을 의미하는 것은?",o:["사물인터넷(IoT)", "가상 사설망(VPN)", "인터넷 전화(VoIP)", "원격 접속(Telnet)"],a:0,e:"사물을 인터넷으로 연결하는 기술은 <b>사물인터넷(IoT)</b>이다."},
  {s:"컴퓨터일반",q:"다음 중 서로 다른 응용 프로그램이나 시스템 사이를 연결하여 데이터를 주고받게 해 주는 중간 소프트웨어를 의미하는 것은?",o:["미들웨어", "펌웨어", "커널", "디바이스 드라이버"],a:0,e:"응용·시스템을 연결하는 중간 소프트웨어는 <b>미들웨어</b>다."},
  {s:"컴퓨터일반",q:"다음 중 디지털 데이터의 오류 검출·교정 코드에 대한 설명으로 옳지 않은 것은?",o:["패리티 비트는 1의 개수를 짝수 또는 홀수로 맞춰 1비트 오류를 '검출'한다.", "해밍(Hamming) 코드는 오류를 검출할 뿐 아니라 스스로 교정할 수 있다.", "CRC(순환 중복 검사)는 다항식을 이용해 블록 단위 오류를 검출한다.", "패리티 비트만으로 어느 자리에서 오류가 났는지 위치를 찾아 교정할 수 있다."],a:3,e:"패리티 비트는 오류의 '발생 여부'만 알려줄 뿐 위치를 찾아 교정하지는 못한다. 오류 교정은 해밍 코드가 담당한다. CRC는 블록 오류 검출용이다."},
  {s:"컴퓨터일반",q:"다음 중 AI 윤리에 대한 설명으로 옳지 않은 것은?",o:["AI는 특정 집단에 불리한 편향(차별)을 주지 않도록 공정성을 지켜야 한다.", "AI의 판단 근거를 사람이 이해할 수 있어야 한다는 설명 가능성(투명성)이 요구된다.", "개인정보 보호와 데이터 보안은 AI 활용의 중요한 윤리 원칙이다.", "AI의 결정은 항상 사람의 판단보다 우선하므로 사람이 개입하면 안 된다."],a:3,e:"AI 윤리는 <b>사람의 감독·개입(인간 중심)</b>을 중시한다. AI 판단을 무조건 우선시하지 않는다."},
  {s:"컴퓨터일반",q:"다음 중 스풀(SPOOL)에 대한 설명으로 옳지 않은 것은?",o:["스풀은 인쇄 데이터를 디스크에 모았다가 프린터로 보내는 기능이다.", "스풀을 쓰면 CPU와 입출력장치가 병행 처리되어 전체 효율이 높아진다.", "스풀은 여러 인쇄 작업을 대기열에 쌓아 순서대로 출력한다.", "스풀은 인쇄 속도 자체를 빠르게 해 출력 시간을 단축시킨다."],a:3,e:"스풀은 <b>인쇄 속도 자체를 높이지는 않는다</b>(CPU가 기다리지 않게 해 전체 효율만 향상)."},
  {s:"컴퓨터일반",q:"다음 중 머신러닝의 학습 방법에 대한 설명으로 옳지 않은 것은?",o:["지도 학습은 정답(레이블)이 있는 데이터로 학습한다.", "비지도 학습은 정답 없이 데이터의 군집·패턴을 찾는다.", "강화 학습은 보상을 최대화하도록 시행착오로 학습한다.", "지도 학습은 정답이 없는 데이터에서 숨은 규칙을 찾는 군집화에 주로 쓰인다."],a:3,e:"정답 없이 군집을 찾는 것은 <b>비지도 학습</b>이다. 지도 학습은 레이블이 있는 데이터를 쓴다."},
  {s:"컴퓨터일반",q:"다음 중 통신망의 규모가 작은 것부터 큰 순서로 옳은 것은?",o:["LAN < MAN < WAN", "WAN < MAN < LAN", "MAN < LAN < WAN", "LAN < WAN < MAN"],a:0,e:"통신망은 규모에 따라 LAN(근거리) < MAN(도시권) < WAN(광역) 순으로 커진다."},
  {s:"컴퓨터일반",q:"다음 중 광학 저장장치에 대한 설명으로 옳지 않은 것은?",o:["CD-ROM은 읽기 전용이며 약 650~700MB를 저장한다.", "DVD는 CD보다 용량이 크며 단층·복층 등이 있다.", "Blu-ray는 DVD보다 짧은 파장의 레이저를 써 용량이 더 크다.", "CD-RW는 한 번만 기록할 수 있고 다시 쓸 수 없다."],a:3,e:"CD-RW는 <b>여러 번 지우고 다시 기록</b>할 수 있다(한 번 기록은 CD-R)."},
  {s:"컴퓨터일반",q:"다음 중 인터넷 서비스에 대한 설명으로 옳지 않은 것은?",o:["FTP는 파일 전송 서비스로 업로드·다운로드를 지원한다.", "Telnet은 원격 컴퓨터에 접속해 작업하는 서비스다.", "전자우편에서 POP3는 메일 수신, SMTP는 메일 송신 프로토콜이다.", "IRC는 인터넷에서 파일을 검색·공유하는 전자우편 프로토콜이다."],a:3,e:"IRC는 <b>실시간 대화(채팅)</b> 서비스다. 전자우편 프로토콜이 아니다."},
  {s:"컴퓨터일반",q:"다음 중 소형화·경량화를 비롯하여 음성·동작 인식 등 다양한 기술이 적용되어, 장소에 구애받지 않고 몸에 착용한 채 컴퓨터를 활용할 수 있도록 만든 컴퓨터를 의미하는 것은?",o:["웨어러블 컴퓨터", "마이크로 컴퓨터", "인공지능 컴퓨터", "서버 컴퓨터"],a:0,e:"몸에 착용하는 형태의 컴퓨터는 <b>웨어러블 컴퓨터</b>다."},
  {s:"컴퓨터일반",q:"다음 중 컴퓨터에서 사용하는 단위에 대한 설명으로 옳지 않은 것은?",o:["자료 표현 단위는 Bit < Nibble(4bit) < Byte(8bit) < Word < Field < Record < File < Database 순으로 커진다.", "처리 속도 단위는 ms > μs > ns > ps > fs 순으로 점점 빨라진다(짧아진다).", "1KB=1,024Byte, 1MB=1,024KB, 1GB=1,024MB이다.", "기억 용량이 가장 큰 단위부터 나열하면 TB > GB > MB > KB 순이다."],a:1,e:"속도 단위는 ms(10⁻³) > μs > ns > ps > fs 순으로 <b>ms가 가장 느리고 fs가 가장 빠르다</b>. '빨라진다'는 표현만 옳고 부등호 방향은 크기 기준으로 맞다—단, 지문은 '>'가 속도를 뜻하는 것처럼 혼동시키는 함정이다."},
  {s:"컴퓨터일반",q:"다음 중 포트(Port)와 용도의 연결로 옳지 않은 것은?",o:["HDMI — 영상·음성 디지털 출력", "USB — 범용 주변장치 연결", "RJ-45 — 유선 랜(네트워크) 연결", "PS/2 — 모니터 전용 연결"],a:3,e:"PS/2는 예전의 키보드·마우스 연결 포트이다. 모니터는 HDMI·DP·D-SUB 등을 사용한다."},
  {s:"컴퓨터일반",q:"다음 중 인터넷 관련 용어에 대한 설명으로 옳지 않은 것은?",o:["쿠키(Cookie)는 방문 기록·설정을 담아 두는 작은 파일이다.", "캐시(Cache)는 자주 쓰는 데이터를 임시 저장해 속도를 높인다.", "북마크(즐겨찾기)는 자주 가는 사이트를 등록해 둔다.", "프록시(Proxy) 서버는 웹 페이지를 삭제하는 보안 장치이다."],a:3,e:"프록시 서버는 내부와 외부 사이에서 요청을 대신 처리·중계하며 캐시·보안·접근 제어에 쓰인다. 웹 페이지를 삭제하는 장치가 아니다."},
  {s:"컴퓨터일반",q:"다음 중 프로그래밍 언어에 대한 설명으로 옳지 않은 것은?",o:["기계어는 0과 1로 된 컴퓨터가 바로 이해하는 언어이다.", "어셈블리어는 기계어와 1:1 대응되는 저급 언어이다.", "C, Java, Python은 고급 언어이다.", "고급 언어는 번역 없이 CPU가 바로 실행한다."],a:3,e:"고급 언어는 컴파일러·인터프리터로 '번역'해야 CPU가 실행할 수 있다. CPU가 바로 실행하는 것은 기계어이다."},
  {s:"컴퓨터일반",q:"다음 중 동영상 파일 형식이 아닌 것은?",o:["AVI", "MP4", "MOV", "JPG"],a:3,e:"JPG는 '정지 이미지' 압축 형식이다. AVI·MP4·MOV는 동영상 파일 형식이다."},
  {s:"컴퓨터일반",q:"다음 중 파일을 모두 내려받지 않고 전송받으면서 동시에 실시간으로 재생하는 기술을 의미하는 것은?",o:["스트리밍", "스풀링", "캐싱", "버퍼링"],a:0,e:"받으면서 바로 재생하는 기술은 <b>스트리밍</b>이다."},
  {s:"컴퓨터일반",q:"다음 중 가로 800픽셀 × 세로 720픽셀, 한 픽셀을 16비트로 표현하는 비압축 비트맵 이미지의 용량으로 옳은 것은? (1KB=1,024Byte)",o:["1,125KB", "2,250KB", "375KB", "562KB"],a:0,e:"비트맵 용량 = 가로×세로×색 깊이(비트)÷8 = 800×720×16÷8 = <b>1,152,000 Byte</b> ≒ 1,125KB."},
  {s:"컴퓨터일반",q:"다음은 7비트 ASCII 코드에 홀수 패리티 비트를 '오른쪽 끝 1비트'로 붙인 8비트 코드이다. 전송 중 오류가 발생한(패리티가 어긋난) 것은?",o:["10000011", "11001011", "10101100", "11011100"],a:2,e:"홀수 패리티는 8비트 전체에서 1의 개수가 홀수가 되도록 패리티 비트를 정한다. 정답 코드 <b>10101100</b>는 1의 개수가 4개로 홀수가 아니어서 오류이다. (패리티 비트는 1비트 오류의 '발생 여부'만 검출하고 위치는 못 찾는다.)"},
  {s:"컴퓨터일반",q:"다음 중 주소선(주소 버스)이 12개인 시스템이 직접 지정할 수 있는 최대 기억 공간(워드 수)으로 옳은 것은?",o:["4,096", "2,048", "12,288", "8,192"],a:0,e:"주소선 n개로 2ⁿ개의 주소를 지정한다 → 2^12 = <b>4,096</b>개."},
  {s:"컴퓨터일반",q:"다음 두 8비트 값에 비트 단위 OR 연산을 수행한 결과로 옳은 것은?\n\n01000011 OR 00110011",o:["01110000", "10111100", "00000011", "01110011"],a:3,e:"비트 OR은 각 자리에서 하나라도 1이면 1 → <b>01110011</b>."},
  {s:"스프레드시트",q:"다음 중 텍스트 함수의 결과로 옳지 않은 것은?",o:["=MID(\"ABCDEFG\",3,2) → CD", "=LEFT(\"대한민국만세\",2) → 대한", "=REPLACE(\"2025년\",1,4,\"2026\") → 2026년", "=FIND(\"북\",\"서울북부\") → 2"],a:3,e:"=FIND(\"북\",\"서울북부\")는 '북'의 위치 → <b>3</b>이다."},
  {s:"스프레드시트",q:"다음 중 그림과 같은 [목표값 찾기] 설정의 의미로 옳은 것은?",o:["평균(E4)이 40이 되려면 노트북(B4) 판매량이 얼마가 되어야 하는가?", "노트북(B4)이 40이 되려면 평균(E4)이 얼마가 되어야 하는가?", "노트북 판매량을 40으로 바꾸면 평균(E4)은 얼마가 되는가?", "평균이 40이 되려면 노트북 외 나머지 제품 판매량은 얼마가 되어야 하는가?"],a:0,fig:"<div class=\"figwrap\"><table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th></tr><tr><td class=\"rh\">1</td><td class=\"tt\" colspan=\"5\">제품별 판매현황</td></tr><tr><td class=\"rh\">3</td><td class=\"hd\">품목</td><td class=\"hd\">노트북</td><td class=\"hd\">프린터</td><td class=\"hd\">스캐너</td><td class=\"hd\">평균</td></tr><tr><td class=\"rh\">4</td><td class=\"hd\">판매량</td><td>60</td><td>35</td><td>15</td><td>36.67</td></tr></table><div class=\"dlg\"><div class=\"tb\"><span>목표값 찾기</span><span class=\"x\">? ✕</span></div><div class=\"bd\"><div class=\"row\"><span>수식 셀(E):</span><span class=\"inp\">$E$4</span></div><div class=\"row\"><span>찾는 값(V):</span><span class=\"inp\">40</span></div><div class=\"row\"><span>값을 바꿀 셀(C):</span><span class=\"inp\">$B$4</span></div><div class=\"btns\"><span class=\"btn pri\">확인</span><span class=\"btn\">취소</span></div></div></div></div>",e:"목표값 찾기는 <b>수식 셀(E4)이 찾는 값(40)</b>이 되도록 <b>값을 바꿀 셀(B4)</b>을 역산한다."},
  {s:"스프레드시트",q:"다음 중 '틀 고정'과 '창 나누기'의 차이로 옳은 것은?",o:["틀 고정은 고정선이 움직이지 않지만, 창 나누기는 분할선을 드래그로 옮길 수 있다.", "둘 다 인쇄에 반영된다.", "창 나누기는 최대 2개, 틀 고정은 최대 4개로 나눈다.", "틀 고정은 분할선을 드래그로 옮길 수 있다."],a:0,e:"틀 고정은 지정한 행/열을 '고정'해 선이 움직이지 않는다. 창 나누기는 화면을 최대 4개로 나누고 분할선을 드래그로 이동할 수 있다. 둘 다 인쇄에는 반영되지 않는다."},
  {s:"스프레드시트",q:"다음 중 피벗 테이블과 피벗 차트에 대한 설명으로 옳지 않은 것은?",o:["원본이 바뀌어도 자동 갱신되지 않으므로 '새로 고침'해야 반영된다.", "피벗 차트를 만든 뒤 연결된 피벗 테이블을 삭제하면 일반 차트로 바뀐다.", "피벗 차트는 분산형·주식형·거품형을 포함한 모든 종류로 바꿀 수 있다.", "값 영역에 합계·평균·개수·최대·최소·곱·표준편차·분산을 쓸 수 있다."],a:2,e:"피벗 차트는 <b>분산형·주식형·거품형으로는 변경 불가</b>."},
  {s:"스프레드시트",q:"다음 중 조건부 집계 함수에 대한 설명으로 옳지 않은 것은?",o:["=SUMIF(조건범위,조건,합계범위)로 조건에 맞는 합계를 구한다.", "=AVERAGEIF로 조건에 맞는 평균을 구한다.", "=COUNTIFS로 여러 조건을 모두 만족하는 개수를 구한다.", "=SUMIFS는 조건을 하나만 지정할 수 있어 다중 조건에는 쓸 수 없다."],a:3,e:"=SUMIFS는 <b>여러 조건(다중)</b>으로 합계를 구하는 함수다."},
  {s:"스프레드시트",q:"여부는 E열에 있을 때, D3·E3 기준으로 가장 적절한 수식은?",o:["=IF(AND(D3>=90,E3=\"정상\"),\"대상\",\"\")", "=IF(OR(D3>=90,E3=\"정상\"),\"대상\",\"\")", "=IF(D3>=90,\"대상\",IF(E3=\"정상\",\"대상\",\"\"))", "=IFS(D3>=90,\"대상\")"],a:0,e:"'그리고(모두 만족)' 조건이므로 AND 함수로 두 조건을 묶어야 한다. ➁는 OR이라 한쪽 조건만 만족해도 대상이 되어 오답이며, ➂은 총점만 90점 이상이어도 결시 여부와 무관하게 대상이 되어버리는 논리 오류가 있다. URL 주소체계 · OSI 7계층 · TCP/IP 기존 1과목 범위에서 자주 누락되는 인터넷 주소체계·통신 프로토콜을 보강한다. URL(인터넷 주소) 구성 순서 프로토콜 :// 도메인 주소 : 포트 번호 / 파일 경로"},
  {s:"스프레드시트",q:"다음 중 '시간 경과에 따른 데이터의 추세·변화'를 나타내기에 가장 적합한 차트는?",o:["원형 차트", "꺾은선형 차트", "도넛형 차트", "방사형 차트"],a:1,e:"시간에 따른 추세·변화는 <b>꺾은선형</b>이 적합하다."},
  {s:"스프레드시트",q:"다음 중 셀 이름 정의에 대한 설명으로 옳지 않은 것은?",o:["이름의 첫 글자는 문자·밑줄(_)·백슬래시여야 하며 공백은 쓸 수 없다.", "셀 주소(A1)와 똑같은 형태의 이름은 사용할 수 없다.", "정의한 이름은 수식에서 절대 참조처럼 사용된다.", "하나의 이름을 여러 범위에 중복해서 자유롭게 정의할 수 있다."],a:3,e:"같은 통합 문서(시트 범위)에서 <b>같은 이름을 중복 정의할 수 없다</b>."},
  {s:"스프레드시트",q:"다음 그림과 같이 [목표값 찾기]를 설정했을 때, 그 의미로 옳은 것은?",o:["평균(E4)이 40이 되려면 노트북 판매량(B4)이 얼마가 되어야 하는가?", "노트북 판매량(B4)이 40이 되려면 평균(E4)이 얼마가 되어야 하는가?", "노트북 판매량을 40으로 바꾸면 평균(E4)은 얼마가 되는가?", "평균이 40이 되려면 노트북 외 나머지 제품 판매량은 얼마가 되어야 하는가?"],a:0,fig:"<div class=\"figwrap\"><table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th></tr><tr><td class=\"rh\">1</td><td class=\"tt\" colspan=\"5\">제품별 판매현황</td></tr><tr><td class=\"rh\">3</td><td class=\"hd\">품목</td><td class=\"hd\">노트북</td><td class=\"hd\">프린터</td><td class=\"hd\">스캐너</td><td class=\"hd\">평균</td></tr><tr><td class=\"rh\">4</td><td class=\"hd\">판매량</td><td>83</td><td>21</td><td>21</td><td>41.67</td></tr></table><div class=\"dlg\"><div class=\"tb\"><span>목표값 찾기</span><span class=\"x\">? ✕</span></div><div class=\"bd\"><div class=\"row\"><span>수식 셀(E):</span><span class=\"inp\">$E$4</span></div><div class=\"row\"><span>찾는 값(V):</span><span class=\"inp\">40</span></div><div class=\"row\"><span>값을 바꿀 셀(C):</span><span class=\"inp\">$B$4</span></div><div class=\"btns\"><span class=\"btn pri\">확인</span><span class=\"btn\">취소</span></div></div></div></div>",e:"목표값 찾기는 <b>수식 셀(E4·평균)이 찾는 값(40)</b>이 되도록 <b>값을 바꿀 셀(B4·노트북)</b>을 역산한다."},
  {s:"스프레드시트",q:"다음 중 REPT 함수로 문자를 반복한 결과로 옳은 것은?\n\n=REPT(\"●\",INT(94/10))",o:["●●●●●●●●●●", "●●●●●●●●●", "●●●●", "●●●●●●●●"],a:1,e:"INT(94/10)=9이므로 '●'를 <b>9번</b> 반복한다 → ●●●●●●●●●"},
  {s:"스프레드시트",q:"다음 수식의 실행 결과로 옳은 것은?\n\n=IF(MOD(A1,2)=0,\"짝수\",\"홀수\")   (단, [A1]=50)",o:["짝수", "홀수", "0", "#VALUE!"],a:0,e:"MOD(50,2)=0 → 짝수"},
  {s:"스프레드시트",q:"다음 수식의 실행 결과로 옳은 것은?\n\n=IF(MOD(A1,2)=0,\"짝수\",\"홀수\")   (단, [A1]=42)",o:["짝수", "홀수", "0", "#VALUE!"],a:0,e:"MOD(42,2)=0 → 짝수"},
  {s:"스프레드시트",q:"아래 시트에서 부서가 '인사부'인 직원의 급여 합계를 [F2]에 구하려 한다. 입력할 수식으로 옳은 것은?",o:["=COUNTIF(B2:B4,\"인사부\")", "=DSUM(B2:B4,\"인사부\",D2:D4)", "=SUMIF(D2:D4,\"인사부\",B2:B4)", "=SUMIF(B2:B4,\"인사부\",D2:D4)"],a:3,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">이름</td><td class=\"hd\">부서</td><td class=\"hd\">직급</td><td class=\"hd\">급여</td></tr><tr><td class=\"rh\">2</td><td>정우진</td><td class=\"l\">영업부</td><td>사원</td><td>2,400,000</td></tr><tr><td class=\"rh\">3</td><td>최나래</td><td class=\"l\">기획부</td><td>과장</td><td>2,200,000</td></tr><tr><td class=\"rh\">4</td><td>김하나</td><td class=\"l\">기획부</td><td>과장</td><td>3,800,000</td></tr></table>",e:"SUMIF(<b>조건범위, 조건, 합계범위</b>) → 부서(B)에서 '인사부'를 찾아 급여(D)를 더한다."},
  {s:"스프레드시트",q:"다음 중 REPT 함수로 문자를 반복한 결과로 옳은 것은?\n\n=REPT(\"●\",INT(89/10))",o:["●●●●", "●●●●●●●●●", "●●●●●●●", "●●●●●●●●"],a:3,e:"INT(89/10)=8이므로 '●'를 <b>8번</b> 반복한다 → ●●●●●●●●"},
  {s:"스프레드시트",q:"아래 표에서 전체 판매 금액(수량×단가의 합계)을 한 번에 구하려고 한다. 가장 적절한 수식은? (참고: 총액 265,000원)",o:["=SUM(B2:B5)*SUM(C2:C5)", "=SUMPRODUCT(B2:B5+C2:C5)", "=SUM(B2:B5*C2:C5)", "=SUMPRODUCT(B2:B5,C2:C5)"],a:3,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">품목</td><td class=\"hd\">수량</td><td class=\"hd\">단가</td></tr><tr><td class=\"rh\">2</td><td>지우개</td><td>8</td><td>14,000</td></tr><tr><td class=\"rh\">3</td><td>풀</td><td>6</td><td>14,000</td></tr><tr><td class=\"rh\">4</td><td>펜</td><td>7</td><td>9,000</td></tr><tr><td class=\"rh\">5</td><td>자</td><td>2</td><td>3,000</td></tr></table>",e:"<b>SUMPRODUCT(배열1, 배열2)</b>는 대응하는 원소끼리 곱한 뒤 모두 더한다 → <b>265,000</b>원. =SUM(B*C)는 일반 입력 시 배열이 아니라 오류/단일값이 되고(배열 입력해야 함), SUM(B)*SUM(C)는 합끼리 곱해 의미가 다르다."},
  {s:"스프레드시트",q:"왼쪽 기준표([F2:G6], 오름차순)를 이용해 점수 84점의 등급을 구하려고 한다. 가장 적절한 수식은? (구간의 최저점 이상이면 해당 등급)",o:["=HLOOKUP(84,$F$2:$G$6,2,TRUE)", "=VLOOKUP(84,$F$2:$G$6,2,FALSE)", "=VLOOKUP(84,$F$2:$G$6,2,0)", "=VLOOKUP(84,$F$2:$G$6,2,TRUE)"],a:3,fig:"<table class=\"xg\"><tr><th></th><th>F</th><th>G</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">기준점수</td><td class=\"hd\">등급</td></tr><tr><td class=\"rh\">2</td><td>0</td><td class=\"l\">F</td></tr><tr><td class=\"rh\">3</td><td>60</td><td class=\"l\">D</td></tr><tr><td class=\"rh\">4</td><td>70</td><td class=\"l\">C</td></tr><tr><td class=\"rh\">5</td><td>80</td><td class=\"l\">B</td></tr><tr><td class=\"rh\">6</td><td>90</td><td class=\"l\">A</td></tr></table>",e:"구간(범위) 조회는 네 번째 인수를 <b>TRUE(생략 가능, 근사일치)</b>로 두고 기준표가 <b>오름차순</b>이어야 한다. 84점 → <b>B</b>등급. FALSE(정확히 일치)는 기준표에 없는 값이면 #N/A가 난다."},
  {s:"스프레드시트",q:"다음 중 수식의 실행 결과가 옳지 않은 것은?",o:["=MOD(-6,-3) → 0", "=TRUNC(-3.2) → -3", "=ROUND(656.454,1) → 656.4", "=INT(-4.5) → -5"],a:2,e:"=ROUND(656.454,1)의 올바른 결과는 656.5이다. (INT=내림, TRUNC=절사, MOD=n-d×INT(n/d), ROUND=반올림)"},
  {s:"스프레드시트",q:"다음 중 문자 위치를 찾는 함수식의 결과로 옳은 것은? (FIND는 대/소문자 구분·와일드카드 불가, SEARCH는 구분 안 함·와일드카드 가능)\n\n=SEARCH(\"P?J\",\"YOUNGPAJOK MASTER\")",o:["6", "1", "#VALUE!", "0"],a:0,e:"SEARCH는 <b>와일드카드(?,*)</b>를 지원하므로 '?'가 한 글자를 대신해 패턴과 일치하는 시작 위치 <b>6</b>를 찾는다. FIND는 와일드카드를 지원하지 않아 같은 식에서 #VALUE!가 난다."},
  {s:"스프레드시트",q:"셀 값이 5,000 이상이면 '자홍', 5,000 미만 500 이상이면 '빨강', 500 미만이면 색을 지정하지 않고, 모든 구간에서 천 단위 구분 기호(,)와 소수 이하 첫째 자리까지 표시하려고 한다. 사용자 지정 표시 형식으로 옳은 것은? (예: 1234.56 → 1,234.6, 432 → 432.0)",o:["[자홍][>=5000]#,###.#;[빨강][>=500]#,###.#;#,###.#", "[자홍][>=5000]#,##0.0;[빨강][>=500]#,##0.0", "[자홍][>=5000]#,##0.0;[빨강][>=500]#,##0.0;#,##0.0", "[>=5000]<자홍>#,##0.0;[>=500]<빨강>#,##0.0;#,##0.0"],a:2,e:"사용자 지정 형식은 <b>[조건·색]양수서식;[조건·색]서식;나머지서식</b> 구조로, 색과 조건은 대괄호 [자홍][>=5000] 안에 넣는다. 소수 첫째 자리는 0을 써서 <b>#,##0.0</b>으로 해야 432가 432.0으로 나온다(#,###.#은 432를 432.로 만들어 틀림). 꺾쇠<>로 색을 넣는 문법은 없다. 정답: <b>[자홍][>=5000]#,##0.0;[빨강][>=500]#,##0.0;#,##0.0</b>"},
  {s:"스프레드시트",q:"아래 시트에서 입력값에 주어진 표시 형식을 적용했을 때, [C2]의 결과로 옳은 것은?",o:["2025년 3월", "12.5%", "005", "25.0%"],a:1,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">입력값</td><td class=\"hd\">표시 형식</td><td class=\"hd\">결과</td></tr><tr><td class=\"rh\">2</td><td>0.125</td><td class=\"l\">0.0%</td><td>?</td></tr></table>",e:"백분율 한 자리 → 12.5%"}
 ]},
{ name:'기출 3회', q:[
  {s:"컴퓨터일반",q:"다음 중 저작권과 정보 윤리에 대한 설명으로 옳지 않은 것은?",o:["타인의 저작물을 무단 복제·배포하면 저작권 침해가 될 수 있다.", "출처를 밝히면 어떤 저작물이든 상업적으로 자유롭게 써도 된다.", "오픈 라이선스(CC 등)는 허용 범위 안에서 사용해야 한다.", "개인정보를 함부로 수집·유출하면 안 된다."],a:1,e:"출처를 밝혀도 저작권자의 허락 없이 상업적으로 이용하면 침해가 될 수 있다. 이용 범위는 라이선스·법에 따른다."},
  {s:"컴퓨터일반",q:"다음 중 객체지향에서 '정보 은닉(Information Hiding)'에 대한 설명으로 옳은 것은?",o:["객체 내부의 데이터·구현을 외부에서 직접 접근하지 못하게 숨기는 것", "상위 클래스의 기능을 하위 클래스가 물려받는 것", "하나의 인터페이스로 여러 형태를 처리하는 것", "객체들을 비슷한 특성끼리 묶어 분류하는 것"],a:0,e:"정보 은닉은 객체의 내부 데이터와 구현을 감추고, 공개된 메서드(인터페이스)를 통해서만 접근하도록 하는 캡슐화의 핵심 원리이다."},
  {s:"컴퓨터일반",q:"다음 중 운영체제의 사용자 인터페이스에 대한 설명으로 옳지 않은 것은?",o:["GUI는 아이콘·창 등을 마우스로 조작한다.", "CLI는 명령어를 입력해 조작한다.", "Windows는 대표적인 GUI 기반 운영체제이다.", "GUI는 명령어를 외워야만 사용할 수 있어 초보자에게 어렵다."],a:3,e:"명령어를 외워야 하는 것은 CLI이다. GUI는 그림·아이콘으로 직관적이라 초보자가 쓰기 쉽다."},
  {s:"컴퓨터일반",q:"다음 중 플래시 메모리(Flash Memory)에 대한 설명으로 옳은 것은?",o:["전원이 꺼져도 내용이 보존되는 비휘발성 메모리로 USB 메모리·SSD 등에 쓰인다.", "읽기만 가능하고 한 번 기록하면 내용을 지울 수 없다.", "휘발성 메모리로 주로 캐시에 사용된다.", "자기 디스크의 일종으로 플래터를 회전시켜 데이터를 저장한다."],a:0,e:"플래시 메모리는 EEPROM의 일종으로 비휘발성이며 전기적으로 지우고 다시 쓸 수 있다. SSD·USB 메모리·메모리 카드 등에 쓰인다. 회전 구동부가 없어 자기 디스크와 다르다."},
  {s:"컴퓨터일반",q:"다음 중 그래픽 데이터 표현 방식에 대한 설명으로 옳지 않은 것은?",o:["비트맵은 픽셀의 집합으로 표현하며 확대 시 계단 현상(앨리어싱)이 생긴다.", "벡터는 점·선·곡선의 수식으로 표현해 확대해도 계단 현상이 없다.", "비트맵은 벡터보다 정교하고 다양한 색 표현에 유리하다.", "벡터 방식은 래스터 방식이라고도 하며 화면 표시 속도가 빠르다."],a:3,e:"래스터 방식은 <b>비트맵</b>의 다른 이름이다. 벡터와는 다르다."},
  {s:"컴퓨터일반",q:"다음 중 멀티미디어의 특징에 대한 설명으로 옳지 않은 것은?",o:["디지털화(Digital)하여 통합 처리한다.", "쌍방향(Interactive)으로 상호작용한다.", "여러 매체를 통합(Integration)한다.", "한 방향으로만 정보를 전달한다."],a:3,e:"멀티미디어는 사용자와 '쌍방향(양방향)'으로 상호작용한다. 한 방향 전달은 멀티미디어의 특징이 아니다."},
  {s:"컴퓨터일반",q:"다음 중 정보 보안 수칙으로 옳지 않은 것은?",o:["비밀번호를 주기적으로 변경한다.", "출처가 불분명한 첨부 파일은 실행하지 않는다.", "백신을 최신으로 유지한다.", "아이디·비밀번호를 여러 사이트에 동일하게 사용한다."],a:3,e:"여러 사이트에 같은 비밀번호를 쓰면 한 곳이 유출되면 모두 위험해지므로 피해야 한다."},
  {s:"컴퓨터일반",q:"다음 중 새 하드웨어를 장착했을 때 운영체제가 자동으로 인식하여 설치·구성해 주는 기능을 의미하는 것은?",o:["플러그 앤 플레이", "멀티태스킹", "가상 메모리", "핫 스와핑"],a:0,e:"장치를 꽂으면 자동 인식·설치하는 기능은 <b>플러그 앤 플레이(PnP)</b>다."},
  {s:"컴퓨터일반",q:"다음 중 데이터 전송 방식에 대한 설명으로 옳지 않은 것은?",o:["단방향(Simplex)은 한쪽 방향으로만 전송한다(예: 라디오).", "반이중(Half-Duplex)은 양방향이지만 동시에는 한 방향만 가능하다(예: 무전기).", "전이중(Full-Duplex)은 양방향 동시 전송이 가능하다(예: 전화).", "반이중은 양방향 동시 전송이 가능하다."],a:3,e:"반이중(Half-Duplex)은 양방향이되 '동시에는 한 방향'만 전송한다. 양방향 동시는 전이중(Full-Duplex)이다."},
  {s:"컴퓨터일반",q:"다음 중 Windows 11의 기능에 대한 설명으로 옳지 않은 것은?",o:["작업 표시줄의 '스냅 레이아웃'으로 창을 여러 구역에 정렬 배치할 수 있다.", "'가상 데스크톱'으로 여러 바탕 화면을 만들어 작업을 분리할 수 있다.", "시작 메뉴와 작업 표시줄 아이콘은 기본적으로 가운데(중앙)에 정렬된다.", "Windows 11은 32비트 CPU에서만 설치·실행할 수 있다."],a:3,e:"Windows 11은 <b>64비트 CPU에서만</b> 설치된다(32비트 미지원)."},
  {s:"컴퓨터일반",q:"다음 중 기억장치의 접근 속도가 빠른 것부터 느린 순서로 바르게 나열한 것은?",o:["레지스터 > 캐시 > 주기억장치 > 보조기억장치", "캐시 > 레지스터 > 보조기억장치 > 주기억장치", "주기억장치 > 캐시 > 레지스터 > 보조기억장치", "보조기억장치 > 주기억장치 > 캐시 > 레지스터"],a:0,e:"속도는 레지스터 > 캐시 > 주기억장치(RAM) > 보조기억장치(HDD/SSD) 순으로, CPU에 가까울수록 빠르고 용량은 작다."},
  {s:"컴퓨터일반",q:"다음 중 네트워크 장비에 대한 설명으로 옳지 않은 것은?",o:["허브는 여러 대의 컴퓨터를 연결하는 집선 장치이다.", "라우터는 서로 다른 네트워크 간 최적 경로를 설정한다.", "게이트웨이는 프로토콜이 다른 네트워크를 연결한다.", "리피터는 서로 다른 프로토콜을 변환해 준다."],a:3,e:"리피터는 약해진 신호를 재생·증폭하는 장비이다. 서로 다른 프로토콜을 변환·연결하는 것은 게이트웨이이다."},
  {s:"컴퓨터일반",q:"다음 중 저장장치의 특성에 대한 설명으로 옳지 않은 것은?",o:["SSD는 HDD보다 읽기·쓰기 속도가 빠르다.", "USB 메모리는 플래시 메모리를 사용한다.", "광학 디스크(CD/DVD)는 레이저로 데이터를 기록·판독한다.", "HDD는 전원이 꺼지면 데이터가 모두 사라진다."],a:3,e:"HDD는 비휘발성으로 전원이 꺼져도 데이터가 보존된다."},
  {s:"컴퓨터일반",q:"다음 중 컴퓨터 바이러스 예방·대응으로 옳지 않은 것은?",o:["중요한 자료는 주기적으로 백업한다.", "백신으로 정기 검사를 수행한다.", "의심스러운 링크는 클릭하지 않는다.", "바이러스에 감염되면 즉시 백업본까지 덮어써서 교체한다."],a:3,e:"감염 상태에서 백업본을 덮어쓰면 백업까지 손상될 수 있다. 감염을 먼저 치료·격리해야 한다."},
  {s:"컴퓨터일반",q:"다음 중 자료의 크기 단위를 작은 것부터 큰 순서로 바르게 나열한 것은?",o:["니블(Nibble) < 바이트(Byte) < 워드(Word) < 필드(Field) < 레코드(Record)", "비트(Bit) < 워드(Word) < 바이트(Byte) < 레코드(Record) < 필드(Field)", "바이트(Byte) < 비트(Bit) < 니블(Nibble) < 필드(Field) < 파일(File)", "필드(Field) < 레코드(Record) < 바이트(Byte) < 워드(Word) < 파일(File)"],a:0,e:"자료 표현 단위는 비트 < 니블(4비트) < 바이트(8비트) < 워드 순이고, 자료 구성 단위는 필드(항목) < 레코드 < 파일 < 데이터베이스 순이다. ①이 이 순서를 바르게 나열했다."},
  {s:"컴퓨터일반",q:"다음 중 소프트웨어의 사용권(라이선스)에 대한 설명으로 옳지 않은 것은?",o:["프리웨어는 무료로 사용할 수 있는 소프트웨어이다.", "셰어웨어는 일정 기간·기능을 체험한 뒤 구매하는 방식이다.", "상용 소프트웨어는 정당한 대가를 지불하고 사용한다.", "공개 소프트웨어는 반드시 소스 코드를 숨겨야 한다."],a:3,e:"공개(오픈) 소프트웨어는 소스 코드를 '공개'하여 누구나 보고 수정·배포할 수 있다. 숨겨야 한다는 설명은 틀리다."},
  {s:"컴퓨터일반",q:"다음 중 가로 800픽셀 × 세로 720픽셀, 한 픽셀을 24비트로 표현하는 비압축 비트맵 이미지의 용량으로 옳은 것은? (1KB=1,024Byte)",o:["40,500KB", "3,375KB", "1,688KB", "562KB"],a:2,e:"비트맵 용량 = 가로×세로×색 깊이(비트)÷8 = 800×720×24÷8 = <b>1,728,000 Byte</b> ≒ 1,688KB."},
  {s:"컴퓨터일반",q:"다음 중 샘플링 22kHz, 양자화 16비트, 스테레오(2채널)로 30초간 녹음한 비압축 디지털 오디오의 용량으로 가장 가까운 것은?",o:["약 2.5MB", "약 5.0MB", "약 1.3MB", "약 40.3MB"],a:0,e:"오디오 용량 = 샘플링 주파수 × (양자화 비트÷8) × 채널 수 × 시간 = 22,000 × 2 × 2 × 30 = <b>2,640,000 Byte</b> ≒ 약 2.5MB."},
  {s:"컴퓨터일반",q:"다음 두 8비트 값에 비트 단위 AND 연산을 수행한 결과로 옳은 것은?\n\n10011111 AND 01100000",o:["01100000", "11111111", "00000000", "0"],a:2,e:"비트 AND은 각 자리에서 둘 다 1일 때만 1 → <b>00000000</b>."},
  {s:"컴퓨터일반",q:"다음은 7비트 ASCII 코드에 홀수 패리티 비트를 '오른쪽 끝 1비트'로 붙인 8비트 코드이다. 전송 중 오류가 발생한(패리티가 어긋난) 것은?",o:["00001110", "10001111", "10101111", "00010110"],a:2,e:"홀수 패리티는 8비트 전체에서 1의 개수가 홀수가 되도록 패리티 비트를 정한다. 정답 코드 <b>10101111</b>는 1의 개수가 6개로 홀수가 아니어서 오류이다. (패리티 비트는 1비트 오류의 '발생 여부'만 검출하고 위치는 못 찾는다.)"},
  {s:"스프레드시트",q:"다음 중 [찾기 및 바꾸기]의 와일드카드·물결표 사용에 대한 설명으로 옳지 않은 것은?",o:["*는 임의의 여러 문자를 대신한다.", "?는 임의의 한 문자를 대신한다.", "물결표 자체(~)를 찾으려면 ~~ 로 입력한다.", "물음표 문자 그대로를 찾으려면 ??로 입력한다."],a:3,e:"물음표(?)를 '문자 그대로' 찾으려면 ~? 로 입력한다. ??는 '임의의 두 글자'를 뜻해 의미가 다르다. *=여러 문자, ?=한 문자, ~~=물결표 자체."},
  {s:"스프레드시트",q:"다음 중 조건부 서식에 대한 설명으로 옳지 않은 것은?",o:["규칙을 여러 개 지정할 수 있고, 여러 규칙이 참이면 우선순위 높은 규칙부터 적용하되 '참이면 중지'를 둘 수 있다.", "수식 규칙에서 혼합·절대 참조로 행·열 전체에 서식을 줄 수 있다.", "조건을 더 이상 만족하지 않게 되어도 지정한 서식은 그대로 남는다.", "셀 값·수식·데이터 막대·색조·아이콘 집합을 기준으로 지정할 수 있다."],a:2,e:"조건 불충족 시 서식은 <b>자동 해제</b>되고 값만 남는다."},
  {s:"스프레드시트",q:"다음 중 매크로 실행 방법으로 옳지 않은 것은?",o:["[개발 도구]-[매크로]에서 선택해 실행한다.", "지정한 바로 가기 키로 실행한다.", "도형·단추(양식 컨트롤)에 매크로를 연결해 클릭으로 실행한다.", "매크로는 반드시 파일을 닫았다 다시 열어야만 실행된다."],a:3,e:"매크로는 <b>언제든 바로 실행</b>할 수 있다(파일을 닫을 필요 없음)."},
  {s:"스프레드시트",q:"다음 중 셀 서식 표시 형식 코드의 결과로 옳지 않은 것은?",o:["형식 0.0%에 0.5를 입력하면 50.0%로 표시된다.", "형식 #,##0에 2500을 입력하면 2,500으로 표시된다.", "형식 0;;에 양수 외의 값을 입력하면 0과 텍스트는 표시되지 않는다.", "형식 yyyy-mm-dd(aaaa)에 날짜를 입력하면 요일이 '월요일'이 아닌 '월'로 표시된다."],a:3,e:"aaaa는 <b>'월요일'(긴 요일)</b>, aaa는 '월'(짧은 요일)이다. 지문은 반대로 설명했다."},
  {s:"스프레드시트",q:"다음 중 머리글/바닥글 설정에 대한 설명으로 옳지 않은 것은?",o:["페이지 번호·전체 페이지 수·날짜·시간·파일 이름·시트 이름을 넣을 수 있다.", "그림을 삽입하고 서식을 지정할 수 있다.", "머리글/바닥글은 각 페이지마다 다르게 '첫 페이지를 다르게' 지정할 수 있다.", "머리글/바닥글의 내용은 워크시트 셀에도 똑같이 표시된다."],a:3,e:"머리글/바닥글은 <b>인쇄 시에만</b> 나타나며 워크시트 셀에는 표시되지 않는다."},
  {s:"스프레드시트",q:"다음 중 차트의 추세선에 대한 설명으로 옳지 않은 것은?",o:["추세선은 변화 추세를 파악·예측하는 선으로 회귀 분석이라고도 한다.", "추세선에 사용된 수식을 차트에 함께 표시할 수 있다.", "비누적 2차원 막대형·꺾은선형·분산형·거품형 등에 추가할 수 있다.", "원형·도넛형·방사형·표면형·3차원 차트에도 추세선을 추가할 수 있다."],a:3,e:"원형·도넛형·방사형·표면형·누적 영역형·<b>3차원에는 추세선을 추가할 수 없다</b>."},
  {s:"스프레드시트",q:"다음 중 조건부 서식 규칙에 대한 설명으로 옳지 않은 것은?",o:["규칙 목록에서 더 위쪽에 있는 규칙일수록 우선순위가 높다", "서식 항목이 서로 겹치지 않으면 여러 규칙이 동시에 적용될 수 있다", "같은 서식 항목이 충돌하면 우선순위가 낮은 규칙이 우선 적용된다", "'이 규칙이 참이면 중지'를 체크하면 하위 순위 규칙은 검사하지 않는다"],a:2,e:"서식 항목이 충돌하면 우선순위가 높은(목록 위쪽) 규칙이 적용되고 나머지는 무시된다. 다음 중 조건부 서식 규칙에 대한 설명으로 옳지 않은 것은?"},
  {s:"스프레드시트",q:"다음 중 콤보(혼합형)·이중 축 차트에 대한 설명으로 옳지 않은 것은?",o:["콤보 차트는 두 개 이상의 차트 종류를 결합하며 보조 축과 함께 표시할 수 있다.", "데이터 계열 간 값 차이가 크거나 단위가 다를 때 이중 축(보조 축)을 쓴다.", "보조 축은 계열을 선택한 뒤 [데이터 계열 서식]에서 '보조 축'으로 지정한다.", "콤보(혼합형) 차트는 3차원으로도 자유롭게 작성할 수 있다."],a:3,e:"콤보(혼합형) 차트는 <b>3차원으로 작성할 수 없다</b>(2차원만)."},
  {s:"스프레드시트",q:"다음 중 수식의 실행 결과가 옳지 않은 것은?",o:["=MOD(6,4) → 2", "=TRUNC(-4) → -5", "=ROUND(419.737,2) → 419.74", "=INT(-1.2) → -2"],a:1,e:"=TRUNC(-4)의 올바른 결과는 -4이다. (INT=내림, TRUNC=절사, MOD=n-d×INT(n/d), ROUND=반올림)"},
  {s:"스프레드시트",q:"아래 표에서 전체 판매 금액(수량×단가의 합계)을 한 번에 구하려고 한다. 가장 적절한 수식은? (참고: 총액 242,000원)",o:["=SUMPRODUCT(B2:B5+C2:C5)", "=SUM(B2:B5*C2:C5)", "=SUM(B2:B5)*SUM(C2:C5)", "=SUMPRODUCT(B2:B5,C2:C5)"],a:3,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">품목</td><td class=\"hd\">수량</td><td class=\"hd\">단가</td></tr><tr><td class=\"rh\">2</td><td>지우개</td><td>3</td><td>4,000</td></tr><tr><td class=\"rh\">3</td><td>자</td><td>7</td><td>11,000</td></tr><tr><td class=\"rh\">4</td><td>풀</td><td>9</td><td>11,000</td></tr><tr><td class=\"rh\">5</td><td>연필</td><td>9</td><td>6,000</td></tr></table>",e:"<b>SUMPRODUCT(배열1, 배열2)</b>는 대응하는 원소끼리 곱한 뒤 모두 더한다 → <b>242,000</b>원. =SUM(B*C)는 일반 입력 시 배열이 아니라 오류/단일값이 되고(배열 입력해야 함), SUM(B)*SUM(C)는 합끼리 곱해 의미가 다르다."},
  {s:"스프레드시트",q:"셀 [A1:A9]에 다음 값이 입력되어 있다: 31, 38, 43, 51, 52, 65, 74, 81, 94\n다음 수식(제3사분위수)의 결과로 옳은 것은?\n\n=QUARTILE.INC(A1:A9, 3)",o:["74", "73", "75", "81"],a:0,e:"QUARTILE.INC(범위, 3)는 제3사분위수(하위 75% 지점)를 구하며 PERCENTILE.INC(범위,0.75)와 같다. 정렬된 값에서 결과는 <b>74</b>이다."},
  {s:"스프레드시트",q:"아래 시트에서 입력값에 주어진 표시 형식을 적용했을 때, [C2]의 결과로 옳은 것은?",o:["2025년 3월", "크다", "1,235", "(1,500)"],a:0,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">입력값</td><td class=\"hd\">표시 형식</td><td class=\"hd\">결과</td></tr><tr><td class=\"rh\">2</td><td>2025-03-05</td><td class=\"l\">yyyy\"년\" m\"월\"</td><td>?</td></tr></table>",e:"연·월 서식 적용"},
  {s:"스프레드시트",q:"셀 값이 1,000 이상이면 '녹색', 1,000 미만 500 이상이면 '빨강', 500 미만이면 색을 지정하지 않고, 모든 구간에서 천 단위 구분 기호(,)와 소수 이하 첫째 자리까지 표시하려고 한다. 사용자 지정 표시 형식으로 옳은 것은? (예: 1234.56 → 1,234.6, 432 → 432.0)",o:["[녹색][>=1000]#,##0.0;[빨강][>=500]#,##0.0", "[녹색][>=1000]#,###.#;[빨강][>=500]#,###.#;#,###.#", "[녹색][>=1000]#,##0.0;[빨강][>=500]#,##0.0;#,##0.0", "[>=1000]<녹색>#,##0.0;[>=500]<빨강>#,##0.0;#,##0.0"],a:2,e:"사용자 지정 형식은 <b>[조건·색]양수서식;[조건·색]서식;나머지서식</b> 구조로, 색과 조건은 대괄호 [녹색][>=1000] 안에 넣는다. 소수 첫째 자리는 0을 써서 <b>#,##0.0</b>으로 해야 432가 432.0으로 나온다(#,###.#은 432를 432.로 만들어 틀림). 꺾쇠<>로 색을 넣는 문법은 없다. 정답: <b>[녹색][>=1000]#,##0.0;[빨강][>=500]#,##0.0;#,##0.0</b>"},
  {s:"스프레드시트",q:"셀 값이 1,000 이상이면 '자홍', 1,000 미만 800 이상이면 '녹색', 800 미만이면 색을 지정하지 않고, 모든 구간에서 천 단위 구분 기호(,)와 소수 이하 첫째 자리까지 표시하려고 한다. 사용자 지정 표시 형식으로 옳은 것은? (예: 1234.56 → 1,234.6, 432 → 432.0)",o:["[자홍][>=1000]#,##0.0;[녹색][>=800]#,##0.0;#,##0.0", "[>=1000]<자홍>#,##0.0;[>=800]<녹색>#,##0.0;#,##0.0", "[자홍][>=1000]#,##0.0;[녹색][>=800]#,##0.0", "[자홍][>=1000]#,###.#;[녹색][>=800]#,###.#;#,###.#"],a:0,e:"사용자 지정 형식은 <b>[조건·색]양수서식;[조건·색]서식;나머지서식</b> 구조로, 색과 조건은 대괄호 [자홍][>=1000] 안에 넣는다. 소수 첫째 자리는 0을 써서 <b>#,##0.0</b>으로 해야 432가 432.0으로 나온다(#,###.#은 432를 432.로 만들어 틀림). 꺾쇠<>로 색을 넣는 문법은 없다. 정답: <b>[자홍][>=1000]#,##0.0;[녹색][>=800]#,##0.0;#,##0.0</b>"},
  {s:"스프레드시트",q:"다음 중 SUBSTITUTE 함수를 사용한 수식의 실행 결과로 옳은 것은?\n\n=SUBSTITUTE(\"52-17-61-32\",\"-\",\".\")",o:["52.17.61-32", "52-17-61-32", "52.17.61.32", "52.17-61-32"],a:2,e:"SUBSTITUTE(문자열, 찾을값, 바꿀값)에서 네 번째 인수를 생략하면 '-'를 <b>모두</b> '.'로 바꾼다 → <b>52.17.61.32</b>."},
  {s:"스프레드시트",q:"다음 중 REPT 함수로 문자를 반복한 결과로 옳은 것은?\n\n=REPT(\"★\",4)&REPT(\"☆\",5-4)",o:["★☆☆☆☆", "★★★★☆", "★★★★", "★★★★★"],a:1,e:"★를 4번, ☆를 1번 이어 붙여 5칸 별점을 만든다 → ★★★★☆"},
  {s:"스프레드시트",q:"아래 시트에서 부서가 '총무부'인 직원의 급여 합계를 [F2]에 구하려 한다. 입력할 수식으로 옳은 것은?",o:["=DSUM(B2:B4,\"총무부\",D2:D4)", "=SUMIF(B2:B4,\"총무부\",D2:D4)", "=COUNTIF(B2:B4,\"총무부\")", "=SUMIF(D2:D4,\"총무부\",B2:B4)"],a:1,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">이름</td><td class=\"hd\">부서</td><td class=\"hd\">직급</td><td class=\"hd\">급여</td></tr><tr><td class=\"rh\">2</td><td>이두리</td><td class=\"l\">기획부</td><td>대리</td><td>2,400,000</td></tr><tr><td class=\"rh\">3</td><td>한소라</td><td class=\"l\">기획부</td><td>사원</td><td>4,600,000</td></tr><tr><td class=\"rh\">4</td><td>박세찬</td><td class=\"l\">총무부</td><td>사원</td><td>4,100,000</td></tr></table>",e:"SUMIF(<b>조건범위, 조건, 합계범위</b>) → 부서(B)에서 '총무부'를 찾아 급여(D)를 더한다."},
  {s:"스프레드시트",q:"다음 중 날짜 함수 수식의 실행 결과로 옳은 것은?\n\n=EOMONTH(\"2025-04-20\",2)",o:["2025-06-29", "2025-06-01", "2025-04-20", "2025-06-30"],a:3,e:"EOMONTH은 2개월 뒤 달의 '마지막 날'을 반환한다 → <b>2025-06-30</b>."},
  {s:"스프레드시트",q:"셀 [A1:A5]에 다음 값이 입력되어 있다: 13, 15, 23, 44, 63\n다음 수식(75% 지점(백분위수))의 결과로 옳은 것은?\n\n=PERCENTILE.INC(A1:A5, 0.75)",o:["44", "43", "63", "45"],a:0,e:"PERCENTILE.INC(범위, 0.75)는 데이터를 오름차순 정렬했을 때 하위 75% 위치의 값을 구한다. 정렬된 5개 값에서 그 위치의 값은 <b>44</b>이다."},
  {s:"스프레드시트",q:"왼쪽 기준표([F2:G6], 오름차순)를 이용해 점수 54점의 등급을 구하려고 한다. 가장 적절한 수식은? (구간의 최저점 이상이면 해당 등급)",o:["=VLOOKUP(54,$F$2:$G$6,2,TRUE)", "=VLOOKUP(54,$F$2:$G$6,2,FALSE)", "=HLOOKUP(54,$F$2:$G$6,2,TRUE)", "=VLOOKUP(54,$F$2:$G$6,2,0)"],a:0,fig:"<table class=\"xg\"><tr><th></th><th>F</th><th>G</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">기준점수</td><td class=\"hd\">등급</td></tr><tr><td class=\"rh\">2</td><td>0</td><td class=\"l\">F</td></tr><tr><td class=\"rh\">3</td><td>60</td><td class=\"l\">D</td></tr><tr><td class=\"rh\">4</td><td>70</td><td class=\"l\">C</td></tr><tr><td class=\"rh\">5</td><td>80</td><td class=\"l\">B</td></tr><tr><td class=\"rh\">6</td><td>90</td><td class=\"l\">A</td></tr></table>",e:"구간(범위) 조회는 네 번째 인수를 <b>TRUE(생략 가능, 근사일치)</b>로 두고 기준표가 <b>오름차순</b>이어야 한다. 54점 → <b>F</b>등급. FALSE(정확히 일치)는 기준표에 없는 값이면 #N/A가 난다."}
 ]},
{ name:'기출 4회', q:[
  {s:"컴퓨터일반",q:"다음 중 컴퓨터 시스템의 구성에서 소프트웨어에 대한 설명으로 옳은 것은?",o:["소프트웨어는 하드웨어를 동작시키는 프로그램과 데이터를 말한다.", "소프트웨어는 손으로 만질 수 있는 물리적 장치이다.", "CPU·RAM·HDD는 소프트웨어에 해당한다.", "소프트웨어는 전원이 없어도 스스로 작동한다."],a:0,e:"소프트웨어는 하드웨어를 동작시키는 프로그램·데이터를 뜻한다. CPU·RAM·HDD 등 물리 장치는 하드웨어이다."},
  {s:"컴퓨터일반",q:"다음 중 AI 관련 용어에 대한 설명으로 옳지 않은 것은?",o:["챗봇은 자연어로 사람과 대화하도록 만든 프로그램이다.", "컴퓨터 비전은 이미지·영상을 인식·분석하는 AI 분야다.", "자연어 처리(NLP)는 사람의 언어를 컴퓨터가 이해·생성하도록 하는 기술이다.", "사물 인터넷(IoT)은 인간의 뇌 신경망을 본떠 학습하는 AI 알고리즘이다."],a:3,e:"뇌 신경망을 본뜬 것은 <b>인공 신경망</b>이다. IoT는 사물을 인터넷으로 연결하는 기술이다."},
  {s:"컴퓨터일반",q:"다음 중 펌웨어(Firmware)에 대한 설명으로 옳은 것은?",o:["하드웨어 제어를 위해 ROM 등에 저장된 소프트웨어로, 하드웨어와 소프트웨어의 중간 성격을 갖는다.", "주기억장치에 적재되어 실행되는 응용 프로그램이다.", "인터프리터 방식으로 번역되어 실행된다.", "전원이 꺼지면 사라지는 휘발성 프로그램이다."],a:0,e:"펌웨어는 ROM·플래시 메모리에 저장되어 하드웨어를 제어하는 소프트웨어로, 소프트웨어를 업그레이드하여 기능을 향상시킬 수 있는 하드웨어·소프트웨어의 중간적 성격을 가진다(비휘발성)."},
  {s:"컴퓨터일반",q:"다음 중 언어 번역 프로그램에 대한 설명으로 옳지 않은 것은?",o:["컴파일러는 원시 프로그램 전체를 한 번에 번역해 목적 프로그램을 만든다.", "인터프리터는 원시 프로그램을 한 줄씩 해석·실행하며 목적 프로그램을 만들지 않는다.", "어셈블러는 어셈블리어를 기계어로 번역한다.", "인터프리터는 컴파일러보다 실행 속도가 빠르고 번역 속도는 느리다."],a:3,e:"인터프리터는 <b>실행 속도가 느리다</b>(한 줄씩 해석). 번역(준비)은 빠르지만 실행이 느리다."},
  {s:"컴퓨터일반",q:"다음 중 오디오·비디오 파일 형식에 대한 설명으로 옳은 것은?",o:["MIDI는 실제 소리를 녹음해 저장하므로 파일 크기가 크다.", "MP3는 사람이 잘 듣지 못하는 음을 제거하는 손실 압축을 사용한다.", "WAV는 연주 정보만 저장해 용량이 매우 작다.", "MPEG은 이미지 전용 무손실 압축 표준이다."],a:1,e:"MP3는 사람이 잘 인지하지 못하는 소리를 제거하는 손실 압축으로 용량을 크게 줄인다. MIDI는 연주 정보만 저장(작음), WAV는 실제 소리 녹음(큼), MPEG은 동영상 손실 압축 표준이다."},
  {s:"컴퓨터일반",q:"다음 중 바이러스 예방 및 대처로 옳지 않은 것은?",o:["출처가 불분명한 메일의 첨부 파일은 열지 않는다.", "백신 프로그램을 최신 버전으로 유지하고 정기 검사한다.", "중요 자료는 정기적으로 백업한다.", "감염 속도를 늦추기 위해 백신의 실시간 감시 기능은 꺼 둔다."],a:3,e:"실시간 감시는 <b>켜 두어야</b> 감염을 예방할 수 있다."},
  {s:"컴퓨터일반",q:"다음 중 캐시 메모리(Cache Memory)에 대한 설명으로 옳지 않은 것은?",o:["CPU와 주기억장치의 속도 차이를 줄이기 위한 고속 버퍼 기억장치이다.", "주로 접근 속도가 빠른 SRAM으로 구성한다.", "캐시 적중률(Hit Ratio)이 높을수록 전체 처리 속도가 빨라진다.", "용량이 매우 커서 주기억장치를 대체할 목적으로 사용한다."],a:3,e:"캐시는 용량은 작지만 속도가 매우 빠른 보조적 기억장치로, 주기억장치를 대체하는 것이 아니라 속도 차이를 완화한다. SRAM으로 구성하며 적중률이 높을수록 성능이 좋아진다."},
  {s:"컴퓨터일반",q:"다음 중 그래픽 파일 형식에 대한 설명으로 옳지 않은 것은?",o:["JPG(JPEG)는 손실 압축을 사용하며 사진 등 자연 영상에 적합하다.", "GIF는 256색으로 제한되며 무손실 압축과 애니메이션을 지원한다.", "PNG는 무손실 압축과 투명(알파 채널)을 지원한다.", "GIF는 1,600만 색 이상을 표현하는 손실 압축 방식이다."],a:3,e:"GIF는 <b>256색·무손실</b>이다. 1,600만 색은 JPG·PNG의 특징이다."},
  {s:"컴퓨터일반",q:"다음 중 네트워크 접속 형태(토폴로지)에 대한 설명으로 옳지 않은 것은?",o:["성형(Star)은 중앙 장치에 각 노드를 연결하며 중앙 고장 시 전체가 마비된다.", "버스형(Bus)은 하나의 통신 회선에 여러 노드를 연결한다.", "링형(Ring)은 각 노드가 원형으로 연결된다.", "망형(Mesh)은 노드가 적고 구성이 단순해 소규모에 적합하다."],a:3,e:"망형은 모든 노드를 서로 연결해 <b>회선이 많고 복잡</b>하지만 신뢰성이 높다(대규모·기간망)."},
  {s:"컴퓨터일반",q:"다음 중 Windows에서 '디스크 정리'로 삭제할 수 있는 대상이 아닌 것은?",o:["임시 인터넷 파일", "휴지통의 파일", "다운로드한 프로그램 파일", "현재 실행 중인 운영체제 커널"],a:3,e:"디스크 정리는 임시 파일·휴지통·임시 인터넷 파일·썸네일 등 불필요한 파일을 지워 공간을 확보한다. 실행 중인 운영체제 핵심 파일은 삭제 대상이 아니다."},
  {s:"컴퓨터일반",q:"다음 중 사용자의 명령을 해석하여 커널에 전달하는, 사용자와 운영체제 사이의 인터페이스를 의미하는 것은?",o:["셸(Shell)", "커널", "BIOS", "레지스트리"],a:0,e:"명령을 해석해 커널에 전달하는 것은 <b>셸</b>이다."},
  {s:"컴퓨터일반",q:"다음 중 객체지향 프로그래밍(OOP)의 특징에 대한 설명으로 옳지 않은 것은?",o:["캡슐화는 데이터와 함수를 하나로 묶고 내부 구현을 숨긴다.", "상속은 상위 클래스의 속성·메서드를 하위 클래스가 물려받는 것이다.", "다형성은 같은 이름의 메서드가 상황에 따라 다르게 동작하는 것이다.", "추상화는 프로그램을 순차적 명령의 나열로 구성하는 것이다."],a:3,e:"추상화는 복잡한 대상에서 '핵심적인 요소만 뽑아 단순화'하는 것이다. 순차적 명령의 나열은 절차지향의 특징이다. OOP 특징: 추상화·캡슐화·정보 은닉·상속·다형성."},
  {s:"컴퓨터일반",q:"다음에서 설명하는 머신러닝 학습 방법으로 옳은 것은?\n\n입력 데이터에 정답(레이블)을 함께 제공하여 입력과 정답의 관계를 학습하고, 새로운 입력에 대한 결과를 예측하도록 한다.",o:["지도 학습", "비지도 학습", "강화 학습", "전이 학습"],a:0,e:"정답(레이블)을 주고 관계를 학습하는 것은 <b>지도 학습</b>이다."},
  {s:"컴퓨터일반",q:"다음 중 동영상의 품질·용량에 영향을 주는 요소에 대한 설명으로 옳지 않은 것은?",o:["해상도가 높을수록 화질이 좋아지고 용량이 커진다.", "초당 프레임 수(fps)가 많을수록 움직임이 부드럽고 용량이 커진다.", "색 깊이(비트)가 클수록 표현 색상이 많아지고 용량이 커진다.", "압축률을 높일수록 화질이 좋아지고 용량도 커진다."],a:3,e:"압축률을 높이면 용량은 줄지만(손실 압축의 경우) 화질은 오히려 떨어질 수 있다. 해상도·fps·색 깊이가 클수록 품질과 용량이 함께 커진다."},
  {s:"컴퓨터일반",q:"다음 중 Windows 11에서 캡처 도구를 실행하는 바로 가기 키로 옳은 것은?",o:["Win+Shift+S", "Win+Ctrl+S", "Alt+PrtSc", "Win+Shift+C"],a:0,e:"<b>Win+Shift+S</b>를 누르면 캡처 도구가 실행되어 사각형·자유형·창·전체 화면 중 선택해 캡처하고 클립보드에 저장한다. Alt+PrtSc는 현재 '활성 창'만 클립보드로 캡처한다."},
  {s:"컴퓨터일반",q:"다음 중 유틸리티 프로그램에 해당하지 않는 것은?",o:["압축 프로그램", "백신 프로그램", "디스크 조각 모음", "운영체제(OS)"],a:3,e:"운영체제는 시스템 소프트웨어이며 유틸리티가 아니다. 압축·백신·조각 모음 등은 작업을 돕는 유틸리티이다."},
  {s:"컴퓨터일반",q:"다음 중 샘플링 44kHz, 양자화 16비트, 스테레오(2채널)로 10초간 녹음한 비압축 디지털 오디오의 용량으로 가장 가까운 것은?",o:["약 3.4MB", "약 0.8MB", "약 1.7MB", "약 26.9MB"],a:2,e:"오디오 용량 = 샘플링 주파수 × (양자화 비트÷8) × 채널 수 × 시간 = 44,000 × 2 × 2 × 10 = <b>1,760,000 Byte</b> ≒ 약 1.7MB."},
  {s:"컴퓨터일반",q:"다음 중 8비트 2진수 00011010의 2의 보수로 옳은 것은?",o:["11100110", "00011001", "11100101", "00011011"],a:0,e:"2의 보수 = 1의 보수(비트 반전=11100101) + 1 = <b>11100110</b>."},
  {s:"컴퓨터일반",q:"다음 중 가로 1024픽셀 × 세로 768픽셀, 한 픽셀을 24비트로 표현하는 비압축 비트맵 이미지의 용량으로 옳은 것은? (1KB=1,024Byte)",o:["768KB", "2,304KB", "4,608KB", "55,296KB"],a:1,e:"비트맵 용량 = 가로×세로×색 깊이(비트)÷8 = 1024×768×24÷8 = <b>2,359,296 Byte</b> ≒ 2,304KB."},
  {s:"컴퓨터일반",q:"다음 중 주소선(주소 버스)이 10개인 시스템이 직접 지정할 수 있는 최대 기억 공간(워드 수)으로 옳은 것은?",o:["2,048", "512", "1,024", "10,240"],a:2,e:"주소선 n개로 2ⁿ개의 주소를 지정한다 → 2^10 = <b>1,024</b>개."},
  {s:"스프레드시트",q:"다음 중 그림의 고급 필터 조건에 대한 해석으로 옳은 것은?",o:["직위가 '대리'이고 급여가 300 이상인 데이터", "직위가 '대리'이거나 급여가 300 이상인 데이터", "직위가 '대리'이고 급여가 300 이하인 데이터", "직위가 '대리'이거나 급여가 300 이하인 데이터"],a:1,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">직위</td><td class=\"hd\">급여</td></tr><tr><td class=\"rh\">2</td><td class=\"l\">대리</td><td></td></tr><tr><td class=\"rh\">3</td><td></td><td class=\"l\">>=300</td></tr></table>",e:"조건을 <b>서로 다른 행</b>에 두면 <b>OR</b>로 결합된다. 같은 행이면 AND다."},
  {s:"스프레드시트",q:"다음 중 엑셀 정렬에 대한 설명으로 옳지 않은 것은?",o:["정렬 기준은 최대 64개까지, 기본 방향은 위→아래이나 옵션에서 왼쪽→오른쪽으로 바꿀 수 있다.", "오름차순에서 빈 셀은 형식과 관계없이 항상 맨 뒤에 온다.", "글꼴 색·셀 색·조건부 서식 아이콘 기준으로도 정렬할 수 있다.", "오름차순 정렬 시 논리값은 숫자보다 앞에 온다."],a:3,e:"오름차순 순서는 <b>숫자<문자<논리값<오류값<빈 셀</b>. 논리값은 숫자보다 뒤다."},
  {s:"스프레드시트",q:"다음 중 시트 보호에 대한 설명으로 옳은 것은?",o:["시트 보호 해제 암호는 반드시 설정해야 한다", "시트를 보호해도 셀 서식의 '잠금' 해제된 셀은 편집할 수 있다", "시트 보호는 통합 문서 전체에 자동으로 적용된다", "시트 보호 중에는 어떤 셀도 값을 입력할 수 없다"],a:1,e:"시트 보호 전에 [셀 서식]-[보호] 탭에서 '잠금'을 해제해 둔 셀은, 시트를 보호해도 값을 입력·수정할 수 있다. 암호 설정은 필수가 아닌 선택사 항이다. 77. 시트가 보호된 상태에서 특정 셀(D5)만 값을 수정할 수 있게 하려면, 시트 보호를 설정하기 전에 반드시 선행되어야 하는 작업으로 옳은 것 은?"},
  {s:"스프레드시트",q:"다음 중 그림과 같은 [정렬]에 대한 설명으로 옳지 않은 것은?",o:["정렬 기준을 여러 개 추가해 1차·2차 기준으로 정렬할 수 있다.", "정렬 기준을 값·셀 색·글꼴 색·조건부 서식 아이콘으로 지정할 수 있다.", "'내 데이터에 머리글 표시'를 체크하면 첫 행을 정렬에서 제외한다.", "정렬 기준은 최대 3개까지만 추가할 수 있다."],a:3,fig:"<div class=\"dlg\"><div class=\"tb\"><span>정렬</span><span class=\"x\">? ✕</span></div><div class=\"bd\"><div class=\"row\"><span>기준 추가</span><span class=\"sel\">열 / 정렬 기준 / 정렬</span></div><div class=\"row\"><span>열(C):</span><span class=\"sel\">부서</span></div><div class=\"row\"><span>정렬 기준:</span><span class=\"sel\">셀 값</span></div><div class=\"row\"><span>정렬:</span><span class=\"sel\">오름차순</span></div><div class=\"btns\"><span class=\"btn pri\">확인</span><span class=\"btn\">취소</span></div></div></div>",e:"정렬 기준은 <b>최대 64개</b>까지 추가할 수 있다."},
  {s:"스프레드시트",q:"다음 중 [찾기 및 바꾸기]에서 별표(*)가 들어간 '문자 그대로의 *'를 찾으려고 할 때 입력 방법으로 옳은 것은?",o:["~* 로 입력한다", "** 로 입력한다", "\\* 로 입력한다", "'*' 로 입력한다"],a:0,e:"엑셀에서 *와 ?는 와일드카드(여러 문자·한 문자)로 쓰인다. 이 기호를 '문자 그대로' 찾으려면 앞에 물결표(~)를 붙여 ~*, ~? 로 입력한다. 물결표 자체는 ~~ 로 찾는다."},
  {s:"스프레드시트",q:"다음 수식의 실행 결과로 옳은 것은?\n\n=IFS(A1>=90,\"A\",A1>=80,\"B\",A1>=70,\"C\",TRUE,\"F\")   (단, [A1]=85)",o:["A", "B", "C", "F"],a:1,e:"85는 90 미만·80 이상이므로 두 번째 조건이 참 → <b>'B'</b>를 반환한다."},
  {s:"스프레드시트",q:"다음 중 차트의 데이터 계열 서식에 대한 설명으로 옳지 않은 것은?",o:["계열마다 채우기 색·테두리를 다르게 지정할 수 있다.", "특정 계열만 선택해 보조 축으로 보낼 수 있다.", "데이터 계열의 겹치기·간격 너비를 조절할 수 있다(막대형).", "차트의 한 계열에만 추세선을 추가하는 것은 불가능하다."],a:3,e:"특정 <b>한 계열에만 추세선</b>을 추가할 수 있다."},
  {s:"스프레드시트",q:"다음 중 그림과 같은 [데이터 유효성 검사]에 대한 설명으로 옳지 않은 것은?",o:["입력 값을 목록·정수·날짜·텍스트 길이·사용자 지정 등으로 제한할 수 있다.", "오류 스타일은 중지(빨강 X)·경고(노랑 △)·정보(파랑 i) 세 가지다.", "유효성 검사를 설정하면 이미 입력된 잘못된 데이터도 자동 삭제된다.", "목록 원본은 다른 시트의 범위나 이름 정의를 참조할 수 있다."],a:2,fig:"<div class=\"dlg\"><div class=\"tb\"><span>데이터 유효성</span><span class=\"x\">? ✕</span></div><div class=\"bd\"><div class=\"row\"><span>제한 대상(A):</span><span class=\"sel\">목록</span></div><div class=\"row\"><span>제한 방법(D):</span><span class=\"sel\">해당 범위</span></div><div class=\"row\"><span>오류 스타일:</span><span class=\"sel\">중지</span></div><div class=\"row\"><span>원본(S):</span><span class=\"inp\">=$H$2:$H$5</span></div><div class=\"btns\"><span class=\"btn pri\">확인</span><span class=\"btn\">취소</span></div></div></div>",e:"기존 입력된 <b>잘못된 데이터는 자동 삭제되지 않는다</b>('잘못된 데이터' 표시만 가능)."},
  {s:"스프레드시트",q:"다음 중 문자 위치를 찾는 함수식의 결과로 옳은 것은? (FIND는 대/소문자 구분·와일드카드 불가, SEARCH는 구분 안 함·와일드카드 가능)\n\n=SEARCH(\"P?J\",\"YOUNGPAJOK\")",o:["6", "1", "#VALUE!", "0"],a:0,e:"SEARCH는 <b>와일드카드(?,*)</b>를 지원하므로 '?'가 한 글자를 대신해 패턴과 일치하는 시작 위치 <b>6</b>를 찾는다. FIND는 와일드카드를 지원하지 않아 같은 식에서 #VALUE!가 난다."},
  {s:"스프레드시트",q:"셀 값이 1,000 이상이면 '빨강', 1,000 미만 300 이상이면 '자홍', 300 미만이면 색을 지정하지 않고, 모든 구간에서 천 단위 구분 기호(,)와 소수 이하 첫째 자리까지 표시하려고 한다. 사용자 지정 표시 형식으로 옳은 것은? (예: 1234.56 → 1,234.6, 432 → 432.0)",o:["[빨강][>=1000]#,###.#;[자홍][>=300]#,###.#;#,###.#", "[빨강][>=1000]#,##0.0;[자홍][>=300]#,##0.0;#,##0.0", "[>=1000]<빨강>#,##0.0;[>=300]<자홍>#,##0.0;#,##0.0", "[빨강][>=1000]#,##0.0;[자홍][>=300]#,##0.0"],a:1,e:"사용자 지정 형식은 <b>[조건·색]양수서식;[조건·색]서식;나머지서식</b> 구조로, 색과 조건은 대괄호 [빨강][>=1000] 안에 넣는다. 소수 첫째 자리는 0을 써서 <b>#,##0.0</b>으로 해야 432가 432.0으로 나온다(#,###.#은 432를 432.로 만들어 틀림). 꺾쇠<>로 색을 넣는 문법은 없다. 정답: <b>[빨강][>=1000]#,##0.0;[자홍][>=300]#,##0.0;#,##0.0</b>"},
  {s:"스프레드시트",q:"아래 표에서 전체 판매 금액(수량×단가의 합계)을 한 번에 구하려고 한다. 가장 적절한 수식은? (참고: 총액 148,000원)",o:["=SUMPRODUCT(B2:B4,C2:C4)", "=SUM(B2:B4*C2:C4)", "=SUM(B2:B4)*SUM(C2:C4)", "=SUMPRODUCT(B2:B4+C2:C4)"],a:0,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">품목</td><td class=\"hd\">수량</td><td class=\"hd\">단가</td></tr><tr><td class=\"rh\">2</td><td>펜</td><td>2</td><td>6,000</td></tr><tr><td class=\"rh\">3</td><td>노트</td><td>9</td><td>9,000</td></tr><tr><td class=\"rh\">4</td><td>풀</td><td>5</td><td>11,000</td></tr></table>",e:"<b>SUMPRODUCT(배열1, 배열2)</b>는 대응하는 원소끼리 곱한 뒤 모두 더한다 → <b>148,000</b>원. =SUM(B*C)는 일반 입력 시 배열이 아니라 오류/단일값이 되고(배열 입력해야 함), SUM(B)*SUM(C)는 합끼리 곱해 의미가 다르다."},
  {s:"스프레드시트",q:"아래 시트에서 입력값에 주어진 표시 형식을 적용했을 때, [C2]의 결과로 옳은 것은?",o:["1,235", "(1,500)", "12.5%", "2025년 3월"],a:2,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">입력값</td><td class=\"hd\">표시 형식</td><td class=\"hd\">결과</td></tr><tr><td class=\"rh\">2</td><td>0.125</td><td class=\"l\">0.0%</td><td>?</td></tr></table>",e:"백분율 한 자리 → 12.5%"},
  {s:"스프레드시트",q:"셀 [A1:A5]에 다음 값이 입력되어 있다: 27, 32, 44, 45, 48\n다음 수식(제1사분위수)의 결과로 옳은 것은?\n\n=QUARTILE.INC(A1:A5, 1)",o:["33", "31", "32", "44"],a:2,e:"QUARTILE.INC(범위, 1)는 제1사분위수(하위 25% 지점)를 구하며 PERCENTILE.INC(범위,0.25)와 같다. 정렬된 값에서 결과는 <b>32</b>이다."},
  {s:"스프레드시트",q:"다음 중 SUBSTITUTE 함수를 사용한 수식의 실행 결과로 옳은 것은?\n\n=SUBSTITUTE(\"16-33-97-29\",\"-\",\":\",3)",o:["16:33:97:29", "16-33-97:29", "16:33-97-29", "16-33-97:21"],a:1,e:"네 번째 인수 3은(는) 3번째 '-'만 ':'로 바꾼다 → <b>16-33-97:29</b>. (인수를 생략하면 모든 '-'를 바꾼다.)"},
  {s:"스프레드시트",q:"다음 수식의 실행 결과로 옳은 것은?\n\n=IF(MOD(A1,4)=0,\"배수\",\"아님\")   (단, [A1]=38)",o:["배수", "아님", "0", "TRUE"],a:1,e:"MOD(38,4)=2 → 아님"},
  {s:"스프레드시트",q:"다음 중 날짜 함수 수식의 실행 결과로 옳은 것은?\n\n=NETWORKDAYS(\"2025-02-15\",\"2025-03-01\")",o:["11", "15", "10", "9"],a:2,e:"NETWORKDAYS는 두 날짜 사이의 주말을 뺀 '근무일 수'(양끝 포함)를 센다 → <b>10</b>일."},
  {s:"스프레드시트",q:"다음 중 문자 위치를 찾는 함수식의 결과로 옳은 것은? (FIND는 대/소문자 구분·와일드카드 불가, SEARCH는 구분 안 함·와일드카드 가능)\n\n=FIND(\"o\",\"YOUNGPAJOK\")",o:["#VALUE!", "2", "1", "0"],a:0,e:"FIND는 <b>대/소문자를 구분</b>한다. 대상 \"YOUNGPAJOK\"에 소문자 'o'가 없으면 <b>#VALUE! 오류</b>가 난다. 대소문자를 무시하려면 SEARCH를 써야 한다 (=SEARCH(\"o\",\"YOUNGPAJOK\") → 2)."},
  {s:"스프레드시트",q:"셀 값이 1,000 이상이면 '빨강', 1,000 미만 300 이상이면 '파랑', 300 미만이면 색을 지정하지 않고, 모든 구간에서 천 단위 구분 기호(,)와 소수 이하 첫째 자리까지 표시하려고 한다. 사용자 지정 표시 형식으로 옳은 것은? (예: 1234.56 → 1,234.6, 432 → 432.0)",o:["[빨강][>=1000]#,##0.0;[파랑][>=300]#,##0.0;#,##0.0", "[빨강][>=1000]#,###.#;[파랑][>=300]#,###.#;#,###.#", "[>=1000]<빨강>#,##0.0;[>=300]<파랑>#,##0.0;#,##0.0", "[빨강][>=1000]#,##0.0;[파랑][>=300]#,##0.0"],a:0,e:"사용자 지정 형식은 <b>[조건·색]양수서식;[조건·색]서식;나머지서식</b> 구조로, 색과 조건은 대괄호 [빨강][>=1000] 안에 넣는다. 소수 첫째 자리는 0을 써서 <b>#,##0.0</b>으로 해야 432가 432.0으로 나온다(#,###.#은 432를 432.로 만들어 틀림). 꺾쇠<>로 색을 넣는 문법은 없다. 정답: <b>[빨강][>=1000]#,##0.0;[파랑][>=300]#,##0.0;#,##0.0</b>"},
  {s:"스프레드시트",q:"다음 중 수식의 실행 결과가 옳지 않은 것은?",o:["=INT(-2.3) → -3", "=TRUNC(-7.6) → -7", "=MOD(-2,4) → 2", "=ROUND(291.23,2) → 292.23"],a:3,e:"=ROUND(291.23,2)의 올바른 결과는 291.23이다. (INT=내림, TRUNC=절사, MOD=n-d×INT(n/d), ROUND=반올림)"},
  {s:"스프레드시트",q:"왼쪽 기준표([F2:G6], 오름차순)를 이용해 점수 96점의 등급을 구하려고 한다. 가장 적절한 수식은? (구간의 최저점 이상이면 해당 등급)",o:["=HLOOKUP(96,$F$2:$G$6,2,TRUE)", "=VLOOKUP(96,$F$2:$G$6,2,0)", "=VLOOKUP(96,$F$2:$G$6,2,TRUE)", "=VLOOKUP(96,$F$2:$G$6,2,FALSE)"],a:2,fig:"<table class=\"xg\"><tr><th></th><th>F</th><th>G</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">기준점수</td><td class=\"hd\">등급</td></tr><tr><td class=\"rh\">2</td><td>0</td><td class=\"l\">F</td></tr><tr><td class=\"rh\">3</td><td>60</td><td class=\"l\">D</td></tr><tr><td class=\"rh\">4</td><td>70</td><td class=\"l\">C</td></tr><tr><td class=\"rh\">5</td><td>80</td><td class=\"l\">B</td></tr><tr><td class=\"rh\">6</td><td>90</td><td class=\"l\">A</td></tr></table>",e:"구간(범위) 조회는 네 번째 인수를 <b>TRUE(생략 가능, 근사일치)</b>로 두고 기준표가 <b>오름차순</b>이어야 한다. 96점 → <b>A</b>등급. FALSE(정확히 일치)는 기준표에 없는 값이면 #N/A가 난다."}
 ]},
{ name:'기출 5회', q:[
  {s:"컴퓨터일반",q:"다음 중 SSD(Solid State Drive)에 대한 설명으로 옳지 않은 것은?",o:["플래시 메모리를 사용해 데이터를 저장한다.", "기계적 구동부가 없어 소음이 적고 충격에 강하다.", "HDD보다 읽기·쓰기 속도가 빠르다.", "자기 디스크(플래터)를 회전시켜 데이터를 읽고 쓴다."],a:3,e:"플래터를 회전시켜 자기적으로 데이터를 저장하는 것은 HDD이다. SSD는 반도체(플래시 메모리) 기반으로 구동부가 없어 빠르고 조용하며 충격에 강하다."},
  {s:"컴퓨터일반",q:"다음 중 보조기억장치의 일부를 주기억장치처럼 사용하여 실제 용량보다 큰 메모리를 쓸 수 있게 하는 기법을 의미하는 것은?",o:["가상 메모리", "캐시 메모리", "연관 메모리", "버퍼"],a:0,e:"보조기억장치를 주기억처럼 쓰는 기법은 <b>가상 메모리</b>다."},
  {s:"컴퓨터일반",q:"다음 중 인터넷 프로토콜의 포트 번호 연결로 옳지 않은 것은?",o:["HTTP — 80", "HTTPS — 443", "FTP — 21", "SMTP — 110"],a:3,e:"SMTP의 포트는 25번이다. 110번은 POP3(메일 수신)의 포트이다. HTTP 80, HTTPS 443, FTP 21."},
  {s:"컴퓨터일반",q:"다음에서 설명하는 생성형 AI의 문제점으로 옳은 것은?\n\n생성형 AI가 학습하지 않았거나 사실이 아닌 내용을, 마치 사실인 것처럼 그럴듯하게 지어내어 답하는 현상이다.",o:["오버피팅(과적합)", "할루시네이션(환각)", "데이터 레이블링", "파인튜닝(미세조정)"],a:1,e:"사실이 아닌 내용을 그럴듯하게 지어내는 현상은 <b>할루시네이션(환각)</b>이다."},
  {s:"컴퓨터일반",q:"다음 중 보안 위협 기법에 대한 설명으로 옳지 않은 것은?",o:["스니핑은 네트워크의 데이터를 몰래 엿보는 도청 행위이다.", "스푸핑은 신뢰받는 사람·주소로 위장해 속이는 기법이다.", "피싱은 가짜 사이트·메일로 개인정보를 빼내는 기법이다.", "방화벽은 외부 침입을 돕기 위해 포트를 모두 열어 두는 공격이다."],a:3,e:"방화벽은 외부의 불법 침입을 '차단'하는 보안 시스템이다. 포트를 모두 여는 것은 보안에 위배된다."},
  {s:"컴퓨터일반",q:"다음 중 Windows 11의 '스냅 레이아웃(Snap Layouts)'에 대한 설명으로 옳지 않은 것은?",o:["제목 표시줄의 최대화 단추 위에 마우스를 올리면 창 배치 틀이 나타난다.", "바로 가기 키 <b>Win+Z</b>로도 스냅 레이아웃을 호출할 수 있다.", "선택한 틀에 창을 배치하면 '스냅 그룹'으로 묶여 작업 표시줄에서 함께 전환된다.", "한 화면을 최대 두 개의 창으로만 분할할 수 있고 네 개 분할은 지원하지 않는다."],a:3,e:"스냅 레이아웃은 화면을 2·3·4분할 등 여러 형태로 나눌 수 있다. 두 개까지만 가능하다는 설명이 틀렸다. Win+Z로 호출하며, 배치된 창들은 스냅 그룹으로 묶인다."},
  {s:"컴퓨터일반",q:"다음 중 운영체제의 목적(성능 평가 기준)으로 옳지 않은 것은?",o:["처리 능력(Throughput) 향상", "응답 시간(Turnaround Time) 단축", "사용 가능도(Availability) 향상", "비용(원가) 증가"],a:3,e:"운영체제의 목적은 처리 능력 향상, 응답(반환) 시간 단축, 사용 가능도 향상, 신뢰도 향상이다. 비용 증가는 목적이 될 수 없다."},
  {s:"컴퓨터일반",q:"다음 중 DHCP에 대한 설명으로 옳은 것은?",o:["네트워크 장치에 IP 주소 등 설정 정보를 자동으로 할당해 주는 프로토콜이다.", "도메인 이름을 IP 주소로 바꿔 주는 서비스이다.", "이메일을 송신하는 프로토콜이다.", "웹 페이지를 전송하는 프로토콜이다."],a:0,e:"DHCP(Dynamic Host Configuration Protocol)는 IP 주소·서브넷 마스크·게이트웨이·DNS 등을 자동으로 할당한다. 도메인 변환은 DNS, 메일 송신은 SMTP, 웹 전송은 HTTP이다."},
  {s:"컴퓨터일반",q:"다음 중 RAM과 ROM에 대한 설명으로 옳은 것은?",o:["ROM은 전원이 꺼져도 내용이 보존되는 비휘발성 메모리이다.", "RAM은 전원이 꺼져도 내용이 유지되는 비휘발성 메모리이다.", "ROM은 사용자가 수시로 읽고 쓰는 주기억장치의 대부분을 차지한다.", "DRAM은 재충전이 필요 없고 SRAM은 주기적인 재충전이 필요하다."],a:0,e:"ROM은 비휘발성으로 전원이 꺼져도 내용이 남으며 주로 바이오스 등 기본 프로그램을 담는다. RAM은 휘발성이고, 재충전(리프레시)이 필요한 쪽은 DRAM이다."},
  {s:"컴퓨터일반",q:"다음 중 압축 프로그램에 대한 설명으로 옳지 않은 것은?",o:["여러 파일을 하나로 묶어 압축할 수 있다.", "압축하면 저장 공간과 전송 시간을 줄인다.", "ZIP·ALZ·7Z 등의 형식이 있다.", "압축 파일은 해제 없이 항상 바로 편집할 수 있다."],a:3,e:"압축 파일 내부의 자료는 보통 '압축 해제' 후에 편집할 수 있다."},
  {s:"컴퓨터일반",q:"다음 중 플러그 앤 플레이(PnP, Plug and Play)에 대한 설명으로 옳은 것은?",o:["새 하드웨어를 연결하면 운영체제가 자동으로 인식·설정한다.", "하드웨어를 연결할 때마다 수동으로 드라이버를 작성해야 한다.", "전원을 끈 상태에서만 장치를 연결할 수 있는 기능이다.", "소프트웨어를 자동으로 업데이트하는 기능이다."],a:0,e:"플러그 앤 플레이는 새 장치를 연결하면 OS가 자동으로 인식하고 필요한 드라이버·자원을 설정해 주는 기능이다."},
  {s:"컴퓨터일반",q:"다음 중 디스플레이 관련 용어에 대한 설명으로 옳지 않은 것은?",o:["해상도는 화면을 구성하는 픽셀 수로 높을수록 정밀하다.", "픽셀(Pixel)은 화면을 구성하는 최소 단위이다.", "재생률(Refresh Rate)이 높을수록 화면 깜박임이 줄어든다.", "도트 피치(Dot Pitch)가 클수록 화질이 선명해진다."],a:3,e:"도트 피치는 픽셀(점) 사이의 간격으로, '작을수록' 화면이 더 선명하다. 해상도·재생률이 높을수록 품질이 좋아진다."},
  {s:"컴퓨터일반",q:"다음 중 프로그래밍 언어 번역 방식에 대한 설명으로 옳지 않은 것은?",o:["컴파일러는 원시 프로그램 전체를 한 번에 번역한다.", "인터프리터는 행 단위로 번역·실행한다.", "컴파일러는 번역 속도가 빠르지만 실행 속도가 느리다.", "컴파일러는 목적 프로그램을 생성하지만 인터프리터는 생성하지 않는다."],a:2,e:"컴파일러는 번역 속도는 '느리지만' 실행 속도가 빠르다. 인터프리터는 번역 속도는 빠르나 실행 속도가 느리고 목적 프로그램을 만들지 않는다."},
  {s:"컴퓨터일반",q:"다음 중 문자를 표현하는 코드 체계에 대한 설명으로 옳지 않은 것은?",o:["BCD 코드는 6비트로 구성되어 영문 대·소문자를 모두 구분해 표현할 수 있다.", "ASCII 코드는 7비트로 128가지 문자를 표현하며 주로 데이터 통신과 PC에서 쓰인다.", "EBCDIC 코드는 8비트로 256가지를 표현하며 주로 대형 컴퓨터에서 사용된다.", "유니코드(Unicode)는 모든 문자를 2바이트로 처리해 전 세계 문자를 표현한다."],a:0,e:"BCD는 6비트(존 2 + 디지트 4)라 64가지만 표현되어 영문 '소문자'는 나타내지 못한다. 대·소문자 구분은 7비트 ASCII(128가지)부터 가능하다. EBCDIC 8비트, 유니코드 2바이트 설명은 옳다."},
  {s:"컴퓨터일반",q:"다음 중 데이터 압축에 대한 설명으로 옳지 않은 것은?",o:["무손실 압축은 원본을 100% 복원할 수 있다(예: ZIP, PNG).", "손실 압축은 일부 정보를 버려 압축률을 높인다(예: JPG, MP3).", "압축하면 저장 공간과 전송 시간을 줄일 수 있다.", "손실 압축은 압축·복원을 반복해도 화질이 전혀 떨어지지 않는다."],a:3,e:"손실 압축은 복원 시 원본과 완전히 같지 않아 반복할수록 화질·음질이 떨어질 수 있다. 무손실은 원본을 그대로 복원한다."},
  {s:"컴퓨터일반",q:"다음 중 한글 Windows의 파일/폴더 관리에 대한 설명으로 옳지 않은 것은?",o:["파일 탐색기에서 Ctrl+A는 전체 선택, F2는 이름 바꾸기다.", "떨어져 있는 여러 파일은 Ctrl을 누른 채 클릭해 선택한다.", "연속된 여러 파일은 Shift를 누른 채 처음과 끝을 클릭해 선택한다.", "같은 드라이브로 파일을 드래그하면 복사, 다른 드라이브로 드래그하면 이동된다."],a:3,e:"같은 드라이브 드래그=이동, <b>다른 드라이브 드래그=복사</b>다. 지문은 반대다."},
  {s:"컴퓨터일반",q:"다음 중 가로 1280픽셀 × 세로 600픽셀, 한 픽셀을 16비트로 표현하는 비압축 비트맵 이미지의 용량으로 옳은 것은? (1KB=1,024Byte)",o:["3,000KB", "750KB", "500KB", "1,500KB"],a:3,e:"비트맵 용량 = 가로×세로×색 깊이(비트)÷8 = 1280×600×16÷8 = <b>1,536,000 Byte</b> ≒ 1,500KB."},
  {s:"컴퓨터일반",q:"다음 두 8비트 값에 비트 단위 XOR 연산을 수행한 결과로 옳은 것은?\n\n10001001 XOR 10010011",o:["01110110", "00011010", "10000001", "10011011"],a:1,e:"비트 XOR은 각 자리에서 서로 다르면 1 → <b>00011010</b>."},
  {s:"컴퓨터일반",q:"다음 중 8비트 2진수 00010001의 2의 보수로 옳은 것은?",o:["11101111", "00010010", "11101110", "00010000"],a:0,e:"2의 보수 = 1의 보수(비트 반전=11101110) + 1 = <b>11101111</b>."},
  {s:"컴퓨터일반",q:"다음 중 8비트 2진수 00000101의 2의 보수로 옳은 것은?",o:["11111010", "00000110", "00000100", "11111011"],a:3,e:"2의 보수 = 1의 보수(비트 반전=11111010) + 1 = <b>11111011</b>."},
  {s:"스프레드시트",q:"다음 중 매크로와 VBA에 대한 설명으로 옳지 않은 것은?",o:["기록한 매크로는 Visual Basic Editor(Alt+F11)에서 코드로 확인·수정할 수 있다.", "매크로는 모듈에 Sub ~ End Sub 프로시저로 저장된다.", "'상대 참조로 기록'을 켜면 선택 위치를 기준으로 상대적으로 기록된다.", "매크로를 포함한 통합 문서는 .xlsx 형식으로 저장해야 매크로가 보존된다."],a:3,e:"매크로는 <b>.xlsm(매크로 사용 통합 문서)</b>로 저장해야 보존된다."},
  {s:"스프레드시트",q:"다음 중 틀고정·창나누기·페이지 나누기에 대한 설명으로 옳지 않은 것은?",o:["틀고정은 선택한 셀을 기준으로 왼쪽 열과 위쪽 행이 고정되어 스크롤을 내리거나 오른쪽으로 이동해도 고정된 열·행은 항상 화면에 표시되며, 이 고정 효과는 인쇄 시 반영되지 않아 인쇄 결과물의 페이지 분할과는 무관하다", "창나누기는 선택한 셀의 왼쪽 열과 위쪽 행을 기준으로 화면을 최대 4개 영역으로 분할하여 서로 다른 부분을 동시에 볼 수 있게 하지만, 이 분할선 역시 인쇄 결과에는 영향을 주지 않는다", "페이지 나누기는 선택한 셀의 왼쪽 열과 위쪽 행을 기준으로 점선이 표시되며, 화면상의 구분일 뿐 실제 인쇄되는 페이지의 경계와는 관련이 없다", "틀고정·창나누기·페이지 나누기는 모두 현재 선택된 셀의 왼쪽 열과 위쪽 행을 기준으로 나뉜다는 공통점이 있지만, 셋 중 실제 인쇄 결과에 영향을 주는 것은 페이지 나누기뿐이다"],a:2,e:"페이지 나누기의 점선은 실제 인쇄 시 페이지가 나뉘는 경계를 그대로 결정한다. 화면상의 구분일 뿐 인쇄와 무관하다는 설명이 틀렸다. 조건부 서식 규칙 유형 · 우선순위 항목 내용 규칙 유형 셀 강조 규칙, 상위/하위 규칙, 데이터 막대, 색조, 아이콘 집합"},
  {s:"스프레드시트",q:"다음 중 데이터 종류별 입력·표시에 대한 설명으로 옳지 않은 것은?",o:["문자 데이터는 셀의 왼쪽, 숫자 데이터는 오른쪽에 기본 정렬된다.", "숫자를 셀 너비보다 길게 입력하면 ###### 또는 지수 형식으로 표시된다.", "날짜는 내부적으로 일련번호로 저장되어 계산에 쓸 수 있다.", "수식을 입력하면 수식 자체가 문자로 셀에 그대로 표시된다."],a:3,e:"수식을 입력하면 <b>계산 결과</b>가 표시된다(수식은 수식 입력줄에)."},
  {s:"스프레드시트",q:"다음 중 셀 메모(노트)에 대한 설명으로 옳지 않은 것은?",o:["메모가 있는 셀에는 기본적으로 빨간 삼각형 표시가 나타난다.", "메모는 셀을 이동·복사하면 함께 이동·복사된다.", "인쇄 시 메모를 '시트에 표시된 대로' 또는 '시트 끝'에 인쇄할 수 있다.", "메모가 삽입된 셀을 삭제해도 메모는 삭제되지 않고 남는다."],a:3,e:"셀을 삭제하면 <b>메모도 함께 삭제</b>된다."},
  {s:"스프레드시트",q:"다음 중 차트의 작성과 편집에 대한 설명으로 옳지 않은 것은?",o:["차트로 만들 데이터 범위에 필드 이름(머리글)을 포함해 선택하는 것이 일반적이다.", "원본 데이터 값이 바뀌면 차트에도 자동으로 반영된다.", "기본 차트(세로 막대형)를 즉시 만들려면 데이터 선택 후 F11(새 차트 시트) 또는 Alt+F1(차트 개체)을 쓴다.", "차트를 삭제하면 원본 데이터도 함께 삭제된다."],a:3,e:"차트를 삭제해도 <b>원본 데이터는 그대로</b> 남는다."},
  {s:"스프레드시트",q:"다음 중 시트 보호·통합 문서 보호에 대한 설명으로 옳지 않은 것은?",o:["시트를 보호하면 잠금된 셀의 내용을 수정할 수 없다.", "특정 셀만 수정 가능하게 하려면 그 셀의 '잠금'을 해제한 뒤 시트를 보호한다.", "시트 보호 암호는 반드시 지정해야 하며 생략할 수 없다.", "통합 문서 보호로 시트의 삽입·삭제·이동을 막을 수 있다."],a:2,e:"시트 보호 암호는 <b>선택 사항</b>으로 생략할 수 있다."},
  {s:"스프레드시트",q:"판매표 [A2:E10]에서 5열이 '예매량'이고 G9:G10이 조건일 때, 설명으로 옳지 않은 것은?",o:["=DSUM(A2:E10,\"예매량\",G9:G10)과 =DSUM(A2:E10,5,G9:G10)은 같은 결과다.", "=DSUM(A2:E10,E2,G9:G10)처럼 셀 주소로 필드를 지정해도 같은 열이면 결과가 같다.", "'DCOUNT'에 문자 필드를 지정하면 0이 반환된다.", "=DSUM(A2:E10,4,G9:G10)은 4열(D)로 지정해도 '예매량'(5열)과 같은 합계를 낸다."],a:3,e:"필드가 <b>가리키는 열이 달라</b>(4열≠5열) 합계가 달라진다."},
  {s:"스프레드시트",q:"다음 중 피벗 차트에 대한 설명으로 옳지 않은 것은?",o:["피벗 테이블과 연결되어 필드를 바꾸면 차트도 함께 바뀐다.", "피벗 차트에서 필터·슬라이서로 데이터를 걸러 볼 수 있다.", "연결된 피벗 테이블을 삭제하면 피벗 차트는 일반 차트가 된다.", "피벗 차트는 분산형·주식형·거품형으로도 자유롭게 변경할 수 있다."],a:3,e:"피벗 차트는 <b>분산형·주식형·거품형으로 변경할 수 없다</b>."},
  {s:"스프레드시트",q:"셀 값이 2,000 이상이면 '파랑', 2,000 미만 500 이상이면 '녹색', 500 미만이면 색을 지정하지 않고, 모든 구간에서 천 단위 구분 기호(,)와 소수 이하 첫째 자리까지 표시하려고 한다. 사용자 지정 표시 형식으로 옳은 것은? (예: 1234.56 → 1,234.6, 432 → 432.0)",o:["[파랑][>=2000]#,##0.0;[녹색][>=500]#,##0.0", "[파랑][>=2000]#,##0.0;[녹색][>=500]#,##0.0;#,##0.0", "[파랑][>=2000]#,###.#;[녹색][>=500]#,###.#;#,###.#", "[>=2000]<파랑>#,##0.0;[>=500]<녹색>#,##0.0;#,##0.0"],a:1,e:"사용자 지정 형식은 <b>[조건·색]양수서식;[조건·색]서식;나머지서식</b> 구조로, 색과 조건은 대괄호 [파랑][>=2000] 안에 넣는다. 소수 첫째 자리는 0을 써서 <b>#,##0.0</b>으로 해야 432가 432.0으로 나온다(#,###.#은 432를 432.로 만들어 틀림). 꺾쇠<>로 색을 넣는 문법은 없다. 정답: <b>[파랑][>=2000]#,##0.0;[녹색][>=500]#,##0.0;#,##0.0</b>"},
