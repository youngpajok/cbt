  {s:"스프레드시트",q:"아래 표에서 전체 판매 금액(수량×단가의 합계)을 한 번에 구하려고 한다. 가장 적절한 수식은? (참고: 총액 247,000원)",o:["=SUMPRODUCT(B2:B5+C2:C5)", "=SUMPRODUCT(B2:B5,C2:C5)", "=SUM(B2:B5)*SUM(C2:C5)", "=SUM(B2:B5*C2:C5)"],a:1,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">품목</td><td class=\"hd\">수량</td><td class=\"hd\">단가</td></tr><tr><td class=\"rh\">2</td><td>자</td><td>6</td><td>9,000</td></tr><tr><td class=\"rh\">3</td><td>연필</td><td>6</td><td>3,000</td></tr><tr><td class=\"rh\">4</td><td>노트</td><td>9</td><td>7,000</td></tr><tr><td class=\"rh\">5</td><td>지우개</td><td>8</td><td>14,000</td></tr></table>",e:"<b>SUMPRODUCT(배열1, 배열2)</b>는 대응하는 원소끼리 곱한 뒤 모두 더한다 → <b>247,000</b>원. =SUM(B*C)는 일반 입력 시 배열이 아니라 오류/단일값이 되고(배열 입력해야 함), SUM(B)*SUM(C)는 합끼리 곱해 의미가 다르다."},
  {s:"스프레드시트",q:"다음 중 REPT 함수로 문자를 반복한 결과로 옳은 것은?\n\n=REPT(\"★\",3)&REPT(\"☆\",5-3)",o:["★★★★☆", "★★☆☆☆", "★★★", "★★★☆☆"],a:3,e:"★를 3번, ☆를 2번 이어 붙여 5칸 별점을 만든다 → ★★★☆☆"},
  {s:"스프레드시트",q:"셀 값이 2,000 이상이면 '자홍', 2,000 미만 300 이상이면 '파랑', 300 미만이면 색을 지정하지 않고, 모든 구간에서 천 단위 구분 기호(,)와 소수 이하 첫째 자리까지 표시하려고 한다. 사용자 지정 표시 형식으로 옳은 것은? (예: 1234.56 → 1,234.6, 432 → 432.0)",o:["[자홍][>=2000]#,##0.0;[파랑][>=300]#,##0.0;#,##0.0", "[자홍][>=2000]#,##0.0;[파랑][>=300]#,##0.0", "[자홍][>=2000]#,###.#;[파랑][>=300]#,###.#;#,###.#", "[>=2000]<자홍>#,##0.0;[>=300]<파랑>#,##0.0;#,##0.0"],a:0,e:"사용자 지정 형식은 <b>[조건·색]양수서식;[조건·색]서식;나머지서식</b> 구조로, 색과 조건은 대괄호 [자홍][>=2000] 안에 넣는다. 소수 첫째 자리는 0을 써서 <b>#,##0.0</b>으로 해야 432가 432.0으로 나온다(#,###.#은 432를 432.로 만들어 틀림). 꺾쇠<>로 색을 넣는 문법은 없다. 정답: <b>[자홍][>=2000]#,##0.0;[파랑][>=300]#,##0.0;#,##0.0</b>"},
  {s:"스프레드시트",q:"다음 중 SUBSTITUTE 함수를 사용한 수식의 실행 결과로 옳은 것은?\n\n=SUBSTITUTE(\"38-39-36-75\",\"-\",\":\",3)",o:["38-39-36:75", "38:39-36-75", "38-39-36:71", "38:39:36:75"],a:0,e:"네 번째 인수 3은(는) 3번째 '-'만 ':'로 바꾼다 → <b>38-39-36:75</b>. (인수를 생략하면 모든 '-'를 바꾼다.)"},
  {s:"스프레드시트",q:"다음 중 문자 위치를 찾는 함수식의 결과로 옳은 것은? (FIND는 대/소문자 구분·와일드카드 불가, SEARCH는 구분 안 함·와일드카드 가능)\n\n=FIND(\"y\",\"YOUNGPAJOK\")",o:["#VALUE!", "0", "1", "#VALUE1"],a:0,e:"FIND는 <b>대/소문자를 구분</b>한다. 대상 \"YOUNGPAJOK\"에 소문자 'y'가 없으면 <b>#VALUE! 오류</b>가 난다. 대소문자를 무시하려면 SEARCH를 써야 한다 (=SEARCH(\"y\",\"YOUNGPAJOK\") → 1)."},
  {s:"스프레드시트",q:"다음 수식의 실행 결과로 옳은 것은?\n\n=IF(MOD(A1,4)=0,\"배수\",\"아님\")   (단, [A1]=61)",o:["배수", "아님", "0", "TRUE"],a:1,e:"MOD(61,4)=1 → 아님"},
  {s:"스프레드시트",q:"아래 시트에서 부서가 '총무부'인 직원의 급여 합계를 [F2]에 구하려 한다. 입력할 수식으로 옳은 것은?",o:["=DSUM(B2:B4,\"총무부\",D2:D4)", "=SUMIF(B2:B4,\"총무부\",D2:D4)", "=SUMIF(D2:D4,\"총무부\",B2:B4)", "=COUNTIF(B2:B4,\"총무부\")"],a:1,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">이름</td><td class=\"hd\">부서</td><td class=\"hd\">직급</td><td class=\"hd\">급여</td></tr><tr><td class=\"rh\">2</td><td>윤서준</td><td class=\"l\">기획부</td><td>사원</td><td>3,900,000</td></tr><tr><td class=\"rh\">3</td><td>이두리</td><td class=\"l\">총무부</td><td>과장</td><td>3,700,000</td></tr><tr><td class=\"rh\">4</td><td>김하나</td><td class=\"l\">영업부</td><td>대리</td><td>3,600,000</td></tr></table>",e:"SUMIF(<b>조건범위, 조건, 합계범위</b>) → 부서(B)에서 '총무부'를 찾아 급여(D)를 더한다."},
  {s:"스프레드시트",q:"다음 중 문자 위치를 찾는 함수식의 결과로 옳은 것은? (FIND는 대/소문자 구분·와일드카드 불가, SEARCH는 구분 안 함·와일드카드 가능)\n\n=FIND(\"a\",\"YOUNGPAJOK STUDY\")",o:["1", "0", "#VALUE!", "7"],a:2,e:"FIND는 <b>대/소문자를 구분</b>한다. 대상 \"YOUNGPAJOK STUDY\"에 소문자 'a'가 없으면 <b>#VALUE! 오류</b>가 난다. 대소문자를 무시하려면 SEARCH를 써야 한다 (=SEARCH(\"a\",\"YOUNGPAJOK STUDY\") → 7)."},
  {s:"스프레드시트",q:"다음 중 SUBSTITUTE 함수를 사용한 수식의 실행 결과로 옳은 것은?\n\n=SUBSTITUTE(\"65-31-33-14\",\"-\",\".\",3)",o:["65-31-33.11", "65.31.33.14", "65-31-33.14", "65.31-33-14"],a:2,e:"네 번째 인수 3은(는) 3번째 '-'만 '.'로 바꾼다 → <b>65-31-33.14</b>. (인수를 생략하면 모든 '-'를 바꾼다.)"},
  {s:"스프레드시트",q:"다음 그림과 같이 [목표값 찾기]를 설정했을 때, 그 의미로 옳은 것은?",o:["평균(E4)이 60이 되려면 노트북 판매량(B4)이 얼마가 되어야 하는가?", "노트북 판매량(B4)이 60이 되려면 평균(E4)이 얼마가 되어야 하는가?", "노트북 판매량을 60으로 바꾸면 평균(E4)은 얼마가 되는가?", "평균이 60이 되려면 노트북 외 나머지 제품 판매량은 얼마가 되어야 하는가?"],a:0,fig:"<div class=\"figwrap\"><table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th></tr><tr><td class=\"rh\">1</td><td class=\"tt\" colspan=\"5\">제품별 판매현황</td></tr><tr><td class=\"rh\">3</td><td class=\"hd\">품목</td><td class=\"hd\">노트북</td><td class=\"hd\">프린터</td><td class=\"hd\">스캐너</td><td class=\"hd\">평균</td></tr><tr><td class=\"rh\">4</td><td class=\"hd\">판매량</td><td>47</td><td>20</td><td>10</td><td>25.67</td></tr></table><div class=\"dlg\"><div class=\"tb\"><span>목표값 찾기</span><span class=\"x\">? ✕</span></div><div class=\"bd\"><div class=\"row\"><span>수식 셀(E):</span><span class=\"inp\">$E$4</span></div><div class=\"row\"><span>찾는 값(V):</span><span class=\"inp\">60</span></div><div class=\"row\"><span>값을 바꿀 셀(C):</span><span class=\"inp\">$B$4</span></div><div class=\"btns\"><span class=\"btn pri\">확인</span><span class=\"btn\">취소</span></div></div></div></div>",e:"목표값 찾기는 <b>수식 셀(E4·평균)이 찾는 값(60)</b>이 되도록 <b>값을 바꿀 셀(B4·노트북)</b>을 역산한다."}
 ]},
{ name:'기출 12회', q:[
  {s:"컴퓨터일반",q:"다음 중 바로 가기(단축) 아이콘에 대한 설명으로 옳지 않은 것은?",o:["바로 가기 아이콘을 삭제해도 원본 프로그램·파일은 삭제되지 않는다.", "바로 가기 아이콘의 확장자는 .LNK이며 왼쪽 아래에 화살표가 표시된다.", "하나의 원본에 대해 여러 개의 바로 가기를 만들 수 있다.", "바로 가기 아이콘을 다른 PC로 복사하면 그 PC에서도 항상 원본이 실행된다."],a:3,e:"바로 가기는 <b>원본 경로를 가리키는 링크</b>일 뿐이라 원본이 없는 PC에서는 실행되지 않는다."},
  {s:"컴퓨터일반",q:"다음 중 휴지통에 대한 설명으로 옳지 않은 것은?",o:["휴지통 최대 크기는 드라이브마다 다르게 설정할 수 있다.", "USB·네트워크 드라이브에서 삭제하거나 Shift+Delete로 삭제한 파일은 휴지통에 보관되지 않는다.", "휴지통에 보관된 실행 파일은 복원하지 않고도 휴지통에서 바로 더블클릭해 실행할 수 있다.", "휴지통이 가득 차면 가장 오래된 파일부터 자동 삭제된다."],a:2,e:"휴지통의 프로그램은 <b>직접 실행할 수 없고</b> 먼저 복원해야 한다."},
  {s:"컴퓨터일반",q:"다음 중 레지스터와 그 기능의 연결로 옳지 않은 것은?",o:["명령 레지스터(IR) — 현재 실행 중인 명령어를 저장", "누산기(AC) — 연산 결과를 일시적으로 저장", "메모리 주소 레지스터(MAR) — 주기억장치에서 읽거나 쓸 데이터를 저장", "메모리 버퍼 레지스터(MBR) — 주기억장치와 주고받는 '데이터'를 저장"],a:2,e:"MAR는 접근할 주기억장치의 '주소'를 저장하고, 실제 데이터는 MBR(=MDR)가 저장한다. 보기 ③은 MAR를 데이터 저장으로 잘못 설명했다."},
  {s:"컴퓨터일반",q:"다음 중 딥러닝에 대한 설명으로 옳지 않은 것은?",o:["딥러닝은 인공 신경망을 여러 층으로 깊게 쌓아 특징을 학습한다.", "이미지 인식·음성 인식·자연어 처리 등에서 뛰어난 성능을 보인다.", "딥러닝은 머신러닝의 한 분야다.", "딥러닝은 사람이 특징(feature)을 일일이 지정해야만 학습할 수 있다."],a:3,e:"딥러닝은 <b>특징을 스스로 추출·학습</b>한다. 특징을 사람이 지정하는 것은 전통적 머신러닝이다."},
  {s:"컴퓨터일반",q:"다음 중 정상 프로그램으로 위장하여 시스템에 몰래 숨어들어 백도어 등 악의적 기능을 수행하는 악성 코드를 의미하는 것은?",o:["웜(Worm)", "트로이 목마", "애드웨어", "스파이웨어"],a:1,e:"정상 프로그램으로 위장해 숨어드는 악성 코드는 <b>트로이 목마</b>다(웜은 자기 복제·전파)."},
  {s:"컴퓨터일반",q:"다음 중 운영체제 외 시스템 소프트웨어에 대한 설명으로 옳지 않은 것은?",o:["장치 드라이버는 주변 장치를 제어하는 프로그램이다.", "유틸리티는 압축·백신·디스크 정리 등 보조 기능을 제공한다.", "로더는 목적 프로그램을 주기억장치에 적재한다.", "응용 소프트웨어인 워드프로세서·스프레드시트는 시스템 소프트웨어에 속한다."],a:3,e:"워드·스프레드시트는 <b>응용 소프트웨어</b>다. 시스템 소프트웨어가 아니다."},
  {s:"컴퓨터일반",q:"다음 중 Windows의 휴지통에 대한 설명으로 옳지 않은 것은?",o:["USB 메모리나 네트워크 드라이브에서 삭제한 파일은 휴지통에 보관되지 않는다.", "휴지통 속성에서 드라이브별로 최대 저장 용량을 지정할 수 있다.", "휴지통에 들어간 파일은 복원 전까지 해당 프로그램에서 바로 열어 편집할 수 있다.", "휴지통을 비우면 그 안의 파일은 복원할 수 없다."],a:2,e:"휴지통의 파일은 '삭제 대기' 상태로, 먼저 복원해야 사용할 수 있고 그 자리에서 바로 열어 편집할 수는 없다. 이동식·네트워크 드라이브 삭제분은 휴지통을 거치지 않고 즉시 삭제된다."},
  {s:"컴퓨터일반",q:"다음 중 지문·홍채·얼굴·정맥 등 신체적 특징을 이용하여 본인 여부를 확인하는 기술을 의미하는 것은?",o:["생체 인식", "전자 서명", "방화벽", "암호화"],a:0,e:"신체 특징으로 본인을 확인하는 것은 <b>생체 인식</b>이다."},
  {s:"컴퓨터일반",q:"다음 중 IP 주소 체계에 대한 설명으로 옳지 않은 것은?",o:["IPv4는 32비트로 8비트씩 4부분으로 나눠 표현한다.", "IPv6는 128비트로 16비트씩 8부분을 콜론(:)으로 구분해 표현한다.", "IPv6는 IPv4의 주소 부족을 해결하며 보안·품질이 개선되었다.", "IPv6는 32비트 주소에 서브넷 마스크를 더해 주소를 확장한 방식이다."],a:3,e:"IPv6는 <b>128비트의 완전히 새로운 체계</b>다. IPv4에 서브넷 마스크를 더한 것이 아니다."},
  {s:"컴퓨터일반",q:"다음 중 인터넷을 통해 서버·저장 공간·소프트웨어 등 IT 자원을 필요한 만큼 빌려 쓰고 사용한 만큼 비용을 지불하는 서비스를 의미하는 것은?",o:["그리드 컴퓨팅", "클라우드 컴퓨팅", "임베디드 시스템", "유비쿼터스"],a:1,e:"자원을 빌려 쓰고 사용량만큼 과금하는 것은 <b>클라우드 컴퓨팅</b>이다."},
  {s:"컴퓨터일반",q:"다음 중 차세대 웹 표준으로, 텍스트·하이퍼링크 중심의 기존 문서에 비디오·오디오 등 멀티미디어를 ActiveX 없이 제공하는 언어는?",o:["XML", "VRML", "HTML5", "JSP"],a:2,e:"보기의 설명은 <b>HTML5</b>다. ActiveX·플러그인 없이 멀티미디어를 웹 서비스로 제공한다."},
  {s:"컴퓨터일반",q:"다음 중 CPU의 성능을 나타내는 단위에 대한 설명으로 옳지 않은 것은?",o:["클록 주파수(Hz)는 1초 동안 발생하는 클록 펄스 수로, 높을수록 처리 속도가 빠르다.", "MIPS는 1초에 처리하는 명령어 수를 100만 단위로 나타낸 것이다.", "FLOPS는 1초에 수행하는 부동소수점 연산 횟수를 나타낸다.", "1GHz는 1초에 1,000번의 클록이 발생함을 의미한다."],a:3,e:"1GHz는 1초에 10억(10⁹)번의 클록이 발생함을 뜻한다. 1,000번은 1kHz이다. MIPS·FLOPS 설명은 옳다."},
  {s:"컴퓨터일반",q:"다음 중 전자 상거래 등에서 결제·배송을 중개하고 대금을 보관했다가 거래 완료 후 전달하는 안전 거래 서비스를 의미하는 것은?",o:["에스크로", "스푸핑", "피어 투 피어", "캐싱"],a:0,e:"대금을 보관했다 전달하는 안전 거래는 <b>에스크로</b>다."},
  {s:"컴퓨터일반",q:"다음 중 기억장치 관련 용어에 대한 설명으로 옳지 않은 것은?",o:["캐시 메모리는 CPU와 주기억장치 사이의 속도 차를 줄이는 고속 메모리다.", "가상 메모리는 보조기억장치 일부를 주기억장치처럼 사용하는 기법이다.", "버퍼는 속도가 다른 두 장치 사이에서 데이터를 임시 저장한다.", "연관 메모리는 CPU와 주기억장치의 속도 차를 줄이기 위한 캐시의 다른 이름이다."],a:3,e:"연관 메모리는 <b>내용으로 검색하는 메모리(CAM)</b>로 캐시와 다르다."},
  {s:"컴퓨터일반",q:"다음 중 컴퓨터를 켜면 가장 먼저 실행되어 하드웨어를 점검하고 부팅을 준비하는 펌웨어를 의미하는 것은?",o:["BIOS", "커널", "스풀러", "디바이스 드라이버"],a:0,e:"부팅 시 하드웨어를 점검하는 펌웨어는 <b>BIOS</b>다."},
  {s:"컴퓨터일반",q:"다음 중 Windows 11에서 여러 항목을 선택하는 방법에 대한 설명으로 옳은 것은?",o:["연속된 여러 파일은 첫 파일을 클릭한 뒤 <b>Ctrl</b>을 누른 채 마지막 파일을 클릭한다.", "떨어져 있는 여러 파일은 <b>Shift</b>를 누른 채 각각 클릭한다.", "현재 폴더의 모든 항목은 <b>Ctrl+A</b>로 한 번에 선택한다.", "선택을 해제하려면 반드시 Esc 키만 사용해야 한다."],a:2,e:"연속 선택은 Shift, 비연속(개별) 선택은 Ctrl, 전체 선택은 Ctrl+A이다. 보기 ①②는 Shift와 Ctrl이 서로 바뀌었다. 빈 공간 클릭으로도 선택을 해제할 수 있다."},
  {s:"컴퓨터일반",q:"다음 중 8비트 2진수 00010110의 2의 보수로 옳은 것은?",o:["11101001", "00010111", "00010101", "11101010"],a:3,e:"2의 보수 = 1의 보수(비트 반전=11101001) + 1 = <b>11101010</b>."},
  {s:"컴퓨터일반",q:"다음 중 주소선(주소 버스)이 12개인 시스템이 직접 지정할 수 있는 최대 기억 공간(워드 수)으로 옳은 것은?",o:["8,192", "12,288", "4,096", "2,048"],a:2,e:"주소선 n개로 2ⁿ개의 주소를 지정한다 → 2^12 = <b>4,096</b>개."},
  {s:"컴퓨터일반",q:"다음은 7비트 ASCII 코드에 짝수 패리티 비트를 '오른쪽 끝 1비트'로 붙인 8비트 코드이다. 전송 중 오류가 발생한(패리티가 어긋난) 것은?",o:["10110010", "00111100", "11111001", "00110100"],a:3,e:"짝수 패리티는 8비트 전체에서 1의 개수가 짝수가 되도록 패리티 비트를 정한다. 정답 코드 <b>00110100</b>는 1의 개수가 3개로 짝수가 아니어서 오류이다. (패리티 비트는 1비트 오류의 '발생 여부'만 검출하고 위치는 못 찾는다.)"},
  {s:"컴퓨터일반",q:"다음 두 8비트 값에 비트 단위 OR 연산을 수행한 결과로 옳은 것은?\n\n10111110 OR 01101110",o:["11111110", "01000001", "00101110", "11010000"],a:0,e:"비트 OR은 각 자리에서 하나라도 1이면 1 → <b>11111110</b>."},
  {s:"스프레드시트",q:"다음 중 데이터 표·시나리오·목표값 찾기에 대한 설명으로 옳지 않은 것은?",o:["목표값 찾기는 수식의 결과를 원하는 값으로 만들기 위해 입력값 하나를 거꾸로 찾는다.", "시나리오는 여러 입력값 집합에 따른 결과를 비교·요약할 수 있다.", "데이터 표의 결과 범위 일부만 선택해 삭제·수정할 수 있다.", "데이터 표는 수식에서 사용하는 한두 개의 변수에 여러 값을 대입한 결과를 한 번에 보여준다."],a:2,e:"데이터 표의 결과는 <b>배열 수식</b>이라 <b>일부만 수정·삭제할 수 없다</b>(전체 단위로만)."},
  {s:"스프레드시트",q:"다음 중 찾기 및 바꾸기(Ctrl+F/Ctrl+H)에 대한 설명으로 옳지 않은 것은?",o:["* 와 ? 등의 와일드카드를 사용해 검색할 수 있다.", "대/소문자 구분, 전체 셀 내용 일치 등의 옵션을 쓸 수 있다.", "수식·값·메모 중에서 찾을 대상을 지정할 수 있다.", "찾기는 현재 워크시트에서만 가능하고 통합 문서 전체는 검색할 수 없다."],a:3,e:"범위를 '통합 문서'로 지정하면 <b>전체 시트 검색</b>이 가능하다."},
  {s:"스프레드시트",q:"다음 중 [찾기 및 바꾸기]에서 '전체 셀 내용 일치'를 체크하고 \"가\"를 찾을 때 찾아지는 셀로 옳은 것은?",o:["셀 값이 정확히 \"가\"인 셀", "\"가나다\"가 들어 있는 셀", "\"국가\"가 들어 있는 셀", "\"가\"로 시작하는 모든 셀"],a:0,e:"'전체 셀 내용 일치'를 켜면 셀 '전체'가 찾을 내용과 똑같은 셀만 찾는다. 따라서 값이 정확히 \"가\"인 셀만 해당하고, '가나다'·'국가'처럼 일부만 같은 셀은 제외된다."},
  {s:"스프레드시트",q:"다음 중 [찾기 및 바꾸기]로 찾을 수 있는 대상에 대한 설명으로 옳지 않은 것은?",o:["'찾는 대상'을 값·수식·메모 중에서 선택할 수 있다.", "셀 서식(글꼴 색 등)을 지정해 해당 서식의 셀을 찾을 수 있다.", "찾는 방향을 행/열 방향으로 지정할 수 있다.", "찾기는 숨겨진 워크시트의 내용까지 자동으로 모두 검색한다."],a:3,e:"숨겨진 시트는 기본적으로 찾기 대상에서 제외된다(시트를 다시 표시해야 검색됨). 값·수식·메모 검색, 서식 찾기, 방향 지정은 가능하다."},
  {s:"스프레드시트",q:"다음 중 계열 겹치기와 간격 너비에 대한 설명으로 옳지 않은 것은?",o:["계열 겹치기는 -100~100%이며 양수로 갈수록 같은 항목 내 계열이 더 겹친다.", "계열 겹치기 0%는 겹치지 않음, 50%는 절반이 겹침을 의미한다.", "간격 너비는 0~500%이며 500%에 가까울수록 항목 그룹 간 간격이 넓어진다.", "계열 겹치기·간격 너비는 원형 차트와 꺾은선형 차트의 대표 옵션이다."],a:3,e:"계열 겹치기·간격 너비는 <b>세로·가로 막대형 전용</b> 옵션이다."},
  {s:"스프레드시트",q:"다음 중 차트 종류와 용도의 연결로 옳지 않은 것은?",o:["꺾은선형 — 시간·항목에 따른 추세·변화 표시", "영역형 — 시간에 따른 변화 추세와 전체 합계에 대한 각 값의 관계 표시", "표면형 — 두 데이터 집합의 최적 조합을 찾을 때(계열 2개 이상)", "주식형 — 데이터 계열이 하나뿐이어도 시가·종가 등을 자유롭게 표시"],a:3,e:"주식형은 <b>시가·고가·저가·종가 등 정해진 순서</b>로 여러 값을 구성해야 하며 1계열로는 그릴 수 없다."},
  {s:"스프레드시트",q:"다음 중 인쇄 미리 보기 및 페이지 설정에 대한 설명으로 옳지 않은 것은?",o:["[페이지 설정]-[시트]에서 눈금선·행/열 머리글·메모·흑백 인쇄 등을 지정할 수 있다.", "인쇄 배율을 '자동 맞춤'으로 하면 지정한 페이지 수에 맞춰 축소 인쇄된다.", "페이지 나누기 미리 보기에서 파란 실선을 드래그해 인쇄 범위를 조절할 수 있다.", "머리글/바닥글에는 페이지 번호·날짜·그림을 넣을 수 없고 텍스트만 가능하다."],a:3,e:"머리글/바닥글에는 <b>페이지 번호·날짜·시간·파일명·그림</b> 등을 넣을 수 있다."},
  {s:"스프레드시트",q:"다음 중 사용자 지정 표시 형식에 대한 설명으로 옳지 않은 것은?",o:["'양수;음수;0;텍스트' 네 구역을 세미콜론으로 구분하며, 한 구역만 쓰면 모든 값에 적용된다.", "#은 유효하지 않은 0을 표시하지 않고, 0은 자릿수가 모자라면 0을 채운다.", "색·조건은 대괄호 안에 지정하며 조건은 최대 세 개까지 쓸 수 있다.", "@는 텍스트 위치를 뜻하며 @\"님\"은 '홍길동'을 '홍길동님'으로 표시한다."],a:2,e:"사용자 지정 조건은 <b>최대 두 개</b>까지만 지정할 수 있다."},
  {s:"스프레드시트",q:"다음 중 문자 위치를 찾는 함수식의 결과로 옳은 것은? (FIND는 대/소문자 구분·와일드카드 불가, SEARCH는 구분 안 함·와일드카드 가능)\n\n=SEARCH(\"P?J\",\"YOUNGPAJOK MASTER\")",o:["0", "1", "6", "#VALUE!"],a:2,e:"SEARCH는 <b>와일드카드(?,*)</b>를 지원하므로 '?'가 한 글자를 대신해 패턴과 일치하는 시작 위치 <b>6</b>를 찾는다. FIND는 와일드카드를 지원하지 않아 같은 식에서 #VALUE!가 난다."},
  {s:"스프레드시트",q:"셀 [A1:A5]에 다음 값이 입력되어 있다: 19, 26, 31, 37, 65\n다음 수식(제3사분위수)의 결과로 옳은 것은?\n\n=QUARTILE.INC(A1:A5, 3)",o:["38", "37", "36", "65"],a:1,e:"QUARTILE.INC(범위, 3)는 제3사분위수(하위 75% 지점)를 구하며 PERCENTILE.INC(범위,0.75)와 같다. 정렬된 값에서 결과는 <b>37</b>이다."},
  {s:"스프레드시트",q:"아래 시트에서 입력값에 주어진 표시 형식을 적용했을 때, [C2]의 결과로 옳은 것은?",o:["3.14", "1", "005", "1,235"],a:3,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">입력값</td><td class=\"hd\">표시 형식</td><td class=\"hd\">결과</td></tr><tr><td class=\"rh\">2</td><td>1234.6</td><td class=\"l\">#,##0</td><td>?</td></tr></table>",e:"천 단위 콤마 + 정수 반올림 → 1,235"},
  {s:"스프레드시트",q:"다음 중 REPT 함수로 문자를 반복한 결과로 옳은 것은?\n\n=REPT(\"■\",INT(77/10))",o:["■■■■■■", "■■■", "■■■■■■■", "■■■■■■■■"],a:2,e:"INT(77/10)=7이므로 '■'를 <b>7번</b> 반복한다 → ■■■■■■■"},
  {s:"스프레드시트",q:"다음 수식의 실행 결과로 옳은 것은?\n\n=IFS(A1>=90,\"A\",A1>=80,\"B\",A1>=70,\"C\",TRUE,\"F\")   (단, [A1]=31)",o:["A", "B", "C", "F"],a:3,e:"31점은 해당 구간에 따라 'F'를 반환한다."},
  {s:"스프레드시트",q:"왼쪽 기준표([F2:G6], 오름차순)를 이용해 점수 51점의 등급을 구하려고 한다. 가장 적절한 수식은? (구간의 최저점 이상이면 해당 등급)",o:["=VLOOKUP(51,$F$2:$G$6,2,FALSE)", "=VLOOKUP(51,$F$2:$G$6,2,TRUE)", "=VLOOKUP(51,$F$2:$G$6,2,0)", "=HLOOKUP(51,$F$2:$G$6,2,TRUE)"],a:1,fig:"<table class=\"xg\"><tr><th></th><th>F</th><th>G</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">기준점수</td><td class=\"hd\">등급</td></tr><tr><td class=\"rh\">2</td><td>0</td><td class=\"l\">F</td></tr><tr><td class=\"rh\">3</td><td>60</td><td class=\"l\">D</td></tr><tr><td class=\"rh\">4</td><td>70</td><td class=\"l\">C</td></tr><tr><td class=\"rh\">5</td><td>80</td><td class=\"l\">B</td></tr><tr><td class=\"rh\">6</td><td>90</td><td class=\"l\">A</td></tr></table>",e:"구간(범위) 조회는 네 번째 인수를 <b>TRUE(생략 가능, 근사일치)</b>로 두고 기준표가 <b>오름차순</b>이어야 한다. 51점 → <b>F</b>등급. FALSE(정확히 일치)는 기준표에 없는 값이면 #N/A가 난다."},
  {s:"스프레드시트",q:"다음 중 문자 위치를 찾는 함수식의 결과로 옳은 것은? (FIND는 대/소문자 구분·와일드카드 불가, SEARCH는 구분 안 함·와일드카드 가능)\n\n=FIND(\"Y\",\"YOUNGPAJOK\")",o:["1", "0", "#VALUE!", "2"],a:0,e:"FIND(찾을문자, 대상)은 앞에서부터 문자가 처음 나오는 <b>위치(1부터)</b>를 반환한다. \"YOUNGPAJOK\"에서 'Y'의 위치는 <b>1</b>. (공백도 한 글자로 센다.)"},
  {s:"스프레드시트",q:"셀 값이 5,000 이상이면 '녹색', 5,000 미만 800 이상이면 '빨강', 800 미만이면 색을 지정하지 않고, 모든 구간에서 천 단위 구분 기호(,)와 소수 이하 첫째 자리까지 표시하려고 한다. 사용자 지정 표시 형식으로 옳은 것은? (예: 1234.56 → 1,234.6, 432 → 432.0)",o:["[>=5000]<녹색>#,##0.0;[>=800]<빨강>#,##0.0;#,##0.0", "[녹색][>=5000]#,###.#;[빨강][>=800]#,###.#;#,###.#", "[녹색][>=5000]#,##0.0;[빨강][>=800]#,##0.0", "[녹색][>=5000]#,##0.0;[빨강][>=800]#,##0.0;#,##0.0"],a:3,e:"사용자 지정 형식은 <b>[조건·색]양수서식;[조건·색]서식;나머지서식</b> 구조로, 색과 조건은 대괄호 [녹색][>=5000] 안에 넣는다. 소수 첫째 자리는 0을 써서 <b>#,##0.0</b>으로 해야 432가 432.0으로 나온다(#,###.#은 432를 432.로 만들어 틀림). 꺾쇠<>로 색을 넣는 문법은 없다. 정답: <b>[녹색][>=5000]#,##0.0;[빨강][>=800]#,##0.0;#,##0.0</b>"},
  {s:"스프레드시트",q:"다음 중 SUBSTITUTE 함수를 사용한 수식의 실행 결과로 옳은 것은?\n\n=SUBSTITUTE(\"44-76-51-24\",\"-\",\":\",1)",o:["44:76:51:24", "44-76:51-24", "44:76-51-21", "44:76-51-24"],a:3,e:"네 번째 인수 1은(는) 1번째 '-'만 ':'로 바꾼다 → <b>44:76-51-24</b>. (인수를 생략하면 모든 '-'를 바꾼다.)"},
  {s:"스프레드시트",q:"다음 중 수식의 실행 결과가 옳지 않은 것은?",o:["=MOD(4,-4) → 0", "=INT(-8.5) → -9", "=ROUND(331.798,1) → 330.8", "=TRUNC(-2.7) → -2"],a:2,e:"=ROUND(331.798,1)의 올바른 결과는 331.8이다. (INT=내림, TRUNC=절사, MOD=n-d×INT(n/d), ROUND=반올림)"},
  {s:"스프레드시트",q:"다음 중 REPT 함수로 문자를 반복한 결과로 옳은 것은?\n\n=REPT(\"★\",3)&REPT(\"☆\",5-3)",o:["★★★☆☆", "★★★★☆", "★★★", "★★☆☆☆"],a:0,e:"★를 3번, ☆를 2번 이어 붙여 5칸 별점을 만든다 → ★★★☆☆"},
  {s:"스프레드시트",q:"셀 값이 5,000 이상이면 '빨강', 5,000 미만 800 이상이면 '녹색', 800 미만이면 색을 지정하지 않고, 모든 구간에서 천 단위 구분 기호(,)와 소수 이하 첫째 자리까지 표시하려고 한다. 사용자 지정 표시 형식으로 옳은 것은? (예: 1234.56 → 1,234.6, 432 → 432.0)",o:["[빨강][>=5000]#,##0.0;[녹색][>=800]#,##0.0", "[>=5000]<빨강>#,##0.0;[>=800]<녹색>#,##0.0;#,##0.0", "[빨강][>=5000]#,##0.0;[녹색][>=800]#,##0.0;#,##0.0", "[빨강][>=5000]#,###.#;[녹색][>=800]#,###.#;#,###.#"],a:2,e:"사용자 지정 형식은 <b>[조건·색]양수서식;[조건·색]서식;나머지서식</b> 구조로, 색과 조건은 대괄호 [빨강][>=5000] 안에 넣는다. 소수 첫째 자리는 0을 써서 <b>#,##0.0</b>으로 해야 432가 432.0으로 나온다(#,###.#은 432를 432.로 만들어 틀림). 꺾쇠<>로 색을 넣는 문법은 없다. 정답: <b>[빨강][>=5000]#,##0.0;[녹색][>=800]#,##0.0;#,##0.0</b>"}
 ]},
{ name:'기출 13회', q:[
  {s:"컴퓨터일반",q:"다음 중 멀티미디어 관련 용어에 대한 설명으로 옳지 않은 것은?",o:["렌더링은 2차원 이미지에 사실감을 주어 3차원처럼 만드는 기법이다.", "안티앨리어싱은 이미지 경계의 계단 현상을 부드럽게 하는 기법이다.", "모핑은 두 이미지를 자연스럽게 변환·합성하는 기법이다.", "인터레이싱은 색상 수를 줄여 파일 크기를 압축하는 기법이다."],a:3,e:"인터레이싱은 이미지의 대략적인 모습을 먼저 보여 준 뒤 점차 선명하게 표시하는 기법이다. 색상 수를 줄이는 것은 디더링·인덱스 컬러 등과 관련된다."},
  {s:"컴퓨터일반",q:"다음 중 생성형 AI에 대한 설명으로 옳지 않은 것은?",o:["생성형 AI는 텍스트·이미지·음악 등 새로운 콘텐츠를 만들어 낸다.", "대규모 언어 모델(LLM)은 방대한 텍스트로 학습한 생성형 AI의 한 예다.", "프롬프트는 생성형 AI에 입력하는 지시·질문을 뜻한다.", "생성형 AI의 결과는 항상 사실과 일치하므로 출처 확인이 필요 없다."],a:3,e:"생성형 AI는 <b>할루시네이션(그럴듯한 오답)</b>이 생길 수 있어 사실·출처 확인이 반드시 필요하다."},
  {s:"컴퓨터일반",q:"다음 중 Windows 11에서 여러 창을 화면에 자동 배치하는 '스냅' 관련 설명으로 옳지 않은 것은?",o:["창을 화면 가장자리로 끌면 반쪽 크기로 배치된다.", "Win+방향키로 창을 좌/우/모서리에 배치할 수 있다.", "스냅 그룹은 함께 배치한 창들을 묶어 작업 표시줄에서 한 번에 전환한다.", "스냅 기능은 한 번에 최대 2개의 창만 배치할 수 있다."],a:3,e:"스냅 레이아웃은 2·3·4분할 등 여러 형태로 배치할 수 있어 2개 제한이 아니다. 가장자리 끌기·Win+방향키·스냅 그룹 설명은 옳다."},
  {s:"컴퓨터일반",q:"다음 중 인공지능·신기술 용어 연결로 옳지 않은 것은?",o:["머신러닝 — 데이터로 스스로 학습하는 기술", "블록체인 — 분산 장부로 위·변조를 막는 기술", "빅데이터 — 대용량·다양·빠른 데이터를 분석", "딥페이크 — 데이터를 블록으로 묶어 보관하는 저장 장치"],a:3,e:"딥페이크는 인공지능으로 영상·음성을 합성·조작하는 기술이다. 데이터를 블록으로 묶는 것은 블록체인이다."},
  {s:"컴퓨터일반",q:"다음 중 데이터 백업과 복구에 대한 설명으로 옳지 않은 것은?",o:["백업은 데이터 손실에 대비해 사본을 보관하는 것이다.", "증분 백업은 마지막 백업 이후 변경된 부분만 백업한다.", "전체 백업은 모든 데이터를 백업해 복구가 간단하다.", "백업을 자주 할수록 복구가 불가능해진다."],a:3,e:"백업을 자주 할수록 최근 상태로 복구하기 쉬워진다. 전체 백업은 복구가 단순하지만 용량·시간이 크고, 증분 백업은 변경분만 저장해 효율적이다."},
  {s:"컴퓨터일반",q:"다음 중 네트워크 용어에 대한 설명으로 옳지 않은 것은?",o:["대역폭은 단위 시간당 전송할 수 있는 데이터 양이다.", "핑(ping)은 네트워크 연결·응답 시간을 확인한다.", "방화벽은 허가되지 않은 접근을 차단한다.", "IP 주소는 사용자의 실제 이름을 저장하는 공간이다."],a:3,e:"IP 주소는 네트워크에서 장치를 식별하는 '주소'이지 사용자의 이름이 아니다."},
  {s:"컴퓨터일반",q:"다음 중 레지스트리와 시스템 구성(msconfig)에 대한 설명으로 옳지 않은 것은?",o:["레지스트리는 환경 설정·시스템 정보가 저장된 계층 구조식 데이터베이스다.", "[실행]에서 regedit를 입력해 레지스트리 편집기를 열고 값을 수정·삭제할 수 있다.", "레지스트리에는 부팅에 필요한 시스템 파일이 모두 저장되어 손상되면 부팅이 불가능하다.", "msconfig에서 시작 프로그램의 자동 실행 사용/사용 안 함을 설정할 수 있다."],a:2,e:"레지스트리는 설정 정보 DB일 뿐 <b>부팅 파일 자체가 저장되는 것은 아니다</b>."},
  {s:"컴퓨터일반",q:"다음 중 프로그램 카운터(PC, Program Counter)에 대한 설명으로 옳은 것은?",o:["다음에 실행할 명령어의 '주소'를 기억하는 레지스터이다.", "현재 실행 중인 명령어의 내용을 해독하는 레지스터이다.", "연산의 중간 결과를 저장하는 레지스터이다.", "주기억장치에서 읽어온 데이터를 일시 저장하는 레지스터이다."],a:0,e:"PC는 '다음에 실행할 명령어의 주소'를 보관한다. 현재 명령어 자체는 명령 레지스터(IR)에, 연산 중간값은 누산기(AC)에 저장된다."},
  {s:"컴퓨터일반",q:"다음 중 특정 기능만 수행하도록 기계나 장치 내부에 내장되는 시스템을 의미하는 것은?",o:["임베디드 시스템", "메인프레임", "슈퍼컴퓨터", "워크스테이션"],a:0,e:"장치에 내장되어 특정 기능만 하는 것은 <b>임베디드 시스템</b>이다."},
  {s:"컴퓨터일반",q:"다음 중 네트워크 구성(토폴로지)에 대한 설명으로 옳지 않은 것은?",o:["성형(Star)은 중앙 장치에 각 노드를 연결한다.", "링형(Ring)은 노드를 고리 모양으로 연결한다.", "버스형(Bus)은 하나의 통신 회선에 노드를 연결한다.", "성형은 중앙 장치가 고장 나도 전체 통신에 전혀 영향이 없다."],a:3,e:"성형은 중앙 장치(허브/스위치)가 고장 나면 전체 통신이 마비된다. 대신 특정 노드 고장은 다른 노드에 영향이 적다."},
  {s:"컴퓨터일반",q:"다음 중 IP 주소와 도메인 이름에 대한 설명으로 옳지 않은 것은?",o:["도메인 이름은 사람이 기억하기 쉬운 문자 형태의 주소이다.", "DNS 서버가 도메인 이름을 IP 주소로 변환한다.", "하나의 IP 주소에는 반드시 하나의 도메인만 연결된다.", "IPv4 주소는 점으로 구분된 네 부분으로 표기한다."],a:2,e:"하나의 IP 주소에 여러 도메인을 연결(가상 호스팅)할 수 있고, 반대로 한 도메인이 여러 IP를 가질 수도 있다. 1:1만 가능하다는 설명은 틀리다."},
  {s:"컴퓨터일반",q:"다음 중 ROM에 저장되어 컴퓨터를 켜면 가장 먼저 실행되며 하드웨어를 점검하는 프로그램은?",o:["BIOS", "운영체제 셸", "워드프로세서", "장치 관리자"],a:0,e:"전원을 켜면 ROM의 BIOS가 먼저 실행되어 하드웨어를 점검(POST)하고 부팅 장치를 찾아 운영체제를 불러온다."},
  {s:"컴퓨터일반",q:"다음 중 소프트웨어 사용권(라이선스)에 대한 설명으로 옳지 않은 것은?",o:["프리웨어는 무료지만 저작권은 제작자에게 있다.", "오픈소스는 소스 코드가 공개되어 수정·배포가 허용된다.", "공개 소프트웨어라도 상업적 이용에 제한이 있을 수 있다.", "셰어웨어는 모든 기능을 영구히 무료로 쓸 수 있는 소프트웨어다."],a:3,e:"셰어웨어는 <b>기능·기간 제한</b>이 있고 정식 사용 시 비용을 낸다."},
  {s:"컴퓨터일반",q:"다음 중 실제 사물과 똑같은 가상 모델을 만들어 시뮬레이션·분석하는 기술을 의미하는 것은?",o:["디지털 트윈", "증강현실", "블록체인", "빅데이터"],a:0,e:"현실 사물의 쌍둥이 가상 모델은 <b>디지털 트윈</b>이다."},
  {s:"컴퓨터일반",q:"다음 중 AI 학습에 쓰이는 '데이터 레이블링'에 대한 설명으로 옳은 것은?",o:["모델이 스스로 데이터를 생성하는 작업이다.", "학습 데이터에 정답(라벨)을 붙이는 작업이다.", "학습이 끝난 모델을 압축하는 작업이다.", "데이터를 암호화하는 작업이다."],a:1,e:"데이터 레이블링은 <b>학습 데이터에 정답(라벨)을 붙이는</b> 작업이다."},
  {s:"컴퓨터일반",q:"다음 중 저장 매체의 용량이 큰 것부터 작은 순서로 일반적으로 옳은 것은?",o:["블루레이 > DVD > CD > 플로피디스크", "CD > DVD > 블루레이 > 플로피디스크", "플로피디스크 > CD > DVD > 블루레이", "DVD > 블루레이 > 플로피디스크 > CD"],a:0,e:"일반적 용량은 블루레이(25GB~) > DVD(4.7GB~) > CD(700MB) > 플로피디스크(1.44MB) 순이다."},
  {s:"컴퓨터일반",q:"다음 두 8비트 값에 비트 단위 OR 연산을 수행한 결과로 옳은 것은?\n\n01010111 OR 10110011",o:["00010011", "10101000", "11100100", "11110111"],a:3,e:"비트 OR은 각 자리에서 하나라도 1이면 1 → <b>11110111</b>."},
  {s:"컴퓨터일반",q:"다음 두 8비트 값에 비트 단위 OR 연산을 수행한 결과로 옳은 것은?\n\n00100001 OR 00011110",o:["00000000", "222222", "00111111", "11011110"],a:2,e:"비트 OR은 각 자리에서 하나라도 1이면 1 → <b>00111111</b>."},
  {s:"컴퓨터일반",q:"다음 중 샘플링 22kHz, 양자화 8비트, 스테레오(2채널)로 60초간 녹음한 비압축 디지털 오디오의 용량으로 가장 가까운 것은?",o:["약 1.3MB", "약 20.1MB", "약 2.5MB", "약 5.0MB"],a:2,e:"오디오 용량 = 샘플링 주파수 × (양자화 비트÷8) × 채널 수 × 시간 = 22,000 × 1 × 2 × 60 = <b>2,640,000 Byte</b> ≒ 약 2.5MB."},
  {s:"컴퓨터일반",q:"다음 두 8비트 값에 비트 단위 AND 연산을 수행한 결과로 옳은 것은?\n\n11100011 AND 10100011",o:["10100011", "11100011", "01000000", "00011100"],a:0,e:"비트 AND은 각 자리에서 둘 다 1일 때만 1 → <b>10100011</b>."},
  {s:"스프레드시트",q:"다음 수식의 실행 결과로 옳은 것은?\n\n=IFS(A1>=90,\"A\",A1>=80,\"B\",A1>=70,\"C\",TRUE,\"F\")   (단, [A1]=28)",o:["A", "B", "C", "F"],a:3,e:"28점은 해당 구간에 따라 'F'를 반환한다."},
  {s:"스프레드시트",q:"다음 중 문자 위치를 찾는 함수식의 결과로 옳은 것은? (FIND는 대/소문자 구분·와일드카드 불가, SEARCH는 구분 안 함·와일드카드 가능)\n\n=SEARCH(\"P?J\",\"YOUNGPAJOK STUDY\")",o:["0", "1", "#VALUE!", "6"],a:3,e:"SEARCH는 <b>와일드카드(?,*)</b>를 지원하므로 '?'가 한 글자를 대신해 패턴과 일치하는 시작 위치 <b>6</b>를 찾는다. FIND는 와일드카드를 지원하지 않아 같은 식에서 #VALUE!가 난다."},
  {s:"스프레드시트",q:"아래 표에서 전체 판매 금액(수량×단가의 합계)을 한 번에 구하려고 한다. 가장 적절한 수식은? (참고: 총액 207,000원)",o:["=SUMPRODUCT(B2:B4,C2:C4)", "=SUM(B2:B4)*SUM(C2:C4)", "=SUMPRODUCT(B2:B4+C2:C4)", "=SUM(B2:B4*C2:C4)"],a:0,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">품목</td><td class=\"hd\">수량</td><td class=\"hd\">단가</td></tr><tr><td class=\"rh\">2</td><td>풀</td><td>8</td><td>11,000</td></tr><tr><td class=\"rh\">3</td><td>노트</td><td>7</td><td>8,000</td></tr><tr><td class=\"rh\">4</td><td>지우개</td><td>7</td><td>9,000</td></tr></table>",e:"<b>SUMPRODUCT(배열1, 배열2)</b>는 대응하는 원소끼리 곱한 뒤 모두 더한다 → <b>207,000</b>원. =SUM(B*C)는 일반 입력 시 배열이 아니라 오류/단일값이 되고(배열 입력해야 함), SUM(B)*SUM(C)는 합끼리 곱해 의미가 다르다."},
  {s:"스프레드시트",q:"셀 값이 2,000 이상이면 '자홍', 2,000 미만 300 이상이면 '녹색', 300 미만이면 색을 지정하지 않고, 모든 구간에서 천 단위 구분 기호(,)와 소수 이하 첫째 자리까지 표시하려고 한다. 사용자 지정 표시 형식으로 옳은 것은? (예: 1234.56 → 1,234.6, 432 → 432.0)",o:["[>=2000]<자홍>#,##0.0;[>=300]<녹색>#,##0.0;#,##0.0", "[자홍][>=2000]#,##0.0;[녹색][>=300]#,##0.0;#,##0.0", "[자홍][>=2000]#,##0.0;[녹색][>=300]#,##0.0", "[자홍][>=2000]#,###.#;[녹색][>=300]#,###.#;#,###.#"],a:1,e:"사용자 지정 형식은 <b>[조건·색]양수서식;[조건·색]서식;나머지서식</b> 구조로, 색과 조건은 대괄호 [자홍][>=2000] 안에 넣는다. 소수 첫째 자리는 0을 써서 <b>#,##0.0</b>으로 해야 432가 432.0으로 나온다(#,###.#은 432를 432.로 만들어 틀림). 꺾쇠<>로 색을 넣는 문법은 없다. 정답: <b>[자홍][>=2000]#,##0.0;[녹색][>=300]#,##0.0;#,##0.0</b>"},
  {s:"스프레드시트",q:"다음 중 REPT 함수로 문자를 반복한 결과로 옳은 것은?\n\n=REPT(\"★\",4)&REPT(\"☆\",5-4)",o:["★☆☆☆☆", "★★★★", "★★★★★", "★★★★☆"],a:3,e:"★를 4번, ☆를 1번 이어 붙여 5칸 별점을 만든다 → ★★★★☆"},
  {s:"스프레드시트",q:"다음 중 문자 위치를 찾는 함수식의 결과로 옳은 것은? (FIND는 대/소문자 구분·와일드카드 불가, SEARCH는 구분 안 함·와일드카드 가능)\n\n=FIND(\"a\",\"YOUNGPAJOK STUDY\")",o:["1", "7", "#VALUE!", "0"],a:2,e:"FIND는 <b>대/소문자를 구분</b>한다. 대상 \"YOUNGPAJOK STUDY\"에 소문자 'a'가 없으면 <b>#VALUE! 오류</b>가 난다. 대소문자를 무시하려면 SEARCH를 써야 한다 (=SEARCH(\"a\",\"YOUNGPAJOK STUDY\") → 7)."},
  {s:"스프레드시트",q:"다음 중 SUBSTITUTE 함수를 사용한 수식의 실행 결과로 옳은 것은?\n\n=SUBSTITUTE(\"59-92-89-79\",\"-\",\":\")",o:["59-92-89-79", "59:92:89:79", "59:92:89-79", "59:92-89-79"],a:1,e:"SUBSTITUTE(문자열, 찾을값, 바꿀값)에서 네 번째 인수를 생략하면 '-'를 <b>모두</b> ':'로 바꾼다 → <b>59:92:89:79</b>."},
  {s:"스프레드시트",q:"다음 중 수식의 실행 결과가 옳지 않은 것은?",o:["=INT(-8.4) → -9", "=MOD(-7,3) → 2", "=TRUNC(-4.1) → -4", "=ROUND(299.356,1) → 298.4"],a:3,e:"=ROUND(299.356,1)의 올바른 결과는 299.4이다. (INT=내림, TRUNC=절사, MOD=n-d×INT(n/d), ROUND=반올림)"},
  {s:"스프레드시트",q:"왼쪽 기준표([F2:G6], 오름차순)를 이용해 점수 34점의 등급을 구하려고 한다. 가장 적절한 수식은? (구간의 최저점 이상이면 해당 등급)",o:["=VLOOKUP(34,$F$2:$G$6,2,FALSE)", "=VLOOKUP(34,$F$2:$G$6,2,TRUE)", "=VLOOKUP(34,$F$2:$G$6,2,0)", "=HLOOKUP(34,$F$2:$G$6,2,TRUE)"],a:1,fig:"<table class=\"xg\"><tr><th></th><th>F</th><th>G</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">기준점수</td><td class=\"hd\">등급</td></tr><tr><td class=\"rh\">2</td><td>0</td><td class=\"l\">F</td></tr><tr><td class=\"rh\">3</td><td>60</td><td class=\"l\">D</td></tr><tr><td class=\"rh\">4</td><td>70</td><td class=\"l\">C</td></tr><tr><td class=\"rh\">5</td><td>80</td><td class=\"l\">B</td></tr><tr><td class=\"rh\">6</td><td>90</td><td class=\"l\">A</td></tr></table>",e:"구간(범위) 조회는 네 번째 인수를 <b>TRUE(생략 가능, 근사일치)</b>로 두고 기준표가 <b>오름차순</b>이어야 한다. 34점 → <b>F</b>등급. FALSE(정확히 일치)는 기준표에 없는 값이면 #N/A가 난다."},
  {s:"스프레드시트",q:"아래 표에서 전체 판매 금액(수량×단가의 합계)을 한 번에 구하려고 한다. 가장 적절한 수식은? (참고: 총액 132,000원)",o:["=SUMPRODUCT(B2:B4,C2:C4)", "=SUM(B2:B4*C2:C4)", "=SUMPRODUCT(B2:B4+C2:C4)", "=SUM(B2:B4)*SUM(C2:C4)"],a:0,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">품목</td><td class=\"hd\">수량</td><td class=\"hd\">단가</td></tr><tr><td class=\"rh\">2</td><td>노트</td><td>6</td><td>11,000</td></tr><tr><td class=\"rh\">3</td><td>지우개</td><td>6</td><td>9,000</td></tr><tr><td class=\"rh\">4</td><td>연필</td><td>3</td><td>4,000</td></tr></table>",e:"<b>SUMPRODUCT(배열1, 배열2)</b>는 대응하는 원소끼리 곱한 뒤 모두 더한다 → <b>132,000</b>원. =SUM(B*C)는 일반 입력 시 배열이 아니라 오류/단일값이 되고(배열 입력해야 함), SUM(B)*SUM(C)는 합끼리 곱해 의미가 다르다."},
  {s:"스프레드시트",q:"왼쪽 기준표([F2:G6], 오름차순)를 이용해 점수 39점의 등급을 구하려고 한다. 가장 적절한 수식은? (구간의 최저점 이상이면 해당 등급)",o:["=VLOOKUP(39,$F$2:$G$6,2,0)", "=HLOOKUP(39,$F$2:$G$6,2,TRUE)", "=VLOOKUP(39,$F$2:$G$6,2,FALSE)", "=VLOOKUP(39,$F$2:$G$6,2,TRUE)"],a:3,fig:"<table class=\"xg\"><tr><th></th><th>F</th><th>G</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">기준점수</td><td class=\"hd\">등급</td></tr><tr><td class=\"rh\">2</td><td>0</td><td class=\"l\">F</td></tr><tr><td class=\"rh\">3</td><td>60</td><td class=\"l\">D</td></tr><tr><td class=\"rh\">4</td><td>70</td><td class=\"l\">C</td></tr><tr><td class=\"rh\">5</td><td>80</td><td class=\"l\">B</td></tr><tr><td class=\"rh\">6</td><td>90</td><td class=\"l\">A</td></tr></table>",e:"구간(범위) 조회는 네 번째 인수를 <b>TRUE(생략 가능, 근사일치)</b>로 두고 기준표가 <b>오름차순</b>이어야 한다. 39점 → <b>F</b>등급. FALSE(정확히 일치)는 기준표에 없는 값이면 #N/A가 난다."},
  {s:"스프레드시트",q:"셀 [A1:A9]에 다음 값이 입력되어 있다: 17, 24, 45, 54, 58, 61, 66, 67, 75\n다음 수식(50% 지점(백분위수))의 결과로 옳은 것은?\n\n=PERCENTILE.INC(A1:A9, 0.5)",o:["58", "61", "57", "59"],a:0,e:"PERCENTILE.INC(범위, 0.5)는 데이터를 오름차순 정렬했을 때 하위 50% 위치의 값을 구한다. 정렬된 9개 값에서 그 위치의 값은 <b>58</b>이다."},
  {s:"스프레드시트",q:"다음 중 날짜 함수 수식의 실행 결과로 옳은 것은?\n\n=EDATE(\"2025-07-10\",2)",o:["2025-09-08", "2025-09-11", "2025-09-10", "2025-09-01"],a:2,e:"EDATE는 기준일에서 지정한 개월 수(2개월) 뒤의 '같은 날'을 반환한다 → <b>2025-09-10</b>."},
  {s:"스프레드시트",q:"다음 중 SUBSTITUTE 함수를 사용한 수식의 실행 결과로 옳은 것은?\n\n=SUBSTITUTE(\"44-80-53-26\",\"-\",\":\",1)",o:["44:80-53-26", "44:80-53-21", "44-80:53-26", "44:80:53:26"],a:0,e:"네 번째 인수 1은(는) 1번째 '-'만 ':'로 바꾼다 → <b>44:80-53-26</b>. (인수를 생략하면 모든 '-'를 바꾼다.)"},
  {s:"스프레드시트",q:"다음 중 REPT 함수로 문자를 반복한 결과로 옳은 것은?\n\n=REPT(\"★\",5)&REPT(\"☆\",5-5)",o:["★★★★1", "★★★★★★", "☆☆☆☆☆", "★★★★★"],a:3,e:"★를 5번, ☆를 0번 이어 붙여 5칸 별점을 만든다 → ★★★★★"},
  {s:"스프레드시트",q:"셀 [A1:A9]에 다음 값이 입력되어 있다: 25, 61, 68, 72, 79, 83, 85, 86, 95\n다음 수식(제2사분위수)의 결과로 옳은 것은?\n\n=QUARTILE.INC(A1:A9, 2)",o:["79", "78", "80", "83"],a:0,e:"QUARTILE.INC(범위, 2)는 제2사분위수(하위 50% 지점)를 구하며 PERCENTILE.INC(범위,0.5)와 같다. 정렬된 값에서 결과는 <b>79</b>이다."},
  {s:"스프레드시트",q:"아래 시트에서 부서가 '인사부'인 직원의 급여 합계를 [F2]에 구하려 한다. 입력할 수식으로 옳은 것은?",o:["=SUMIF(D2:D4,\"인사부\",B2:B4)", "=DSUM(B2:B4,\"인사부\",D2:D4)", "=COUNTIF(B2:B4,\"인사부\")", "=SUMIF(B2:B4,\"인사부\",D2:D4)"],a:3,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">이름</td><td class=\"hd\">부서</td><td class=\"hd\">직급</td><td class=\"hd\">급여</td></tr><tr><td class=\"rh\">2</td><td>박세찬</td><td class=\"l\">인사부</td><td>대리</td><td>2,800,000</td></tr><tr><td class=\"rh\">3</td><td>윤서준</td><td class=\"l\">기획부</td><td>대리</td><td>4,400,000</td></tr><tr><td class=\"rh\">4</td><td>오지민</td><td class=\"l\">기획부</td><td>사원</td><td>2,400,000</td></tr></table>",e:"SUMIF(<b>조건범위, 조건, 합계범위</b>) → 부서(B)에서 '인사부'를 찾아 급여(D)를 더한다."},
  {s:"스프레드시트",q:"다음 중 날짜 함수 수식의 실행 결과로 옳은 것은?\n\n=WORKDAY(\"2025-08-15\",7)",o:["2025-08-25", "2025-08-26", "2025-08-22", "2025-08-27"],a:1,e:"WORKDAY는 주말(토·일)을 제외하고 7 '근무일' 뒤의 날짜를 반환한다 → <b>2025-08-26</b>."},
  {s:"스프레드시트",q:"아래 시트에서 부서가 '영업부'인 직원의 급여 합계를 [F2]에 구하려 한다. 입력할 수식으로 옳은 것은?",o:["=COUNTIF(B2:B4,\"영업부\")", "=SUMIF(D2:D4,\"영업부\",B2:B4)", "=SUMIF(B2:B4,\"영업부\",D2:D4)", "=DSUM(B2:B4,\"영업부\",D2:D4)"],a:2,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">이름</td><td class=\"hd\">부서</td><td class=\"hd\">직급</td><td class=\"hd\">급여</td></tr><tr><td class=\"rh\">2</td><td>오지민</td><td class=\"l\">총무부</td><td>과장</td><td>4,400,000</td></tr><tr><td class=\"rh\">3</td><td>정우진</td><td class=\"l\">총무부</td><td>사원</td><td>2,800,000</td></tr><tr><td class=\"rh\">4</td><td>윤서준</td><td class=\"l\">인사부</td><td>사원</td><td>3,600,000</td></tr></table>",e:"SUMIF(<b>조건범위, 조건, 합계범위</b>) → 부서(B)에서 '영업부'를 찾아 급여(D)를 더한다."},
  {s:"스프레드시트",q:"다음 수식의 실행 결과로 옳은 것은?\n\n=IF(MOD(A1,4)=0,\"배수\",\"아님\")   (단, [A1]=91)",o:["배수", "아님", "0", "TRUE"],a:1,e:"MOD(91,4)=3 → 아님"}
 ]},
{ name:'기출 14회', q:[
  {s:"컴퓨터일반",q:"다음 중 인공지능으로 영상·음성을 합성해 진짜처럼 조작한 가짜 콘텐츠를 의미하는 것은?",o:["딥페이크", "스트리밍", "캡차", "쿠키"],a:0,e:"AI로 합성한 가짜 영상·음성은 <b>딥페이크</b>다."},
  {s:"컴퓨터일반",q:"다음 중 데이터 단위에 대한 설명으로 옳지 않은 것은?",o:["비트(bit)는 0 또는 1을 나타내는 최소 단위이다.", "1바이트는 8비트이다.", "필드는 레코드보다 큰 자료 구성 단위이다.", "레코드는 여러 필드가 모여 이룬다."],a:2,e:"자료 구성 단위는 필드 < 레코드 < 파일 순이므로 필드는 레코드보다 '작은' 단위이다."},
  {s:"컴퓨터일반",q:"다음 중 Windows 11의 '집중 지원/방해 금지(Do not disturb)'와 알림에 대한 설명으로 옳지 않은 것은?",o:["방해 금지를 켜면 알림이 알림 센터에만 쌓이고 배너로 튀어나오지 않는다.", "빠른 설정은 <b>Win+A</b>로 열어 Wi-Fi·블루투스·볼륨 등을 조절한다.", "알림 센터와 달력은 작업 표시줄의 날짜·시간을 클릭하거나 <b>Win+N</b>으로 연다.", "방해 금지를 켜면 받은 알림이 모두 삭제되어 나중에 확인할 수 없다."],a:3,e:"방해 금지 중에도 알림은 삭제되지 않고 알림 센터(Win+N)에 모였다가 나중에 확인할 수 있다. 빠른 설정은 Win+A로 연다."},
  {s:"컴퓨터일반",q:"다음 중 입력장치와 출력장치의 구분으로 옳지 않은 것은?",o:["스캐너 — 입력장치", "OMR(광학 마크 판독기) — 입력장치", "플로터 — 출력장치", "터치스크린 — 출력 전용 장치"],a:3,e:"터치스크린은 화면 출력과 터치 입력을 함께 수행하는 '입·출력 겸용' 장치이다. 출력 전용이 아니다."},
  {s:"컴퓨터일반",q:"다음 중 멀티미디어의 특징으로 옳지 않은 것은?",o:["디지털화(Digitalization)되어 통합 처리된다.", "쌍방향(Interactive)으로 정보를 주고받는다.", "여러 매체를 하나로 통합(Integration)해 다룬다.", "정보가 순서대로만 선형적으로 전달되어 비선형 접근은 불가능하다."],a:3,e:"멀티미디어는 하이퍼링크 등으로 <b>비선형(비순차)</b> 접근이 가능하다."},
  {s:"컴퓨터일반",q:"다음 중 인공지능(AI)에 대한 설명으로 옳지 않은 것은?",o:["인공지능은 학습·추론·인식 등 인간의 지적 능력을 컴퓨터로 구현하는 기술이다.", "약(좁은) 인공지능은 특정 작업에 특화된 AI로, 현재 상용 AI 대부분이 여기 속한다.", "강(범용) 인공지능은 인간 수준의 폭넓은 지능을 갖춘 AI를 말한다.", "머신러닝은 규칙을 사람이 일일이 입력해야만 동작하는 전통적 프로그래밍 방식이다."],a:3,e:"머신러닝은 <b>데이터로부터 규칙(패턴)을 스스로 학습</b>한다. 규칙을 일일이 입력하는 것은 전통적 방식이다."},
  {s:"컴퓨터일반",q:"다음 중 그래픽 데이터 표현 방식에 대한 설명으로 옳지 않은 것은?",o:["비트맵은 픽셀의 집합으로 이미지를 표현한다.", "벡터는 점·선·면을 수학적 좌표로 표현해 확대해도 깨지지 않는다.", "비트맵은 벡터보다 확대 시 화질 저하가 적다.", "비트맵 파일 형식에는 BMP, JPG, GIF, PNG 등이 있다."],a:2,e:"비트맵은 확대하면 픽셀이 커지며 계단 현상(앨리어싱)이 생겨 화질이 '저하'된다. 확대에 강한 것은 벡터이다."},
  {s:"컴퓨터일반",q:"다음 중 자료를 미리 정한 규칙에 따라 암호문으로 바꾸어 제3자가 알아볼 수 없게 하는 것을 의미하는 것은?",o:["암호화", "압축", "인코딩", "정규화"],a:0,e:"알아볼 수 없게 암호문으로 바꾸는 것은 <b>암호화</b>다."},
  {s:"컴퓨터일반",q:"다음 중 Windows의 '제어판/설정'에서 할 수 있는 작업으로 옳지 않은 것은?",o:["앱 제거 및 변경", "기본 앱 설정", "날짜·시간 변경", "엑셀 수식의 자동 계산 켜기"],a:3,e:"엑셀 수식의 자동 계산은 엑셀 '옵션'에서 설정하는 것으로 Windows 설정과 무관하다. 앱 제거·기본 앱·날짜·시간 등은 Windows 설정에서 한다."},
  {s:"컴퓨터일반",q:"다음 중 클라우드 저장소(예: 드라이브)에 대한 설명으로 옳지 않은 것은?",o:["인터넷으로 어디서나 파일에 접근할 수 있다.", "여러 기기에서 동기화할 수 있다.", "파일을 공유·협업할 수 있다.", "인터넷 연결 없이도 서버의 모든 파일을 항상 열람할 수 있다."],a:3,e:"클라우드 저장소의 서버 파일을 보려면 기본적으로 인터넷 연결이 필요하다(일부 오프라인 캐시 제외)."},
  {s:"컴퓨터일반",q:"다음 중 인공지능 관련 용어의 포함 관계로 옳은 것은?",o:["인공지능 ⊃ 머신러닝 ⊃ 딥러닝", "딥러닝 ⊃ 머신러닝 ⊃ 인공지능", "머신러닝 ⊃ 인공지능 ⊃ 딥러닝", "딥러닝 ⊃ 인공지능 ⊃ 머신러닝"],a:0,e:"가장 넓은 개념이 인공지능이고, 그 하위에 머신러닝, 다시 그 하위에 신경망 기반의 딥러닝이 포함된다 (인공지능 ⊃ 머신러닝 ⊃ 딥러닝)."},
  {s:"컴퓨터일반",q:"다음 중 프린터 인쇄 방식에 대한 설명으로 옳지 않은 것은?",o:["잉크젯 프린터는 노즐로 잉크를 분사해 인쇄하며 해상도는 DPI로 표시한다.", "레이저 프린터는 토너를 사용하며 인쇄 속도 단위로 PPM을 쓴다.", "도트 매트릭스는 핀으로 리본을 때려 인쇄하며 소음이 크다.", "인쇄 속도 단위 CPS는 레이저 프린터의 분당 인쇄 매수를 뜻한다."],a:3,e:"CPS(Character Per Second)는 <b>도트 매트릭스</b> 등의 속도 단위다. 레이저는 PPM이다."},
  {s:"컴퓨터일반",q:"다음 중 모바일 운영체제로 옳은 것끼리 짝지은 것은?",o:["Android, iOS", "Windows, Excel", "Photoshop, Android", "iOS, Hangul"],a:0,e:"대표적 모바일 운영체제는 구글의 Android와 애플의 iOS이다. Excel·Photoshop·Hangul은 응용 프로그램이다."},
  {s:"컴퓨터일반",q:"다음 중 암호화 기법에 대한 설명으로 옳지 않은 것은?",o:["비밀키(대칭키) 암호화는 암호화·복호화에 같은 키를 사용한다.", "공개키(비대칭키) 암호화는 서로 다른 키를 사용한다.", "공개키 방식은 비밀키 방식보다 암호화 속도가 빠르다.", "DES는 대표적인 비밀키 암호화 방식이다."],a:2,e:"공개키(비대칭) 방식은 키 분배가 쉬운 대신 암·복호화 속도가 '느리다'. 비밀키(대칭, 예: DES)는 빠르지만 키 분배가 어렵다."},
  {s:"컴퓨터일반",q:"다음 중 하나의 물리적 컴퓨터에서 여러 개의 가상 컴퓨터를 만들어 운영하는 기술을 의미하는 것은?",o:["가상화", "이중화", "다중화", "정규화"],a:0,e:"하나의 하드웨어에서 여러 가상 머신을 운영하는 것은 <b>가상화</b>다."},
  {s:"컴퓨터일반",q:"다음 중 내부 네트워크와 외부(인터넷) 사이에서 대신 요청을 처리하고 캐싱·보안 기능을 하는 중계 서버를 의미하는 것은?",o:["프록시 서버", "DNS 서버", "웹 서버", "메일 서버"],a:0,e:"대리 요청·캐싱을 하는 중계 서버는 <b>프록시 서버</b>다."},
  {s:"컴퓨터일반",q:"다음 중 가로 1280픽셀 × 세로 720픽셀, 한 픽셀을 16비트로 표현하는 비압축 비트맵 이미지의 용량으로 옳은 것은? (1KB=1,024Byte)",o:["900KB", "1,800KB", "3,600KB", "600KB"],a:1,e:"비트맵 용량 = 가로×세로×색 깊이(비트)÷8 = 1280×720×16÷8 = <b>1,843,200 Byte</b> ≒ 1,800KB."},
  {s:"컴퓨터일반",q:"다음 중 샘플링 44kHz, 양자화 8비트, 모노(1채널)로 10초간 녹음한 비압축 디지털 오디오의 용량으로 가장 가까운 것은?",o:["약 0.2MB", "약 0.8MB", "약 3.4MB", "약 0.4MB"],a:3,e:"오디오 용량 = 샘플링 주파수 × (양자화 비트÷8) × 채널 수 × 시간 = 44,000 × 1 × 1 × 10 = <b>440,000 Byte</b> ≒ 약 0.4MB."},
  {s:"컴퓨터일반",q:"다음 중 샘플링 22kHz, 양자화 16비트, 스테레오(2채널)로 10초간 녹음한 비압축 디지털 오디오의 용량으로 가장 가까운 것은?",o:["약 0.4MB", "약 13.4MB", "약 0.8MB", "약 1.7MB"],a:2,e:"오디오 용량 = 샘플링 주파수 × (양자화 비트÷8) × 채널 수 × 시간 = 22,000 × 2 × 2 × 10 = <b>880,000 Byte</b> ≒ 약 0.8MB."},
  {s:"컴퓨터일반",q:"다음 중 샘플링 44kHz, 양자화 8비트, 스테레오(2채널)로 10초간 녹음한 비압축 디지털 오디오의 용량으로 가장 가까운 것은?",o:["약 6.7MB", "약 1.7MB", "약 0.4MB", "약 0.8MB"],a:3,e:"오디오 용량 = 샘플링 주파수 × (양자화 비트÷8) × 채널 수 × 시간 = 44,000 × 1 × 2 × 10 = <b>880,000 Byte</b> ≒ 약 0.8MB."},
  {s:"스프레드시트",q:"다음 수식의 실행 결과로 옳은 것은?\n\n=IF(MOD(A1,3)=0,\"배수\",\"아님\")   (단, [A1]=32)",o:["배수", "아님", "0", "TRUE"],a:1,e:"MOD(32,3)=2 → 아님"},
  {s:"스프레드시트",q:"다음 수식의 실행 결과로 옳은 것은?\n\n=IF(MOD(A1,2)=0,\"짝수\",\"홀수\")   (단, [A1]=36)",o:["짝수", "홀수", "0", "#VALUE!"],a:0,e:"MOD(36,2)=0 → 짝수"},
  {s:"스프레드시트",q:"셀 값이 1,000 이상이면 '녹색', 1,000 미만 300 이상이면 '자홍', 300 미만이면 색을 지정하지 않고, 모든 구간에서 천 단위 구분 기호(,)와 소수 이하 첫째 자리까지 표시하려고 한다. 사용자 지정 표시 형식으로 옳은 것은? (예: 1234.56 → 1,234.6, 432 → 432.0)",o:["[녹색][>=1000]#,###.#;[자홍][>=300]#,###.#;#,###.#", "[녹색][>=1000]#,##0.0;[자홍][>=300]#,##0.0", "[>=1000]<녹색>#,##0.0;[>=300]<자홍>#,##0.0;#,##0.0", "[녹색][>=1000]#,##0.0;[자홍][>=300]#,##0.0;#,##0.0"],a:3,e:"사용자 지정 형식은 <b>[조건·색]양수서식;[조건·색]서식;나머지서식</b> 구조로, 색과 조건은 대괄호 [녹색][>=1000] 안에 넣는다. 소수 첫째 자리는 0을 써서 <b>#,##0.0</b>으로 해야 432가 432.0으로 나온다(#,###.#은 432를 432.로 만들어 틀림). 꺾쇠<>로 색을 넣는 문법은 없다. 정답: <b>[녹색][>=1000]#,##0.0;[자홍][>=300]#,##0.0;#,##0.0</b>"},
  {s:"스프레드시트",q:"아래 표에서 전체 판매 금액(수량×단가의 합계)을 한 번에 구하려고 한다. 가장 적절한 수식은? (참고: 총액 210,000원)",o:["=SUMPRODUCT(B2:B4+C2:C4)", "=SUM(B2:B4*C2:C4)", "=SUMPRODUCT(B2:B4,C2:C4)", "=SUM(B2:B4)*SUM(C2:C4)"],a:2,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">품목</td><td class=\"hd\">수량</td><td class=\"hd\">단가</td></tr><tr><td class=\"rh\">2</td><td>연필</td><td>6</td><td>7,000</td></tr><tr><td class=\"rh\">3</td><td>지우개</td><td>7</td><td>15,000</td></tr><tr><td class=\"rh\">4</td><td>자</td><td>9</td><td>7,000</td></tr></table>",e:"<b>SUMPRODUCT(배열1, 배열2)</b>는 대응하는 원소끼리 곱한 뒤 모두 더한다 → <b>210,000</b>원. =SUM(B*C)는 일반 입력 시 배열이 아니라 오류/단일값이 되고(배열 입력해야 함), SUM(B)*SUM(C)는 합끼리 곱해 의미가 다르다."},
  {s:"스프레드시트",q:"셀 [A1:A9]에 다음 값이 입력되어 있다: 18, 20, 28, 57, 59, 60, 91, 96, 97\n다음 수식(50% 지점(백분위수))의 결과로 옳은 것은?\n\n=PERCENTILE.INC(A1:A9, 0.5)",o:["60", "59", "57", "58"],a:1,e:"PERCENTILE.INC(범위, 0.5)는 데이터를 오름차순 정렬했을 때 하위 50% 위치의 값을 구한다. 정렬된 9개 값에서 그 위치의 값은 <b>59</b>이다."},
  {s:"스프레드시트",q:"왼쪽 기준표([F2:G6], 오름차순)를 이용해 점수 88점의 등급을 구하려고 한다. 가장 적절한 수식은? (구간의 최저점 이상이면 해당 등급)",o:["=VLOOKUP(88,$F$2:$G$6,2,0)", "=VLOOKUP(88,$F$2:$G$6,2,FALSE)", "=HLOOKUP(88,$F$2:$G$6,2,TRUE)", "=VLOOKUP(88,$F$2:$G$6,2,TRUE)"],a:3,fig:"<table class=\"xg\"><tr><th></th><th>F</th><th>G</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">기준점수</td><td class=\"hd\">등급</td></tr><tr><td class=\"rh\">2</td><td>0</td><td class=\"l\">F</td></tr><tr><td class=\"rh\">3</td><td>60</td><td class=\"l\">D</td></tr><tr><td class=\"rh\">4</td><td>70</td><td class=\"l\">C</td></tr><tr><td class=\"rh\">5</td><td>80</td><td class=\"l\">B</td></tr><tr><td class=\"rh\">6</td><td>90</td><td class=\"l\">A</td></tr></table>",e:"구간(범위) 조회는 네 번째 인수를 <b>TRUE(생략 가능, 근사일치)</b>로 두고 기준표가 <b>오름차순</b>이어야 한다. 88점 → <b>B</b>등급. FALSE(정확히 일치)는 기준표에 없는 값이면 #N/A가 난다."},
  {s:"스프레드시트",q:"아래 표에서 전체 판매 금액(수량×단가의 합계)을 한 번에 구하려고 한다. 가장 적절한 수식은? (참고: 총액 162,000원)",o:["=SUMPRODUCT(B2:B5+C2:C5)", "=SUM(B2:B5)*SUM(C2:C5)", "=SUM(B2:B5*C2:C5)", "=SUMPRODUCT(B2:B5,C2:C5)"],a:3,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">품목</td><td class=\"hd\">수량</td><td class=\"hd\">단가</td></tr><tr><td class=\"rh\">2</td><td>펜</td><td>7</td><td>8,000</td></tr><tr><td class=\"rh\">3</td><td>노트</td><td>6</td><td>8,000</td></tr><tr><td class=\"rh\">4</td><td>연필</td><td>8</td><td>4,000</td></tr><tr><td class=\"rh\">5</td><td>자</td><td>2</td><td>13,000</td></tr></table>",e:"<b>SUMPRODUCT(배열1, 배열2)</b>는 대응하는 원소끼리 곱한 뒤 모두 더한다 → <b>162,000</b>원. =SUM(B*C)는 일반 입력 시 배열이 아니라 오류/단일값이 되고(배열 입력해야 함), SUM(B)*SUM(C)는 합끼리 곱해 의미가 다르다."},
  {s:"스프레드시트",q:"셀 값이 2,000 이상이면 '녹색', 2,000 미만 500 이상이면 '빨강', 500 미만이면 색을 지정하지 않고, 모든 구간에서 천 단위 구분 기호(,)와 소수 이하 첫째 자리까지 표시하려고 한다. 사용자 지정 표시 형식으로 옳은 것은? (예: 1234.56 → 1,234.6, 432 → 432.0)",o:["[녹색][>=2000]#,###.#;[빨강][>=500]#,###.#;#,###.#", "[>=2000]<녹색>#,##0.0;[>=500]<빨강>#,##0.0;#,##0.0", "[녹색][>=2000]#,##0.0;[빨강][>=500]#,##0.0;#,##0.0", "[녹색][>=2000]#,##0.0;[빨강][>=500]#,##0.0"],a:2,e:"사용자 지정 형식은 <b>[조건·색]양수서식;[조건·색]서식;나머지서식</b> 구조로, 색과 조건은 대괄호 [녹색][>=2000] 안에 넣는다. 소수 첫째 자리는 0을 써서 <b>#,##0.0</b>으로 해야 432가 432.0으로 나온다(#,###.#은 432를 432.로 만들어 틀림). 꺾쇠<>로 색을 넣는 문법은 없다. 정답: <b>[녹색][>=2000]#,##0.0;[빨강][>=500]#,##0.0;#,##0.0</b>"},
  {s:"스프레드시트",q:"다음 중 수식의 실행 결과가 옳지 않은 것은?",o:["=INT(-2.2) → -3", "=MOD(7,-3) → -2", "=ROUND(143.306,2) → 143.21", "=TRUNC(-4.8) → -4"],a:2,e:"=ROUND(143.306,2)의 올바른 결과는 143.31이다. (INT=내림, TRUNC=절사, MOD=n-d×INT(n/d), ROUND=반올림)"},
  {s:"스프레드시트",q:"다음 중 SUBSTITUTE 함수를 사용한 수식의 실행 결과로 옳은 것은?\n\n=SUBSTITUTE(\"85-76-31-38\",\"-\",\":\")",o:["85-76-31-38", "85:76:31-38", "85:76:31:38", "85:76-31-38"],a:2,e:"SUBSTITUTE(문자열, 찾을값, 바꿀값)에서 네 번째 인수를 생략하면 '-'를 <b>모두</b> ':'로 바꾼다 → <b>85:76:31:38</b>."},
  {s:"스프레드시트",q:"다음 중 문자 위치를 찾는 함수식의 결과로 옳은 것은? (FIND는 대/소문자 구분·와일드카드 불가, SEARCH는 구분 안 함·와일드카드 가능)\n\n=FIND(\"Y\",\"YOUNGPAJOK\")",o:["0", "#VALUE!", "1", "2"],a:2,e:"FIND(찾을문자, 대상)은 앞에서부터 문자가 처음 나오는 <b>위치(1부터)</b>를 반환한다. \"YOUNGPAJOK\"에서 'Y'의 위치는 <b>1</b>. (공백도 한 글자로 센다.)"},
  {s:"스프레드시트",q:"다음 중 문자 위치를 찾는 함수식의 결과로 옳은 것은? (FIND는 대/소문자 구분·와일드카드 불가, SEARCH는 구분 안 함·와일드카드 가능)\n\n=FIND(\"\",\"YOUNGPAJOK STUDY\")",o:["16", "1", "0", "#VALUE!"],a:1,e:"찾을 문자열이 <b>빈 문자열(\"\")</b>이면 FIND·SEARCH 모두 시작 위치인 <b>1</b>을 반환한다. 예: =FIND(\"\",\"YOUNGPAJOK STUDY\") → 1."},
  {s:"스프레드시트",q:"왼쪽 기준표([F2:G6], 오름차순)를 이용해 점수 46점의 등급을 구하려고 한다. 가장 적절한 수식은? (구간의 최저점 이상이면 해당 등급)",o:["=VLOOKUP(46,$F$2:$G$6,2,TRUE)", "=VLOOKUP(46,$F$2:$G$6,2,0)", "=VLOOKUP(46,$F$2:$G$6,2,FALSE)", "=HLOOKUP(46,$F$2:$G$6,2,TRUE)"],a:0,fig:"<table class=\"xg\"><tr><th></th><th>F</th><th>G</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">기준점수</td><td class=\"hd\">등급</td></tr><tr><td class=\"rh\">2</td><td>0</td><td class=\"l\">F</td></tr><tr><td class=\"rh\">3</td><td>60</td><td class=\"l\">D</td></tr><tr><td class=\"rh\">4</td><td>70</td><td class=\"l\">C</td></tr><tr><td class=\"rh\">5</td><td>80</td><td class=\"l\">B</td></tr><tr><td class=\"rh\">6</td><td>90</td><td class=\"l\">A</td></tr></table>",e:"구간(범위) 조회는 네 번째 인수를 <b>TRUE(생략 가능, 근사일치)</b>로 두고 기준표가 <b>오름차순</b>이어야 한다. 46점 → <b>F</b>등급. FALSE(정확히 일치)는 기준표에 없는 값이면 #N/A가 난다."},
  {s:"스프레드시트",q:"다음 중 REPT 함수로 문자를 반복한 결과로 옳은 것은?\n\n=REPT(\"▣\",INT(70/10))",o:["▣▣▣▣▣▣▣▣", "▣▣▣▣▣▣▣", "▣▣▣", "▣▣▣▣▣▣"],a:1,e:"INT(70/10)=7이므로 '▣'를 <b>7번</b> 반복한다 → ▣▣▣▣▣▣▣"},
  {s:"스프레드시트",q:"아래 시트에서 입력값에 주어진 표시 형식을 적용했을 때, [C2]의 결과로 옳은 것은?",o:["홍길동님", "(1,500)", "1", "크다"],a:2,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">입력값</td><td class=\"hd\">표시 형식</td><td class=\"hd\">결과</td></tr><tr><td class=\"rh\">2</td><td>1000000</td><td class=\"l\">0,,</td><td>?</td></tr></table>",e:"쉼표 2개는 백만 단위 생략 → 1"},
  {s:"스프레드시트",q:"셀 [A1:A9]에 다음 값이 입력되어 있다: 24, 28, 33, 40, 51, 53, 70, 81, 84\n다음 수식(50% 지점(백분위수))의 결과로 옳은 것은?\n\n=PERCENTILE.INC(A1:A9, 0.5)",o:["53", "52", "50", "51"],a:3,e:"PERCENTILE.INC(범위, 0.5)는 데이터를 오름차순 정렬했을 때 하위 50% 위치의 값을 구한다. 정렬된 9개 값에서 그 위치의 값은 <b>51</b>이다."},
  {s:"스프레드시트",q:"다음 중 날짜 함수 수식의 실행 결과로 옳은 것은?\n\n=NETWORKDAYS(\"2025-07-06\",\"2025-07-30\")",o:["17", "25", "18", "19"],a:2,e:"NETWORKDAYS는 두 날짜 사이의 주말을 뺀 '근무일 수'(양끝 포함)를 센다 → <b>18</b>일."},
  {s:"스프레드시트",q:"다음 중 REPT 함수로 문자를 반복한 결과로 옳은 것은?\n\n=REPT(\"■\",INT(92/10))",o:["■■■■■■■■", "■■■■■■■■■■", "■■■■■■■■■", "■■■■"],a:2,e:"INT(92/10)=9이므로 '■'를 <b>9번</b> 반복한다 → ■■■■■■■■■"},
  {s:"스프레드시트",q:"다음 중 SUBSTITUTE 함수를 사용한 수식의 실행 결과로 옳은 것은?\n\n=SUBSTITUTE(\"97-27-31-52\",\"-\",\".\")",o:["97.27-31-52", "97.27.31-52", "97.27.31.52", "97-27-31-52"],a:2,e:"SUBSTITUTE(문자열, 찾을값, 바꿀값)에서 네 번째 인수를 생략하면 '-'를 <b>모두</b> '.'로 바꾼다 → <b>97.27.31.52</b>."},
  {s:"스프레드시트",q:"다음 중 날짜 함수 수식의 실행 결과로 옳은 것은?\n\n=EDATE(\"2025-04-06\",4)",o:["2025-08-01", "2025-08-07", "2025-08-06", "2025-08-04"],a:2,e:"EDATE는 기준일에서 지정한 개월 수(4개월) 뒤의 '같은 날'을 반환한다 → <b>2025-08-06</b>."}
 ]},
{ name:'기출 15회', q:[
  {s:"컴퓨터일반",q:"다음 중 통신망의 종류에 대한 설명으로 옳지 않은 것은?",o:["LAN은 근거리 통신망으로 전송 속도가 빠르고 오류율이 낮다.", "WAN은 광역 통신망으로 국가·대륙 규모를 연결한다.", "VPN은 공중망을 전용선처럼 쓰는 가상 사설망이다.", "WLAN은 유선 LAN으로 케이블로만 연결된다."],a:3,e:"WLAN은 <b>무선 LAN</b>이다(Wi-Fi 등)."},
  {s:"컴퓨터일반",q:"다음 중 중앙처리장치(CPU)의 구성 요소에 대한 설명으로 옳지 않은 것은?",o:["제어장치(CU)는 명령어를 해석하고 각 장치에 제어 신호를 보낸다.", "연산장치(ALU)는 산술 연산과 논리 연산을 수행한다.", "레지스터는 연산 결과나 주소를 잠시 저장하는 CPU 내부의 고속 기억장소이다.", "제어장치는 사칙연산과 비교·판단 등 실제 연산을 직접 담당한다."],a:3,e:"실제 산술·논리 연산은 연산장치(ALU)가 담당한다. 제어장치는 명령 해석과 제어 신호 발생을 맡는다. 레지스터는 CPU 내부의 임시 고속 기억장소이다."},
  {s:"컴퓨터일반",q:"다음 중 데이터를 블록에 담아 사슬처럼 연결하고 다수의 참여자가 분산 보관하여 위·변조를 어렵게 하는 기술을 의미하는 것은?",o:["블록체인", "방화벽", "프록시 서버", "데이터 마이닝"],a:0,e:"분산 저장으로 위·변조를 막는 기술은 <b>블록체인</b>이다."},
  {s:"컴퓨터일반",q:"다음 중 마이크로프로세서와 명령 실행에 대한 설명으로 옳지 않은 것은?",o:["명령어는 연산자(OP code)와 주소(Operand)로 구성된다.", "메이저 상태는 인출(Fetch)·간접(Indirect)·실행(Execute)·인터럽트 등이 있다.", "클록 주파수(Hz)가 높을수록 처리 속도가 빠르다.", "워드(Word) 크기가 작을수록 한 번에 처리하는 데이터가 많다."],a:3,e:"워드 크기가 <b>클수록</b> 한 번에 처리하는 데이터가 많다."},
  {s:"컴퓨터일반",q:"다음 중 Windows 11의 '설정'에서 할 수 있는 작업으로 옳지 않은 것은?",o:["디스플레이 해상도 변경", "기본 앱 지정", "네트워크·인터넷 설정", "엑셀 함수 라이브러리 편집"],a:3,e:"엑셀 함수는 엑셀 프로그램의 기능으로 Windows 설정과 무관하다."},
  {s:"컴퓨터일반",q:"다음 중 가로 640픽셀 × 세로 720픽셀, 한 픽셀을 16비트로 표현하는 비압축 비트맵 이미지의 용량으로 옳은 것은? (1KB=1,024Byte)",o:["300KB", "1,800KB", "900KB", "450KB"],a:2,e:"비트맵 용량 = 가로×세로×색 깊이(비트)÷8 = 640×720×16÷8 = <b>921,600 Byte</b> ≒ 900KB."},
  {s:"컴퓨터일반",q:"다음은 7비트 ASCII 코드에 짝수 패리티 비트를 '오른쪽 끝 1비트'로 붙인 8비트 코드이다. 전송 중 오류가 발생한(패리티가 어긋난) 것은?",o:["11111110", "01101111", "11001010", "00100111"],a:0,e:"짝수 패리티는 8비트 전체에서 1의 개수가 짝수가 되도록 패리티 비트를 정한다. 정답 코드 <b>11111110</b>는 1의 개수가 7개로 짝수가 아니어서 오류이다. (패리티 비트는 1비트 오류의 '발생 여부'만 검출하고 위치는 못 찾는다.)"},
  {s:"컴퓨터일반",q:"다음 중 샘플링 22kHz, 양자화 16비트, 스테레오(2채널)로 30초간 녹음한 비압축 디지털 오디오의 용량으로 가장 가까운 것은?",o:["약 5.0MB", "약 2.5MB", "약 1.3MB", "약 40.3MB"],a:1,e:"오디오 용량 = 샘플링 주파수 × (양자화 비트÷8) × 채널 수 × 시간 = 22,000 × 2 × 2 × 30 = <b>2,640,000 Byte</b> ≒ 약 2.5MB."},
  {s:"컴퓨터일반",q:"다음 중 가로 800픽셀 × 세로 720픽셀, 한 픽셀을 16비트로 표현하는 비압축 비트맵 이미지의 용량으로 옳은 것은? (1KB=1,024Byte)",o:["1,125KB", "375KB", "562KB", "2,250KB"],a:0,e:"비트맵 용량 = 가로×세로×색 깊이(비트)÷8 = 800×720×16÷8 = <b>1,152,000 Byte</b> ≒ 1,125KB."},
  {s:"컴퓨터일반",q:"다음 두 8비트 값에 비트 단위 OR 연산을 수행한 결과로 옳은 것은?\n\n01100000 OR 00000111",o:["2200222", "01100111", "00000000", "10011111"],a:1,e:"비트 OR은 각 자리에서 하나라도 1이면 1 → <b>01100111</b>."},
  {s:"컴퓨터일반",q:"다음 중 주소선(주소 버스)이 10개인 시스템이 직접 지정할 수 있는 최대 기억 공간(워드 수)으로 옳은 것은?",o:["512", "10,240", "2,048", "1,024"],a:3,e:"주소선 n개로 2ⁿ개의 주소를 지정한다 → 2^10 = <b>1,024</b>개."},
  {s:"컴퓨터일반",q:"다음 중 가로 640픽셀 × 세로 720픽셀, 한 픽셀을 24비트로 표현하는 비압축 비트맵 이미지의 용량으로 옳은 것은? (1KB=1,024Byte)",o:["450KB", "32,400KB", "1,350KB", "2,700KB"],a:2,e:"비트맵 용량 = 가로×세로×색 깊이(비트)÷8 = 640×720×24÷8 = <b>1,382,400 Byte</b> ≒ 1,350KB."},
  {s:"컴퓨터일반",q:"다음 중 샘플링 22kHz, 양자화 16비트, 모노(1채널)로 30초간 녹음한 비압축 디지털 오디오의 용량으로 가장 가까운 것은?",o:["약 20.1MB", "약 0.6MB", "약 1.3MB", "약 2.5MB"],a:2,e:"오디오 용량 = 샘플링 주파수 × (양자화 비트÷8) × 채널 수 × 시간 = 22,000 × 2 × 1 × 30 = <b>1,320,000 Byte</b> ≒ 약 1.3MB."},
  {s:"컴퓨터일반",q:"다음 중 8비트 2진수 00010110의 2의 보수로 옳은 것은?",o:["00010111", "11101001", "11101010", "00010101"],a:2,e:"2의 보수 = 1의 보수(비트 반전=11101001) + 1 = <b>11101010</b>."},
  {s:"컴퓨터일반",q:"다음 두 8비트 값에 비트 단위 AND 연산을 수행한 결과로 옳은 것은?\n\n00101011 AND 11101000",o:["00101000", "11000011", "11101011", "11010100"],a:0,e:"비트 AND은 각 자리에서 둘 다 1일 때만 1 → <b>00101000</b>."},
  {s:"컴퓨터일반",q:"다음은 7비트 ASCII 코드에 홀수 패리티 비트를 '오른쪽 끝 1비트'로 붙인 8비트 코드이다. 전송 중 오류가 발생한(패리티가 어긋난) 것은?",o:["11001101", "10101110", "01111001", "00011011"],a:3,e:"홀수 패리티는 8비트 전체에서 1의 개수가 홀수가 되도록 패리티 비트를 정한다. 정답 코드 <b>00011011</b>는 1의 개수가 4개로 홀수가 아니어서 오류이다. (패리티 비트는 1비트 오류의 '발생 여부'만 검출하고 위치는 못 찾는다.)"},
  {s:"컴퓨터일반",q:"다음 중 주소선(주소 버스)이 20개인 시스템이 직접 지정할 수 있는 최대 기억 공간(워드 수)으로 옳은 것은?",o:["20,480", "1,048,576", "524,288", "2,097,152"],a:1,e:"주소선 n개로 2ⁿ개의 주소를 지정한다 → 2^20 = <b>1,048,576</b>개."},
  {s:"컴퓨터일반",q:"다음 중 가로 1024픽셀 × 세로 600픽셀, 한 픽셀을 8비트로 표현하는 비압축 비트맵 이미지의 용량으로 옳은 것은? (1KB=1,024Byte)",o:["200KB", "1,200KB", "600KB", "4,800KB"],a:2,e:"비트맵 용량 = 가로×세로×색 깊이(비트)÷8 = 1024×600×8÷8 = <b>614,400 Byte</b> ≒ 600KB."},
  {s:"컴퓨터일반",q:"다음 중 주소선(주소 버스)이 12개인 시스템이 직접 지정할 수 있는 최대 기억 공간(워드 수)으로 옳은 것은?",o:["8,192", "4,096", "2,048", "12,288"],a:1,e:"주소선 n개로 2ⁿ개의 주소를 지정한다 → 2^12 = <b>4,096</b>개."},
  {s:"컴퓨터일반",q:"다음 중 8비트 2진수 00000100의 2의 보수로 옳은 것은?",o:["00000011", "00000101", "11111011", "11111100"],a:3,e:"2의 보수 = 1의 보수(비트 반전=11111011) + 1 = <b>11111100</b>."},
  {s:"스프레드시트",q:"아래 시트에서 부서가 '인사부'인 직원의 급여 합계를 [F2]에 구하려 한다. 입력할 수식으로 옳은 것은?",o:["=DSUM(B2:B4,\"인사부\",D2:D4)", "=SUMIF(B2:B4,\"인사부\",D2:D4)", "=COUNTIF(B2:B4,\"인사부\")", "=SUMIF(D2:D4,\"인사부\",B2:B4)"],a:1,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">이름</td><td class=\"hd\">부서</td><td class=\"hd\">직급</td><td class=\"hd\">급여</td></tr><tr><td class=\"rh\">2</td><td>오지민</td><td class=\"l\">총무부</td><td>사원</td><td>3,600,000</td></tr><tr><td class=\"rh\">3</td><td>윤서준</td><td class=\"l\">기획부</td><td>과장</td><td>4,800,000</td></tr><tr><td class=\"rh\">4</td><td>김하나</td><td class=\"l\">영업부</td><td>과장</td><td>3,300,000</td></tr></table>",e:"SUMIF(<b>조건범위, 조건, 합계범위</b>) → 부서(B)에서 '인사부'를 찾아 급여(D)를 더한다."},
  {s:"스프레드시트",q:"다음 수식의 실행 결과로 옳은 것은?\n\n=IF(MOD(A1,2)=0,\"짝수\",\"홀수\")   (단, [A1]=82)",o:["짝수", "홀수", "0", "#VALUE!"],a:0,e:"MOD(82,2)=0 → 짝수"},
  {s:"스프레드시트",q:"다음 중 문자 위치를 찾는 함수식의 결과로 옳은 것은? (FIND는 대/소문자 구분·와일드카드 불가, SEARCH는 구분 안 함·와일드카드 가능)\n\n=SEARCH(\"P?J\",\"YoungPaJok CBT\")",o:["6", "#VALUE!", "0", "1"],a:0,e:"SEARCH는 <b>와일드카드(?,*)</b>를 지원하므로 '?'가 한 글자를 대신해 패턴과 일치하는 시작 위치 <b>6</b>를 찾는다. FIND는 와일드카드를 지원하지 않아 같은 식에서 #VALUE!가 난다."},
  {s:"스프레드시트",q:"아래 표에서 전체 판매 금액(수량×단가의 합계)을 한 번에 구하려고 한다. 가장 적절한 수식은? (참고: 총액 117,000원)",o:["=SUMPRODUCT(B2:B4+C2:C4)", "=SUMPRODUCT(B2:B4,C2:C4)", "=SUM(B2:B4)*SUM(C2:C4)", "=SUM(B2:B4*C2:C4)"],a:1,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">품목</td><td class=\"hd\">수량</td><td class=\"hd\">단가</td></tr><tr><td class=\"rh\">2</td><td>지우개</td><td>6</td><td>5,000</td></tr><tr><td class=\"rh\">3</td><td>연필</td><td>7</td><td>5,000</td></tr><tr><td class=\"rh\">4</td><td>풀</td><td>4</td><td>13,000</td></tr></table>",e:"<b>SUMPRODUCT(배열1, 배열2)</b>는 대응하는 원소끼리 곱한 뒤 모두 더한다 → <b>117,000</b>원. =SUM(B*C)는 일반 입력 시 배열이 아니라 오류/단일값이 되고(배열 입력해야 함), SUM(B)*SUM(C)는 합끼리 곱해 의미가 다르다."},
  {s:"스프레드시트",q:"아래 표에서 전체 판매 금액(수량×단가의 합계)을 한 번에 구하려고 한다. 가장 적절한 수식은? (참고: 총액 154,000원)",o:["=SUMPRODUCT(B2:B5,C2:C5)", "=SUM(B2:B5)*SUM(C2:C5)", "=SUMPRODUCT(B2:B5+C2:C5)", "=SUM(B2:B5*C2:C5)"],a:0,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">품목</td><td class=\"hd\">수량</td><td class=\"hd\">단가</td></tr><tr><td class=\"rh\">2</td><td>자</td><td>8</td><td>7,000</td></tr><tr><td class=\"rh\">3</td><td>노트</td><td>2</td><td>6,000</td></tr><tr><td class=\"rh\">4</td><td>연필</td><td>6</td><td>11,000</td></tr><tr><td class=\"rh\">5</td><td>펜</td><td>5</td><td>4,000</td></tr></table>",e:"<b>SUMPRODUCT(배열1, 배열2)</b>는 대응하는 원소끼리 곱한 뒤 모두 더한다 → <b>154,000</b>원. =SUM(B*C)는 일반 입력 시 배열이 아니라 오류/단일값이 되고(배열 입력해야 함), SUM(B)*SUM(C)는 합끼리 곱해 의미가 다르다."},
  {s:"스프레드시트",q:"왼쪽 기준표([F2:G6], 오름차순)를 이용해 점수 75점의 등급을 구하려고 한다. 가장 적절한 수식은? (구간의 최저점 이상이면 해당 등급)",o:["=HLOOKUP(75,$F$2:$G$6,2,TRUE)", "=VLOOKUP(75,$F$2:$G$6,2,FALSE)", "=VLOOKUP(75,$F$2:$G$6,2,0)", "=VLOOKUP(75,$F$2:$G$6,2,TRUE)"],a:3,fig:"<table class=\"xg\"><tr><th></th><th>F</th><th>G</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">기준점수</td><td class=\"hd\">등급</td></tr><tr><td class=\"rh\">2</td><td>0</td><td class=\"l\">F</td></tr><tr><td class=\"rh\">3</td><td>60</td><td class=\"l\">D</td></tr><tr><td class=\"rh\">4</td><td>70</td><td class=\"l\">C</td></tr><tr><td class=\"rh\">5</td><td>80</td><td class=\"l\">B</td></tr><tr><td class=\"rh\">6</td><td>90</td><td class=\"l\">A</td></tr></table>",e:"구간(범위) 조회는 네 번째 인수를 <b>TRUE(생략 가능, 근사일치)</b>로 두고 기준표가 <b>오름차순</b>이어야 한다. 75점 → <b>C</b>등급. FALSE(정확히 일치)는 기준표에 없는 값이면 #N/A가 난다."},
  {s:"스프레드시트",q:"아래 시트에서 입력값에 주어진 표시 형식을 적용했을 때, [C2]의 결과로 옳은 것은?",o:["abcabc", "25.0%", "1,235", "홍길동님"],a:1,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">입력값</td><td class=\"hd\">표시 형식</td><td class=\"hd\">결과</td></tr><tr><td class=\"rh\">2</td><td>0.25</td><td class=\"l\">0.0%</td><td>?</td></tr></table>",e:"0.0%는 백분율 한 자리 → 25.0%"},
  {s:"스프레드시트",q:"아래 시트에서 부서가 '영업부'인 직원의 급여 합계를 [F2]에 구하려 한다. 입력할 수식으로 옳은 것은?",o:["=SUMIF(D2:D4,\"영업부\",B2:B4)", "=DSUM(B2:B4,\"영업부\",D2:D4)", "=COUNTIF(B2:B4,\"영업부\")", "=SUMIF(B2:B4,\"영업부\",D2:D4)"],a:3,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">이름</td><td class=\"hd\">부서</td><td class=\"hd\">직급</td><td class=\"hd\">급여</td></tr><tr><td class=\"rh\">2</td><td>한소라</td><td class=\"l\">인사부</td><td>대리</td><td>4,800,000</td></tr><tr><td class=\"rh\">3</td><td>김하나</td><td class=\"l\">인사부</td><td>과장</td><td>3,900,000</td></tr><tr><td class=\"rh\">4</td><td>이두리</td><td class=\"l\">인사부</td><td>사원</td><td>4,200,000</td></tr></table>",e:"SUMIF(<b>조건범위, 조건, 합계범위</b>) → 부서(B)에서 '영업부'를 찾아 급여(D)를 더한다."},
  {s:"스프레드시트",q:"다음 중 SUBSTITUTE 함수를 사용한 수식의 실행 결과로 옳은 것은?\n\n=SUBSTITUTE(\"36-17-65-57\",\"-\",\".\",2)",o:["36.17.65.57", "36.17.65-57", "36-17-65.57", "36-17.65-57"],a:3,e:"네 번째 인수 2은(는) 2번째 '-'만 '.'로 바꾼다 → <b>36-17.65-57</b>. (인수를 생략하면 모든 '-'를 바꾼다.)"},
  {s:"스프레드시트",q:"다음 중 날짜 함수 수식의 실행 결과로 옳은 것은?\n\n=NETWORKDAYS(\"2025-07-06\",\"2025-07-21\")",o:["16", "12", "10", "11"],a:3,e:"NETWORKDAYS는 두 날짜 사이의 주말을 뺀 '근무일 수'(양끝 포함)를 센다 → <b>11</b>일."},
  {s:"스프레드시트",q:"왼쪽 기준표([F2:G6], 오름차순)를 이용해 점수 41점의 등급을 구하려고 한다. 가장 적절한 수식은? (구간의 최저점 이상이면 해당 등급)",o:["=VLOOKUP(41,$F$2:$G$6,2,0)", "=HLOOKUP(41,$F$2:$G$6,2,TRUE)", "=VLOOKUP(41,$F$2:$G$6,2,TRUE)", "=VLOOKUP(41,$F$2:$G$6,2,FALSE)"],a:2,fig:"<table class=\"xg\"><tr><th></th><th>F</th><th>G</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">기준점수</td><td class=\"hd\">등급</td></tr><tr><td class=\"rh\">2</td><td>0</td><td class=\"l\">F</td></tr><tr><td class=\"rh\">3</td><td>60</td><td class=\"l\">D</td></tr><tr><td class=\"rh\">4</td><td>70</td><td class=\"l\">C</td></tr><tr><td class=\"rh\">5</td><td>80</td><td class=\"l\">B</td></tr><tr><td class=\"rh\">6</td><td>90</td><td class=\"l\">A</td></tr></table>",e:"구간(범위) 조회는 네 번째 인수를 <b>TRUE(생략 가능, 근사일치)</b>로 두고 기준표가 <b>오름차순</b>이어야 한다. 41점 → <b>F</b>등급. FALSE(정확히 일치)는 기준표에 없는 값이면 #N/A가 난다."},
  {s:"스프레드시트",q:"다음 중 수식의 실행 결과가 옳지 않은 것은?",o:["=ROUND(704.443,1) → 704.4", "=MOD(-9,4) → 3", "=TRUNC(-6.4) → -5", "=INT(-4.6) → -5"],a:2,e:"=TRUNC(-6.4)의 올바른 결과는 -6이다. (INT=내림, TRUNC=절사, MOD=n-d×INT(n/d), ROUND=반올림)"},
  {s:"스프레드시트",q:"다음 중 날짜 함수 수식의 실행 결과로 옳은 것은?\n\n=NETWORKDAYS(\"2025-02-05\",\"2025-02-26\")",o:["15", "16", "22", "17"],a:1,e:"NETWORKDAYS는 두 날짜 사이의 주말을 뺀 '근무일 수'(양끝 포함)를 센다 → <b>16</b>일."},
  {s:"스프레드시트",q:"다음 수식의 실행 결과로 옳은 것은?\n\n=IF(MOD(A1,5)=0,\"배수\",\"아님\")   (단, [A1]=95)",o:["배수", "아님", "0", "TRUE"],a:0,e:"MOD(95,5)=0 → 배수"},
  {s:"스프레드시트",q:"셀 값이 1,000 이상이면 '빨강', 1,000 미만 800 이상이면 '녹색', 800 미만이면 색을 지정하지 않고, 모든 구간에서 천 단위 구분 기호(,)와 소수 이하 첫째 자리까지 표시하려고 한다. 사용자 지정 표시 형식으로 옳은 것은? (예: 1234.56 → 1,234.6, 432 → 432.0)",o:["[빨강][>=1000]#,###.#;[녹색][>=800]#,###.#;#,###.#", "[빨강][>=1000]#,##0.0;[녹색][>=800]#,##0.0", "[빨강][>=1000]#,##0.0;[녹색][>=800]#,##0.0;#,##0.0", "[>=1000]<빨강>#,##0.0;[>=800]<녹색>#,##0.0;#,##0.0"],a:2,e:"사용자 지정 형식은 <b>[조건·색]양수서식;[조건·색]서식;나머지서식</b> 구조로, 색과 조건은 대괄호 [빨강][>=1000] 안에 넣는다. 소수 첫째 자리는 0을 써서 <b>#,##0.0</b>으로 해야 432가 432.0으로 나온다(#,###.#은 432를 432.로 만들어 틀림). 꺾쇠<>로 색을 넣는 문법은 없다. 정답: <b>[빨강][>=1000]#,##0.0;[녹색][>=800]#,##0.0;#,##0.0</b>"},
  {s:"스프레드시트",q:"다음 중 문자 위치를 찾는 함수식의 결과로 옳은 것은? (FIND는 대/소문자 구분·와일드카드 불가, SEARCH는 구분 안 함·와일드카드 가능)\n\n=FIND(\"\",\"YOUNGPAJOK STUDY\")",o:["#VALUE!", "16", "0", "1"],a:3,e:"찾을 문자열이 <b>빈 문자열(\"\")</b>이면 FIND·SEARCH 모두 시작 위치인 <b>1</b>을 반환한다. 예: =FIND(\"\",\"YOUNGPAJOK STUDY\") → 1."},
  {s:"스프레드시트",q:"다음 중 SUBSTITUTE 함수를 사용한 수식의 실행 결과로 옳은 것은?\n\n=SUBSTITUTE(\"70-29-23-11\",\"-\",\":\")",o:["70:29:23:11", "70:29:23-11", "70-29-23-11", "70:29-23-11"],a:0,e:"SUBSTITUTE(문자열, 찾을값, 바꿀값)에서 네 번째 인수를 생략하면 '-'를 <b>모두</b> ':'로 바꾼다 → <b>70:29:23:11</b>."},
  {s:"스프레드시트",q:"셀 [A1:A9]에 다음 값이 입력되어 있다: 19, 22, 23, 24, 33, 62, 64, 69, 96\n다음 수식(50% 지점(백분위수))의 결과로 옳은 것은?\n\n=PERCENTILE.INC(A1:A9, 0.5)",o:["33", "62", "34", "32"],a:0,e:"PERCENTILE.INC(범위, 0.5)는 데이터를 오름차순 정렬했을 때 하위 50% 위치의 값을 구한다. 정렬된 9개 값에서 그 위치의 값은 <b>33</b>이다."},
  {s:"스프레드시트",q:"다음 중 REPT 함수로 문자를 반복한 결과로 옳은 것은?\n\n=REPT(\"■\",INT(68/10))",o:["■■■■■■■", "■■■■■■", "■■■", "■■■■■"],a:1,e:"INT(68/10)=6이므로 '■'를 <b>6번</b> 반복한다 → ■■■■■■"},
  {s:"스프레드시트",q:"셀 [A1:A5]에 다음 값이 입력되어 있다: 10, 13, 18, 72, 85\n다음 수식(제2사분위수)의 결과로 옳은 것은?\n\n=QUARTILE.INC(A1:A5, 2)",o:["19", "18", "72", "17"],a:1,e:"QUARTILE.INC(범위, 2)는 제2사분위수(하위 50% 지점)를 구하며 PERCENTILE.INC(범위,0.5)와 같다. 정렬된 값에서 결과는 <b>18</b>이다."}
 ]},
{ name:'기출 16회', q:[
  {s:"컴퓨터일반",q:"다음 중 각 용어에 대한 설명으로 옳지 않은 것은?",o:["RFID : 전자태그(Tag)를 이용해 물체나 사람에 부착된 정보를 무선 전파로 인식하는 비접촉식 기술로, 리더와 태그 사이의 통신 거리가 비교적 길고 양방향 통신이 가능하여 도서관 자동화 시스템, 물류·재고 관리, 교통카드 등 다양한 분야에서 활용된다", "NFC : RFID 기술을 응용한 초근거리(약 10cm 이내) 무선통신 기술로, 스마트폰 등 기기를 태그나 다른 기기에 근접시키는 것만으로 데이터를 주고받을 수 있어 모바일 결제나 교통카드 인식 등에 널리 사용된다", "ARP : 네트워크 상에서 이미 알고 있는 물리적 주소(MAC Address)를 이용해 상대방의 논리적 IP 주소를 찾아내는 프로토콜로, 라우터가 목적지까지의 경로를 설정할 때 반드시 거쳐야 하는 핵심 프로토콜이다", "DDoS : 여러 대의 좀비 PC를 동원해 분산된 형태로 특정 서버나 사이트에 동시다발적으로 대량의 트래픽을 발생시켜 정상적인 서비스 제공을 방해하는 공격으로, 단일 발신지에서 공격하는 DoS와 달리 공격 근원지를 추적하기가 훨씬 어렵다"],a:2,e:"ARP(주소 결정 프로토콜)는 이미 알고 있는 논리적 IP 주소로 상대방의 물리적 MAC 주소를 찾아내는 프로토콜이다. 반대로 물리적 MAC 주소로 IP 주소를 찾아내는 것은 RARP(역 주소결정 프로토콜)다. 지문은 이 방향을 서로 바꿔 설명하고 있다. 🎁 정보보안 공격 유형 4가지 클립보드 · 컴파일러 · 파일 드래그 .LOG 메모장 : 메모장 상단에 .LOG라고 입력 후 저장하면 열 때마다 해당 문서 작성시간과 날짜가 자동 표시 (.LOG는 대문자만 지원)"},
  {s:"컴퓨터일반",q:"다음 중 파일 드래그 앤 드롭 결과로 옳지 않은 것은?",o:["같은 드라이브에서 드래그하면 이동된다", "다른 드라이브에서 드래그하면 복사된다", "Shift를 누른 채 드래그하면 복사된다", "Alt를 누른 채 드래그하면 바로가기 아이콘이 생성된다"],a:2,e:"Shift+드래그는 이동이며, 복사가 되는 것은 Ctrl+드래그다. 나머지는 모두 옳다. 다음 중 컴파일러와 인터프리터에 대한 설명으로 옳지 않은 것은?"},
  {s:"컴퓨터일반",q:"다음 중 컴파일러와 인터프리터에 대한 설명으로 옳지 않은 것은?",o:["컴파일러는 번역 전체를 마친 후 실행하므로, 문법 오류가 있으면 실행 전 단계에서 오류를 확인할 수 있다", "인터프리터는 번역과 동시에 한 줄씩 실행하므로, 오류가 있는 줄에 도달하기 전까지는 프로그램이 정상 동작하는 것처럼 보일 수 있다", "인터프리터 방식은 목적 프로그램을 생성하지 않으므로, 프로그램을 실행할 때마다 소스코드 전체를 다시 번역해야 한다", "컴파일러는 목적 프로그램을 한 번만 생성하면 되므로, 인터프리터보다 번역 속도와 실행 속도 모두 빠르다"],a:3,e:"컴파일러는 실행 속도는 인터프리터보다 빠르지만, 소스 전체를 한꺼번에 번역해야 하므로 번역 속도는 오히려 느리다. \"번역·실행 속도 모두 빠르다\"는 설명은 틀렸다. 스프레드시트 필수 단축키 모음 단축키 기능"},
  {s:"컴퓨터일반",q:"그래픽 데이터의 표현에서 벡터(Vector) 방식에 관한 설명으로 옳은 것은?",o:["점과 점을 연결하는 직선 또는 곡선을 이용하여 이미지를 표현한다.", "이미지를 확대하면 테두리에 계단 현상과 같은 앨리어싱이 발생한다.", "래스터 방식이라고도 하며 화면 표시 속도가 빠르다.", "많은 픽셀로 정교하고 다양한 색상을 표시할 수 있다."],a:0,e:"교재 해설 참고"},
  {s:"컴퓨터일반",q:"컴퓨터에서 사용하는 소리 파일인 웨이브(WAV) 파일에 관한 설명으로 옳지 않은 것은?",o:["비압축 오디오 포맷이다.", "녹음 조건에 따라 파일의 크기가 가변적이다.", "Windows Media Player로 파일을 재생할 수 있다.", "음높이, 음길이, 세기 등 다양한 음악 기호가 정의되어 있다."],a:3,e:"음높이·음길이·세기 등 음악 기호가 정의되는 것은 MIDI 파일에 대한 설명입니다. 다음 중 분산형(XY 차트)에 대한 설명으로 옳지 않은 것은?"},
  {s:"컴퓨터일반",q:"3D 프린터에 관한 설명으로 옳지 않은 것은?",o:["입력한 도면을 바탕으로 3차원 입체 물품을 만들어 내는 프린터이다.", "인쇄 원리는 잉크를 종이 표면에 분사하여 2D 이미지를 인쇄하는 잉크젯 프린터의 원리와 같다.", "출력 단위로는 IPM, PPM 등이 사용된다.", "기계·건축·예술·우주 등 많은 분야에서 응용되고 있으며, 의료 분야에서도 활발히 활용되고 있다."],a:2,e:"IPM(Images Per Minute)·PPM(Pages Per Minute)은 일반 2D 문서 프린터의 분당 인쇄 속도 단위입니다. 다음 중 히스토그램에 대한 설명으로 옳지 않은 것은?"},
  {s:"컴퓨터일반",q:"다음 중 히스토그램에 대한 설명으로 옳지 않은 것은?",o:["연속형 데이터를 일정 구간(계급)으로 나누어 빈도수를 막대로 나타낸다", "데이터의 분포 형태를 파악하는 데 사용된다", "항목 간 비율(구성비) 비교에 적합하다", "계급(구간)별 빈도를 막대로 표시한다"],a:2,e:"히스토그램은 구간별 빈도 분포를 보는 차트로, 항목 간 비율(구성비) 비교에는 적합하지 않다. 차트 종류 ➃ 콤보·이중 축 차트 · 추세선 · 오차 막대 콤보(혼합형) 여러 열과 행에 있는 데이터를 콤보 차트로 그릴 수 있다. 데이터 범위가 광범위할 때 이해하기 쉽도록 두 개 이상의 차트 종류를 결합한다. 보조 축 과 함께 표시되므로 차트 분석이 용이하다. 혼합형 차트는 3차원으로 작성할 수 없으며, 2차원에서만 가능하다. 이중 축 차트"},
  {s:"컴퓨터일반",q:"다음 중 INT·TRUNC 함수에 대한 설명으로 옳지 않은 것은?",o:["INT(수)는 괄호 안에서 슬래시(/)로 나눗셈을 표현한다", "TRUNC(수,자릿수)는 콤마(,)로 자릿수를 지정한다", "음수를 넣었을 때 INT와 TRUNC의 결과는 항상 같다", "ROUNDDOWN은 TRUNC와 사실상 같은 결과를 낸다"],a:2,e:"음수에서는 INT와 TRUNC의 결과가 서로 다르다(예: INT(-4.5)=-5, TRUNC(-4.5)=-4). 양수에서만 같다. TRUNC · ROUND 자릿수 활용 · 기출체크 =TRUNC(123.456,2) → 123.45 (소수 둘째 자리까지 남기고 절사, 반올림 없음) =TRUNC(123.45,1) → 123.4 (소수 첫째 자리까지, 반올림 없이 절사) =ROUND(123.456,2) → 123.46 (소수 셋째 자리 6에서 반올림 적용!) =TRUNC(123.45,-1) → 120 (-1 : 1의 자리를 0으로 절사)"},
  {s:"컴퓨터일반",q:"=MOD(-7,3)의 결과값으로 옳은 것은?",o:["-1", "2", "-2", "1"],a:1,e:"공식 n-d×INT(n/d)에 대입: -7-3×INT(-7/3)=-7-3×(-3)=-7+9=2 5. 성이 '이'씨이면서 이름이 두 글자인(총 3글자) 직원 수를 구하는 수식은?"},
  {s:"컴퓨터일반",q:"Q. B3, C3에 각각 위 수식을 적용했을 때 결과는?",o:["긴아이디, 긴아이디", "긴아이디, 짧은아이디", "짧은아이디, 긴아이디", "짧은아이디, 짧은아이디"],a:1,e:"SEARCH(\"@\",B3)는 '@'의 위치를 찾는다. B3는 \"kimyp01\" 7글자 뒤에 '@'가 있어 위치 8은 6보다 크므로 \"긴아이디\", C3는 \"lee\" 3글자 뒤 '@'가 있어 위치 4는 6보다 작으므로 \"짧은아이디\"가 된다. =IF(IFERROR(FIND(\"SALE\",B3),0)>0,\"세일상품\",\"일반상품\") B3 : SALE2024 C3 : NEW2024 Q. B3, C3에 각각 위 수식을 적용했을 때 결과는?"},
  {s:"컴퓨터일반",q:"다음 중 Windows 바로 가기 키의 연결이 옳지 않은 것은?",o:["Alt+Tab — 실행 중인 프로그램 전환", "Ctrl+Esc — 시작 메뉴 표시", "Alt+F4 — 활성창 종료", "Ctrl+Alt+Delete — 활성창 최소화"],a:3,e:"Ctrl+Alt+Delete는 작업 관리자·잠금 등의 보안 옵션 화면을 여는 키이며, 활성창 최소화가 아니다. 27. 명령 프롬프트(CMD)에서 IP 설정을 확인하는 명령으로 옳은 것은?"},
  {s:"컴퓨터일반",q:"명령 프롬프트(CMD)에서 IP 설정을 확인하는 명령으로 옳은 것은?",o:["ping", "ipconfig", "tracert", "netstat"],a:1,e:"ipconfig는 현재 컴퓨터의 IP 주소·서브넷마스크·게이트웨이 등을 확인하는 명령이다. 28. 다음 중 Windows [설정]에서 수행할 수 없는 작업은?"},
  {s:"컴퓨터일반",q:"다음 중 Windows [설정]에서 수행할 수 없는 작업은?",o:["디스플레이 해상도 변경", "레지스트리 값 직접 편집", "개인 설정(배경화면) 변경", "접근성 옵션 설정"],a:1,e:"레지스트리를 직접 편집하려면 REGEDIT(레지스트리 편집기)를 별도로 실행해야 하며, [설정] 앱에서는 직접 편집할 수 없다. 29. 한 사용자가 여러 프로그램을 동시에 실행하다가 시스템이 느려져 작업 관리자를 열어 CPU 사용률이 가장 높은 프로세스를 종료하려고 한 다. 이때 사용하는 Windows 작업 관리자의 탭으로 가장 적절한 것은?"},
  {s:"컴퓨터일반",q:"다. 이때 사용하는 Windows 작업 관리자의 탭으로 가장 적절한 것은?",o:["성능 탭", "프로세스 탭", "사용자 탭", "시작프로그램 탭"],a:1,e:"프로세스 탭에서 현재 실행 중인 프로그램·백그라운드 프로세스별 CPU·메모리 사용률을 확인하고 특정 프로세스를 선택해 종료할 수 있다. 성능 탭은 전체 시스템 자원의 그래프만 보여줄 뿐 개별 프로세스를 종료하는 기능은 없다. 휴지통 · 바로가기 · NTFS 기출체크 30. 다음 중 휴지통에 대한 설명으로 옳지 않은 것은?"},
  {s:"컴퓨터일반",q:"다음 중 휴지통에 대한 설명으로 옳지 않은 것은?",o:["휴지통 크기는 드라이브별로 다르게 설정할 수 있다", "플로피디스크나 USB 메모리에서 삭제한 파일은 휴지통을 거치지 않고 완전히 삭제된다", "휴지통에 보관된 파일은 다시 사용할 프로그램에 반영구적으로 보관된다", "Shift+Delete로 삭제하면 휴지통을 거치지 않고 완전히 삭제된다"],a:2,e:"휴지통에 보관된 파일은 필요시 원래 위치로 복원할 수 있는 임시 보관 상태일 뿐, 반영구적으로 보관되는 것은 아니며 휴지통 비우기·용량 초 과 시 자동으로 삭제될 수 있다. 31. 다음 중 바로 가기 아이콘(단축 아이콘)에 대한 설명으로 옳은 것은?"},
  {s:"컴퓨터일반",q:"다음 중 바로 가기 아이콘(단축 아이콘)에 대한 설명으로 옳은 것은?",o:["바로 가기 아이콘을 삭제하면 원본 파일도 함께 삭제된다", "하나의 원본 파일에 여러 개의 바로 가기 아이콘을 만들 수 있다", "바로 가기 아이콘은 원본 파일이 있는 폴더에만 만들 수 있다", "바로 가기 아이콘의 확장자는 원본과 동일하다"],a:1,e:"바로 가기는 원본의 위치 정보를 담은 작은 파일(.lnk)로, 여러 개를 서로 다른 위치에 만들 수 있다. 삭제해도 원본에는 영향이 없다. 32. 다음 중 NTFS 파일 시스템의 특징으로 옳지 않은 것은?"},
  {s:"컴퓨터일반",q:"다음 중 NTFS 파일 시스템의 특징으로 옳지 않은 것은?",o:["개별 파일에 대한 접근 권한 설정이 가능하다", "파일 및 폴더에 대한 압축 기능을 지원한다", "FAT32보다 큰 단일 파일을 저장할 수 있다", "USB 메모리 등 이동식 저장장치에서는 사용할 수 없다"],a:3,e:"NTFS는 이동식 저장장치(USB 등)에도 포맷하여 사용할 수 있다. 33. USB 메모리에 저장되어 있던 대용량 동영상 파일을 실수로 삭제한 뒤, 파일 탐색기에서 휴지통을 열어 복원을 시도했지만 목록에 해당 파일 이 보이지 않았다. 이러한 상황이 발생하는 원인으로 가장 타당한 것은?"},
  {s:"컴퓨터일반",q:"이 보이지 않았다. 이러한 상황이 발생하는 원인으로 가장 타당한 것은?",o:["NTFS로 포맷된 드라이브라서 삭제 즉시 영구 삭제되기 때문이다", "이동식 저장장치(USB)에서 삭제한 파일은 기본적으로 휴지통을 거치지 않고 완전히 삭제되기 때문이다", "휴지통 용량이 부족해서 자동으로 목록이 초기화되었기 때문이다", "파일 형식이 동영상이라 휴지통에서 자동으로 제외되기 때문이다"],a:1,e:"하드디스크(내장 드라이브)와 달리 USB·플로피디스크 등 이동식 저장장치에서 삭제한 파일은 휴지통을 거치지 않고 곧바로 완전히 삭제되는 것이 기본 동작이다. 레지스트리 · 네트워크 단위 · 코드체계 기출체크 34. 자료 단위를 작은 것부터 큰 순서로 옳게 나열한 것은?"},
  {s:"컴퓨터일반",q:"자료 단위를 작은 것부터 큰 순서로 옳게 나열한 것은?",o:["Bit < Byte < Word < Nibble", "Bit < Nibble < Byte < Word", "Nibble < Bit < Byte < Word", "Byte < Bit < Nibble < Word"],a:1,e:"Bit(1비트) < Nibble(4비트) < Byte(8비트) < Word(CPU가 한 번에 처리하는 단위). 35. 다음 중 유니코드(Unicode)에 대한 설명으로 옳은 것은?"},
  {s:"컴퓨터일반",q:"다음 중 유니코드(Unicode)에 대한 설명으로 옳은 것은?",o:["한 문자를 1바이트로 표현한다", "세계 각국의 문자를 통일된 방식으로 표현하기 위한 코드체계이다", "아스키코드보다 표현 가능한 문자 수가 적다", "한글은 유니코드로 표현할 수 없다"],a:1,e:"유니코드는 전 세계 문자를 하나의 코드체계로 표현하기 위해 만들어졌으며 보통 2바이트(또는 가변)로 문자를 표현해 아스키코드보다 훨씬 많은 문자를 표현할 수 있다. 36. 레지스트리(Registry)에 대한 설명으로 옳지 않은 것은?"},
  {s:"스프레드시트",q:"다음 중 오류 코드와 발생 원인의 연결로 옳지 않은 것은?",o:["#DIV/0! : 0으로 나누기 연산을 시도한 경우", "#NAME? : 함수 이름이나 정의되지 않은 셀 이름을 사용한 경우", "#REF! : 숫자가 필요한 곳에 잘못된 값을 지정한 경우", "#N/A : 찾기 함수에서 결과값을 찾지 못한 경우"],a:2,e:"숫자가 필요한 곳에 잘못된 값을 지정한 경우는 #NUM! 오류다. #REF!는 셀 참조를 잘못 사용한 경우 발생한다. 다음 중 오류 코드에 대한 설명으로 옳지 않은 것은?"},
  {s:"스프레드시트",q:"다음 중 오류 코드에 대한 설명으로 옳지 않은 것은?",o:["#NULL! : 서로 교차하지 않는 두 참조 범위의 교집합을 지정했을 때 발생한다", "#SPILL! : 배열 수식이 결과를 펼칠 범위에 이미 다른 값이 있을 때 발생한다", "#### : 함수 이름을 잘못 입력했을 때 발생한다", "#CALC! : 배열 수식 계산 도중 계산이 불가능한 결과가 발생했을 때 나타난다"],a:2,e:"함수 이름을 잘못 입력했을 때 발생하는 것은 #NAME? 오류다. ####는 열 폭 부족이나 날짜·시간 계산 결과가 음수일 때 발생한다. 차트의 구성 요소 완전정리 (필기 빈출 파트) 차트는 수치 데이터를 시각적으로 표현한 것으로, 워크시트의 데이터를 범위로 지정하여 작성한다. 아래 요소들은 매 시험 그림 문제로 출제되는 핵심 용어이므로 명칭과 위치를 함께 암기해야 한다. 구성 요소 설명"},
  {s:"스프레드시트",q:"차트에 대한 설명으로 옳지 않은 것은?",o:["히스토그램은 연속형 데이터를 구간으로 나누어 빈도수를 나타내는 차트이다.", "트리맵 차트는 계층 구조 데이터를 사각형의 크기로 비교하여 표현한다.", "상자수염그림(Box-Whisker)은 데이터의 사분위수와 이상치를 확인할 수 있다.", "히스토그램은 항목 간의 비율(구성비)을 비교하는 데 적합하다."],a:3,e:"히스토그램은 구간별 빈도 분포를 나타내는 차트로, 항목 간 구성비 비교에는 적합하지 않습니다. 차트 종류 ➀ 세로막대형·꺾은선형·원형·가로막대형 세로 막대형 각 항목 간의 값을 비교하는 데 가장 많이 사용하는 기본 차트. 2차원·3차원으로 작성할 수 있으며 누적/비누적 형태로 구분된다. 꺾은선형 시간이나 항목에 따라 일정한 간격으로 데이터의 추세나 변화를 표시한다. 데이터 계열 하나가 하나의 선으로 표시된다."},
  {s:"스프레드시트",q:"다음 중 차트 종류에 대한 설명으로 옳지 않은 것은?",o:["원형 차트는 항상 한 개의 데이터 계열만 가지며 축이 없다", "꺾은선형 차트는 데이터의 추세나 변화를 표시한다", "가로 막대형은 값 축과 항목 축의 위치가 세로 막대형과 서로 바뀐 형태다", "계열 겹치기 옵션 값이 양수로 갈수록 계열 간 간격이 벌어진다"],a:3,e:"계열 겹치기는 음수로 갈수록 계열이 벌어지고 양수로 갈수록 겹쳐진다. 지문은 이를 반대로 설명하고 있다. 차트 종류 ➁ 영역형·분산형·주식형·표면형 영역형 일정한 시간에 따라 데이터의 변화 추세(데이터 세트의 차이점 강조)를 표시한다. 데이터 계열값의 합계를 표시하여 전체 값에 대한 각 값의 관계를 나타낸다. 분산형(XY 차트)"},
  {s:"스프레드시트",q:"다음 중 분산형(XY 차트)에 대한 설명으로 옳지 않은 것은?",o:["데이터의 불규칙한 간격이나 묶음을 보여준다", "가로 축은 항목 축이 아닌 값 축 형태로 표시된다", "3차원 차트로 작성할 수 있다", "두 개의 숫자 그룹을 XY 좌표의 한 계열로 표시한다"],a:2,e:"분산형(XY 차트)은 3차원 차트로 작성할 수 없다. 차트 종류 ➂ 방사형·트리맵·선버스트·히스토그램 방사형 많은 데이터 계열의 합계 값을 비교할 때 사용한다. 각 항목마다 가운데 요소에서 뻗어나온 값 축을 가지며, 선은 같은 계열의 모든 값을 연결한다 (가로·세로 축이 없음). 3차원 차트로 작성할 수 없다. 트리맵"},
  {s:"스프레드시트",q:"차트의 오차 막대에 관한 설명으로 옳지 않은 것은?",o:["데이터 계열의 각 데이터 표식에 대한 오류 가능성이나 불확실성의 정도를 표시한다.", "3차원 세로 막대형 차트에서 사용 가능하다.", "고정값, 백분율, 표준 편차, 표준 오차 등으로 설정할 수 있다.", "분산형과 거품형 차트에 X값, Y값 또는 이 두 값 모두에 대한 오차 막대를 나타낼 수 있다."],a:1,e:"오차 막대는 3차원 차트에서는 사용할 수 없습니다. 2차원 형태(세로·가로 막대형, 꺾은선형, 분산형 등)에서만 사용 가능합니다. [그림] 추세선 vs 오차 막대 예시 점: 실제 데이터 / 점선: 추세(예측) 방향 T자 구간 = 오차 범위(고정값·표준편차 등) 차트 편집 총정리 작업"},
  {s:"스프레드시트",q:"다음 중 차트에 대한 설명으로 옳지 않은 것은?",o:["세로 막대형, 가로 막대형, 원형, 영역형 차트는 3차원으로 작성할 수 있다", "분산형(XY)·주식형·방사형·도넛형 차트는 3차원으로 작성할 수 없다", "데이터 레이블은 셀 값·계열 이름·항목 이름·값 중에서 선택해 표시할 수 있으며, 원본 워크시트 값이 바뀌면 자동으로 업데이트된다", "차트 영역을 선택한 상태에서 Delete를 누르면 차트 개체와 함께 원본 워크시트의 데이터도 항상 삭제된다"],a:3,e:"차트 영역(개체)을 삭제해도 워크시트의 원본 데이터에는 전혀 영향이 없다. 차트 편집과 원본 데이터는 별개다. 다음 중 차트 편집에 대한 설명으로 옳지 않은 것은?"},
  {s:"스프레드시트",q:"다음 중 차트 편집에 대한 설명으로 옳지 않은 것은?",o:["차트 데이터 계열만 선택해 삭제해도 원본 데이터는 삭제되지 않는다", "차트 데이터 범위에 항목을 삽입하면 차트에도 자동 반영된다", "차트 데이터 범위 중간에 새 계열이 삽입되면 차트에 자동으로 반영된다", "원형·영역형 차트는 3차원으로 작성할 수 있다"],a:2,e:"범위 중간에 데이터 계열이 삽입되어도 차트는 자동으로 변경되지 않는다. [데이터 선택]에서 수동으로 반영해야 한다. 데이터베이스 함수 · 연결연산자 · TEXT 표(데이터베이스)에서 조건에 맞는 값을 집계하는 D-함수와, 문자·수식을 연결하는 & 연산자, 서식 변환의 핵심 TEXT 함수를 정리한다. D-함수는 반드시 필드명 (또는 열 번호)과 조건범위(제목 포함)를 함께 지정해야 한다. 데이터베이스 함수(D-함수) 함수"},
  {s:"스프레드시트",q:"다음 중 실행 결과가 나머지 셋과 다른 것은?",o:["=DSUM(A2:E10,\"예매량\",G9:G10)", "=DSUM(A2:E10,5,G9:G10)", "=DSUM(A2:E10,E2,G9:G10)", "=DSUM(A2:E10,4,G9:G10)"],a:3,e:"D-함수의 필드는 셀주소·열번호·필드명 중 어떤 방식으로 지정해도 같은 열을 가리켜야 동일한 값이 나온다. ➀➁➂은 모두 5번째 열(E열, 예 매량)을 가리키지만 ➃는 4번째 열(D열)을 가리켜 값이 다르다. INT · TRUNC · ROUND 완전비교(반올림 여부) 정수·소수 처리 함수 3형제(INT, TRUNC, ROUND 계열)는 매회 시험에서 결과값을 직접 계산시키는 단골 함정 문제다. 핵심은 \"반올림을 하는가, 그냥 잘라내는 가\"이며, 음수를 넣었을 때 INT와 TRUNC의 결과가 달라진다는 점이 가장 큰 함정이다."},
  {s:"스프레드시트",q:"다음 중 실행 결과가 옳지 않은 것은?",o:["=INT(-4.5) → -5", "=TRUNC(-4.5) → -4", "=ROUND(123.456,2) → 123.45", "=TRUNC(123.45,-1) → 120"],a:2,e:"ROUND(123.456,2)는 소수 셋째 자리(6)에서 반올림이 적용되어 123.46이 되어야 한다. 123.45는 반올림을 하지 않은 TRUNC의 결과값이 다. 3. 성별이 남이면서 과장이 아닌 사원의 급여 평균을 구하되, 백의자리에서 반올림하여 표시하려 한다(452,900 → 453,000). 올바른 수식은?"},
  {s:"스프레드시트",q:"성별이 남이면서 과장이 아닌 사원의 급여 평균을 구하되, 백의자리에서 반올림하여 표시하려 한다(452,900 → 453,000). 올바른 수식은?",o:["=TRUNC(AVERAGEIFS(L3:L11,I3:I11,\"남\",J3:J11,\"<>과장\"),-3)", "=ROUND(AVERAGEIFS(L3:L11,I3:I11,\"남\",J3:J11,\"<>과장\"),-3)", "=INT(AVERAGEIFS(L3:L11,I3:I11,\"남\",J3:J11,\"<>과장\"))", "=ROUNDDOWN(AVERAGEIFS(L3:L11,I3:I11,\"남\",J3:J11,\"<>과장\"),-3)"],a:1,e:"'반올림하라'는 지시가 있으므로 반드시 ROUND를 사용해야 한다. TRUNC·ROUNDDOWN·INT는 모두 반올림 없이 버리는 함수이므로 오 답이다. 다음 중 실행 결과가 옳지 않은 것은?"},
  {s:"스프레드시트",q:"성이 '이'씨이면서 이름이 두 글자인(총 3글자) 직원 수를 구하는 수식은?",o:["=COUNTIF(C3:C11,\"이*\")", "=COUNTIF(C3:C11,\"이??\")", "=COUNTIF(C3:C11,\"이?\")", "=COUNTIFS(C3:C11,\"이\")"],a:1,e:"와일드카드 ?는 글자 수 하나를 의미하므로 '이'+두 글자(??)가 정답. *는 글자수 제한 없이 '이'로 시작하는 모두를 포함한다. IF · IFS · SWITCH 조건함수 심화 다중 조건 판정의 핵심인 IF 중첩, IFS·SWITCH 함수, AND/OR 결합, IFERROR 예외처리를 실전 예제 중심으로 정리한다. IF 다중 중첩 vs IFS · SWITCH 학점 : =IF(E3>=90,\"A\",IF(E3>=80,\"B\",IF(E3>=70,\"C\",IF(E3>=60,\"D\",\"F\")))) =IFS(RIGHT(A16,1)=\"M\",\"남성용\",RIGHT(A16,1)=\"W\",\"여성용\",TRUE,\"아웃도어\")"},
  {s:"스프레드시트",q:"다음 중 IFS·SWITCH 함수에 대한 설명으로 옳지 않은 것은?",o:["IFS 함수는 모든 조건이 거짓일 경우를 대비해 마지막 조건 자리에 TRUE를 넣을 수 있다", "SWITCH 함수는 '찾을 값'이 정확히 일치하는 경우만 비교한다", "SWITCH 함수는 부등호(>,<) 조건에도 사용할 수 있다", "IFS 함수는 중첩 IF 없이 여러 조건을 순서대로 판정한다"],a:2,e:"SWITCH는 '찾을 값'이 정확히 일치하는 경우만 비교하며 부등호 조건에는 사용할 수 없다. 3과목(H3,I3,J3) 중 한 과목이라도 80점 이상이면 \"합격\"을 반환하는 수식으로 옳은 것은?"},
  {s:"스프레드시트",q:"3과목(H3,I3,J3) 중 한 과목이라도 80점 이상이면 \"합격\"을 반환하는 수식으로 옳은 것은?",o:["=IF(AND(H3>=80,I3>=80,J3>=80),\"합격\",\"불합격\")", "=IF(OR(H3>=80,I3>=80,J3>=80),\"합격\",\"불합격\")", "=IF(COUNTIF(H3:J3,\">=80\")=3,\"합격\",\"불합격\")", "=IF(COUNTIF(H3:J3,\"=80\")>=1,\"합격\",\"불합격\")"],a:1,e:"OR은 하나라도 조건을 만족하면 참이 된다. AND와 COUNTIF(...)=3은 3과목 모두를 요구하므로 오답이며, \"=80\"은 정확히 80점만 세므로 오답이다. COUNTIF(H3:J3,\">=80\")의 결과가 2일 때, 다음 중 옳지 않은 것은?"},
  {s:"스프레드시트",q:"COUNTIF(H3:J3,\">=80\")의 결과가 2일 때, 다음 중 옳지 않은 것은?",o:["=IF(OR(H3>=80,I3>=80,J3>=80),\"합격\",\"불합격\")와 =IF(COUNTIF(H3:J3,\">=80\")>=1,\"합격\",\"불합격\")는 항상 같은 결과를 반환한다", "=IF(AND(H3>=80,I3>=80,J3>=80),\"합격\",\"불합격\")와 =IF(COUNTIF(H3:J3,\">=80\")=3,\"합격\",\"불합격\")는 항상 같은 결과를 반환한다", "COUNTIF(H3:J3,\">=80\")의 결과가 2일 때, OR 조건식과 AND 조건식의 결과는 서로 같다", "IFS 함수로 3과목 모두 80점 이상 조건을 표현할 때 =IFS(AND(H3>=80,I3>=80,J3>=80),\"합격\",TRUE,\"불합격\")처럼 조건 자리에 AND를 직접 사용할 수 있다"],a:2,e:"COUNTIF 결과가 2(두 과목만 80점 이상)일 때 OR 조건은 참이라 \"합격\", AND 조건은 거짓이라 \"불합격\"이 되어 서로 다른 결과가 나온다. IFERROR · IFS·SWITCH 예제 보강 · 기출체크 IFERROR — 에러 발생 시 대체값 =IFERROR(CHOOSE(COUNTA(B16:E16),\"25%\",\"50%\",\"75%\",\"100%\"),\"0%\") → 출석 횟수가 0이면 CHOOSE 인수가 0이 되어 #VALUE! 에러 발생 → IFERROR가 \"0%\"로 대체 =IFERROR(HLOOKUP(LEFT(A3,1),$B$13:$D$14,2,0),\"코드오류\")"},
  {s:"스프레드시트",q:"다음 중 IFS 함수 사용법으로 옳지 않은 것은?",o:["마지막 조건 자리에 TRUE를 넣어 나머지 모두를 처리할 수 있다", "중간에 IF 함수를 중첩해서 사용해야 한다", "조건과 값의 쌍을 순서대로 나열한다", "앞에서부터 조건을 검사해 처음 TRUE인 값을 반환한다"],a:1,e:"IFS는 IF를 중첩하지 않고 조건-값 쌍을 나열하는 함수로, 중간에 다시 IF를 넣지 않는다. IFS · SWITCH 예제 보강 문제 상황 IFS 수식 요일 표시(1~7→ 월~일)"},
  {s:"스프레드시트",q:"다음 중 결과값(반환되는 문자열)이 나머지 셋과 다른 것은? (단, RIGHT(A16,1)의 값은 \"W\"이다)",o:["=IF(RIGHT(A16,1)=\"M\",\"남성용\",IF(RIGHT(A16,1)=\"W\",\"여성용\",\"아웃도어\"))", "=IFS(RIGHT(A16,1)=\"M\",\"남성용\",RIGHT(A16,1)=\"W\",\"여성용\",TRUE,\"아웃도어\")", "=SWITCH(RIGHT(A16,1),\"M\",\"남성용\",\"W\",\"여성용\",\"아웃도어\")", "=IFS(RIGHT(A16,1)=\"M\",\"남성용\",TRUE,\"여성용\")"],a:3,e:"교재 해설 참고"},
  {s:"스프레드시트",q:"다음 중 목표값 찾기에 대한 설명으로 옳지 않은 것은?",o:["'수식 셀'은 반드시 수식이 입력된 셀이어야 한다", "'찾는 값'은 수식으로 입력할 수 있다", "'값을 바꿀 셀'은 수식 셀이 참조하는 셀이어야 한다", "'값을 바꿀 셀'에는 상수 값이 입력되어 있어야 한다"],a:1,e:"'찾는 값'은 수식 셀이 도달해야 할 목표 숫자값으로, 상수만 입력 가능하며 수식은 입력할 수 없다. 추세선 종류 · 기출체크 종류 특징 선형 데이터가 일정한 비율로 증가·감소할 때 사용하는 가장 기본적인 추세선"},
  {s:"스프레드시트",q:"다음 중 추세선을 추가할 수 없는 차트는?",o:["꺾은선형", "분산형", "원형", "세로 막대형(누적 아님)"],a:2,e:"원형·도넛형·방사형·표면형·3차원 차트에는 추세선을 추가할 수 없다. 다음 중 추세선 종류에 대한 설명으로 옳지 않은 것은?"},
  {s:"스프레드시트",q:"다음 중 추세선 종류에 대한 설명으로 옳지 않은 것은?",o:["선형 추세선은 데이터가 일정한 비율로 증가·감소할 때 사용한다", "지수 추세선은 데이터 값이 0이거나 음수여도 사용할 수 있다", "로그 추세선은 변화율이 처음에는 빠르다가 점차 완만해질 때 사용한다", "다항식 추세선은 차수를 2~6차까지 지정할 수 있다"],a:1,e:"지수 추세선은 값이 0이거나 음수면 사용할 수 없다. 다음 중 추세선에 대한 설명으로 옳지 않은 것은?"}
 ]},
{ name:'기출 17회', q:[
  {s:"컴퓨터일반",q:"레지스트리(Registry)에 대한 설명으로 옳지 않은 것은?",o:["시스템과 관련된 하드웨어·소프트웨어 정보가 저장되는 데이터베이스이다", "레지스트리 편집기(REGEDIT)로 직접 수정할 수 있다", "레지스트리가 손상되면 시스템 운영에 문제가 발생할 수 있다", "레지스트리 정보는 삭제해도 시스템에 아무 영향이 없다"],a:3,e:"레지스트리는 시스템 운영의 핵심 설정 정보이므로 임의로 삭제·손상되면 시스템 오류나 부팅 실패로 이어질 수 있다. 37. 1개의 한글 문서 안에 한글 500자와 영문 500자가 섞여 저장되어 있다. 이 문서를 유니코드(UTF-16 기준, 모든 문자를 2바이트로 저장한다 고 가정)로 저장했을 때 문자 데이터의 총 바이트 수로 옳은 것은? (제어 문자·공백은 제외)"},
  {s:"컴퓨터일반",q:"고 가정)로 저장했을 때 문자 데이터의 총 바이트 수로 옳은 것은? (제어 문자·공백은 제외)",o:["500바이트", "1,000바이트", "1,500바이트", "2,000바이트"],a:3,e:"유니코드(UTF-16 고정폭 가정)는 한글·영문 구분 없이 문자 1개당 2바이트를 사용하므로, 총 1,000자 × 2바이트 = 2,000바이트가 된다. 아 스키코드처럼 영문을 1바이트로 계산하지 않도록 주의한다. 컴퓨터 분류 · CPU · 기억장치 기출체크 38. 다음 중 CPU 성능에 직접적인 영향을 주는 요소가 아닌 것은?"},
  {s:"컴퓨터일반",q:"다음 중 CPU 성능에 직접적인 영향을 주는 요소가 아닌 것은?",o:["클럭 속도(Clock Speed)", "코어(Core)의 개수", "캐시 메모리의 용량", "모니터의 해상도"],a:3,e:"모니터 해상도는 출력장치의 성능이며 CPU 처리 성능과는 직접 관련이 없다. 39. 주기억장치 중 RAM에 대한 설명으로 옳은 것은?"},
  {s:"컴퓨터일반",q:"주기억장치 중 RAM에 대한 설명으로 옳은 것은?",o:["전원이 꺼져도 데이터가 유지된다", "읽기 전용 메모리로 데이터를 기록할 수 없다", "전원이 꺼지면 저장된 내용이 사라지는 휘발성 메모리이다", "BIOS가 저장되는 비휘발성 메모리이다"],a:2,e:"RAM(Random Access Memory)은 전원이 차단되면 내용이 사라지는 휘발성 메모리다. ➁➃는 ROM에 대한 설명이다. 40. 다음 중 캐시 메모리(Cache Memory)의 목적으로 가장 적절한 것은?"},
  {s:"컴퓨터일반",q:"다음 중 캐시 메모리(Cache Memory)의 목적으로 가장 적절한 것은?",o:["보조기억장치의 용량 확장", "CPU와 주기억장치 간 속도 차이를 줄여 처리 속도 향상", "네트워크 전송 속도 향상", "그래픽 처리 전용 연산"],a:1,e:"캐시 메모리는 CPU와 상대적으로 느린 주기억장치(RAM) 사이에서 자주 사용하는 데이터를 임시 저장해 처리 속도 차이를 줄여준다. 41. 동일한 프로그램을 실행했을 때, 캐시 메모리가 없는 컴퓨터보다 캐시 메모리가 탑재된 컴퓨터의 체감 처리 속도가 더 빠른 이유로 가장 적절 한 것은?"},
  {s:"컴퓨터일반",q:"다음 중 SSD(Solid State Drive)에 대한 설명으로 옳지 않은 것은?",o:["반도체를 이용하여 데이터를 저장한다", "HDD보다 소음이 적고 발열이 낮다", "HDD보다 데이터 접근 속도가 느리다", "기계적 구동부가 없어 충격에 강하다"],a:2,e:"SSD는 기계적 헤드 이동이 없어 HDD보다 데이터 접근(읽기·쓰기) 속도가 훨씬 빠르다. 43. IPv4 주소 체계에 대한 설명으로 옳은 것은?"},
  {s:"컴퓨터일반",q:"IPv4 주소 체계에 대한 설명으로 옳은 것은?",o:["총 128비트로 구성된다", "8비트씩 8부분, 총 64비트로 구성된다", "8비트씩 4부분, 총 32비트로 구성되며 점(.)으로 구분한다", "16진수로 표기하며 콜론(:)으로 구분한다"],a:2,e:"IPv4는 8비트씩 4부분(총 32비트)로 구성되며 각 부분을 점(.)으로 구분해 표기한다(예: 192.168.0.1). ➀➃는 IPv6에 대한 설명이다. 44. 다음 중 셰어웨어(Shareware)에 대한 설명으로 옳은 것은?"},
  {s:"컴퓨터일반",q:"다음 중 셰어웨어(Shareware)에 대한 설명으로 옳은 것은?",o:["개발자가 소스코드까지 무료로 공개하는 소프트웨어이다", "일정 기간 무료로 사용해보고 계속 사용하려면 비용을 지불하는 소프트웨어이다", "상업용 소프트웨어의 정식 발매 전 테스트를 위해 무료 배포하는 소프트웨어이다", "저작권이 소멸되어 누구나 자유롭게 사용할 수 있는 소프트웨어이다"],a:1,e:"셰어웨어는 일정 기간 또는 일부 기능만 무료로 제공하고, 계속 사용하려면 정식 등록(결제)해야 하는 방식이다. ➂은 베타 버전, ➃는 퍼블릭 도메인에 대한 설명이다. 45. 회사에서 사용하던 SSD가 부팅은 되지만 대용량 파일을 복사할 때마다 속도가 급격히 느려지는 증상이 반복된다. 이런 상황에서 원인으로 추 정할 수 있는 SSD의 특성으로 가장 적절한 것은?"},
  {s:"컴퓨터일반",q:"정할 수 있는 SSD의 특성으로 가장 적절한 것은?",o:["SSD는 저장 공간이 가득 찰수록 쓰기 성능이 저하될 수 있다", "SSD는 사용할수록 회전 속도가 느려진다", "SSD는 기계적 헤드가 마모되어 성능이 떨어진다", "SSD는 온도와 무관하게 항상 일정한 속도를 유지한다"],a:0,e:"SSD는 낸드플래시의 남은 여유 공간(오버프로비저닝)을 활용해 쓰기 성능을 유지하는데, 저장 공간이 가득 차면 여유 블록이 부족해져 쓰기 속도가 크게 저하될 수 있다. ➁➂은 HDD(기계식)에 해당하는 설명이다. 멀티미디어 · 정보보안 · 스풀 기출체크 46. 다음 중 정보보안의 3대 요소가 아닌 것은?"},
  {s:"컴퓨터일반",q:"다음 중 정보보안의 3대 요소가 아닌 것은?",o:["기밀성(Confidentiality)", "무결성(Integrity)", "가용성(Availability)", "확장성(Scalability)"],a:3,e:"정보보안의 3대 요소는 기밀성·무결성·가용성이다. 확장성은 시스템 설계 관점의 개념으로 보안 3요소에 해당하지 않는다. 47. 다음 중 스풀(SPOOL) 기능에 대한 설명으로 옳은 것은?"},
  {s:"컴퓨터일반",q:"다음 중 스풀(SPOOL) 기능에 대한 설명으로 옳은 것은?",o:["인쇄 속도를 CPU 속도만큼 빠르게 한다", "인쇄 데이터를 보조기억장치에 임시 저장해 프린터와 CPU가 동시에 작업할 수 있게 한다", "프린터의 해상도를 높여준다", "문서 파일을 자동으로 압축해 저장한다"],a:1,e:"스풀은 인쇄할 데이터를 디스크에 임시 저장(버퍼링)해 CPU가 프린터의 느린 처리 속도를 기다리지 않고 다른 작업을 계속할 수 있게 하는 기 능이다. 단, 전체 인쇄가 끝나는 시간 자체는 스풀을 사용하지 않을 때보다 다소 늘어날 수 있다. 48. 다음 중 랜섬웨어(Ransomware)에 대한 설명으로 옳은 것은?"},
  {s:"컴퓨터일반",q:"다음 중 랜섬웨어(Ransomware)에 대한 설명으로 옳은 것은?",o:["사용자의 동의 없이 시스템 정보를 수집해 외부로 전송하는 프로그램이다", "파일을 암호화한 뒤 이를 인질로 금전을 요구하는 악성코드이다", "정상 프로그램인 척 위장하여 실행되는 프로그램이다", "네트워크 트래픽을 감시해 정보를 가로채는 기법이다"],a:1,e:"랜섬웨어는 사용자의 파일(문서·사진 등)을 암호화해 접근을 막고, 이를 풀어주는 대가로 금전(랜섬)을 요구하는 악성코드다. ➀은 스파이웨 어, ➂은 트로이목마, ➃는 스니핑에 대한 설명이다. 49. 회사 이메일로 택배 배송 조회 링크가 첨부된 메일을 받고 클릭했더니, 실제 택배사 사이트와 매우 유사하지만 도메인 주소가 미묘하게 다른 로그인 페이지로 연결되어 개인정보 입력을 요구받았다. 이러한 공격 기법의 명칭으로 가장 적절한 것은?"},
  {s:"컴퓨터일반",q:"로그인 페이지로 연결되어 개인정보 입력을 요구받았다. 이러한 공격 기법의 명칭으로 가장 적절한 것은?",o:["스푸핑(Spoofing)", "피싱(Phishing)", "스니핑(Sniffing)", "디도스(DDoS)"],a:1,e:"피싱은 신뢰할 수 있는 기관(택배사·은행 등)을 사칭한 가짜 웹사이트나 이메일로 사용자를 속여 개인정보·금융정보를 탈취하는 사회공학적 공격 기법이다. 데이터 입력 · 자동채우기 · 엑셀 단축키 기출체크 50. 다음 중 자동 채우기에 대한 설명으로 옳지 않은 것은?"},
  {s:"컴퓨터일반",q:"셀 포인터가 C7에 있을 때 Ctrl+왼쪽 화살표(←)를 누르면 이동하는 위치는? (A~E열까지 데이터가 연속으로 입력되어 있음)",o:["B7", "A7", "A1", "C1"],a:1,e:"Ctrl+방향키는 연속된 데이터의 끝(또는 데이터가 없으면 시트의 끝)으로 이동한다. 데이터가 연속이면 해당 행의 첫 데이터 열(A7)로 이동한 다. 53. 사용자가 [파일]-[옵션]-[고급]에서 사용자 지정 목록에 \"월요일, 화요일, 수요일\"을 등록해 둔 상태에서, 특정 셀에 \"화요일\"을 입력하고 채 우기 핸들을 오른쪽으로 3칸 드래그했을 때 결과로 옳은 것은?"},
  {s:"컴퓨터일반",q:"우기 핸들을 오른쪽으로 3칸 드래그했을 때 결과로 옳은 것은?",o:["화요일, 화요일, 화요일, 화요일", "화요일, 수요일, 월요일, 화요일", "화요일, 수요일, 월요일, 화요일 순으로 무한 반복되지 않고 수요일에서 멈춘다", "화요일 뒤에 아무 값도 채워지지 않는다"],a:1,e:"사용자 지정 목록에 등록된 데이터는 목록 순서대로 순환하며 자동 채우기된다. \"화요일\"부터 시작해 오른쪽으로 갈수록 수요일→(목록의 끝 이므로 처음으로 돌아가)월요일→화요일 순으로 반복된다. 정렬 · 부분합 · 시나리오 기출체크 54. 다음 중 부분합 실행 전 반드시 선행되어야 하는 작업은?"},
  {s:"컴퓨터일반",q:"다음 중 페이지 설정의 [시트] 탭에서 지정할 수 없는 것은?",o:["인쇄 영역", "반복할 행/열", "용지 방향(가로/세로)", "눈금선 인쇄 여부"],a:2,e:"용지 방향(가로/세로)은 [페이지] 탭에서 지정한다. [시트] 탭에서는 인쇄영역, 반복할 행/열, 눈금선, 흑백으로, 간단하게 인쇄, 메모 인쇄 등을 지정한다. 59. 다음 중 피벗 테이블에 대한 설명으로 옳지 않은 것은?"},
  {s:"컴퓨터일반",q:"다음 중 데이터 유효성 검사의 오류 메시지 스타일이 아닌 것은?",o:["중지(빨간색 X)", "경고(노란색 삼각형)", "정보(파란색 i)", "확인(초록색 체크)"],a:3,e:"데이터 유효성 검사의 오류 메시지 스타일은 중지·경고·정보 3가지이며, '확인(초록색 체크)' 스타일은 존재하지 않는다. 61. 피벗 테이블에서 \"값\" 영역에 이미 배치된 매출액 필드 외에, 매출액에서 원가를 뺀 이익을 별도 계산해서 함께 표시하고 싶다. 원본 데이터에 는 원가 열만 있고 이익 열은 없을 때, 가장 적절한 방법은?"},
  {s:"컴퓨터일반",q:"다음 중 메모(Comment)에 대한 설명으로 옳지 않은 것은?",o:["단축키 Shift+F2로 메모를 삽입할 수 있다", "메모가 삽입된 셀은 우측 상단에 작은 빨간 삼각형이 표시된다", "찾기(Ctrl+F)로 메모 안의 텍스트를 검색할 수 있다", "메모는 항상 인쇄되며 인쇄 여부를 선택할 수 없다"],a:3,e:"메모의 인쇄 여부는 [페이지 설정]-[시트] 탭에서 '없음/시트 끝/시트에 표시된 대로' 등으로 선택할 수 있다. 63. 다음 중 틀 고정에 대한 설명으로 옳은 것은?"},
  {s:"컴퓨터일반",q:"고급필터 조건 지정 시, 두 조건을 서로 다른 행에 입력했을 때의 의미로 옳은 것은?",o:["AND 조건 (모두 만족)", "OR 조건 (하나라도 만족)", "NOT 조건 (모두 불만족)", "조건이 무시된다"],a:1,e:"같은 행에 조건을 입력하면 AND(그리고), 다른 행에 입력하면 OR(또는) 조건으로 처리된다. 65. 고급필터의 조건 범위에 국어 점수 조건(>=80)과 영어 점수 조건(>=80)을 같은 행에 나란히 입력하고, 그 아래 행에 국어 점수 조건(>=90) 하나만 다시 입력했다면, 이 고급필터가 추출하는 데이터의 조건으로 옳은 것은?"},
  {s:"컴퓨터일반",q:"하나만 다시 입력했다면, 이 고급필터가 추출하는 데이터의 조건으로 옳은 것은?",o:["국어 80점 이상 그리고 영어 80점 이상인 데이터만", "국어 90점 이상인 데이터만", "(국어 80점 이상 그리고 영어 80점 이상) 이거나, 국어 90점 이상인 데이터", "국어 80점 이상 그리고 영어 80점 이상 그리고 국어 90점 이상인 데이터"],a:2,e:"같은 행에 나열된 조건은 AND(그리고), 다른 행에 나열된 조건은 OR(또는)로 처리된다. 따라서 (국어>=80 그리고 영어>=80)인 그룹과, 국어 >=90인 그룹을 OR로 합친 결과가 추출된다. 매크로 종합 기출체크 66. 다음 중 매크로 이름 작성 규칙으로 옳지 않은 것은?"},
  {s:"스프레드시트",q:"다음 중 추세선에 대한 설명으로 옳지 않은 것은?",o:["이동 평균 추세선은 불규칙한 변동을 평균으로 완화하여 추세를 파악할 때 사용한다", "다항식 추세선의 차수는 2차부터 6차까지 지정할 수 있다", "누적 세로 막대형 차트에도 추세선을 추가할 수 있다", "데이터 계열이 하나뿐인 2차원 차트에서만 추세선을 추가할 수 있다"],a:2,e:"누적 세로 막대형 차트에는 추세선을 추가할 수 없다. 다음 중 추세선을 추가할 수 있는 차트로만 짝지어진 것은?"},
  {s:"스프레드시트",q:"다음 중 추세선을 추가할 수 있는 차트로만 짝지어진 것은?",o:["원형, 도넛형", "방사형, 표면형", "분산형, 꺾은선형", "3차원 세로 막대형, 누적 세로 막대형"],a:2,e:"원형·도넛형·방사형·표면형·3차원·누적 세로 막대형은 추세선 추가가 불가능하다. 분산형·꺾은선형만 가능하다. SUMIF·SUMIFS · COUNT계열 · ROW/COLUMN(보강) 함수편에서 예제로만 잠깐 스쳐간 기본기 함수들을 별도 표로 완전 정리한다. SUMIF·SUMIFS는 조건부 합계의 기본이자 매회 출제되는 핵심 함수다. SUMIF · SUMIFS — 조건부 합계 함수 문법"},
  {s:"스프레드시트",q:"판매량이 1,500,000 초과이면서 판매수량이 평균 이상인 항목의 개수를 구하는 수식으로 옳은 것은?",o:["=COUNTIFS(E15:E22,\">1500000\",D15:D22,\">=\"&AVERAGE(D15:D22))", "=COUNTIF(E15:E22,\">1500000\",D15:D22,\">=\"&AVERAGE(D15:D22))", "=SUMIFS(E15:E22,\">1500000\",D15:D22,\">=\"&AVERAGE(D15:D22))", "=COUNTIFS(D15:D22,\">=\"&AVERAGE(D15:D22))"],a:0,e:"조건이 2개 이상이므로 COUNTIFS를 사용하며, 비교연산자와 AVERAGE 함수가 이어질 때는 반드시 \">=\"&AVERAGE(...) 형태로 연결한다. COUNTIF는 조건 1개만 지원하므로 ➁는 오류다. 다음 중 옳지 않은 것은?"},
  {s:"스프레드시트",q:"텍스트 \"20240103\"에서 앞 4자리(학번의 연도)를 추출해 숫자형 참조표에서 VLOOKUP으로 찾으려 한다. 다음 중 옳지 않은 것은?",o:["=LEFT(A2,4)의 결과는 \"2024\"라는 문자 데이터다", "=VALUE(LEFT(A2,4))의 결과는 2024라는 숫자 데이터다", "참조표의 찾을 열이 숫자로 입력되어 있다면, =VLOOKUP(LEFT(A2,4),참조표,2,0)도 문자와 숫자를 자동으로 변환해 정상적으로 검색된다", "참조표의 찾을 열이 숫자로 입력되어 있다면, =VLOOKUP(VALUE(LEFT(A2,4)),참조표,2,0)처럼 VALUE로 감싸야 정상적으로 검색된다"],a:2,e:"LEFT의 결과(문자)와 참조표의 숫자는 자동으로 호환되지 않는다. VALUE()로 감싸 숫자로 변환해야 정상적으로 일치 검색이 된다. RANK.EQ · CHOOSE · LARGE/SMALL · MEDIAN 순위·조건부 값 추출 함수의 조합형 문제를 정리한다. CHOOSE는 인수가 1 이상이어야 하므로 RANK.EQ·MOD 등과 결합할 때 IFERROR로 감싸는 패턴이 반복 출제된다. RANK.EQ 옵션 옵션"},
  {s:"스프레드시트",q:"판매총액이 많은 5개 제품은 \"재생산\", 나머지는 \"생산중단\"으로 표시하는 수식으로 옳은 것은?",o:["=IF(C17>=LARGE($C$17:$C$26,5),\"재생산\",\"생산중단\")", "=IF(C17>=SMALL($C$17:$C$26,5),\"재생산\",\"생산중단\")", "=IF(C17<=LARGE($C$17:$C$26,5),\"재생산\",\"생산중단\")", "=IF(RANK.EQ(C17,$C$17:$C$26)>=5,\"재생산\",\"생산중단\")"],a:0,e:"LARGE(범위,5)는 5번째로 큰 값이므로, 그 값 이상이면 상위 5개 안에 든다는 의미다. 주민번호 8번째 자리가 \"4\"일 때, 수식 =IF(MOD(MID(A4,8,1),2),\"남\",\"여\")의 결과는?"},
  {s:"스프레드시트",q:"주민번호 8번째 자리가 \"4\"일 때, 수식 =IF(MOD(MID(A4,8,1),2),\"남\",\"여\")의 결과는?",o:["남", "여", "#VALUE!", "#NUM!"],a:1,e:"MID로 \"4\"를 추출해 MOD(4,2)=0이 된다. IF는 0을 거짓(FALSE)으로 인식하므로 거짓값인 \"여\"가 반환된다. VLOOKUP · HLOOKUP · INDEX · MATCH 시험에 가장 잘 나오는 참조 함수 4형제. VLOOKUP/HLOOKUP은 '표에서 찾기', INDEX/MATCH는 '좌표로 찾기'라는 원리 차이를 이해하면 조합 문제도 쉽게 풀린 다. 함수 문법"},
  {s:"스프레드시트",q:"다음 중 결과값이 나머지 셋과 다른 것은? (단, A3=\"P02\", B13:D14는 부서코드표)",o:["=HLOOKUP(LEFT(A3,1),$B$13:$D$14,2,FALSE)", "=HLOOKUP(LEFT(A3,1),$B$13:$D$14,2,0)", "=VLOOKUP(LEFT(A3,1),$B$13:$D$14,2,FALSE)", "=IFERROR(HLOOKUP(LEFT(A3,1),$B$13:$D$14,2,0),\"코드오류\")"],a:2,e:"참조표(B13:D14)는 부서코드가 행(가로)으로 나열된 표이므로 HLOOKUP을 써야 한다. VLOOKUP은 열(세로) 방향 표에서만 정상 작동하므 로 ➂은 오류이거나 엉뚱한 값을 반환한다. 날짜함수 · 문자열함수 완전정리 날짜·시간 함수와 문자열 함수는 조합 문제로 자주 출제된다. 날짜 데이터는 1900-01-01을 일련번호 1로 하는 순차값이라는 원리를 알아두면 여러 함정을 피할 수 있다. 날짜 함수"},
