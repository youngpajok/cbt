  {s:"스프레드시트",q:"다음 중 결과값이 나머지 셋과 다른 것은? (텍스트: \"KOREAkook\")",o:["=SEARCH(\"k\",\"KOREAkook\",1)", "=FIND(\"k\",\"KOREAkook\",1)", "=SEARCH(\"K\",\"KOREAkook\",1)", "=SEARCH(\"\",\"KOREA kook\",1)"],a:1,e:"SEARCH는 대소문자를 구분하지 않으므로 ➀➂은 모두 대문자 K가 있는 1번째 위치(1)를 반환한다. ➃는 찾을 문자를 빈 문자열(\"\")로 바꿔 대소문자와 무관하게 시작위치 그대로인 1을 반환하므로 ➀·➂·➃가 모두 1이 된다. FIND로 소문자 k만 찾는 ➁만 6이 되어 나머지 셋과 다른 값을 갖는 정답은 ➁로 유일하게 확정된다. 다음 중 옳지 않은 것은?"},
  {s:"스프레드시트",q:"셀 값이 \"Young Pajok\"일 때, 다음 중 결과값이 옳지 않은 것은?",o:["=SEARCH(\"\",\"Young Pajok\") → 1", "=SEARCH(\" \",\"Young Pajok\") → 6", "=SEARCH(\"s\",\"Young Pajok\") → 9", "=FIND(\"P\",\"Young Pajok\") → 7"],a:2,e:"\"Young Pajok\"에는 소문자 s도 대문자 S도 존재하지 않으므로 결과는 9가 아니라 #VALUE! 에러가 발생한다. 14. 이메일 아이디(@ 앞부분)가 4글자 이상이면 \"사용가능\", 아니면 \"4글자 이상 입력\"을 표시하는 수식으로 옳은 것은? (이메일은 J3셀)"},
  {s:"스프레드시트",q:"이메일 아이디(@ 앞부분)가 4글자 이상이면 \"사용가능\", 아니면 \"4글자 이상 입력\"을 표시하는 수식으로 옳은 것은? (이메일은 J3셀)",o:["=IF(LEN(J3)>=4,\"사용가능\",\"4글자 이상 입력\")", "=IF(SEARCH(\"@\",J3)-1>=4,\"사용가능\",\"4글자 이상 입력\")", "=IF(SEARCH(\"@\",J3)>=4,\"사용가능\",\"4글자 이상 입력\")", "=IF(FIND(\"@\",J3)>=4,\"사용가능\",\"4글자 이상 입력\")"],a:1,e:"교재 해설 참고"},
  {s:"스프레드시트",q:"다음 중 결과값이 나머지 셋과 다른 하나는?",o:["=MOD(11,2)", "=MOD(-7,3)-1", "=TRUNC(10/3)", "=INT(10/3)"],a:1,e:"교재 해설 참고"},
  {s:"스프레드시트",q:"다음 중 결과값이 나머지 셋과 다른 하나는? (단, C3의 주민번호 8번째 자리는 \"2\")",o:["=CHOOSE(MID(C3,8,1),\"남\",\"여\",\"남\",\"여\")", "=CHOOSE(MOD(MID(C3,8,1),2)+1,\"여\",\"남\")", "=IF(MOD(MID(C3,8,1),2)=0,\"여\",\"남\")", "=IF(MOD(MID(C3,8,1),2),\"남\",\"여\")"],a:3,e:"8번째 자리가 2이므로 ➀은 CHOOSE의 2번째 값 \"여\"를 반환. ➁ MOD(2,2)=0, 0+1=1번째 값 \"여\". ➂ MOD 결과 0이므로 \"여\". ➃는 MOD 결과 0(FALSE)이므로 뒤의 값 \"여\"가 나와야 하는데 조건식이 앞뒤가 반대로 배치되어 있어 실제로는 \"여\"가 맞다 — 다만 함정 지문에서는 조건 순서를 바꿔 \"남\"으로 잘못 표기하는 경우가 많으므로 IF(조건,참,거짓)의 순서를 항상 재확인해야 한다. 17. 다음 중 결과값이 나머지 셋과 다른 하나는?"},
  {s:"스프레드시트",q:"다음 중 결과값이 나머지 셋과 다른 것은?",o:["=LARGE({{10,20,30,40,50}},2)", "=SMALL({{10,20,30,40,50}},4)", "=MEDIAN(10,20,30,40,50)", "=RANK.EQ(30,{{10,20,30,40,50}})"],a:3,e:"교재 해설 참고"},
  {s:"스프레드시트",q:"셀 값이 1234567일 때, 서식 코드 #,##0,를 적용한 결과로 옳은 것은?",o:["1,234,567", "1,235", "1234567,", "#,##0,"],a:1,e:"서식 맨 끝의 콤마(,)는 천 단위를 하나씩 생략시킨다. 1,234,567 → 천 단위 생략(반올림) → 1,235가 표시된다. 셀 서식 표시형식 — 결과값 예측 ➁(날짜·색상) 날짜·시간·조건부 색상 서식 코드와 결과값을 정리한다. 특히 yy, aaa, hh:mm:ss 등 날짜·시간 서식은 결과값 문제로 매우 자주 출제된다. 날짜 · 시간 서식 기호 기호 의미"},
  {s:"스프레드시트",q:"셀 값이 2026-12-26(토요일)일 때, 서식 코드 \"yy/m/dd(aaa)\"를 적용한 결과는?",o:["2026/12/26(토)", "26/12/26(토)", "26/12/26(토요일)", "26-12-26"],a:1,e:"yy=2자리 연도(26), m=0 생략 월(12), dd=2자리 일(26), (aaa)=요일 한 글자(토). 셀 서식 표시형식 — 색상 서식 결과값(이어서) 색상 서식 조건부 표시 결과값을 이어서 확인한다. 21. 셀 값이 -5000일 때, 서식 코드 #,##0;[파랑](#,##0)를 적용한 결과로 옳은 것은?"},
  {s:"스프레드시트",q:"셀 값이 -5000일 때, 서식 코드 #,##0;[파랑](#,##0)를 적용한 결과로 옳은 것은?",o:["-5,000 (검정)", "(5,000) (파랑)", "5,000 (파랑)", "-5,000 (파랑)"],a:1,e:"세미콜론 뒤 두 번째 구역이 음수 서식이며 [파랑]과 괄호가 함께 지정되어 있으므로 음수는 괄호로 감싸고 파란색으로 표시된다. 22. 셀 값이 -1234567일 때, 서식 코드 #,##0,;[빨강](#,##0,)\"천원\"을 적용한 결과로 옳은 것은?"},
  {s:"스프레드시트",q:"셀 값이 -1234567일 때, 서식 코드 #,##0,;[빨강](#,##0,)\"천원\"을 적용한 결과로 옳은 것은?",o:["-1,234,567 (검정)", "(1,235)천원 (빨강)", "-1,235천원 (검정)", "(1,234,567)천원 (빨강)"],a:1,e:"맨 끝 콤마(,)는 천 단위를 하나씩 생략시키므로 1,234,567 → 1,235(반올림)가 된다. 세미콜론 뒤 음수 구역이 [빨강]과 괄호로 지정되어 있으 므로 괄호+빨간색으로 표시되고, 서식 끝의 \"천원\" 문자가 그대로 붙어 (1,235)천원이 표시된다. 셀 값이 1500일 때, 서식 코드 #,##0;[빨강](#,##0)를 적용한 결과로 옳은 것은?"},
  {s:"스프레드시트",q:"셀 값이 1500일 때, 서식 코드 #,##0;[빨강](#,##0)를 적용한 결과로 옳은 것은?",o:["1,500 (검정)", "(1,500) (빨강)", "1,500 (빨강)", "-1,500 (빨강)"],a:0,e:"1500은 양수이므로 세미콜론 앞 첫 번째 구역(색상 지정 없음)이 적용되어 기본색(검정)으로 1,500이 표시된다. [빨강] 서식은 음수 구역에만 지정되어 있다. 셀 값이 0일 때, 서식 코드 #,##0;[빨강](#,##0);\"—\";@ 를 적용한 결과로 옳은 것은?"},
  {s:"스프레드시트",q:"셀 값이 0일 때, 서식 코드 #,##0;[빨강](#,##0);\"—\";@ 를 적용한 결과로 옳은 것은?",o:["0", "—", "(0) (빨강)", "아무것도 표시되지 않음"],a:1,e:"서식 코드는 양수;음수;0;텍스트 순서의 4개 구역으로 구성된다. 값이 0이면 세 번째 구역인 \"—\"이 그대로 적용되어 대시(—) 기호가 표시된다. 셀 서식 · 조건부 서식 종합 기출체크 조건부 서식 규칙과 셀 참조 결과값을 함께 묻는 응용형 문제를 다룬다. B C D"},
  {s:"스프레드시트",q:"식으로 옳은 것은? (D2셀 기준, 전체범위 D2:D4)",o:["=D2>AVERAGE(D2:D4)", "=$D2>AVERAGE($D$2:$D$4)", "=D$2>AVERAGE(D2:D4)", "=$D$2>AVERAGE($D$2:$D$4)"],a:1,e:"조건부 서식의 수식은 채우기 핸들처럼 각 행마다 자동 적용되므로 비교 대상 셀은 열고정 혼합참조($D2)로, 비교 기준인 평균범위는 항상 고 정되어야 하므로 절대참조($D$2:$D$4)로 지정한다. 24. 셀 값이 0.5일 때, 서식 코드 0.0%를 적용한 결과값으로 옳은 것은?"}
 ]},
{ name:'기출 18회', q:[
  {s:"컴퓨터일반",q:"다음 중 매크로 이름 작성 규칙으로 옳지 않은 것은?",o:["첫 글자는 반드시 문자(영문 또는 한글)로 시작해야 한다", "이름 중간에 공백을 사용할 수 있다", "숫자로 시작할 수 없다", "이름 중간에 밑줄(_)은 사용할 수 있다"],a:1,e:"매크로 이름에는 공백을 포함할 수 없다. 첫 글자는 문자로 시작해야 하며 숫자·밑줄은 중간에 사용 가능하나 하이픈(-) 등 특수문자는 사용할 수 없다. 67. 다음 중 매크로를 연결할 수 없는 개체는?"},
  {s:"컴퓨터일반",q:"매크로 실행 바로 가기 키를 대문자(예: Ctrl+Shift+A)로 지정했을 때의 기본 형태로 옳은 것은?",o:["Alt+영문 대문자", "Ctrl+영문 대문자", "Ctrl+Shift+영문 대문자", "Shift+영문 대문자"],a:2,e:"매크로 바로 가기 키는 기본적으로 Ctrl+영문 소문자이며, 대문자로 지정하면 자동으로 Ctrl+Shift+영문 대문자 조합이 된다. 69. 매크로를 상대 참조로 기록하기 시작한 뒤 C3셀에서 D3셀로 이동해 값을 입력하고 기록을 마쳤다. 이 매크로를 F5셀을 선택한 상태에서 실 행하면 실제로 값이 입력되는 셀로 옳은 것은?"},

  {s:"컴퓨터일반",q:"계열 겹치기를 -100%로, 간격 너비를 0%로 설정했을 때 나타나는 형태로 옳은 것은?",o:["계열끼리 완전히 겹쳐지고 막대 사이 간격이 최대가 된다", "계열이 서로 완전히 벌어지고 막대 사이 간격이 없어진다", "계열도 벌어지고 간격도 최대가 된다", "계열도 겹쳐지고 간격도 없어진다"],a:1,e:"계열 겹치기는 음수쪽(-100%)일수록 계열이 최대한 벌어지고, 간격 너비 0%는 막대 사이 간격이 없어진 상태를 의미한다. 73. 막대형 차트로 월별 매출액을, 꺾은선형 차트로 월별 성장률(%)을 한 차트에 함께 표시하려고 한다. 매출액은 수백만 단위, 성장률은 0~100% 단위라 값의 크기 차이가 커서 성장률 막대가 거의 보이지 않는 문제를 해결하는 가장 적절한 방법은?"},

  {s:"컴퓨터일반",q:"다음 중 인터넷 서비스에 대한 설명으로 옳지 않은 것은?",o:["DNS는 도메인 이름을 실제 IP 주소로 변환해주는 서비스다", "DHCP는 네트워크에 접속한 기기에 자동으로 IP 주소를 할당한다", "VPN은 공중망을 전용선처럼 안전하게 사용하도록 하는 기술이다", "FTP는 도메인 이름을 IP 주소로 변환하는 서비스다"],a:3,e:"도메인 이름을 IP 주소로 변환하는 서비스는 DNS다. FTP는 파일을 서버와 주고받는 서비스다. 저작권 · 소프트웨어 라이선스 · 클라우드·최신 IT 용어 저작권·소프트웨어 라이선스 종류와 최근 출제 비중이 늘고 있는 클라우드·최신 IT 용어를 정리한다. 소프트웨어 라이선스 종류 종류 특징"},

  {s:"컴퓨터일반",q:"다음 중 MPEG 규격에 대한 설명으로 옳지 않은 것은?",o:["MPEG-1은 비디오 CD(VCD) 등 CD 매체 저장을 위한 규격이다", "MPEG-2는 디지털TV·DVD 등 고화질 분야에 사용된다", "MPEG-7은 동영상을 압축하는 표준이다", "MPEG-21은 멀티미디어 콘텐츠의 제작·유통·보안을 관리하는 통합 프레임워크다"],a:2,e:"MPEG-7은 압축 규격이 아니라 멀티미디어 콘텐츠의 정보검색(내용 기반 검색)을 위한 메타데이터 표준이다. EXTRA SECTION · 시험에 잘 나오고 자주 헷갈리는 핵심 항목 CONFUSION KILLER — 헷갈림 종결 심화비교 CISC vs RISC 구분 CISC"},
  {s:"컴퓨터일반",q:"다음 중 CISC와 RISC에 대한 설명으로 옳지 않은 것은?",o:["CISC는 명령어의 길이가 가변적이며, 복잡한 연산을 하나의 명령어로 처리할 수 있다", "RISC는 명령어 종류가 적어 명령어 해독 회로가 단순하고, 대부분 한 클럭에 실행되도록 설계된다", "CISC는 RISC보다 범용 레지스터의 수가 많아, 메모리 접근 없이 대부분의 연산을 레지스터에서 처리한다", "RISC는 대부분의 연산을 레지스터 중심으로 처리하며, 메모리 접근은 Load·Store 명령어로 제한한다"],a:2,e:"CISC는 오히려 RISC보다 범용 레지스터의 수가 적은 편이며, 메모리에 직접 접근하는 복잡한 주소지정 방식의 명령어를 다수 지원한다. 레지스터 중심으로 연산하고 메모리 접근을 Load·Store 명령어로 제한하는 쪽은 RISC다. 프로세스 스케줄링 기법 기법 특징 FCFS(선입선출)"},
  {s:"컴퓨터일반",q:"다음은 7비트 ASCII 코드에 홀수 패리티 비트를 '오른쪽 끝 1비트'로 붙인 8비트 코드이다. 전송 중 오류가 발생한(패리티가 어긋난) 것은?",o:["11001010", "00110001", "10111010", "01110000"],a:0,e:"홀수 패리티는 8비트 전체에서 1의 개수가 홀수가 되도록 패리티 비트를 정한다. 정답 코드 <b>11001010</b>는 1의 개수가 4개로 홀수가 아니어서 오류이다. (패리티 비트는 1비트 오류의 '발생 여부'만 검출하고 위치는 못 찾는다.)"},

  {s:"컴퓨터일반",q:"다음 두 8비트 값에 비트 단위 AND 연산을 수행한 결과로 옳은 것은?\n\n00101101 AND 01100000",o:["11010010", "00100000", "01001101", "01101101"],a:1,e:"비트 AND은 각 자리에서 둘 다 1일 때만 1 → <b>00100000</b>."},
  {s:"컴퓨터일반",q:"다음 중 가로 1024픽셀 × 세로 720픽셀, 한 픽셀을 16비트로 표현하는 비압축 비트맵 이미지의 용량으로 옳은 것은? (1KB=1,024Byte)",o:["2,880KB", "1,440KB", "720KB", "480KB"],a:1,e:"비트맵 용량 = 가로×세로×색 깊이(비트)÷8 = 1024×720×16÷8 = <b>1,474,560 Byte</b> ≒ 1,440KB."},
  {s:"스프레드시트",q:"셀 값이 0.5일 때, 서식 코드 0.0%를 적용한 결과값으로 옳은 것은?",o:["0.5%", "50.0%", "50%", "5.0%"],a:1,e:"% 서식은 값에 100을 곱하고 %를 붙인다. 0.5×100=50, 소수 첫째자리(0.0)까지 표시하므로 50.0%. 25. 셀 값이 문자 \"합계\"일 때, 서식 코드 @\"금액\"를 적용한 결과값으로 옳은 것은?"},
  {s:"스프레드시트",q:"셀 값이 문자 \"합계\"일 때, 서식 코드 @\"금액\"를 적용한 결과값으로 옳은 것은?",o:["합계", "금액", "합계금액", "금액합계"],a:2,e:"@는 원래 문자 데이터가 표시될 위치를 나타내는 자리표시자다. @ 뒤에 \"금액\"이 있으므로 원래 문자 뒤에 '금액'이 붙어 '합계금액'이 표시된 다. 운영체제 · 단축키 · CMD 기출체크 26. 다음 중 Windows 바로 가기 키의 연결이 옳지 않은 것은?"},
  {s:"스프레드시트",q:"다음 중 자동 채우기에 대한 설명으로 옳지 않은 것은?",o:["숫자와 문자가 혼합된 데이터는 문자는 고정되고 숫자만 1씩 증가한다", "날짜 데이터는 기본적으로 1일 단위로 증가한다", "사용자 지정 목록에 등록된 데이터는 순서대로 반복 채워진다", "수식이 입력된 셀은 자동 채우기가 되지 않는다"],a:3,e:"수식이 입력된 셀도 자동 채우기가 가능하며, 이때 셀 참조는 상대·절대·혼합 참조 방식에 따라 자동으로 조정되거나 고정된다. 51. 다음 중 단축키와 기능의 연결이 옳지 않은 것은?"},
  {s:"스프레드시트",q:"다음 중 단축키와 기능의 연결이 옳지 않은 것은?",o:["Ctrl+1 — 셀 서식 대화상자 표시", "Ctrl+9 — 선택한 행 숨기기", "Ctrl+Shift+; — 현재 시스템의 날짜 입력", "Ctrl+; — 현재 시스템의 날짜 입력"],a:2,e:"Ctrl+;(세미콜론)은 현재 날짜, Ctrl+Shift+;은 현재 시간을 입력하는 단축키다. ➂번 지문은 시간이 아닌 날짜라고 설명해 오답이다. 52. 셀 포인터가 C7에 있을 때 Ctrl+왼쪽 화살표(←)를 누르면 이동하는 위치는? (A~E열까지 데이터가 연속으로 입력되어 있음)"},
  {s:"스프레드시트",q:"다음 중 부분합 실행 전 반드시 선행되어야 하는 작업은?",o:["필터 적용", "그룹화할 기준 필드로 정렬", "피벗테이블 작성", "조건부 서식 지정"],a:1,e:"부분합은 그룹화 기준이 되는 필드를 오름차순 또는 내림차순으로 미리 정렬해 놓아야 정상적으로 그룹별 집계가 이루어진다. 55. 다음 중 시나리오에 대한 설명으로 옳지 않은 것은?"},
  {s:"스프레드시트",q:"다음 중 시나리오에 대한 설명으로 옳지 않은 것은?",o:["여러 개의 변화하는 값을 저장해 두고 조건에 따라 결과를 비교할 수 있다", "변경 셀은 반드시 수식이 입력된 셀이어야 한다", "시나리오 요약 보고서를 별도의 시트로 생성할 수 있다", "각 시나리오에 이름을 지정해 구분할 수 있다"],a:1,e:"시나리오의 '변경 셀'은 값이 바뀌는 입력 셀(상수)이어야 하며, 수식이 입력된 셀은 '결과 셀'로 지정한다. 56. 다음 중 통합(Consolidate)에 대한 설명으로 옳은 것은?"},
  {s:"스프레드시트",q:"다음 중 통합(Consolidate)에 대한 설명으로 옳은 것은?",o:["통합 시 원본 데이터가 반드시 같은 워크시트에 있어야 한다", "여러 시트·통합 문서의 데이터를 하나의 표로 요약할 수 있다", "통합 결과는 반드시 원본 데이터의 오른쪽에 표시된다", "통합 기능은 숫자 데이터에는 사용할 수 없다"],a:1,e:"통합은 서로 다른 워크시트나 다른 통합 문서(파일)에 있는 데이터도 하나의 표로 요약할 수 있는 기능이다. 57. 부서(오름차순)를 1차 기준, 매출액(내림차순)을 2차 기준으로 정렬한 표에서 부분합을 실행해 부서별 매출액 합계를 구하려 한다. 이 작업의 순서로 가장 적절한 것은?"},
  {s:"스프레드시트",q:"다음 중 피벗 테이블에 대한 설명으로 옳지 않은 것은?",o:["원본 데이터가 변경되면 자동으로 피벗 테이블에 반영된다", "피벗 테이블의 레이아웃(행/열/값 영역)은 자유롭게 재배치할 수 있다", "피벗 차트를 함께 만들 수 있다", "그룹화 기능으로 날짜 데이터를 월·분기·연 단위로 묶을 수 있다"],a:0,e:"원본 데이터가 변경되어도 피벗 테이블에 자동으로 반영되지 않으며, [데이터]-[모두 새로 고침]을 실행해야 최신 데이터가 반영된다. 60. 다음 중 데이터 유효성 검사의 오류 메시지 스타일이 아닌 것은?"},
  {s:"스프레드시트",q:"는 원가 열만 있고 이익 열은 없을 때, 가장 적절한 방법은?",o:["원본 데이터로 돌아가 이익 열을 직접 추가한 뒤 피벗 테이블을 새로 만든다", "피벗 테이블 도구의 [계산 필드] 기능으로 매출액-원가 수식을 추가한다", "피벗 테이블에서는 계산된 필드를 추가할 수 없으므로 불가능하다", "값 영역에 원가를 다시 추가하는 것 외에는 방법이 없다"],a:1,e:"피벗 테이블의 [필드, 항목 및 집합]-[계산 필드] 기능을 사용하면 원본 데이터를 수정하지 않고도 기존 필드를 조합한 새로운 계산 필드(예: 매 출액-원가)를 피벗 테이블 안에서 바로 만들 수 있다. 메모 삽입 · 틀 고정 · 고급필터 기출체크 62. 다음 중 메모(Comment)에 대한 설명으로 옳지 않은 것은?"},
  {s:"스프레드시트",q:"다음 중 틀 고정에 대한 설명으로 옳은 것은?",o:["D4셀에서 틀 고정을 실행하면 D4셀을 기준으로 윗 행과 왼쪽 열이 고정된다", "틀 고정은 인쇄 시 반복 인쇄 행/열과 동일한 기능이다", "틀 고정선은 마우스로 드래그해 위치를 조정할 수 있다", "틀 고정은 셀 선택 없이 실행할 수 없는 기능이 아니라 항상 A1 기준으로 고정된다"],a:0,e:"셀포인터 기준으로 [틀 고정]을 실행하면 그 셀을 기준으로 윗 행과 왼쪽 열이 고정되어 스크롤 시에도 화면에 남아있게 된다. 64. 고급필터 조건 지정 시, 두 조건을 서로 다른 행에 입력했을 때의 의미로 옳은 것은?"},
  {s:"스프레드시트",q:"다음 중 매크로를 연결할 수 없는 개체는?",o:["도형", "단추(양식 컨트롤)", "셀에 입력된 일반 텍스트", "스마트아트"],a:2,e:"매크로는 도형, 단추, 스마트아트 등의 개체에 지정할 수 있지만, 셀에 입력된 일반 문자(텍스트) 자체에는 매크로를 직접 연결할 수 없다. 68. 매크로 실행 바로 가기 키를 대문자(예: Ctrl+Shift+A)로 지정했을 때의 기본 형태로 옳은 것은?"},
  {s:"스프레드시트",q:"행하면 실제로 값이 입력되는 셀로 옳은 것은?",o:["D3셀", "F5셀", "G5셀", "E5셀"],a:2,e:"상대 참조로 기록된 매크로는 기록 당시의 이동 방향과 거리(오른쪽으로 1칸)를 기억한다. F5셀에서 실행하면 F5셀 기준으로 오른쪽 1칸인 G5셀에 값이 입력된다. 차트 종합 기출체크(복습) 70. 다음 중 원형 차트에 대한 설명으로 옳지 않은 것은?"},
  {s:"스프레드시트",q:"다음 중 방사형 차트에 대한 설명으로 옳은 것은?",o:["3차원 차트로 작성할 수 있다", "가운데 요소에서 뻗어나온 값 축을 가지며 3차원으로는 작성할 수 없다", "반드시 하나의 데이터 계열만 가질 수 있다", "두 개의 숫자 값을 XY 좌표로 표시한다"],a:1,e:"방사형 차트는 여러 계열의 합계값을 비교할 때 사용하며, 각 항목마다 중심에서 뻗어나온 값 축을 갖고 3차원으로는 작성할 수 없다. 72. 계열 겹치기를 -100%로, 간격 너비를 0%로 설정했을 때 나타나는 형태로 옳은 것은?"},
  {s:"스프레드시트",q:"0~100% 단위라 값의 크기 차이가 커서 성장률 막대가 거의 보이지 않는 문제를 해결하는 가장 적절한 방법은?",o:["매출액 계열을 삭제하고 성장률만 표시한다", "성장률 계열을 보조 축으로 지정한 콤보(혼합) 차트로 변경한다", "두 계열의 차트 종류를 모두 원형 차트로 바꾼다", "데이터 레이블을 숨겨서 문제를 해결한다"],a:1,e:"값의 단위 차이가 큰 두 계열을 한 차트에 표시할 때는 하나의 계열(성장률)을 보조 축으로 지정하고 차트 종류를 다르게 섞는 콤보(혼합) 차트 를 사용하면 각 계열이 자기 축의 눈금에 맞춰 적절한 크기로 표시된다. 혼합 모의고사 기출체크 ➀ 74. 다음 중 [찾기 및 바꾸기]에 대한 설명으로 옳지 않은 것은?"},
  {s:"스프레드시트",q:"아래 표에서 전체 판매 금액(수량×단가의 합계)을 한 번에 구하려고 한다. 가장 적절한 수식은? (참고: 총액 63,000원)",o:["=SUM(B2:B4)*SUM(C2:C4)", "=SUM(B2:B4*C2:C4)", "=SUMPRODUCT(B2:B4,C2:C4)", "=SUMPRODUCT(B2:B4+C2:C4)"],a:2,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">품목</td><td class=\"hd\">수량</td><td class=\"hd\">단가</td></tr><tr><td class=\"rh\">2</td><td>지우개</td><td>2</td><td>6,000</td></tr><tr><td class=\"rh\">3</td><td>펜</td><td>5</td><td>7,000</td></tr><tr><td class=\"rh\">4</td><td>노트</td><td>2</td><td>8,000</td></tr></table>",e:"<b>SUMPRODUCT(배열1, 배열2)</b>는 대응하는 원소끼리 곱한 뒤 모두 더한다 → <b>63,000</b>원. =SUM(B*C)는 일반 입력 시 배열이 아니라 오류/단일값이 되고(배열 입력해야 함), SUM(B)*SUM(C)는 합끼리 곱해 의미가 다르다."},
  {s:"스프레드시트",q:"셀 값이 1,000 이상이면 '자홍', 1,000 미만 500 이상이면 '빨강', 500 미만이면 색을 지정하지 않고, 모든 구간에서 천 단위 구분 기호(,)와 소수 이하 첫째 자리까지 표시하려고 한다. 사용자 지정 표시 형식으로 옳은 것은? (예: 1234.56 → 1,234.6, 432 → 432.0)",o:["[자홍][>=1000]#,##0.0;[빨강][>=500]#,##0.0;#,##0.0", "[자홍][>=1000]#,##0.0;[빨강][>=500]#,##0.0", "[>=1000]<자홍>#,##0.0;[>=500]<빨강>#,##0.0;#,##0.0", "[자홍][>=1000]#,###.#;[빨강][>=500]#,###.#;#,###.#"],a:0,e:"사용자 지정 형식은 <b>[조건·색]양수서식;[조건·색]서식;나머지서식</b> 구조로, 색과 조건은 대괄호 [자홍][>=1000] 안에 넣는다. 소수 첫째 자리는 0을 써서 <b>#,##0.0</b>으로 해야 432가 432.0으로 나온다(#,###.#은 432를 432.로 만들어 틀림). 꺾쇠<>로 색을 넣는 문법은 없다. 정답: <b>[자홍][>=1000]#,##0.0;[빨강][>=500]#,##0.0;#,##0.0</b>"},
  {s:"스프레드시트",q:"다음 수식의 실행 결과로 옳은 것은?\n\n=IFS(A1>=90,\"A\",A1>=80,\"B\",A1>=70,\"C\",TRUE,\"F\")   (단, [A1]=12)",o:["A", "B", "C", "F"],a:3,e:"12점은 해당 구간에 따라 'F'를 반환한다."},
  {s:"스프레드시트",q:"셀 값이 5,000 이상이면 '녹색', 5,000 미만 500 이상이면 '자홍', 500 미만이면 색을 지정하지 않고, 모든 구간에서 천 단위 구분 기호(,)와 소수 이하 첫째 자리까지 표시하려고 한다. 사용자 지정 표시 형식으로 옳은 것은? (예: 1234.56 → 1,234.6, 432 → 432.0)",o:["[녹색][>=5000]#,###.#;[자홍][>=500]#,###.#;#,###.#", "[>=5000]<녹색>#,##0.0;[>=500]<자홍>#,##0.0;#,##0.0", "[녹색][>=5000]#,##0.0;[자홍][>=500]#,##0.0", "[녹색][>=5000]#,##0.0;[자홍][>=500]#,##0.0;#,##0.0"],a:3,e:"사용자 지정 형식은 <b>[조건·색]양수서식;[조건·색]서식;나머지서식</b> 구조로, 색과 조건은 대괄호 [녹색][>=5000] 안에 넣는다. 소수 첫째 자리는 0을 써서 <b>#,##0.0</b>으로 해야 432가 432.0으로 나온다(#,###.#은 432를 432.로 만들어 틀림). 꺾쇠<>로 색을 넣는 문법은 없다. 정답: <b>[녹색][>=5000]#,##0.0;[자홍][>=500]#,##0.0;#,##0.0</b>"},
  {s:"스프레드시트",q:"다음 중 SUBSTITUTE 함수를 사용한 수식의 실행 결과로 옳은 것은?\n\n=SUBSTITUTE(\"44-14-70-52\",\"-\",\"/\")",o:["44/14/70-52", "44/14/70/52", "44/14-70-52", "44-14-70-52"],a:1,e:"SUBSTITUTE(문자열, 찾을값, 바꿀값)에서 네 번째 인수를 생략하면 '-'를 <b>모두</b> '/'로 바꾼다 → <b>44/14/70/52</b>."},
  {s:"스프레드시트",q:"다음 중 날짜 함수 수식의 실행 결과로 옳은 것은?\n\n=EDATE(\"2025-06-14\",2)",o:["2025-08-15", "2025-08-01", "2025-08-14", "2025-08-13"],a:2,e:"EDATE는 기준일에서 지정한 개월 수(2개월) 뒤의 '같은 날'을 반환한다 → <b>2025-08-14</b>."}
 ]}

function bar(label,c,t){const p=pct(c,t);return `<div class="br"><span>${esc(label)}</span><div class="tr"><div class="fl${p<60?' lo':''}" style="width:${p}%"></div></div><span class="pc">${p}% (${c}/${t})</span></div>`;}

/* ===== 세션 ===== */
function startRound(r){begin(ROUNDS[r].name+' 모의고사','round',ROUNDS[r].q.map((_,i)=>mk(r+'-'+i)),()=>startRound(r),r);}
function startWrong(){const ids=Object.keys(DB.wrong).filter(validId);begin('오답노트','wrong',ids.map(mk),startWrong);}
function startRandom(){
 const by={}; ROUNDS.forEach((R,r)=>R.q.forEach((x,i)=>(by[x.s]=by[x.s]||[]).push(r+'-'+i)));
 Object.values(by).forEach(shuf); const pick=[],used=new Set();
 for(const s in RATIO)(by[s]||[]).slice(0,RATIO[s]).forEach(id=>{pick.push(id);used.add(id);});
 const rest=shuf(Object.values(by).flat().filter(id=>!used.has(id)));
 while(pick.length<RAND_N&&rest.length)pick.push(rest.shift());
 pick.sort((a,b)=>SUBJ_ORDER.indexOf(validId(a).s)-SUBJ_ORDER.indexOf(validId(b).s));
 begin('랜덤 모의고사','random',pick.map(mk),startRandom);
}
/* ===== 과목별 집중 학습 ===== */
function subjPanel(){
 const scount={}; ROUNDS.forEach(R=>R.q.forEach(x=>scount[x.s]=(scount[x.s]||0)+1));
 const subjs=SUBJ_ORDER.filter(s=>scount[s]);
 const chips=subjs.map(s=>{const g=DB.subj[s],rate=g?pct(g[0],g[1]):0,on=DB.ssel.includes(s);
   return `<button class="chip ${on?'on':''}" data-s="${esc(s)}"><b>${esc(s)}</b><span>${scount[s]}문항 · 정답률 ${rate}%</span></button>`;}).join('');
 const row=(label,key,opts)=>`<div class="optrow"><label>${label}</label><div class="seg seg${opts.length}">`+
   opts.map(([v,t])=>`<button data-k="${key}" data-v="${v}" class="${String(DB[key])===String(v)?'on':''}">${t}</button>`).join('')+`</div></div>`;
 const sel=DB.ssel.filter(s=>subjs.includes(s));
 const navail=sel.reduce((n,s)=>n+scount[s],0);
 const label=!sel.length?'과목을 선택하세요':`선택 과목 집중 학습 시작 (${DB.sn?Math.min(DB.sn,navail)+'문항':navail+'문항 전체'})`;
 return `<section class="panel"><div class="ph"><h2>과목별 집중 학습</h2><small>약한 과목만 골라 맞춤 문제를 풉니다</small></div>
   <div class="optrow"><label>과목 선택 <span style="font-weight:400">(여러 과목 선택 가능)</span></label><div class="subjchips">${chips}</div></div>
   ${row('출제 범위','sscope',[['all','전체 문항'],['wrong','틀린 문제만'],['unseen','안 푼 문제만']])}
   ${row('문항 수','sn',[[10,'10문항'],[20,'20문항'],[0,'전체']])}
   ${row('순서','sord',[['recent','최신 회차순'],['random','무작위']])}
   ${row('채점 방식','sgrade',[['practice','바로 채점'],['exam','제출 후 채점 · 문항당 2분']])}
   <button class="fill" id="goSubj" ${sel.length?'':'disabled style="opacity:.55"'}>${label}</button>
   <div class="msg" id="smsg"></div></section>`;
}
function startSubject(){
 const sel=DB.ssel.filter(s=>SUBJ_ORDER.includes(s));
 if(!sel.length){$('smsg').textContent='과목을 1개 이상 선택하세요.';return;}
 const groups=[]; ROUNDS.forEach((R,r)=>{const ids=[];R.q.forEach((x,i)=>{if(sel.includes(x.s))ids.push(r+'-'+i);});if(ids.length)groups.push(ids);});
 let ids=[];
 if(DB.sord==='recent'){for(let k=groups.length-1;k>=0;k--)ids.push(...groups[k]);}
 else {groups.forEach(g=>ids.push(...g)); shuf(ids);}
 if(DB.sscope==='wrong')ids=ids.filter(id=>DB.wrong[id]);
 else if(DB.sscope==='unseen')ids=ids.filter(id=>!DB.seen[id]);
 if(!ids.length){$('smsg').textContent=DB.sscope==='wrong'?'선택 과목에 틀린 문제가 없습니다.':DB.sscope==='unseen'?'선택 과목을 모두 풀었습니다. 범위를 바꿔 보세요.':'조건에 맞는 문제가 없습니다.';return;}
 if(DB.sn)ids=ids.slice(0,DB.sn);
 const title='과목별 집중 · '+sel.join('·');
 begin(title,'subject',ids.map(mk),startSubject,undefined,{mode:DB.sgrade,time:DB.sgrade==='exam'?ids.length*120:TIME});
}

function begin(title,type,items,again,r,opt){
 opt=opt||{};
 S={title,type,r,items,again,mode:opt.mode||DB.mode,cur:0,warned:false,t:opt.time||TIME,start:Date.now(),
    ans:items.map(()=>-1),flag:items.map(()=>false),chk:items.map(()=>false)};
 screen='exam'; $('tool').style.display='';
 clearInterval(timerId); if(S.mode==='exam') timerId=setInterval(tick,1000);
 showQ(0);
}
function tick(){S.t--; const el=$('tm'); if(el){el.textContent=clk(S.t); if(S.t<=60)el.closest('.timer').classList.add('warn');}
 if(S.t<=0){clearInterval(timerId);alert('시험 시간이 종료되어 자동 제출됩니다.');submit(true);}}

/* ===== 문제 ===== */
function showQ(i){
 S.cur=i; const x=S.items[i], a=S.ans[i], rev=S.mode==='practice'&&S.chk[i];
 let h=`<div class="qhead"><div class="qtitle">${AVA}<div><div class="stitle">${esc(S.title)}</div><small>${DB.name?esc(DB.name)+' · ':'수험생 · '}${S.mode==='exam'?'시험 모드':'연습 모드'}${POINT!=null?' · 문항당 '+POINT+'점':' · 100점 환산'}</small></div></div>`;
 h+= S.mode==='exam'
   ? `<div class="timer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6M12 2v3"/></svg><div><div><b>남은 시간</b><span id="tm">${clk(S.t)}</span></div></div></div>`
   : `<span class="pbadge">연습 모드 · 시간 제한 없음</span>`;
 h+=`</div><div class="card"><div class="qbox">
  <div class="meta"><span class="tag">${esc(x.s)}</span><span class="qno">${i+1} / ${S.items.length}</span><button class="star${S.flag[i]?' on':''}" id="star">${S.flag[i]?'★ 체크됨':'☆ 체크'}</button></div>
  ${S.type!=='round'?`<div class="src">출처 ${esc(x.src)}</div>`:''}
  <p class="qtext"><span class="n">${i+1}.</span> ${x.q}</p>${x.fig?`<div class="fig">${x.fig}</div>`:''}`;
 x.o.forEach((o,k)=>{let c='',lbl=''; if(rev){if(k===x.a){c=' ok';lbl='<span class="lbl">정답</span>';}else if(k===a){c=' ng';lbl='<span class="lbl">오답</span>';}} else if(a===k)c=' sel';
   h+=`<button class="op${c}" data-k="${k}">${lbl}<span class="num">${k+1}</span><span>${o}</span></button>`;});
 if(rev) h+=`<div class="exp ${a===x.a?'g':'r'}"><span class="eh">${a===x.a?'정답입니다 · '+okBadge():'오답입니다 · 정답 '+MARK[x.a]+' '+x.o[x.a]}</span>${x.e}</div>`;
 h+=`<div class="msg" id="msg"></div></div>
  <div class="nav"><button class="prev" id="pv">이전 문제</button><button class="next" id="nx">${i===S.items.length-1?'마지막 문제':'다음 문제'}</button></div></div>`;
 main.innerHTML=h;
 main.querySelectorAll('.op').forEach(b=>b.onclick=()=>choose(i,+b.dataset.k));
 $('star').onclick=()=>{S.flag[i]=!S.flag[i];showQ(i);};
 $('pv').onclick=()=>i>0?showQ(i-1):msg('첫 번째 문제입니다.');
 $('nx').onclick=()=>i<S.items.length-1?showQ(i+1):msg('마지막 문제입니다. 답안 제출을 눌러 주세요.');
 window.scrollTo({top:0,behavior:'smooth'});
}
function choose(i,k){if(S.mode==='practice'&&S.chk[i])return;S.ans[i]=k;if(S.mode==='practice')S.chk[i]=true;S.warned=false;showQ(i);}
function msg(s,color){const m=$('msg');if(m){m.style.color=color||'';m.textContent=s;}}

/* ===== OMR ===== */
function openOMR(){let h='';
 S.items.forEach((_,r)=>{h+=`<div class="row${r===S.cur?' cur':''}"><button class="no${S.ans[r]<0?' empty':''}" data-g="${r}">${r+1}${S.flag[r]?'<i>★</i>':''}</button><div class="bubbles">`;
   for(let k=0;k<4;k++)h+=`<span class="num${S.ans[r]===k?' on':''}" data-r="${r}" data-k="${k}">${k+1}</span>`; h+='</div></div>';});
 $('omrBody').innerHTML=h;
 $('omrBody').querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{closeOMR();showQ(+b.dataset.g);});
 $('omrBody').querySelectorAll('[data-r]').forEach(s=>s.onclick=()=>{const r=+s.dataset.r;if(S.mode==='practice'&&S.chk[r])return;S.ans[r]=+s.dataset.k;if(S.mode==='practice')S.chk[r]=true;S.warned=false;openOMR();if(r===S.cur)showQ(r);});
 $('omrBg').classList.add('show');}
function closeOMR(){$('omrBg').classList.remove('show');}

/* ===== 제출·채점 ===== */
function submit(force){
 const left=S.ans.filter(a=>a<0).length;
 if(left&&!S.warned&&!force){showQ(S.cur);msg(`안 푼 문제가 ${left}개 있습니다. 한 번 더 누르면 제출됩니다.`);S.warned=true;return;}
 clearInterval(timerId); closeOMR(); screen='result'; $('tool').style.display='none'; document.body.classList.remove('exam-on');
 const ok=S.items.map((x,i)=>S.ans[i]===x.a), right=ok.filter(Boolean).length;
 const full=fullOf(S.items.length), sc=scoreOf(right,S.items.length);
 const sub={}; S.items.forEach((x,i)=>{(sub[x.s]=sub[x.s]||[0,0])[1]++; if(ok[i])sub[x.s][0]++;});
 const elapsed=Math.round((Date.now()-S.start)/1000);
 S.res={ok,right,full,sc,sub,elapsed};
 S.items.forEach((x,i)=>{const g=DB.subj[x.s]||(DB.subj[x.s]=[0,0]);g[1]++;if(ok[i])g[0]++; if(validId(x.id))DB.seen[x.id]=1; if(ok[i])delete DB.wrong[x.id];else DB.wrong[x.id]=(DB.wrong[x.id]||0)+1;});
 if(S.type==='round'){const st=DB.rounds[S.r]||(DB.rounds[S.r]={best:0,full,cnt:0});st.cnt++;st.full=full;if(sc>st.best)st.best=sc;}
 DB.log.unshift({t:S.title,sc,full,d:today()}); DB.log=DB.log.slice(0,12); save();
 showResult();
}
function passed(sub,p){const subP=Object.values(sub).map(([c,t])=>pct(c,t));return p>=PASS_AVG && (subP.length?Math.min(...subP):0)>=PASS_SUB;}
function showResult(){
 const {ok,right,full,sc,sub,elapsed}=S.res, n=S.items.length, p=pct(sc,full), pass=passed(sub,p);
 let h=`<section class="rhero"><div class="rx"><div class="lab">${esc(S.title)} 결과</div>
   <div class="big"><b>${sc}</b><span>/ ${full}점</span></div>
   <div class="cap">정답률 ${p}% · ${right} / ${n}문항 · 소요 ${clk(elapsed)}</div>
   <span class="pill ${pass?'ok':'no'}">${pass?'🎉 합격 예상':'복습이 필요해요'}</span></div></section>`;
 h+=`<section class="panel"><div class="metrics">
    <div><small>맞힌 문항</small><b>${right}개</b></div>
    <div><small>틀린 문항</small><b>${n-right}개</b></div>
    <div><small>소요 시간</small><b>${clk(elapsed)}</b></div></div>
   <div class="ph"><h2>과목별 정답률</h2><small>합격 기준: 과목당 40% · 평균 60%</small></div>
   <div class="bars">${SUBJ_ORDER.filter(s=>sub[s]).map(s=>bar(s,sub[s][0],sub[s][1])).join('')}</div>
   <div class="acts">
    ${n-right?`<button class="fill" id="rw">틀린 문제 다시 풀기 (${n-right})</button>`:''}
    <button class="gold" id="img">이미지로 저장</button>
    <button class="kakao" id="kko">카카오톡 공유</button>
    <button id="all">전체 응시결과</button>
    <button id="ag">처음부터 다시 풀기</button>
    <button id="hm">처음 화면</button>
   </div><div class="msg" id="rmsg" style="color:var(--sub)"></div></section>`;
 h+=`<section class="panel"><div class="ph"><h2>문항별 해설</h2><small>정답 확인 · 오답 복습</small></div>`;
 S.items.forEach((x,i)=>{const a=S.ans[i];
   h+=`<div class="ri"><h3><span class="sbadge ${ok[i]?'ok-b':'no-b'}">${ok[i]?okBadge():ngBadge()}</span>${i+1}번 · ${esc(x.s)}${S.flag[i]?' <span style="color:var(--gold-d)">★</span>':''}${S.type!=='round'?` <span style="font-size:.8rem;color:var(--sub);font-weight:400">(${esc(x.src)})</span>`:''}</h3>
    <p class="q">${x.q}</p>${x.fig?`<div class="fig">${x.fig}</div>`:''}
    <p class="a">내 답 ${a<0?'미응답':MARK[a]+' '+x.o[a]} · 정답 ${MARK[x.a]} ${x.o[x.a]}</p>
    <div class="e">${x.e}</div></div>`;});
 h+=`</section>`; main.innerHTML=h; window.scrollTo({top:0,behavior:'smooth'});
 if($('rw'))$('rw').onclick=()=>{const ids=S.items.filter((_,i)=>!ok[i]).map(x=>x.id);const t=S.title.replace(/ 오답 복습$/,'')+' 오답 복습';const f=()=>begin(t,'retry',ids.map(mk),f);f();};
 $('img').onclick=()=>makeImage(false); $('kko').onclick=()=>makeImage(true);
 $('all').onclick=allResults; $('ag').onclick=S.again; $('hm').onclick=()=>{screen='x';home();};
}

/* ===== 전체 응시결과 ===== */
function allResults(){
 let rows=ROUNDS.map((R,r)=>{const st=DB.rounds[r]; if(!R.q.length) return `<tr class="na"><td class="rn">${R.name}</td><td>준비 중</td><td class="hide-m">-</td><td>-</td></tr>`;
   const full=R.q.length*POINT, best=st?st.best:0, p=pct(best,full);
   return `<tr class="go" data-r="${r}"><td class="rn">${R.name}</td><td>${st?st.cnt+'회':'미응시'}</td><td class="hide-m">${st?best+' / '+full:'-'}</td><td><span class="sc">${st?p+'%':'-'}</span>${st?`<div class="sb"><div style="width:${p}%"></div></div>`:''}</td></tr>`;}).join('');
 main.innerHTML=`<section class="panel"><div class="ph"><h2>전체 응시결과</h2><small>회차를 누르면 바로 시작합니다</small></div>
   <table class="tbl"><thead><tr><th>회차</th><th>응시</th><th class="hide-m">최고점</th><th>정답률</th></tr></thead><tbody>${rows}</tbody></table>
   <div class="acts" style="margin-top:1rem"><button id="hm2">처음 화면</button></div></section>`;
 window.scrollTo(0,0);
 main.querySelectorAll('.tbl tr.go').forEach(tr=>tr.onclick=()=>startRound(+tr.dataset.r));
 $('hm2').onclick=()=>{screen='x';home();};
}

/* ===== 결과 이미지 · 공유 ===== */
function makeImage(share){
 const {right,full,sc,sub,elapsed}=S.res, subs=SUBJ_ORDER.filter(s=>sub[s]).map(s=>[s,sub[s]]), p=pct(sc,full), pass=passed(sub,p);
 const W=760, H=520+subs.length*58, cv=document.createElement('canvas'); cv.width=W;cv.height=H; const c=cv.getContext('2d');
 const F='"Noto Sans KR","Malgun Gothic",sans-serif';
 c.fillStyle='#F5F2EB';c.fillRect(0,0,W,H);
 c.fillStyle='#173C7C';c.fillRect(0,0,W,120); c.fillStyle='#F2C94C';c.fillRect(0,120,W,4);
 c.fillStyle='#F2C94C';c.font=`900 30px ${F}`;c.fillText('영파족 STUDY · CBT',40,60);
 c.fillStyle='#fff';c.font=`500 19px ${F}`;c.fillText('컴퓨터활용능력 '+GRADE+' 필기',40,94);
 c.fillStyle='#1E2433';c.font=`900 27px ${F}`;c.fillText(S.title+' 결과',40,172);
 c.fillStyle='#6B7080';c.font=`400 18px ${F}`;c.fillText(`${DB.name?DB.name+' · ':''}${today()} · ${S.mode==='exam'?'시험 모드':'연습 모드'}`,40,202);
 c.textAlign='center';c.fillStyle='#173C7C';c.font=`900 92px ${F}`;c.fillText(sc,W/2-30,310);
 c.fillStyle='#B8891A';c.font=`700 34px ${F}`;c.fillText('/ '+full,W/2+95,310);
 c.fillStyle=pass?'#2E7D32':'#C62828';c.font=`700 23px ${F}`;
 c.fillText(`${pass?'합격 예상':'복습 필요'} · 정답률 ${p}% · ${right}/${S.items.length} · 소요 ${clk(elapsed)}`,W/2,352);c.textAlign='left';
 let y=410;c.fillStyle='#1E2433';c.font=`900 21px ${F}`;c.fillText('과목별 정답률',40,y);y+=18;
 subs.forEach(([s,[cc,t]])=>{const q=pct(cc,t);y+=34;c.fillStyle='#1E2433';c.font=`500 19px ${F}`;c.fillText(s,40,y);
   c.fillStyle='#EEE9DC';c.fillRect(210,y-15,420,16);c.fillStyle=q<60?'#D9675F':'#173C7C';c.fillRect(210,y-15,420*q/100,16);
   c.fillStyle='#6B7080';c.font=`400 17px ${F}`;c.fillText(`${q}% (${cc}/${t})`,645,y);y+=22;});
 cv.toBlob(b=>{const name=`컴활2급CBT_${S.title.replace(/\s/g,'')}.png`, file=new File([b],name,{type:'image/png'});
   if(share){ if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:'컴활 2급 필기 CBT 결과',text:`${S.title} ${sc}/${S.res.full}점`}).catch(()=>{});}
     else{dl(b,name);$('rmsg').textContent='이미지를 저장했습니다. 카카오톡 대화창에 첨부해 공유하세요.';} }
   else{ dl(b,name);$('rmsg').textContent='결과 이미지를 저장했습니다. 다운로드 폴더를 확인하세요.'; }
 },'image/png');
}
function dl(b,name){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();}

/* ===== 하단 버튼 ===== */
$('b1').onclick=()=>showQ(0);
$('b2').onclick=openOMR;
$('b3').onclick=()=>{const u=S.ans.indexOf(-1);if(u<0)msg('모든 문제에 답했습니다.','var(--green)');else showQ(u);};
$('b4').onclick=()=>submit(false);
$('omrClose').onclick=closeOMR;
$('omrBg').onclick=e=>{if(e.target.id==='omrBg')closeOMR();};
$('logo').onclick=home;
// 푸터 링크(교재·유튜브) 연결
try{var fl=$('flink'); if(fl&&_C.book){fl.href=_C.book.url; fl.target='_blank'; fl.rel='noopener';}
    var yl=$('ylink'); if(yl){yl.href='https://www.youtube.com/@youngpajok'; yl.target='_blank'; yl.rel='noopener';}}catch(e){}
applyFs(); home();

</script>
