  {s:"데이터베이스",q:"아래 '회원' 테이블에서 다음 SQL을 실행했을 때 '수정되는 레코드 수'로 옳은 것은?\n\nUPDATE 회원 SET 등급='VIP' WHERE 지역='대전';",o:["7", "2", "1", "0"],a:2,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">이름</td><td class=\"hd\">지역</td><td class=\"hd\">등급</td><td class=\"hd\">실적</td></tr><tr><td class=\"rh\">2</td><td class=\"l\">김하늘</td><td>인천</td><td>우수</td><td>20</td></tr><tr><td class=\"rh\">3</td><td class=\"l\">강다온</td><td>광주</td><td>일반</td><td>60</td></tr><tr><td class=\"rh\">4</td><td class=\"l\">한소라</td><td>광주</td><td>우수</td><td>50</td></tr><tr><td class=\"rh\">5</td><td class=\"l\">박세찬</td><td>대전</td><td>우수</td><td>90</td></tr><tr><td class=\"rh\">6</td><td class=\"l\">이두리</td><td>광주</td><td>일반</td><td>50</td></tr><tr><td class=\"rh\">7</td><td class=\"l\">YOUNGPAJOK</td><td>광주</td><td>우수</td><td>50</td></tr><tr><td class=\"rh\">8</td><td class=\"l\">윤서준</td><td>인천</td><td>일반</td><td>70</td></tr></table>",e:"WHERE 지역='대전' 조건을 만족하는 레코드만 수정된다 → <b>1건</b>."}
 ]},
{ name:'기출 3회', q:[
  {s:"컴퓨터일반",q:"다음 중 메타버스의 유형(ASF 분류)에 해당하지 않는 것은?",o:["증강현실(Augmented Reality)", "라이프로깅(Lifelogging)", "거울세계(Mirror World)", "블록체인(Blockchain)"],a:3,e:"메타버스는 보통 <b>증강현실·라이프로깅·거울세계·가상세계</b>의 네 유형으로 구분한다. 블록체인은 분산 원장 '보안' 기술로 메타버스 유형이 아니다."},
  {s:"컴퓨터일반",q:"다음 중 데이터 전송 방식(캐스트)에 대한 설명으로 옳지 않은 것은?",o:["유니캐스트는 하나의 송신자가 하나의 수신자에게 1:1로 전송하는 방식이다.", "멀티캐스트는 특정 그룹에 속한 여러 수신자에게 동시에 전송하는 방식이다.", "브로드캐스트는 같은 네트워크 내 모든 수신자에게 전송하는 방식이다.", "애니캐스트는 그룹 내 모든 수신자에게 빠짐없이 동시에 전송하는 방식이다."],a:3,e:"애니캐스트는 그룹 중 <b>가장 가까운(또는 최적인) 하나의 수신자</b>에게만 전송(1:1)한다. 모두에게 동시에 보내는 것은 멀티캐스트다."},
  {s:"컴퓨터일반",q:"다음 중 가상현실 관련 기술 용어에 대한 설명으로 옳지 않은 것은?",o:["VR은 현실과 분리된 가상 환경에 몰입하게 한다.", "AR은 현실 영상 위에 가상 정보를 겹쳐 보여 준다.", "MR은 현실과 가상을 결합해 상호작용하게 한다.", "메타버스는 데이터를 블록 단위로 저장·연결하는 분산 장부 기술이다."],a:3,e:"데이터를 블록으로 연결하는 것은 블록체인이다. 메타버스는 아바타로 활동하는 3차원 가상 융합 세계를 뜻한다."},
  {s:"컴퓨터일반",q:"다음 중 가상·증강 관련 기술에 대한 설명으로 옳지 않은 것은?",o:["VR(가상현실)은 현실과 단절된 완전한 가상 환경을 컴퓨터로 구현해 몰입감을 준다.", "AR(증강현실)은 현실 세계의 모습 위에 가상의 정보·이미지를 겹쳐 보여 준다.", "MR(혼합현실)은 현실과 가상을 결합하여 가상 객체와 실시간으로 상호작용하게 한다.", "XR(확장현실)은 VR 전용 기술을 가리키며 AR·MR과는 전혀 관련이 없다."],a:3,e:"XR(확장현실)은 <b>VR·AR·MR을 아우르는 통칭</b>이다. VR 전용이라는 설명은 틀리다."},
  {s:"컴퓨터일반",q:"다음 중 CPU 스케줄링 알고리즘에 대한 설명으로 옳지 않은 것은?",o:["FCFS는 도착 순서대로 처리하는 비선점 방식으로, 긴 작업 뒤의 짧은 작업이 오래 기다리는 호위 효과가 있다.", "SJF는 실행 시간이 짧은 작업을 먼저 처리하며 평균 대기 시간을 최소화할 수 있다.", "라운드 로빈(RR)은 시간 할당량(Time Quantum)을 두고 순환하는 선점형 방식이다.", "라운드 로빈에서 시간 할당량을 매우 크게 하면 SJF와 동일하게 동작한다."],a:3,e:"라운드 로빈에서 시간 할당량을 매우 '크게' 하면 선점이 거의 일어나지 않아 FCFS에 가까워진다. 반대로 매우 작게 하면 문맥 교환 부담이 커진다."},
  {s:"컴퓨터일반",q:"다음 중 Windows 11의 시스템 관리 도구에 대한 설명으로 옳지 않은 것은?",o:["장치 관리자에서 하드웨어와 드라이버 상태를 확인·갱신할 수 있다.", "작업 스케줄러로 특정 시각·조건에 프로그램을 자동 실행할 수 있다.", "레지스트리 편집기(regedit)로 시스템·앱 설정 정보를 수정할 수 있다.", "디스크 조각 모음은 SSD에서도 반드시 주기적으로 수행해야 수명이 늘어난다."],a:3,e:"SSD는 구동부가 없어 '조각 모음'이 불필요하며 오히려 쓰기 수명을 깎을 수 있다. SSD에는 TRIM(최적화)이 수행된다."},
  {s:"컴퓨터일반",q:"다음 중 캐시 메모리의 사상(Mapping) 방식에 대한 설명으로 옳지 않은 것은?",o:["직접 사상(Direct Mapping)은 주기억장치 블록이 들어갈 캐시 라인이 하나로 고정된다.", "완전 연관 사상(Fully Associative)은 블록을 캐시의 임의 라인에 배치할 수 있어 적중률이 높지만 비교 회로가 복잡하다.", "집합 연관 사상(Set Associative)은 직접 사상과 완전 연관 사상의 절충 방식이다.", "직접 사상은 블록 교체 알고리즘이 반드시 필요하여 구현이 가장 복잡하다."],a:3,e:"직접 사상은 블록이 들어갈 자리가 하나로 정해져 교체 알고리즘이 필요 없고 구현이 가장 단순하다. 교체 알고리즘이 필요한 것은 연관·집합 연관 사상이다."},
  {s:"컴퓨터일반",q:"다음 중 스풀(SPOOL)과 버퍼(Buffer)에 대한 설명으로 옳지 않은 것은?",o:["버퍼는 속도 차이가 나는 두 장치 사이에 데이터를 잠시 저장하는 기억 공간이다.", "스풀은 주로 인쇄 작업을 디스크에 모았다가 순서대로 출력한다.", "스풀링으로 여러 사용자의 출력 작업을 동시에 처리하는 효과를 얻는다.", "버퍼는 반드시 하드디스크에만 두며 주기억장치에는 둘 수 없다."],a:3,e:"버퍼는 주로 '주기억장치(RAM)'나 장치 내부에 둔다. 스풀은 디스크를 버퍼처럼 활용한다. 버퍼를 HDD에만 둔다는 설명은 틀리다."},
  {s:"컴퓨터일반",q:"다음 중 컴퓨터 비전(Computer Vision) 기술의 활용으로 보기 어려운 것은?",o:["얼굴 인식 출입", "자율주행차의 보행자 감지", "의료 영상 판독", "스프레드시트 수식 계산"],a:3,e:"스프레드시트 수식 계산은 컴퓨터 비전과 무관하다."},
  {s:"컴퓨터일반",q:"다음 중 Windows 11의 파일 탐색기에 대한 설명으로 옳지 않은 것은?",o:["하나의 창에서 '탭' 기능으로 여러 폴더를 열어 전환할 수 있다.", "<b>Alt+방향키</b>로 이전/다음 폴더로 이동하는 탐색 기록을 사용할 수 있다.", "파일을 선택하고 <b>F2</b>를 누르면 이름을 바꿀 수 있다.", "휴지통을 거치지 않고 영구 삭제하려면 <b>Shift+Insert</b>를 사용한다."],a:3,e:"휴지통을 거치지 않는 영구 삭제는 <b>Shift+Delete</b>이다. Shift+Insert는 붙여넣기 기능이다. 탐색기 탭, Alt+방향키 이동, F2 이름 바꾸기는 모두 옳다."},
  {s:"컴퓨터일반",q:"다음 중 인터넷 서비스와 웹 기술에 대한 설명으로 옳지 않은 것은?",o:["HTTP는 웹 문서를 주고받는 프로토콜이고, HTTPS는 여기에 암호화(SSL/TLS)를 더해 보안을 강화한 것이다.", "FTP는 파일 전송 서비스로 업로드·다운로드를 지원하며, 익명(anonymous) 접속을 허용하기도 한다.", "HTML5는 ActiveX나 별도 플러그인 없이도 <video>·<audio> 태그로 멀티미디어를 재생할 수 있다.", "쿠키(Cookie)는 서버 측에 저장되는 대용량 데이터로, 이용자의 모든 접속 기록을 영구적으로 보관한다."],a:3,e:"쿠키는 <b>이용자(클라이언트) 컴퓨터에 저장되는 작은 텍스트 파일</b>로, 서버 대용량·영구 보관이 아니다."},
  {s:"컴퓨터일반",q:"다음 중 Windows 11의 '스냅 레이아웃/스냅 그룹' 기능에 대한 설명으로 옳지 않은 것은?",o:["창의 최대화 단추 위에 마우스를 올리거나 Win+Z로 스냅 레이아웃을 열 수 있다.", "여러 창을 화면의 지정된 구역에 자동으로 배치할 수 있다.", "함께 배치한 창들을 '스냅 그룹'으로 묶어 작업 표시줄에서 한 번에 복원할 수 있다.", "스냅 레이아웃은 모니터가 한 대일 때는 사용할 수 없고 듀얼 모니터에서만 동작한다."],a:3,e:"스냅 레이아웃은 <b>모니터 한 대에서도 사용</b>할 수 있다. 화면을 2·3·4 구역으로 나눠 창을 정렬하는 기능이다."},
  {s:"컴퓨터일반",q:"다음 중 프로세스와 스레드에 대한 설명으로 옳지 않은 것은?",o:["프로세스는 실행 중인 프로그램으로 독립된 주소 공간을 가진다.", "스레드는 프로세스 내에서 실행되는 흐름의 단위로 코드·데이터·힙을 공유한다.", "하나의 프로세스는 여러 스레드를 가질 수 있다.", "같은 프로세스의 스레드들은 서로 스택까지 완전히 공유하여 독립적인 실행 흐름을 가질 수 없다."],a:3,e:"같은 프로세스의 스레드는 코드·데이터·힙은 공유하지만 '스택과 레지스터는 각자' 가져 독립적인 실행 흐름을 유지한다."},
  {s:"컴퓨터일반",q:"다음 중 모바일·무선 통신 기술에 대한 설명으로 옳지 않은 것은?",o:["5G는 LTE보다 빠른 속도와 낮은 지연, 많은 동시 접속을 지원한다.", "Wi-Fi 6은 이전 세대보다 혼잡 환경에서 효율이 개선되었다.", "블루투스는 근거리 저전력 무선 통신에 쓰인다.", "NFC는 수십 미터 거리에서 동작하는 광역 무선 통신 기술이다."],a:3,e:"NFC는 약 10cm 이내의 '초근거리' 통신 기술이다. 수십 미터 광역 통신이 아니다."},
  {s:"컴퓨터일반",q:"다음 중 자연어 처리(NLP) 기술이 활용되는 사례로 보기 어려운 것은?",o:["기계 번역", "챗봇 상담", "음성 비서의 명령 이해", "하드디스크 조각 모음"],a:3,e:"디스크 조각 모음은 <b>저장장치 관리</b>로 자연어 처리와 무관하다."},
  {s:"컴퓨터일반",q:"다음 중 기억장치의 '지역성(Locality)'에 대한 설명으로 옳지 않은 것은?",o:["시간 지역성은 최근에 참조된 항목이 가까운 미래에 다시 참조될 가능성이 높은 성질이다.", "공간 지역성은 참조된 항목의 인접한 항목이 곧 참조될 가능성이 높은 성질이다.", "반복문·순차 접근은 지역성을 높여 캐시 적중률을 향상시킨다.", "지역성이 높을수록 캐시 적중률이 낮아져 성능이 떨어진다."],a:3,e:"지역성이 높을수록 캐시에 필요한 데이터가 있을 확률이 커져 '적중률이 높아지고' 성능이 좋아진다."},
  {s:"컴퓨터일반",q:"다음 중 Windows 11의 위젯·알림 기능에 대한 설명으로 옳은 것은?",o:["위젯 패널에서는 날씨·뉴스·일정 등 정보를 모아 볼 수 있다.", "빠른 설정과 알림은 반드시 같은 버튼 하나로만 함께 열린다.", "알림을 일시 중지하는 기능은 제공되지 않는다.", "위젯은 바탕 화면에 아이콘으로만 추가할 수 있고 패널 형태는 없다."],a:0,e:"위젯 패널(Win+W)은 <b>날씨·뉴스·일정 등 개인화 정보를 모아 보는 패널</b>이다. 빠른 설정(Win+A)과 알림 센터(Win+N)는 별도로 열 수 있고, 집중 세션으로 알림을 멈출 수 있다."},
  {s:"컴퓨터일반",q:"다음 중 가로 1024픽셀 × 세로 768픽셀, 한 픽셀을 16비트로 표현하는 비압축 비트맵 이미지의 용량으로 옳은 것은? (1KB=1,024Byte)",o:["3,072KB", "768KB", "1,536KB", "512KB"],a:2,e:"비트맵 용량 = 가로×세로×색 깊이(비트)÷8 = 1024×768×16÷8 = <b>1,572,864 Byte</b> ≒ 1,536KB."},
  {s:"컴퓨터일반",q:"다음은 7비트 ASCII 코드에 짝수 패리티 비트를 '오른쪽 끝 1비트'로 붙인 8비트 코드이다. 전송 중 오류가 발생한(패리티가 어긋난) 것은?",o:["11100100", "01111110", "01111101", "11011100"],a:3,e:"짝수 패리티는 8비트 전체에서 1의 개수가 짝수가 되도록 패리티 비트를 정한다. 정답 코드 <b>11011100</b>는 1의 개수가 5개로 짝수가 아니어서 오류이다. (패리티 비트는 1비트 오류의 '발생 여부'만 검출하고 위치는 못 찾는다.)"},
  {s:"컴퓨터일반",q:"다음 중 샘플링 44kHz, 양자화 16비트, 스테레오(2채널)로 10초간 녹음한 비압축 디지털 오디오의 용량으로 가장 가까운 것은?",o:["약 26.9MB", "약 0.8MB", "약 1.7MB", "약 3.4MB"],a:2,e:"오디오 용량 = 샘플링 주파수 × (양자화 비트÷8) × 채널 수 × 시간 = 44,000 × 2 × 2 × 10 = <b>1,760,000 Byte</b> ≒ 약 1.7MB."},
  {s:"스프레드시트",q:"다음 VBA 프로시저를 실행한 후 메시지 박스에 출력되는 값으로 옳은 것은?",o:["36", "34", "35", "37"],a:2,fig:"<pre class=\"code\">Sub Test()\n  Dim i As Integer, S As Integer\n  S = 0\n  For i = 1 To 15 Step 3\n    S = S + i\n  Next i\n  MsgBox S\nEnd Sub</pre>",e:"i를 1부터 15까지 3씩 증가 → 1+4+7+10+13 = <b>35</b>"},
  {s:"스프레드시트",q:"다음 중 차트의 구성 요소에 대한 설명으로 옳지 않은 것은?",o:["차트 영역은 전체를 감싸는 가장 바깥 영역, 그림 영역은 축과 계열이 그려지는 안쪽 영역이다.", "데이터 레이블은 각 요소의 값·항목 이름·계열 이름 등을 직접 표시한다.", "추세선은 데이터 변화 추세를 예측하는 선으로 회귀 분석이라고도 한다.", "범례는 계열을 색·기호로 설명하며, 원형 차트에서는 가로·세로 축이 범례를 대신한다."],a:3,e:"원형 차트는 <b>가로·세로 축이 없다</b>."},
  {s:"스프레드시트",q:"시작일 [B2], 종료일 [C2] 사이의 실제 근무일수를 주말과 공휴일([H2:H5])을 제외하고 구하는 수식으로 옳은 것은?",o:["=NETWORKDAYS(B2,C2,H2:H5)", "=WORKDAY(B2,C2,H2:H5)", "=DAYS(C2,B2)", "=NETWORKDAYS(B2,C2)+COUNTA(H2:H5)"],a:0,e:"NETWORKDAYS(시작,종료,[휴일])은 <b>주말·휴일을 제외한 근무일수</b>를 센다. WORKDAY는 '날짜'를, DAYS는 전체 일수를 반환한다."},
  {s:"스프레드시트",q:"다음 중 [머리글/바닥글] 탭에서 설정할 수 '없는' 것은?",o:["첫 페이지를 다르게 지정", "짝수와 홀수 페이지를 다르게 지정", "문서에 맞게 배율 조정", "반복할 행(인쇄 제목) 지정"],a:3,e:"반복할 행/열(인쇄 제목)은 [시트] 탭에서 지정한다. [머리글/바닥글] 탭에는 첫 페이지 다르게, 짝/홀수 다르게, 문서에 맞게 배율 조정, 페이지 여백에 맞춤 옵션이 있다."},
  {s:"스프레드시트",q:"다음 중 차트의 추세선에 대한 설명으로 옳지 않은 것은?",o:["추세선은 변화 추세를 파악·예측하는 선으로 회귀 분석이라고도 한다.", "추세선에 사용된 수식을 차트에 함께 표시할 수 있다.", "비누적 2차원 막대형·꺾은선형·분산형·거품형 등에 추가할 수 있다.", "원형·도넛형·방사형·표면형·3차원 차트에도 추세선을 추가할 수 있다."],a:3,e:"원형·도넛형·방사형·표면형·누적 영역형·<b>3차원에는 추세선을 추가할 수 없다</b>."},
  {s:"스프레드시트",q:"A열에 머리글(A1) 아래로 매출이 개수가 달라지며 연속 입력될 때, 전체 합계를 자동으로 구하는 가장 적절한 수식은?",o:["=SUM(A2:A100)", "=SUM(OFFSET(A2,0,0,COUNTA(A:A)-1,1))", "=SUM(OFFSET(A1,COUNTA(A:A),0,1,1))", "=SUMPRODUCT(A:A)"],a:1,e:"OFFSET(A2,0,0,COUNTA(A:A)-1,1)으로 <b>'머리글 제외 데이터 높이'만큼의 동적 범위</b>를 만들어 합산한다."},
  {s:"스프레드시트",q:"다음 중 데이터 정렬과 고급 필터에 대한 설명으로 옳지 않은 것은?",o:["정렬 기준은 최대 64개까지 지정할 수 있고, 값뿐 아니라 셀 색·글꼴 색·조건부 서식 아이콘을 기준으로도 정렬할 수 있다.", "오름차순 정렬 시 데이터는 숫자, 문자, 논리값, 오류값, 빈 셀 순으로 배치된다.", "고급 필터에서 조건을 같은 행에 입력하면 AND, 서로 다른 행에 입력하면 OR로 결합된다.", "고급 필터의 '다른 장소에 복사'는 결과를 다른 워크시트나 다른 통합 문서의 임의 위치로 자유롭게 복사할 수 있다."],a:3,e:"'다른 장소에 복사'의 결과 위치는 <b>반드시 같은 워크시트</b>여야 한다."},
  {s:"스프레드시트",q:"다음 중 목표값 찾기·시나리오·데이터 표에 대한 설명으로 옳지 않은 것은?",o:["목표값 찾기는 수식의 결과를 원하는 값으로 만들기 위해 입력값 하나를 거꾸로 찾아 주는 기능이다.", "시나리오는 여러 입력값 집합(변경 셀)에 따른 결과를 비교하고 요약 보고서로 만들 수 있다.", "데이터 표는 한두 개의 입력 변수에 여러 값을 대입했을 때의 결과를 한 번에 보여 주며, 결과는 배열 수식으로 입력된다.", "데이터 표의 결과 범위는 셀 단위로 일부만 선택해 자유롭게 수정하거나 삭제할 수 있다."],a:3,e:"데이터 표의 결과는 <b>배열 수식이라 일부만 수정·삭제할 수 없다</b>(전체 단위로만)."},
  {s:"스프레드시트",q:"다음 중 REPLACE 함수로 특정 위치의 문자를 바꾼 결과로 옳은 것은?\n\n=REPLACE(\"01021631111\",5,3,\"***\")",o:["0102***31111", "0102***1111", "0102***1112", "01021***111"],a:1,e:"REPLACE(원본, 시작위치, 글자수, 새문자)는 5번째부터 3글자를 '***'로 바꾼다 → <b>0102***1111</b>. (SUBSTITUTE는 '값'으로 찾고, REPLACE는 '위치'로 바꾸는 점이 다르다.)"},
  {s:"스프레드시트",q:"다음 중 REPLACE 함수로 특정 위치의 문자를 바꾼 결과로 옳은 것은?\n\n=REPLACE(\"01065873064\",4,4,\"****\")",o:["010****3064", "010****3061", "010****73064", "0106****064"],a:0,e:"REPLACE(원본, 시작위치, 글자수, 새문자)는 4번째부터 4글자를 '****'로 바꾼다 → <b>010****3064</b>. (SUBSTITUTE는 '값'으로 찾고, REPLACE는 '위치'로 바꾸는 점이 다르다.)"},
  {s:"스프레드시트",q:"아래 [A1:C7] 표에서 부서가 '영업부'이면서 점수가 70점 이상인 직원 수를 배열 수식으로 구하려고 한다. 가장 적절한 수식은?",o:["{=SUM((B2:B7=\"영업부\")*(C2:C7>=70))}", "{=SUMPRODUCT((B2:B7=\"영업부\")*(C2:C7>70))}", "{=COUNT((B2:B7=\"영업부\")*(C2:C7>=70))}", "{=SUM((B2:B7=\"영업부\")+(C2:C7>=70))}"],a:0,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">이름</td><td class=\"hd\">부서</td><td class=\"hd\">점수</td></tr><tr><td class=\"rh\">2</td><td>정하람</td><td class=\"l\">인사부</td><td>95</td></tr><tr><td class=\"rh\">3</td><td>최서연</td><td class=\"l\">영업부</td><td>73</td></tr><tr><td class=\"rh\">4</td><td>오시후</td><td class=\"l\">영업부</td><td>82</td></tr><tr><td class=\"rh\">5</td><td>권노아</td><td class=\"l\">인사부</td><td>84</td></tr><tr><td class=\"rh\">6</td><td>오시후</td><td class=\"l\">전산부</td><td>64</td></tr><tr><td class=\"rh\">7</td><td>조민재</td><td class=\"l\">인사부</td><td>65</td></tr></table>",e:"개수는 두 조건의 곱을 <b>SUM</b>으로 합산한다. <b>{=SUM((B2:B7=\"영업부\")*(C2:C7>=70))}</b> → 두 조건이 모두 참인 행마다 1을 더해 <b>2</b>명. (+는 OR가 되고, >70는 경계값을 빠뜨려 틀린다.)"},
  {s:"스프레드시트",q:"아래 [A1:C6] 표에서 부서가 '영업부'인 직원 중 실적의 최대값을 배열 수식으로 구하려고 한다. 가장 적절한 수식은?",o:["{=MAX(IF(B2:B6=\"영업부\",C2:C6))}", "=MAXIF(B2:B6,\"영업부\",C2:C6)", "=MAX(C2:C6)", "{=MAX((B2:B6=\"영업부\")*C2:C6)}"],a:0,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">이름</td><td class=\"hd\">부서</td><td class=\"hd\">실적</td></tr><tr><td class=\"rh\">2</td><td>강태양</td><td class=\"l\">인사부</td><td>41</td></tr><tr><td class=\"rh\">3</td><td>오시후</td><td class=\"l\">영업부</td><td>58</td></tr><tr><td class=\"rh\">4</td><td>박도윤</td><td class=\"l\">인사부</td><td>62</td></tr><tr><td class=\"rh\">5</td><td>홍지안</td><td class=\"l\">인사부</td><td>98</td></tr><tr><td class=\"rh\">6</td><td>박도윤</td><td class=\"l\">기획부</td><td>99</td></tr></table>",e:"<b>{=MAX(IF(B2:B6=\"영업부\",C2:C6))}</b> → 조건이 참인 행의 실적만 모아 최대값을 구한다. 결과는 <b>58</b>. IF의 거짓값을 0으로 두면 MIN에서 0이 섞여 틀리고, (B2:B6=\"영업부\")*C2:C6 방식도 MIN에서 0 때문에 틀린다. (Ctrl+Shift+Enter 배열 입력)"},
  {s:"스프레드시트",q:"아래 [A1:D5] 표에서 '키보드'의 '3월' 값을 찾으려고 한다. 가장 적절한 수식은? (결과: 참고로 한 셀의 값)",o:["=INDEX(B2:D5,MATCH(\"3월\",B1:D1,0),MATCH(\"키보드\",A2:A5,0))", "=INDEX(B2:D5,MATCH(\"키보드\",A2:A5,0),MATCH(\"3월\",B1:D1,0))", "=INDEX(B2:D5,MATCH(\"키보드\",A2:A5,0))", "=VLOOKUP(\"키보드\",A2:A5,MATCH(\"3월\",B1:D1,0),0)"],a:1,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">품목</td><td class=\"hd\">2월</td><td class=\"hd\">1월</td><td class=\"hd\">3월</td></tr><tr><td class=\"rh\">2</td><td>프린터</td><td>59</td><td>42</td><td>85</td></tr><tr><td class=\"rh\">3</td><td>키보드</td><td>92</td><td>70</td><td>56</td></tr><tr><td class=\"rh\">4</td><td>마우스</td><td>34</td><td>34</td><td>32</td></tr><tr><td class=\"rh\">5</td><td>노트북</td><td>56</td><td>70</td><td>18</td></tr></table>",e:"<b>INDEX(데이터, 행번호, 열번호)</b> 형태에서 행·열 위치를 각각 <b>MATCH</b>로 찾는다. INDEX의 인수 순서는 (범위, 행, 열)이므로 행 MATCH가 먼저 와야 한다. '키보드'×'3월' 교차값은 <b>56</b>. VLOOKUP은 왼쪽 첫 열 기준이라 열 머리글 조회에 부적합하다."},
  {s:"스프레드시트",q:"아래 시트([A1:C3])에서 다음 수식의 결과로 옳은 것은?\n\n=OFFSET(A1,0,1)",o:["8", "28", "24", "30"],a:1,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td>12</td><td>28</td><td>30</td></tr><tr><td class=\"rh\">2</td><td>8</td><td>24</td><td>9</td></tr><tr><td class=\"rh\">3</td><td>16</td><td>21</td><td>30</td></tr></table>",e:"OFFSET(A1,0,1)은 A1에서 아래로 0칸·오른쪽으로 1칸 이동한 셀 → <b>28</b>"},
  {s:"스프레드시트",q:"다음 중 SUBSTITUTE 함수를 사용한 수식의 실행 결과로 옳은 것은?\n\n=SUBSTITUTE(\"96-63-19-71\",\"-\",\".\",2)",o:["96-63-19.71", "96-63.19-71", "96.63.19-71", "96.63.19.71"],a:1,e:"네 번째 인수 2은(는) 2번째 '-'만 '.'로 바꾼다 → <b>96-63.19-71</b>. (인수를 생략하면 모든 '-'를 바꾼다.)"},
  {s:"스프레드시트",q:"아래 [A1:C6] 표에서 부서가 '기획부'인 직원 중 실적의 최대값을 배열 수식으로 구하려고 한다. 가장 적절한 수식은?",o:["{=MAX(IF(B2:B6=\"기획부\",C2:C6))}", "=MAXIF(B2:B6,\"기획부\",C2:C6)", "{=MAX((B2:B6=\"기획부\")*C2:C6)}", "=MAX(C2:C6)"],a:0,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">이름</td><td class=\"hd\">부서</td><td class=\"hd\">실적</td></tr><tr><td class=\"rh\">2</td><td>홍지안</td><td class=\"l\">영업부</td><td>55</td></tr><tr><td class=\"rh\">3</td><td>신아라</td><td class=\"l\">기획부</td><td>33</td></tr><tr><td class=\"rh\">4</td><td>신아라</td><td class=\"l\">기획부</td><td>33</td></tr><tr><td class=\"rh\">5</td><td>서다은</td><td class=\"l\">기획부</td><td>62</td></tr><tr><td class=\"rh\">6</td><td>신아라</td><td class=\"l\">영업부</td><td>82</td></tr></table>",e:"<b>{=MAX(IF(B2:B6=\"기획부\",C2:C6))}</b> → 조건이 참인 행의 실적만 모아 최대값을 구한다. 결과는 <b>62</b>. IF의 거짓값을 0으로 두면 MIN에서 0이 섞여 틀리고, (B2:B6=\"기획부\")*C2:C6 방식도 MIN에서 0 때문에 틀린다. (Ctrl+Shift+Enter 배열 입력)"},
  {s:"스프레드시트",q:"아래 시트에서 입력값에 주어진 표시 형식을 적용했을 때, [C2]의 결과로 옳은 것은?",o:["abcabc", "1", "2025년 3월", "크다"],a:3,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">입력값</td><td class=\"hd\">표시 형식</td><td class=\"hd\">결과</td></tr><tr><td class=\"rh\">2</td><td>7</td><td class=\"l\">[>=5]\"크다\";\"작다\"</td><td>?</td></tr></table>",e:"5 이상이면 '크다' → 크다"},
  {s:"스프레드시트",q:"아래 [A1:C7] 표에서 부서가 '생산부'이면서 점수가 70점 이상인 직원 수를 배열 수식으로 구하려고 한다. 가장 적절한 수식은?",o:["{=SUMPRODUCT((B2:B7=\"생산부\")*(C2:C7>70))}", "{=SUM((B2:B7=\"생산부\")*(C2:C7>=70))}", "{=SUM((B2:B7=\"생산부\")+(C2:C7>=70))}", "{=COUNT((B2:B7=\"생산부\")*(C2:C7>=70))}"],a:1,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">이름</td><td class=\"hd\">부서</td><td class=\"hd\">점수</td></tr><tr><td class=\"rh\">2</td><td>서다은</td><td class=\"l\">생산부</td><td>97</td></tr><tr><td class=\"rh\">3</td><td>임채원</td><td class=\"l\">전산부</td><td>62</td></tr><tr><td class=\"rh\">4</td><td>최서연</td><td class=\"l\">생산부</td><td>71</td></tr><tr><td class=\"rh\">5</td><td>윤예린</td><td class=\"l\">생산부</td><td>82</td></tr><tr><td class=\"rh\">6</td><td>강태양</td><td class=\"l\">영업부</td><td>68</td></tr><tr><td class=\"rh\">7</td><td>김하늘</td><td class=\"l\">생산부</td><td>84</td></tr></table>",e:"개수는 두 조건의 곱을 <b>SUM</b>으로 합산한다. <b>{=SUM((B2:B7=\"생산부\")*(C2:C7>=70))}</b> → 두 조건이 모두 참인 행마다 1을 더해 <b>4</b>명. (+는 OR가 되고, >70는 경계값을 빠뜨려 틀린다.)"},
  {s:"스프레드시트",q:"셀 [A1:A5]에 다음 값이 입력되어 있다: 32, 35, 48, 49, 87\n다음 수식(제2사분위수)의 결과로 옳은 것은?\n\n=QUARTILE.INC(A1:A5, 2)",o:["48", "47", "49", "35"],a:0,e:"QUARTILE.INC(범위, 2)는 제2사분위수(하위 50% 지점)를 구하며 PERCENTILE.INC(범위,0.5)와 같다. 정렬된 값에서 결과는 <b>48</b>이다."},
  {s:"스프레드시트",q:"다음 중 SUBSTITUTE 함수를 사용한 수식의 실행 결과로 옳은 것은?\n\n=SUBSTITUTE(\"21-60-58-57\",\"-\",\":\")",o:["21:60:58:57", "21:60-58-57", "21-60-58-57", "21:60:58-57"],a:0,e:"SUBSTITUTE(문자열, 찾을값, 바꿀값)에서 네 번째 인수를 생략하면 '-'를 <b>모두</b> ':'로 바꾼다 → <b>21:60:58:57</b>."},
  {s:"데이터베이스",q:"다음 중 입력 마스크 기호에 대한 설명으로 옳지 않은 것은?",o:["0 은 필수 숫자(0~9), 9 는 선택 숫자(공백 허용)를 뜻한다.", "L 은 필수 영문자·한글, ? 는 선택 영문자·한글을 뜻한다.", "> 는 뒤의 모든 문자를 대문자로, < 는 소문자로 변환한다.", "입력 마스크는 세미콜론(;)으로 구분된 두 개의 구역으로만 구성된다."],a:3,e:"입력 마스크는 <b>최대 세 구역(마스크;서식문자 저장 여부;자리 표시 문자)</b>으로 구성된다."},
  {s:"데이터베이스",q:"다음 중 테이블의 필드 속성(입력 마스크·유효성 검사·기본값)에 대한 설명으로 옳지 않은 것은?",o:["'유효성 검사 규칙'에 조건식을 지정하면 조건에 맞지 않는 값은 입력할 수 없고, '유효성 검사 텍스트'로 안내 메시지를 표시한다.", "'기본값'을 지정하면 새 레코드를 추가할 때 해당 값이 미리 입력되며, 사용자가 다른 값으로 바꿀 수 있다.", "'입력 마스크'에서 0은 필수 숫자, 9는 선택 숫자, L은 필수 문자, &는 임의의 한 문자(공백 불가)를 뜻한다.", "'형식(Format)' 속성에 지정한 내용은 테이블에 '저장되는 실제 값' 자체를 변경하여 디스크에 그대로 기록한다."],a:3,e:"'형식'은 <b>화면 표시 방식만</b> 바꿀 뿐 <b>저장되는 실제 값은 변경하지 않는다</b>."},
  {s:"데이터베이스",q:"다음 중 Access의 '도메인 집계 함수'에 대한 설명으로 옳지 않은 것은?",o:["DLookUp은 조건에 맞는 특정 필드의 값을 하나 반환한다.", "DCount는 조건에 맞는 레코드의 개수를 반환한다.", "DSum은 조건에 맞는 레코드의 합계를 반환한다.", "DAvg는 조건에 맞는 레코드 중 가장 큰 값을 반환한다."],a:3,e:"DAvg는 '평균'을 반환한다. 가장 큰 값은 DMax, 가장 작은 값은 DMin이다. 도메인 함수는 =DSum(\"필드\",\"테이블\",\"조건\") 형태로 쓴다."},
  {s:"데이터베이스",q:"다음 중 '하위 폼(Subform)'에 대한 설명으로 옳은 것은?",o:["일대다 관계에서 '다' 쪽의 관련 레코드를 기본 폼 안에 표시한다.", "기본 폼과 아무 관계가 없는 독립 폼이다.", "보고서 안에서만 사용할 수 있다.", "하위 폼에는 데이터시트 형식을 쓸 수 없다."],a:0,e:"하위 폼은 보통 일대다 관계에서 '하나'에 해당하는 기본 폼에, '다'에 해당하는 관련 레코드들을 함께 표시한다. 기본 폼과 하위 폼은 연결 필드로 묶인다."},
  {s:"데이터베이스",q:"다음 SQL 문의 의미로 옳은 것은?\n\nSELECT 부서, COUNT(*) AS 인원 FROM 사원 GROUP BY 부서 HAVING COUNT(*) >= 3;",o:["부서별 인원수를 구하되, 인원이 3명 이상인 부서만 표시한다.", "전체 사원 수가 3명 이상이면 모두 표시한다.", "부서가 3개 이상인 사원을 표시한다.", "사원을 부서별로 3명씩 삭제한다."],a:0,e:"GROUP BY 부서로 부서별 인원(COUNT)을 구하고, HAVING COUNT(*)>=3으로 '인원 3명 이상'인 부서만 남긴다. AS 인원은 COUNT(*) 결과의 별칭이다."},
  {s:"데이터베이스",q:"다음 중 SQL 명령어의 분류로 옳지 않은 것은?",o:["SELECT, INSERT, UPDATE, DELETE는 데이터 조작어(DML)이다.", "CREATE, ALTER, DROP은 데이터 정의어(DDL)이다.", "GRANT, REVOKE는 데이터 제어어(DCL)이다.", "SELECT는 데이터 정의어(DDL)이다."],a:3,e:"SELECT는 데이터를 조회하는 '데이터 조작어(DML)'이다. 데이터 정의어(DDL)는 CREATE·ALTER·DROP 등 구조를 정의하는 명령이다."},
  {s:"데이터베이스",q:"다음 중 보고서에서 레코드마다 일련번호(순번)를 매기려고 할 때의 방법으로 옳은 것은?",o:["텍스트 상자의 컨트롤 원본을 =1 로 하고 '누적 합계'를 '모두'로 설정한다.", "기본 키 필드를 그대로 표시한다.", "페이지 번호 코드 &[Page] 를 사용한다.", "그룹 머리글에 Sum 함수를 넣는다."],a:0,e:"텍스트 상자의 컨트롤 원본을 =1, '누적 합계(Running Sum)' 속성을 '모두' 또는 '그룹'으로 지정하면 레코드마다 1,2,3…의 순번이 매겨진다."},
  {s:"데이터베이스",q:"다음 중 데이터베이스 정규화에 대한 설명으로 옳지 않은 것은?",o:["정규화는 데이터 중복과 이상(Anomaly) 현상을 줄이기 위한 과정이다.", "제1정규형은 모든 속성이 원자값을 갖도록 한다.", "제2정규형은 기본 키에 대한 부분 함수 종속을 제거한다.", "정규화를 많이 할수록 테이블이 합쳐져 조인이 줄어든다."],a:3,e:"정규화를 진행할수록 테이블이 '분해'되어 수가 늘고, 조회 시 조인이 '많아진다'. 중복과 이상 현상은 줄어든다. 3NF는 이행 종속 제거, BCNF는 결정자가 후보 키가 되도록 한다."},
  {s:"데이터베이스",q:"아래 '회원' 테이블에서 다음 SQL을 실행했을 때 '수정되는 레코드 수'로 옳은 것은?\n\nUPDATE 회원 SET 등급='VIP' WHERE 지역='대전';",o:["8", "1", "2", "0"],a:1,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">이름</td><td class=\"hd\">지역</td><td class=\"hd\">등급</td><td class=\"hd\">실적</td></tr><tr><td class=\"rh\">2</td><td class=\"l\">정우진</td><td>광주</td><td>VIP</td><td>40</td></tr><tr><td class=\"rh\">3</td><td class=\"l\">최나래</td><td>부산</td><td>VIP</td><td>80</td></tr><tr><td class=\"rh\">4</td><td class=\"l\">이두리</td><td>부산</td><td>우수</td><td>40</td></tr><tr><td class=\"rh\">5</td><td class=\"l\">최나래</td><td>광주</td><td>일반</td><td>80</td></tr><tr><td class=\"rh\">6</td><td class=\"l\">오지민</td><td>서울</td><td>일반</td><td>50</td></tr><tr><td class=\"rh\">7</td><td class=\"l\">김하늘</td><td>대전</td><td>VIP</td><td>50</td></tr><tr><td class=\"rh\">8</td><td class=\"l\">오지민</td><td>대구</td><td>우수</td><td>20</td></tr><tr><td class=\"rh\">9</td><td class=\"l\">한소라</td><td>광주</td><td>우수</td><td>70</td></tr></table>",e:"WHERE 지역='대전' 조건을 만족하는 레코드만 수정된다 → <b>1건</b>."},

  {s:"데이터베이스",q:"아래 '회원' 테이블에 대해 다음 SQL을 실행했을 때 검색되는 '레코드 수'로 옳은 것은?\n\nSELECT * FROM 회원 WHERE 지역='대구' AND 실적>=40;",o:["1", "2", "-1", "0"],a:3,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">이름</td><td class=\"hd\">지역</td><td class=\"hd\">등급</td><td class=\"hd\">실적</td></tr><tr><td class=\"rh\">2</td><td class=\"l\">최나래</td><td>부산</td><td>VIP</td><td>70</td></tr><tr><td class=\"rh\">3</td><td class=\"l\">김하늘</td><td>서울</td><td>VIP</td><td>10</td></tr><tr><td class=\"rh\">4</td><td class=\"l\">이두리</td><td>부산</td><td>일반</td><td>10</td></tr><tr><td class=\"rh\">5</td><td class=\"l\">이두리</td><td>서울</td><td>일반</td><td>30</td></tr><tr><td class=\"rh\">6</td><td class=\"l\">YOUNGPAJOK</td><td>대구</td><td>우수</td><td>20</td></tr><tr><td class=\"rh\">7</td><td class=\"l\">김하늘</td><td>대구</td><td>우수</td><td>30</td></tr><tr><td class=\"rh\">8</td><td class=\"l\">강다온</td><td>대전</td><td>일반</td><td>20</td></tr></table>",e:"WHERE 조건(지역이 '대구'이면서 실적이 40 이상)을 만족하는 레코드를 센다. AND는 두 조건을 모두, OR는 둘 중 하나만 만족해도 선택된다 → <b>0건</b>."},
  {s:"데이터베이스",q:"아래 '회원' 테이블에서 다음 SQL을 실행했을 때 '삭제되는 레코드 수'로 옳은 것은?\n\nDELETE FROM 회원 WHERE 실적<40;",o:["2", "3", "5", "4"],a:1,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">이름</td><td class=\"hd\">지역</td><td class=\"hd\">등급</td><td class=\"hd\">실적</td></tr><tr><td class=\"rh\">2</td><td class=\"l\">한소라</td><td>대전</td><td>우수</td><td>20</td></tr><tr><td class=\"rh\">3</td><td class=\"l\">박세찬</td><td>대구</td><td>VIP</td><td>20</td></tr><tr><td class=\"rh\">4</td><td class=\"l\">이두리</td><td>부산</td><td>VIP</td><td>40</td></tr><tr><td class=\"rh\">5</td><td class=\"l\">윤서준</td><td>대전</td><td>우수</td><td>70</td></tr><tr><td class=\"rh\">6</td><td class=\"l\">박세찬</td><td>인천</td><td>우수</td><td>80</td></tr><tr><td class=\"rh\">7</td><td class=\"l\">오지민</td><td>인천</td><td>VIP</td><td>50</td></tr><tr><td class=\"rh\">8</td><td class=\"l\">YOUNGPAJOK</td><td>대구</td><td>일반</td><td>30</td></tr><tr><td class=\"rh\">9</td><td class=\"l\">최나래</td><td>인천</td><td>우수</td><td>60</td></tr></table>",e:"실적<40 조건에 맞는 레코드가 삭제된다 → <b>3건</b>. (DELETE는 행만 삭제하고 테이블 구조는 남는다.)"},
  {s:"데이터베이스",q:"아래 '회원' 테이블에서 다음 도메인 함수의 결과로 옳은 것은?\n\n=DMax(\"실적\",\"회원\",\"지역='대구'\")",o:["130", "90", "80", "50"],a:2,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">이름</td><td class=\"hd\">지역</td><td class=\"hd\">등급</td><td class=\"hd\">실적</td></tr><tr><td class=\"rh\">2</td><td class=\"l\">YOUNGPAJOK</td><td>대구</td><td>우수</td><td>80</td></tr><tr><td class=\"rh\">3</td><td class=\"l\">김하늘</td><td>부산</td><td>우수</td><td>40</td></tr><tr><td class=\"rh\">4</td><td class=\"l\">한소라</td><td>대전</td><td>VIP</td><td>60</td></tr><tr><td class=\"rh\">5</td><td class=\"l\">정우진</td><td>서울</td><td>일반</td><td>70</td></tr><tr><td class=\"rh\">6</td><td class=\"l\">정우진</td><td>인천</td><td>VIP</td><td>70</td></tr><tr><td class=\"rh\">7</td><td class=\"l\">YOUNGPAJOK</td><td>대구</td><td>일반</td><td>50</td></tr></table>",e:"DMax은 조건(지역='대구')에 맞는 실적의 최댓값을 구한다 → <b>80</b>."}
 ]},
{ name:'기출 4회', q:[
  {s:"컴퓨터일반",q:"다음 중 중앙처리장치의 성능 향상 기법에 대한 설명으로 옳지 않은 것은?",o:["다중 코어(Multi-Core)는 하나의 CPU 안에 여러 개의 처리 코어를 둔다.", "하이퍼스레딩은 하나의 물리 코어를 논리적으로 둘 이상처럼 활용한다.", "클록 주파수를 높이면 단위 시간당 처리할 수 있는 명령 수가 늘어난다.", "캐시 적중률이 낮을수록 평균 기억장치 접근 시간이 짧아져 성능이 좋아진다."],a:3,e:"캐시 적중률이 '높을수록' 느린 주기억장치 접근이 줄어 평균 접근 시간이 짧아지고 성능이 좋아진다. 낮을수록 성능이 나빠진다."},
  {s:"컴퓨터일반",q:"다음 중 IP 주소와 서브넷에 대한 설명으로 옳지 않은 것은?",o:["서브넷 마스크는 IP 주소에서 네트워크부와 호스트부를 구분한다.", "CIDR 표기 /24는 앞 24비트가 네트워크부임을 뜻한다.", "서브네팅은 하나의 큰 네트워크를 여러 작은 네트워크로 나누어 주소를 효율적으로 사용한다.", "/24 네트워크 하나에는 호스트를 256개 모두 장치에 할당할 수 있다."],a:3,e:"/24(호스트 8비트)는 2⁸=256개 주소 중 네트워크 주소·브로드캐스트 주소 2개를 빼서 실제 호스트는 254개를 할당할 수 있다."},
  {s:"컴퓨터일반",q:"다음 중 저장장치 인터페이스에 대한 설명으로 옳지 않은 것은?",o:["SATA는 직렬 방식의 저장장치 연결 인터페이스이다.", "NVMe는 PCIe를 통해 SSD의 고속 전송을 지원한다.", "RAID 0은 스트라이핑으로 속도를 높이지만 안정성(중복성)은 제공하지 않는다.", "RAID 1은 패리티를 분산 저장해 용량 손실 없이 복구한다."],a:3,e:"RAID 1은 '미러링'으로 같은 데이터를 두 디스크에 복제한다(용량 절반 사용). 패리티를 분산 저장하는 것은 RAID 5이다."},
  {s:"컴퓨터일반",q:"다음 중 프로세스 상태 전이에 대한 설명으로 옳지 않은 것은?",o:["준비(Ready) 상태는 CPU 할당을 기다리는 상태이다.", "실행(Running) 상태는 CPU를 할당받아 명령을 수행하는 상태이다.", "대기(Blocked) 상태는 입출력 등 사건을 기다리는 상태이다.", "디스패치(Dispatch)는 실행 상태의 프로세스를 대기 상태로 보내는 것이다."],a:3,e:"디스패치는 '준비 상태'의 프로세스에 CPU를 할당해 '실행 상태'로 보내는 것이다. 실행→대기는 입출력 요청 등으로 일어난다."},
  {s:"컴퓨터일반",q:"다음 중 Windows 11의 바로 가기 키 연결로 옳지 않은 것은?",o:["Win+A : 빠른 설정(와이파이·볼륨·밝기 등) 열기", "Win+N : 알림 센터·달력 열기", "Win+W : 위젯 패널 열기", "Win+V : 화면 전체 캡처하여 클립보드에 저장"],a:3,e:"Win+V는 <b>클립보드 기록(여러 번 복사한 항목 목록)</b>을 연다. 화면 영역 캡처는 Win+Shift+S다."},
  {s:"컴퓨터일반",q:"다음 중 빅데이터의 특징(3V)에 대한 설명으로 옳지 않은 것은?",o:["규모(Volume)는 데이터의 양이 매우 방대함을 뜻한다.", "다양성(Variety)은 정형·반정형·비정형 등 데이터 형태가 다양함을 뜻한다.", "속도(Velocity)는 데이터가 빠르게 생성·수집·처리됨을 뜻한다.", "3V는 데이터의 양이 적을수록, 종류가 단순할수록 가치가 커진다는 의미다."],a:3,e:"빅데이터의 3V는 <b>방대한 양·다양한 형태·빠른 속도</b>를 가리킨다. '양이 적고 단순할수록 가치가 크다'는 정반대 설명이다."},
  {s:"컴퓨터일반",q:"다음 중 DMA(Direct Memory Access)에 대한 설명으로 옳은 것은?",o:["CPU를 거치지 않고 입출력 장치와 주기억장치가 직접 데이터를 주고받아 CPU 부담을 줄인다.", "CPU가 입출력의 모든 바이트 전송을 직접 제어하는 방식이다.", "인터럽트를 전혀 사용하지 않고 폴링만으로 동작한다.", "주기억장치 없이 레지스터 간에만 데이터를 전송한다."],a:0,e:"DMA는 DMA 제어기가 버스를 넘겨받아 입출력 장치와 주기억장치 간 데이터를 CPU 개입 없이 직접 전송하고, 블록 전송이 끝나면 인터럽트로 CPU에 알린다. 대량 전송 시 CPU 효율이 높아진다."},
  {s:"컴퓨터일반",q:"다음 중 입출력 제어 방식에 대한 설명으로 옳지 않은 것은?",o:["프로그램 제어 입출력은 CPU가 입출력 완료 여부를 계속 검사(폴링)하여 CPU 낭비가 크다.", "인터럽트 구동 입출력은 입출력 완료 시 인터럽트로 알려 CPU 효율을 높인다.", "DMA는 블록 단위 전송에 적합하며 CPU 개입을 최소화한다.", "채널(Channel)은 CPU 성능이 낮은 소형 시스템에서만 쓰이는 저속 입출력 방식이다."],a:3,e:"채널은 '대형 컴퓨터'에서 입출력 전용 처리기로 다수의 고속 입출력을 CPU와 독립적으로 처리하는 방식이다. 소형 저속 전용이라는 설명은 틀리다."},
  {s:"컴퓨터일반",q:"다음 중 Windows 11의 시스템 관리·모니터링 도구에 대한 설명으로 옳지 않은 것은?",o:["이벤트 뷰어는 시스템·응용·보안 로그를 확인할 수 있다.", "사용자 계정 컨트롤(UAC)은 권한이 필요한 작업 시 동의를 요구해 무단 변경을 막는다.", "리소스 모니터·성능 모니터로 CPU·메모리·디스크·네트워크 사용을 분석할 수 있다.", "안전 모드는 모든 드라이버와 시작 프로그램을 전부 적재해 최고 성능으로 부팅한다."],a:3,e:"안전 모드는 '최소한의' 드라이버·서비스만 적재해 문제 진단·복구를 돕는 모드이다. 최고 성능 부팅이 아니다."},
  {s:"컴퓨터일반",q:"다음 중 기억장치의 계층 구조와 접근 방식에 대한 설명으로 옳지 않은 것은?",o:["레지스터-캐시-주기억장치-보조기억장치 순으로 CPU에서 멀어질수록 용량은 커지지만 접근 속도는 느려지고 비트당 가격은 낮아진다.", "캐시 메모리의 적중률(Hit Ratio)이 높을수록 평균 기억장치 접근 시간이 짧아지며, 지역성(Locality)이 클수록 적중률이 높아진다.", "가상 메모리는 보조기억장치의 일부를 주기억장치처럼 사용하는 기법으로, 페이지 교체가 지나치게 잦아지는 스래싱(Thrashing)이 발생할 수 있다.", "연관 기억장치(Associative Memory)는 저장된 내용이 아니라 주소를 이용해 데이터를 찾으므로 일반 RAM보다 검색 속도가 느리다."],a:3,e:"연관 기억장치는 <b>주소가 아니라 내용(데이터)으로 병렬 검색</b>하므로 일반 RAM보다 <b>빠르다</b>."},
  {s:"컴퓨터일반",q:"다음 중 색 표현 방식에 대한 설명으로 옳지 않은 것은?",o:["RGB는 빛의 삼원색을 더하는 가산 혼합으로 모니터에 쓰인다.", "CMYK는 잉크의 감산 혼합으로 인쇄에 쓰인다.", "HSB(HSV)는 색상·채도·명도로 색을 표현한다.", "RGB는 색을 더할수록 어두워져 모두 더하면 검정이 된다."],a:3,e:"RGB(가산 혼합)는 색을 더할수록 밝아져 모두 더하면 '흰색'이 된다. 더할수록 어두워져 검정이 되는 것은 CMYK(감산 혼합)이다."},
  {s:"컴퓨터일반",q:"다음 중 Windows의 인쇄 및 스풀(Spool)에 대한 설명으로 옳지 않은 것은?",o:["스풀은 인쇄할 데이터를 디스크에 임시 저장했다가 프린터로 보내는 기능이다.", "스풀을 사용하면 CPU와 프린터가 병행 처리되어 전체 작업 효율이 높아진다.", "인쇄 대기열에서 문서의 인쇄 순서를 바꾸거나 취소할 수 있다.", "스풀을 설정하면 인쇄 속도 자체가 빨라져 한 장을 인쇄하는 시간이 단축된다."],a:3,e:"스풀은 <b>인쇄 속도 자체를 높이지는 않는다</b>. CPU가 인쇄를 기다리지 않고 다른 일을 하게 해 '전체 효율'만 향상시킨다."},
  {s:"컴퓨터일반",q:"다음 중 가상 메모리의 페이지 교체 알고리즘에 대한 설명으로 옳지 않은 것은?",o:["FIFO는 가장 먼저 적재된 페이지를 교체하며, 프레임을 늘렸는데 오히려 부재가 증가하는 벨레이디 모순이 생길 수 있다.", "LRU는 가장 오랫동안 참조되지 않은 페이지를 교체한다.", "LFU는 참조 '횟수'가 가장 적은 페이지를 교체한다.", "OPT(최적) 알고리즘은 과거의 참조 기록만으로 간단히 구현할 수 있어 실제 시스템에서 널리 쓰인다."],a:3,e:"OPT는 '앞으로 가장 오랫동안 쓰이지 않을' 페이지를 교체하는 이론적 최적 기법으로, 미래를 알아야 해서 실제 구현이 불가능하다(성능 비교 기준으로만 사용)."},
  {s:"컴퓨터일반",q:"다음 중 정보 보안의 암호화 방식과 전자 서명에 대한 설명으로 옳지 않은 것은?",o:["대칭키(비밀키) 암호화는 암호화·복호화에 같은 키를 사용해 속도가 빠르지만, 사용자 수가 늘수록 관리할 키의 수가 급격히 증가한다.", "공개키(비대칭) 암호화는 공개키로 암호화하고 개인키로 복호화하며, 대표 알고리즘으로 RSA가 있다.", "전자 서명은 송신자의 '개인키'로 서명하고 수신자가 송신자의 '공개키'로 확인하여, 위조 방지와 부인 방지를 제공한다.", "공개키 암호화는 대칭키 암호화보다 처리 속도가 빠르기 때문에, 대용량 데이터를 통째로 암호화할 때 주로 단독으로 사용된다."],a:3,e:"공개키는 대칭키보다 <b>속도가 느려</b> 대용량은 대칭키로 암호화하고 그 키만 공개키로 전달하는 혼합 방식을 쓴다."},
  {s:"컴퓨터일반",q:"다음 중 파일 시스템에 대한 설명으로 옳지 않은 것은?",o:["NTFS는 FAT32보다 보안(권한)·대용량·저널링을 지원한다.", "FAT32는 단일 파일 최대 크기가 4GB로 제한된다.", "exFAT는 USB 등 이동식 저장장치에서 4GB 초과 파일을 지원한다.", "FAT32는 파일별 접근 권한(ACL)과 암호화를 기본 지원한다."],a:3,e:"파일별 접근 권한(ACL)·암호화(EFS)·압축 등은 NTFS의 기능이다. FAT32는 이를 지원하지 않는다."},
  {s:"컴퓨터일반",q:"다음 중 운영체제·시스템 소프트웨어에 대한 설명으로 옳지 않은 것은?",o:["장치 드라이버는 특정 하드웨어를 운영체제가 제어하도록 돕는다.", "펌웨어는 ROM 등에 탑재되어 하드웨어를 제어하는 소프트웨어이다.", "가비지 컬렉션은 더 이상 쓰지 않는 메모리를 자동으로 회수한다.", "컴파일러는 응용 소프트웨어로 분류되며 시스템 소프트웨어가 아니다."],a:3,e:"컴파일러·어셈블러·인터프리터 등 언어 번역기는 '시스템 소프트웨어'로 분류된다."},
  {s:"컴퓨터일반",q:"다음 중 다양한 보안 위협과 공격 기법에 대한 설명으로 옳지 않은 것은?",o:["스니핑(Sniffing)은 네트워크를 지나는 패킷을 몰래 엿보아 정보를 가로채는 소극적 공격이다.", "스푸핑(Spoofing)은 자신의 주소나 신원을 위장해 접근 권한을 얻거나 데이터를 가로채는 공격이다.", "분산 서비스 거부(DDoS)는 다수의 좀비 PC로 대량의 트래픽을 보내 시스템을 마비시키는 공격이다.", "랜섬웨어는 시스템의 보안 취약점을 조용히 수집해 외부로 전송만 할 뿐, 파일을 훼손하거나 금전을 요구하지는 않는다."],a:3,e:"랜섬웨어는 <b>파일을 암호화한 뒤 복구 대가로 금전을 요구</b>하는 악성 코드다. 정보 수집·전송만 하는 것은 스파이웨어다."},
  {s:"컴퓨터일반",q:"다음 두 8비트 값에 비트 단위 XOR 연산을 수행한 결과로 옳은 것은?\n\n01010101 XOR 11000111",o:["11010111", "10010010", "01000101", "10101010"],a:1,e:"비트 XOR은 각 자리에서 서로 다르면 1 → <b>10010010</b>."},
  {s:"컴퓨터일반",q:"다음은 7비트 ASCII 코드에 홀수 패리티 비트를 '오른쪽 끝 1비트'로 붙인 8비트 코드이다. 전송 중 오류가 발생한(패리티가 어긋난) 것은?",o:["11111001", "10111111", "00110010", "01101000"],a:0,e:"홀수 패리티는 8비트 전체에서 1의 개수가 홀수가 되도록 패리티 비트를 정한다. 정답 코드 <b>11111001</b>는 1의 개수가 6개로 홀수가 아니어서 오류이다. (패리티 비트는 1비트 오류의 '발생 여부'만 검출하고 위치는 못 찾는다.)"},
  {s:"컴퓨터일반",q:"다음 중 가로 800픽셀 × 세로 480픽셀, 한 픽셀을 24비트로 표현하는 비압축 비트맵 이미지의 용량으로 옳은 것은? (1KB=1,024Byte)",o:["1,125KB", "375KB", "2,250KB", "27,000KB"],a:0,e:"비트맵 용량 = 가로×세로×색 깊이(비트)÷8 = 800×480×24÷8 = <b>1,152,000 Byte</b> ≒ 1,125KB."},
  {s:"스프레드시트",q:"다음 VBA 프로시저를 실행한 후 메시지 박스에 출력되는 값으로 옳은 것은?",o:["22", "20", "23", "21"],a:3,fig:"<pre class=\"code\">Sub Test()\n  Dim i As Integer, S As Integer\n  i = 1 : S = 0\n  Do While S &lt; 17\n    S = S + i\n    i = i + 1\n  Loop\n  MsgBox S\nEnd Sub</pre>",e:"S가 17 이상이 될 때까지 1,2,3…을 더한다 → 마지막엔 i=6까지 더해 S = <b>21</b>"},
  {s:"스프레드시트",q:"[C5] 셀의 주소를 절대 참조 문자열 \"$C$5\"로 반환하는 수식으로 옳은 것은?",o:["=ADDRESS(ROW(C5),COLUMN(C5))", "=ADDRESS(COLUMN(C5),ROW(C5))", "=ADDRESS(5,3,4)", "=ADDRESS(3,5)"],a:0,e:"ADDRESS(<b>행번호, 열번호</b>)이며 기본이 절대 참조다. ROW(C5)=5, COLUMN(C5)=3 → \"$C$5\". 4를 넣으면 상대 참조가 된다."},
  {s:"스프레드시트",q:"다음 중 '시트 보호'와 셀의 '잠금' 속성에 대한 설명으로 옳은 것은?",o:["모든 셀은 기본적으로 '잠금'되어 있으나, 시트를 보호해야 잠금이 실제로 적용된다.", "셀의 '잠금'을 해제하면 시트를 보호해도 그 셀은 편집할 수 있다.", "시트를 보호하지 않아도 잠금된 셀은 편집할 수 없다.", "①과 ②가 모두 옳다."],a:3,e:"엑셀의 모든 셀은 기본적으로 '잠금' 상태이지만, '시트 보호'를 실행해야 잠금이 실제로 효력을 가진다. 미리 특정 셀의 잠금을 '해제'해 두면, 시트를 보호해도 그 셀만 입력할 수 있다. 따라서 ①·② 모두 옳다."},
  {s:"스프레드시트",q:"아래 표에서 '이름'(B열)이 \"김\"으로 시작하는 '행 전체'에 노랑 채우기를 적용하려 한다. 조건부 서식의 수식으로 옳은 것은?",o:["=LEFT($B2,1)=\"김\"", "=LEFT(B2,1)=\"김\"", "=LEFT(B$2,1)=\"김\"", "=LEFT($B$2,1)=\"김\""],a:0,e:"행 전체에 같은 조건을 적용하려면 <b>열만 고정(혼합 참조 $B2)</b>해야 한다. 상대(B2)는 셀마다 기준이 흔들리고, 행 고정(B$2)·완전 고정($B$2)은 특정 셀만 검사해 틀린다."},
  {s:"스프레드시트",q:"다음 중 3차원 차트로 작성할 수 없는 것으로만 바르게 묶은 것은?",o:["세로 막대형, 꺾은선형, 원형", "분산형, 주식형, 방사형", "영역형, 세로 막대형, 가로 막대형", "꺾은선형, 영역형, 원형"],a:1,e:"3차원으로 작성할 수 없는 대표 차트는 <b>분산형·주식형·방사형</b>(및 도넛형)이다."},
  {s:"스프레드시트",q:"다음 중 통합 문서·워크시트 관리와 셀 참조에 대한 설명으로 옳지 않은 것은?",o:["여러 시트를 그룹으로 묶으면 한 시트에 입력·서식 지정한 내용이 그룹의 모든 시트에 동시에 적용된다.", "3차원 참조(예: =SUM(Sheet1:Sheet3!B2))로 여러 시트의 같은 위치 값을 한 번에 계산할 수 있다.", "F4 키를 누르면 상대 참조 → 절대 참조 → 행 고정 혼합 → 열 고정 혼합 순으로 참조 형태가 순환한다.", "다른 통합 문서의 셀을 참조할 수 없으므로, 외부 데이터는 반드시 복사해 붙여 넣어야 한다."],a:3,e:"다른 통합 문서의 셀도 <b>외부 참조(링크)로 참조할 수 있다</b>."},
  {s:"스프레드시트",q:"다음 중 [페이지 설정]-[페이지] 탭의 '확대/축소'에 대한 설명으로 옳지 않은 것은?",o:["배율은 표준 크기의 10%~400% 범위에서 지정할 수 있다.", "'자동 맞춤'에서 용지 너비와 높이를 각각 1로 지정하면 전체가 한 페이지에 인쇄되도록 축소된다.", "배율을 수동으로 지정하면 '자동 맞춤'과 동시에 적용된다.", "배율은 워크시트 전체에 적용된다."],a:2,e:"'확대/축소 배율(수동)'과 '자동 맞춤'은 둘 중 하나만 선택되는 상호 배타적 옵션이다. 배율은 10%~400%, 자동 맞춤은 지정한 페이지 수에 맞춰 축소 인쇄한다."},
  {s:"스프레드시트",q:"〈단가표〉 1행에 \"1월\"~\"12월\"이 있고, [A15] 제품의 [B15]월 단가를 찾으려 한다. (표 A1:M10) 옳은 수식은?",o:["=VLOOKUP(A15,A1:M10,MATCH(B15,A1:M1,0),0)", "=VLOOKUP(A15,A1:M10,MATCH(B15,B1:M1,0),0)", "=HLOOKUP(B15,A1:M10,MATCH(A15,A2:A10,0),0)", "=INDEX(A1:M10,MATCH(B15,A1:M1,0))"],a:0,e:"VLOOKUP의 열 번호를 <b>MATCH(B15,A1:M1,0)</b>으로 동적 계산한다. 열 범위를 B1:M1로 하면 1씩 밀려 틀린다."},
  {s:"스프레드시트",q:"아래 [A1:D6] 표에서 부서가 '인사부'이면서 직급이 '과장'인 직원의 급여 합계를 배열 수식으로 구하려고 한다. 가장 적절한 수식은?",o:["{=SUM((B2:B6=\"인사부\")*D2:D6)}", "{=SUM((B2:B6=\"인사부\")*(C2:C6=\"과장\")*D2:D6)}", "{=SUM((B2:B6=\"인사부\")+(C2:C6=\"과장\")*D2:D6)}", "=SUMIF(B2:B6,\"인사부\",D2:D6)"],a:1,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">이름</td><td class=\"hd\">부서</td><td class=\"hd\">직급</td><td class=\"hd\">급여</td></tr><tr><td class=\"rh\">2</td><td>권노아</td><td class=\"l\">전산부</td><td>과장</td><td class=\"l\">2,000,000</td></tr><tr><td class=\"rh\">3</td><td>서다은</td><td class=\"l\">전산부</td><td>과장</td><td class=\"l\">4,700,000</td></tr><tr><td class=\"rh\">4</td><td>구본길</td><td class=\"l\">전산부</td><td>차장</td><td class=\"l\">5,300,000</td></tr><tr><td class=\"rh\">5</td><td>강태양</td><td class=\"l\">생산부</td><td>과장</td><td class=\"l\">5,100,000</td></tr><tr><td class=\"rh\">6</td><td>권노아</td><td class=\"l\">전산부</td><td>과장</td><td class=\"l\">4,400,000</td></tr></table>",e:"두 조건을 모두 만족시키려면 각 조건식을 <b>곱(*)</b>으로 연결한다. <b>{=SUM((B2:B6=\"인사부\")*(C2:C6=\"과장\")*D2:D6)}</b> → 조건이 모두 참(1)인 행의 급여만 더해 <b>0</b>원. (+로 연결하면 OR가 되어 틀리고, Ctrl+Shift+Enter로 입력해 중괄호가 생긴다.)"},
  {s:"스프레드시트",q:"아래 [A1:C7] 표에서 부서가 '생산부'인 직원 중 실적의 최소값을 배열 수식으로 구하려고 한다. 가장 적절한 수식은?",o:["{=MIN(IF(B2:B7=\"생산부\",C2:C7,0))}", "=MINIF(B2:B7,\"생산부\",C2:C7)", "{=MIN(IF(B2:B7=\"생산부\",C2:C7))}", "{=MIN((B2:B7=\"생산부\")*C2:C7)}"],a:2,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">이름</td><td class=\"hd\">부서</td><td class=\"hd\">실적</td></tr><tr><td class=\"rh\">2</td><td>오시후</td><td class=\"l\">생산부</td><td>64</td></tr><tr><td class=\"rh\">3</td><td>최서연</td><td class=\"l\">인사부</td><td>56</td></tr><tr><td class=\"rh\">4</td><td>배주한</td><td class=\"l\">생산부</td><td>90</td></tr><tr><td class=\"rh\">5</td><td>박도윤</td><td class=\"l\">생산부</td><td>50</td></tr><tr><td class=\"rh\">6</td><td>임채원</td><td class=\"l\">생산부</td><td>41</td></tr><tr><td class=\"rh\">7</td><td>조민재</td><td class=\"l\">인사부</td><td>67</td></tr></table>",e:"<b>{=MIN(IF(B2:B7=\"생산부\",C2:C7))}</b> → 조건이 참인 행의 실적만 모아 최소값을 구한다. 결과는 <b>41</b>. IF의 거짓값을 0으로 두면 MIN에서 0이 섞여 틀리고, (B2:B7=\"생산부\")*C2:C7 방식도 MIN에서 0 때문에 틀린다. (Ctrl+Shift+Enter 배열 입력)"},
  {s:"스프레드시트",q:"왼쪽 기준표([F2:G6], 오름차순)를 이용해 점수 18점의 등급을 구하려고 한다. 가장 적절한 수식은? (구간의 최저점 이상이면 해당 등급)",o:["=VLOOKUP(18,$F$2:$G$6,2,FALSE)", "=VLOOKUP(18,$F$2:$G$6,2,0)", "=HLOOKUP(18,$F$2:$G$6,2,TRUE)", "=VLOOKUP(18,$F$2:$G$6,2,TRUE)"],a:3,fig:"<table class=\"xg\"><tr><th></th><th>F</th><th>G</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">기준점수</td><td class=\"hd\">등급</td></tr><tr><td class=\"rh\">2</td><td>0</td><td class=\"l\">F</td></tr><tr><td class=\"rh\">3</td><td>60</td><td class=\"l\">D</td></tr><tr><td class=\"rh\">4</td><td>70</td><td class=\"l\">C</td></tr><tr><td class=\"rh\">5</td><td>80</td><td class=\"l\">B</td></tr><tr><td class=\"rh\">6</td><td>90</td><td class=\"l\">A</td></tr></table>",e:"구간(범위) 조회는 네 번째 인수를 <b>TRUE(생략 가능, 근사일치)</b>로 두고 기준표가 <b>오름차순</b>이어야 한다. 18점 → <b>F</b>등급. FALSE(정확히 일치)는 기준표에 없는 값이면 #N/A가 난다."},
  {s:"스프레드시트",q:"왼쪽 기준표([F2:G6], 오름차순)를 이용해 점수 19점의 등급을 구하려고 한다. 가장 적절한 수식은? (구간의 최저점 이상이면 해당 등급)",o:["=VLOOKUP(19,$F$2:$G$6,2,TRUE)", "=HLOOKUP(19,$F$2:$G$6,2,TRUE)", "=VLOOKUP(19,$F$2:$G$6,2,0)", "=VLOOKUP(19,$F$2:$G$6,2,FALSE)"],a:0,fig:"<table class=\"xg\"><tr><th></th><th>F</th><th>G</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">기준점수</td><td class=\"hd\">등급</td></tr><tr><td class=\"rh\">2</td><td>0</td><td class=\"l\">F</td></tr><tr><td class=\"rh\">3</td><td>60</td><td class=\"l\">D</td></tr><tr><td class=\"rh\">4</td><td>70</td><td class=\"l\">C</td></tr><tr><td class=\"rh\">5</td><td>80</td><td class=\"l\">B</td></tr><tr><td class=\"rh\">6</td><td>90</td><td class=\"l\">A</td></tr></table>",e:"구간(범위) 조회는 네 번째 인수를 <b>TRUE(생략 가능, 근사일치)</b>로 두고 기준표가 <b>오름차순</b>이어야 한다. 19점 → <b>F</b>등급. FALSE(정확히 일치)는 기준표에 없는 값이면 #N/A가 난다."},
  {s:"스프레드시트",q:"셀 값이 5,000 이상이면 '빨강', 5,000 미만 500 이상이면 '파랑', 500 미만이면 색을 지정하지 않고, 모든 구간에서 천 단위 구분 기호(,)와 소수 이하 첫째 자리까지 표시하려고 한다. 사용자 지정 표시 형식으로 옳은 것은? (예: 1234.56 → 1,234.6, 432 → 432.0)",o:["[빨강][>=5000]#,###.#;[파랑][>=500]#,###.#;#,###.#", "[>=5000]<빨강>#,##0.0;[>=500]<파랑>#,##0.0;#,##0.0", "[빨강][>=5000]#,##0.0;[파랑][>=500]#,##0.0;#,##0.0", "[빨강][>=5000]#,##0.0;[파랑][>=500]#,##0.0"],a:2,e:"사용자 지정 형식은 <b>[조건·색]양수서식;[조건·색]서식;나머지서식</b> 구조로, 색과 조건은 대괄호 [빨강][>=5000] 안에 넣는다. 소수 첫째 자리는 0을 써서 <b>#,##0.0</b>으로 해야 432가 432.0으로 나온다(#,###.#은 432를 432.로 만들어 틀림). 꺾쇠<>로 색을 넣는 문법은 없다. 정답: <b>[빨강][>=5000]#,##0.0;[파랑][>=500]#,##0.0;#,##0.0</b>"},
  {s:"스프레드시트",q:"아래 시트에서 입력값에 주어진 표시 형식을 적용했을 때, [C2]의 결과로 옳은 것은?",o:["005", "2025년 3월", "홍길동님", "1"],a:1,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">입력값</td><td class=\"hd\">표시 형식</td><td class=\"hd\">결과</td></tr><tr><td class=\"rh\">2</td><td>2025-03-05</td><td class=\"l\">yyyy\"년\" m\"월\"</td><td>?</td></tr></table>",e:"연·월 서식 적용"},
  {s:"스프레드시트",q:"아래 [A1:C7] 표에서 부서가 '총무부'이면서 점수가 80점 이상인 직원 수를 배열 수식으로 구하려고 한다. 가장 적절한 수식은?",o:["{=SUM((B2:B7=\"총무부\")+(C2:C7>=80))}", "{=COUNT((B2:B7=\"총무부\")*(C2:C7>=80))}", "{=SUM((B2:B7=\"총무부\")*(C2:C7>=80))}", "{=SUMPRODUCT((B2:B7=\"총무부\")*(C2:C7>80))}"],a:2,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">이름</td><td class=\"hd\">부서</td><td class=\"hd\">점수</td></tr><tr><td class=\"rh\">2</td><td>서다은</td><td class=\"l\">기획부</td><td>75</td></tr><tr><td class=\"rh\">3</td><td>오시후</td><td class=\"l\">총무부</td><td>87</td></tr><tr><td class=\"rh\">4</td><td>서다은</td><td class=\"l\">기획부</td><td>61</td></tr><tr><td class=\"rh\">5</td><td>오시후</td><td class=\"l\">총무부</td><td>80</td></tr><tr><td class=\"rh\">6</td><td>정하람</td><td class=\"l\">기획부</td><td>75</td></tr><tr><td class=\"rh\">7</td><td>문가온</td><td class=\"l\">기획부</td><td>57</td></tr></table>",e:"개수는 두 조건의 곱을 <b>SUM</b>으로 합산한다. <b>{=SUM((B2:B7=\"총무부\")*(C2:C7>=80))}</b> → 두 조건이 모두 참인 행마다 1을 더해 <b>2</b>명. (+는 OR가 되고, >80는 경계값을 빠뜨려 틀린다.)"},
  {s:"스프레드시트",q:"아래 [A1:C7] 표에서 부서가 '기획부'인 직원 중 실적의 최대값을 배열 수식으로 구하려고 한다. 가장 적절한 수식은?",o:["=MAX(C2:C7)", "{=MAX((B2:B7=\"기획부\")*C2:C7)}", "{=MAX(IF(B2:B7=\"기획부\",C2:C7))}", "=MAXIF(B2:B7,\"기획부\",C2:C7)"],a:2,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">이름</td><td class=\"hd\">부서</td><td class=\"hd\">실적</td></tr><tr><td class=\"rh\">2</td><td>임채원</td><td class=\"l\">기획부</td><td>85</td></tr><tr><td class=\"rh\">3</td><td>조민재</td><td class=\"l\">전산부</td><td>98</td></tr><tr><td class=\"rh\">4</td><td>김하늘</td><td class=\"l\">생산부</td><td>35</td></tr><tr><td class=\"rh\">5</td><td>권노아</td><td class=\"l\">생산부</td><td>64</td></tr><tr><td class=\"rh\">6</td><td>조민재</td><td class=\"l\">생산부</td><td>44</td></tr><tr><td class=\"rh\">7</td><td>김하늘</td><td class=\"l\">전산부</td><td>44</td></tr></table>",e:"<b>{=MAX(IF(B2:B7=\"기획부\",C2:C7))}</b> → 조건이 참인 행의 실적만 모아 최대값을 구한다. 결과는 <b>85</b>. IF의 거짓값을 0으로 두면 MIN에서 0이 섞여 틀리고, (B2:B7=\"기획부\")*C2:C7 방식도 MIN에서 0 때문에 틀린다. (Ctrl+Shift+Enter 배열 입력)"},
  {s:"스프레드시트",q:"셀 [A1:A5]에 다음 값이 입력되어 있다: 13, 35, 43, 80, 97\n다음 수식(제3사분위수)의 결과로 옳은 것은?\n\n=QUARTILE.INC(A1:A5, 3)",o:["97", "81", "79", "80"],a:3,e:"QUARTILE.INC(범위, 3)는 제3사분위수(하위 75% 지점)를 구하며 PERCENTILE.INC(범위,0.75)와 같다. 정렬된 값에서 결과는 <b>80</b>이다."},
  {s:"스프레드시트",q:"셀 [A1:A5]에 다음 값이 입력되어 있다: 11, 17, 19, 24, 83\n다음 수식(제3사분위수)의 결과로 옳은 것은?\n\n=QUARTILE.INC(A1:A5, 3)",o:["24", "83", "25", "23"],a:0,e:"QUARTILE.INC(범위, 3)는 제3사분위수(하위 75% 지점)를 구하며 PERCENTILE.INC(범위,0.75)와 같다. 정렬된 값에서 결과는 <b>24</b>이다."},
  {s:"스프레드시트",q:"다음 중 문자 위치를 찾는 함수식의 결과로 옳은 것은? (FIND는 대/소문자 구분·와일드카드 불가, SEARCH는 구분 안 함·와일드카드 가능)\n\n=SEARCH(\"P?J\",\"YOUNGPAJOK\")",o:["0", "1", "#VALUE!", "6"],a:3,e:"SEARCH는 <b>와일드카드(?,*)</b>를 지원하므로 '?'가 한 글자를 대신해 패턴과 일치하는 시작 위치 <b>6</b>를 찾는다. FIND는 와일드카드를 지원하지 않아 같은 식에서 #VALUE!가 난다."},
  {s:"스프레드시트",q:"셀 값이 5,000 이상이면 '빨강', 5,000 미만 800 이상이면 '녹색', 800 미만이면 색을 지정하지 않고, 모든 구간에서 천 단위 구분 기호(,)와 소수 이하 첫째 자리까지 표시하려고 한다. 사용자 지정 표시 형식으로 옳은 것은? (예: 1234.56 → 1,234.6, 432 → 432.0)",o:["[빨강][>=5000]#,##0.0;[녹색][>=800]#,##0.0", "[>=5000]<빨강>#,##0.0;[>=800]<녹색>#,##0.0;#,##0.0", "[빨강][>=5000]#,##0.0;[녹색][>=800]#,##0.0;#,##0.0", "[빨강][>=5000]#,###.#;[녹색][>=800]#,###.#;#,###.#"],a:2,e:"사용자 지정 형식은 <b>[조건·색]양수서식;[조건·색]서식;나머지서식</b> 구조로, 색과 조건은 대괄호 [빨강][>=5000] 안에 넣는다. 소수 첫째 자리는 0을 써서 <b>#,##0.0</b>으로 해야 432가 432.0으로 나온다(#,###.#은 432를 432.로 만들어 틀림). 꺾쇠<>로 색을 넣는 문법은 없다. 정답: <b>[빨강][>=5000]#,##0.0;[녹색][>=800]#,##0.0;#,##0.0</b>"},
  {s:"데이터베이스",q:"다음 VBA 코드의 실행 결과로 옳은 것은?\n\nMe.Filter = \"지역='부산'\"\nMe.FilterOn = True",o:["현재 폼에서 지역이 '부산'인 레코드만 표시된다.", "지역이 '부산'인 레코드가 모두 삭제된다.", "폼이 읽기 전용으로 바뀐다.", "조건과 상관없이 모든 레코드가 표시된다."],a:0,e:"Filter에 조건을 지정하고 FilterOn=True로 켜면, 조건(지역='부산')에 맞는 레코드만 폼에 표시된다. FilterOn=False로 하면 필터가 해제되어 전체가 보인다."},
  {s:"데이터베이스",q:"다음 중 Access 폼의 '바운드 컨트롤(Bound Control)'에 대한 설명으로 옳은 것은?",o:["테이블·쿼리의 필드와 연결되어 데이터를 표시·편집하는 컨트롤이다.", "원본과 연결되지 않고 제목·선 등 장식에만 쓰이는 컨트롤이다.", "식의 계산 결과만 표시하는 컨트롤이다.", "항상 콤보 상자 형태로만 만들어진다."],a:0,e:"바운드 컨트롤은 레코드 원본의 특정 필드에 연결되어 값을 표시·입력한다. 연결이 없으면 언바운드, 식 계산 결과를 표시하면 계산 컨트롤이다."},
  {s:"데이터베이스",q:"다음 중 Access 테이블의 '기본 키(Primary Key)'에 대한 설명으로 옳지 않은 것은?",o:["기본 키 필드에는 중복된 값을 입력할 수 없다.", "기본 키 필드에는 Null 값을 입력할 수 없다.", "하나의 테이블에는 기본 키를 반드시 하나만, 단일 필드로만 지정할 수 있다.", "여러 필드를 묶어 기본 키로 지정할 수 있다."],a:2,e:"기본 키는 단일 필드뿐 아니라 여러 필드를 묶은 '복합 키'로도 지정할 수 있다. 기본 키는 중복과 Null을 허용하지 않아 각 레코드를 유일하게 식별한다."},
  {s:"데이터베이스",q:"다음 중 SQL 문 'SELECT 이름 FROM 회원 WHERE 이름 LIKE \"김*\";' 의 실행 결과로 옳은 것은?",o:["이름이 '김'으로 시작하는 모든 회원", "이름이 정확히 '김'인 회원", "이름에 '김'이 포함된 모든 회원", "이름이 '김'으로 끝나는 모든 회원"],a:0,e:"Access에서 * 는 임의의 문자열을 뜻하는 와일드카드이므로 \"김*\"은 '김'으로 시작하는 모든 이름을 찾는다. (표준 SQL에서는 % 를 사용한다.)"},
  {s:"데이터베이스",q:"다음 중 액세스의 '실행 쿼리(Action Query)'에 해당하지 않는 것은?",o:["테이블 만들기 쿼리", "추가 쿼리", "업데이트 쿼리", "매개 변수 쿼리"],a:3,e:"실행 쿼리는 데이터를 실제로 바꾸는 <b>테이블 만들기·추가·업데이트·삭제 쿼리</b>다. 매개 변수 쿼리는 조건만 입력받는 '선택 쿼리'의 한 형태로 데이터를 변경하지 않는다."},
  {s:"데이터베이스",q:"다음 중 SQL SELECT 문에 대한 설명으로 옳지 않은 것은?",o:["SELECT 절에서 DISTINCT를 사용하면 결과에서 완전히 중복되는 행을 한 번만 표시한다.", "WHERE 절은 개별 행을 대상으로, HAVING 절은 GROUP BY로 묶인 그룹을 대상으로 조건을 적용한다.", "여러 테이블을 결합할 때 INNER JOIN은 양쪽 모두에 일치하는 행만, LEFT JOIN은 왼쪽 테이블의 모든 행을 포함한다.", "ORDER BY 절에서 여러 필드를 지정하면 모든 필드가 오름차순으로만 정렬되며, 필드별로 오름·내림을 다르게 지정할 수 없다."],a:3,e:"ORDER BY는 <b>필드마다 ASC/DESC를 각각 지정</b>할 수 있다."},
  {s:"데이터베이스",q:"다음 중 Access 테이블의 데이터 형식에 대한 설명으로 옳지 않은 것은?",o:["'일련번호' 형식은 레코드가 추가될 때 1씩 자동 증가하거나 임의의 난수로 부여되며, 사용자가 임의로 수정할 수 없다.", "'예/아니요' 형식은 True/False 두 값을 저장하며, 폼에서 확인란(체크박스) 컨트롤로 표시하는 것이 일반적이다.", "'짧은 텍스트'는 최대 255자, '긴 텍스트(메모)'는 약 6만 5천 자까지 저장할 수 있다.", "한 테이블에 '일련번호' 형식의 필드는 여러 개를 동시에 만들어 각각 자동 증가시킬 수 있다."],a:3,e:"'일련번호' 형식 필드는 한 테이블에 <b>하나만</b> 둘 수 있다."},
  {s:"데이터베이스",q:"다음 중 여러 레코드를 한눈에 표로 보여 주기에 가장 적합한 폼의 '기본 보기' 형식은?",o:["연속 폼(데이터시트/연속 폼)", "단일 폼", "분할 표시 폼의 폼 영역만", "모달 대화상자"],a:0,e:"연속 폼·데이터시트 형식은 여러 레코드를 행으로 나열해 한 화면에 표시한다. 단일 폼은 한 번에 한 레코드만 보여 준다."},
  {s:"데이터베이스",q:"아래 '회원' 테이블에 대해 다음 SQL을 실행했을 때 '출력되는 행(그룹) 수'로 옳은 것은?\n\nSELECT 등급, COUNT(*) FROM 회원 GROUP BY 등급;",o:["1", "3", "7", "2"],a:3,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">이름</td><td class=\"hd\">지역</td><td class=\"hd\">등급</td><td class=\"hd\">실적</td></tr><tr><td class=\"rh\">2</td><td class=\"l\">최나래</td><td>광주</td><td>우수</td><td>10</td></tr><tr><td class=\"rh\">3</td><td class=\"l\">강다온</td><td>부산</td><td>우수</td><td>20</td></tr><tr><td class=\"rh\">4</td><td class=\"l\">윤서준</td><td>대전</td><td>우수</td><td>10</td></tr><tr><td class=\"rh\">5</td><td class=\"l\">최나래</td><td>광주</td><td>우수</td><td>60</td></tr><tr><td class=\"rh\">6</td><td class=\"l\">박세찬</td><td>서울</td><td>일반</td><td>30</td></tr><tr><td class=\"rh\">7</td><td class=\"l\">박세찬</td><td>인천</td><td>우수</td><td>40</td></tr><tr><td class=\"rh\">8</td><td class=\"l\">박세찬</td><td>대전</td><td>일반</td><td>80</td></tr></table>",e:"GROUP BY 등급은(는) 등급 값이 같은 레코드를 하나의 그룹으로 묶는다. 서로 다른 등급 값이 2개이므로 결과는 <b>2행</b>이 출력된다."},
  {s:"데이터베이스",q:"아래 '회원' 테이블에서 다음 SQL을 실행했을 때 '삭제되는 레코드 수'로 옳은 것은?\n\nDELETE FROM 회원 WHERE 실적<40;",o:["6", "1", "-1", "0"],a:3,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">이름</td><td class=\"hd\">지역</td><td class=\"hd\">등급</td><td class=\"hd\">실적</td></tr><tr><td class=\"rh\">2</td><td class=\"l\">최나래</td><td>인천</td><td>일반</td><td>50</td></tr><tr><td class=\"rh\">3</td><td class=\"l\">윤서준</td><td>서울</td><td>일반</td><td>50</td></tr><tr><td class=\"rh\">4</td><td class=\"l\">강다온</td><td>광주</td><td>VIP</td><td>70</td></tr><tr><td class=\"rh\">5</td><td class=\"l\">정우진</td><td>대구</td><td>우수</td><td>60</td></tr><tr><td class=\"rh\">6</td><td class=\"l\">한소라</td><td>대전</td><td>VIP</td><td>60</td></tr><tr><td class=\"rh\">7</td><td class=\"l\">이두리</td><td>광주</td><td>일반</td><td>60</td></tr></table>",e:"실적<40 조건에 맞는 레코드가 삭제된다 → <b>0건</b>. (DELETE는 행만 삭제하고 테이블 구조는 남는다.)"},
  {s:"데이터베이스",q:"아래 '회원' 테이블에서 다음 SQL을 실행했을 때 '수정되는 레코드 수'로 옳은 것은?\n\nUPDATE 회원 SET 등급='VIP' WHERE 지역='대구';",o:["7", "0", "-1", "1"],a:1,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">이름</td><td class=\"hd\">지역</td><td class=\"hd\">등급</td><td class=\"hd\">실적</td></tr><tr><td class=\"rh\">2</td><td class=\"l\">YOUNGPAJOK</td><td>대전</td><td>일반</td><td>70</td></tr><tr><td class=\"rh\">3</td><td class=\"l\">김하늘</td><td>부산</td><td>일반</td><td>80</td></tr><tr><td class=\"rh\">4</td><td class=\"l\">정우진</td><td>서울</td><td>일반</td><td>50</td></tr><tr><td class=\"rh\">5</td><td class=\"l\">이두리</td><td>인천</td><td>우수</td><td>70</td></tr><tr><td class=\"rh\">6</td><td class=\"l\">강다온</td><td>광주</td><td>우수</td><td>20</td></tr><tr><td class=\"rh\">7</td><td class=\"l\">최나래</td><td>대전</td><td>VIP</td><td>40</td></tr><tr><td class=\"rh\">8</td><td class=\"l\">김하늘</td><td>인천</td><td>우수</td><td>20</td></tr></table>",e:"WHERE 지역='대구' 조건을 만족하는 레코드만 수정된다 → <b>0건</b>."},
  {s:"데이터베이스",q:"아래 '회원' 테이블에서 다음 도메인 함수의 결과로 옳은 것은?\n\n=DMin(\"실적\",\"회원\",\"지역='인천'\")",o:["68", "70", "80", "71"],a:1,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">이름</td><td class=\"hd\">지역</td><td class=\"hd\">등급</td><td class=\"hd\">실적</td></tr><tr><td class=\"rh\">2</td><td class=\"l\">오지민</td><td>인천</td><td>일반</td><td>70</td></tr><tr><td class=\"rh\">3</td><td class=\"l\">박세찬</td><td>대전</td><td>우수</td><td>90</td></tr><tr><td class=\"rh\">4</td><td class=\"l\">한소라</td><td>대전</td><td>우수</td><td>20</td></tr><tr><td class=\"rh\">5</td><td class=\"l\">윤서준</td><td>서울</td><td>일반</td><td>50</td></tr><tr><td class=\"rh\">6</td><td class=\"l\">김하늘</td><td>광주</td><td>일반</td><td>20</td></tr><tr><td class=\"rh\">7</td><td class=\"l\">박세찬</td><td>대전</td><td>우수</td><td>50</td></tr></table>",e:"DMin은 조건(지역='인천')에 맞는 실적의 최솟값을 구한다 → <b>70</b>."},
  {s:"데이터베이스",q:"아래 '회원' 테이블에 대해 다음 SQL을 실행했을 때 검색되는 '레코드 수'로 옳은 것은?\n\nSELECT * FROM 회원 WHERE 지역='광주' OR 실적>=50;",o:["4", "6", "3", "5"],a:0,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">이름</td><td class=\"hd\">지역</td><td class=\"hd\">등급</td><td class=\"hd\">실적</td></tr><tr><td class=\"rh\">2</td><td class=\"l\">박세찬</td><td>광주</td><td>우수</td><td>60</td></tr><tr><td class=\"rh\">3</td><td class=\"l\">최나래</td><td>대전</td><td>일반</td><td>20</td></tr><tr><td class=\"rh\">4</td><td class=\"l\">윤서준</td><td>서울</td><td>우수</td><td>80</td></tr><tr><td class=\"rh\">5</td><td class=\"l\">정우진</td><td>인천</td><td>일반</td><td>90</td></tr><tr><td class=\"rh\">6</td><td class=\"l\">김하늘</td><td>인천</td><td>VIP</td><td>50</td></tr><tr><td class=\"rh\">7</td><td class=\"l\">한소라</td><td>인천</td><td>일반</td><td>20</td></tr><tr><td class=\"rh\">8</td><td class=\"l\">이두리</td><td>부산</td><td>VIP</td><td>30</td></tr></table>",e:"WHERE 조건(지역이 '광주'이거나 실적이 50 이상)을 만족하는 레코드를 센다. AND는 두 조건을 모두, OR는 둘 중 하나만 만족해도 선택된다 → <b>4건</b>."},
  {s:"데이터베이스",q:"다음 중 입력 마스크와 입력 데이터에 따른 결과가 옳지 않은 것은?",o:["마스크 AAAA · 입력 한글AB → 한글A", "마스크 00:00 · 입력 0930 → 09:30", "마스크 L0L0 · 입력 A1B2 → A1B2", "마스크 000-0000 · 입력 1234567 → 123-4567"],a:0,e:"마스크 AAAA에 한글AB를 입력하면 올바른 결과는 <b>한글AB</b>이다. (0=필수숫자, L=필수문자, &gt;=대문자, &lt;=소문자)"},
  {s:"데이터베이스",q:"아래 '회원' 테이블에서 다음 도메인 함수의 결과로 옳은 것은?\n\n=DMax(\"실적\",\"회원\",\"지역='인천'\")",o:["81", "80", "90", "78"],a:1,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">이름</td><td class=\"hd\">지역</td><td class=\"hd\">등급</td><td class=\"hd\">실적</td></tr><tr><td class=\"rh\">2</td><td class=\"l\">윤서준</td><td>광주</td><td>일반</td><td>90</td></tr><tr><td class=\"rh\">3</td><td class=\"l\">최나래</td><td>광주</td><td>우수</td><td>70</td></tr><tr><td class=\"rh\">4</td><td class=\"l\">김하늘</td><td>인천</td><td>우수</td><td>80</td></tr><tr><td class=\"rh\">5</td><td class=\"l\">윤서준</td><td>대전</td><td>일반</td><td>60</td></tr><tr><td class=\"rh\">6</td><td class=\"l\">오지민</td><td>대구</td><td>일반</td><td>70</td></tr><tr><td class=\"rh\">7</td><td class=\"l\">YOUNGPAJOK</td><td>대전</td><td>일반</td><td>60</td></tr></table>",e:"DMax은 조건(지역='인천')에 맞는 실적의 최댓값을 구한다 → <b>80</b>."},
  {s:"데이터베이스",q:"아래 '회원' 테이블에 대해 다음 SQL을 실행했을 때 검색되는 '레코드 수'로 옳은 것은?\n\nSELECT * FROM 회원 WHERE 실적>=60;",o:["0", "2", "1", "3"],a:2,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">이름</td><td class=\"hd\">지역</td><td class=\"hd\">등급</td><td class=\"hd\">실적</td></tr><tr><td class=\"rh\">2</td><td class=\"l\">김하늘</td><td>인천</td><td>우수</td><td>30</td></tr><tr><td class=\"rh\">3</td><td class=\"l\">강다온</td><td>부산</td><td>우수</td><td>90</td></tr><tr><td class=\"rh\">4</td><td class=\"l\">박세찬</td><td>부산</td><td>일반</td><td>20</td></tr><tr><td class=\"rh\">5</td><td class=\"l\">오지민</td><td>대구</td><td>일반</td><td>20</td></tr><tr><td class=\"rh\">6</td><td class=\"l\">최나래</td><td>부산</td><td>일반</td><td>20</td></tr><tr><td class=\"rh\">7</td><td class=\"l\">김하늘</td><td>대구</td><td>우수</td><td>40</td></tr></table>",e:"WHERE 조건(실적이 60 이상)을 만족하는 레코드를 센다. AND는 두 조건을 모두, OR는 둘 중 하나만 만족해도 선택된다 → <b>1건</b>."},
  {s:"데이터베이스",q:"아래 '회원' 테이블에서 다음 SQL(Access 기준)의 '검색 결과 레코드 수'로 옳은 것은?\n\nSELECT * FROM 회원 WHERE 이름 LIKE '김*';",o:["7", "2", "1", "3"],a:1,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">이름</td><td class=\"hd\">지역</td><td class=\"hd\">등급</td><td class=\"hd\">실적</td></tr><tr><td class=\"rh\">2</td><td class=\"l\">최나래</td><td>인천</td><td>VIP</td><td>50</td></tr><tr><td class=\"rh\">3</td><td class=\"l\">오지민</td><td>부산</td><td>VIP</td><td>40</td></tr><tr><td class=\"rh\">4</td><td class=\"l\">김하늘</td><td>부산</td><td>일반</td><td>60</td></tr><tr><td class=\"rh\">5</td><td class=\"l\">이두리</td><td>광주</td><td>일반</td><td>80</td></tr><tr><td class=\"rh\">6</td><td class=\"l\">김하늘</td><td>부산</td><td>VIP</td><td>80</td></tr><tr><td class=\"rh\">7</td><td class=\"l\">최나래</td><td>대구</td><td>VIP</td><td>50</td></tr><tr><td class=\"rh\">8</td><td class=\"l\">박세찬</td><td>서울</td><td>우수</td><td>70</td></tr></table>",e:"Access에서 * 는 임의 문자열 와일드카드이므로 이름이 '김'로 시작하는 레코드를 찾는다 → <b>2건</b>. (표준 SQL은 % 사용)"},
  {s:"데이터베이스",q:"아래 '회원' 테이블에서 다음 SQL을 실행했을 때 '삭제되는 레코드 수'로 옳은 것은?\n\nDELETE FROM 회원 WHERE 실적<30;",o:["-1", "0", "6", "1"],a:1,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">이름</td><td class=\"hd\">지역</td><td class=\"hd\">등급</td><td class=\"hd\">실적</td></tr><tr><td class=\"rh\">2</td><td class=\"l\">김하늘</td><td>대구</td><td>VIP</td><td>40</td></tr><tr><td class=\"rh\">3</td><td class=\"l\">정우진</td><td>광주</td><td>VIP</td><td>90</td></tr><tr><td class=\"rh\">4</td><td class=\"l\">박세찬</td><td>광주</td><td>VIP</td><td>50</td></tr><tr><td class=\"rh\">5</td><td class=\"l\">강다온</td><td>대구</td><td>일반</td><td>50</td></tr><tr><td class=\"rh\">6</td><td class=\"l\">최나래</td><td>서울</td><td>일반</td><td>90</td></tr><tr><td class=\"rh\">7</td><td class=\"l\">한소라</td><td>인천</td><td>VIP</td><td>80</td></tr></table>",e:"실적<30 조건에 맞는 레코드가 삭제된다 → <b>0건</b>. (DELETE는 행만 삭제하고 테이블 구조는 남는다.)"},
  {s:"데이터베이스",q:"아래 '회원' 테이블에서 다음 도메인 집계 함수의 결과로 옳은 것은?\n\n=DMin(\"실적\",\"회원\",\"등급='우수'\")",o:["70", "60", "200", "3"],a:1,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">이름</td><td class=\"hd\">지역</td><td class=\"hd\">등급</td><td class=\"hd\">실적</td></tr><tr><td class=\"rh\">2</td><td class=\"l\">이두리</td><td>인천</td><td>일반</td><td>20</td></tr><tr><td class=\"rh\">3</td><td class=\"l\">김하늘</td><td>대전</td><td>우수</td><td>70</td></tr><tr><td class=\"rh\">4</td><td class=\"l\">이두리</td><td>인천</td><td>우수</td><td>60</td></tr><tr><td class=\"rh\">5</td><td class=\"l\">윤서준</td><td>부산</td><td>일반</td><td>10</td></tr><tr><td class=\"rh\">6</td><td class=\"l\">이두리</td><td>인천</td><td>VIP</td><td>10</td></tr><tr><td class=\"rh\">7</td><td class=\"l\">정우진</td><td>부산</td><td>우수</td><td>70</td></tr></table>",e:"DMin은(는) 세 번째 인수(조건)를 만족하는 레코드에 대해 조건에 맞는 실적의 최솟값을(를) 구한다. 등급='우수'인 레코드는 3건이고, 그 실적으로 계산하면 결과는 <b>60</b>이다."},
  {s:"데이터베이스",q:"아래 '회원' 테이블에서 다음 SQL의 '검색 결과 레코드 수'로 옳은 것은?\n\nSELECT * FROM 회원 WHERE 지역 IN ('인천','대구');",o:["2", "1", "6", "0"],a:1,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">이름</td><td class=\"hd\">지역</td><td class=\"hd\">등급</td><td class=\"hd\">실적</td></tr><tr><td class=\"rh\">2</td><td class=\"l\">김하늘</td><td>대전</td><td>우수</td><td>40</td></tr><tr><td class=\"rh\">3</td><td class=\"l\">YOUNGPAJOK</td><td>서울</td><td>우수</td><td>10</td></tr><tr><td class=\"rh\">4</td><td class=\"l\">오지민</td><td>서울</td><td>일반</td><td>70</td></tr><tr><td class=\"rh\">5</td><td class=\"l\">정우진</td><td>대구</td><td>일반</td><td>80</td></tr><tr><td class=\"rh\">6</td><td class=\"l\">이두리</td><td>대전</td><td>VIP</td><td>40</td></tr><tr><td class=\"rh\">7</td><td class=\"l\">최나래</td><td>광주</td><td>우수</td><td>90</td></tr><tr><td class=\"rh\">8</td><td class=\"l\">박세찬</td><td>서울</td><td>VIP</td><td>30</td></tr></table>",e:"IN ('인천','대구')은 지역이 둘 중 하나인 레코드를 모두 찾는다 → <b>1건</b>."}
 ]},
{ name:'기출 5회', q:[
  {s:"컴퓨터일반",q:"다음 중 Windows 휴지통에 대한 설명으로 틀린 것은?",o:["휴지통 최대 크기는 기본적으로 각 드라이브 용량의 약 10% 수준이다.", "휴지통은 드라이브별로 따로 설정할 수 있다.", "휴지통이 가득 차면 '최근에' 삭제된 파일부터 자동 삭제된다.", "휴지통을 거치지 않고 바로 삭제하도록 설정할 수 있다."],a:2,e:"휴지통이 가득 차면 '가장 오래전에' 삭제된 파일부터 자동으로 지워진다. 드라이브별 용량 설정, 바로 삭제 설정은 옳다."},
  {s:"컴퓨터일반",q:"다음 중 멀티미디어 데이터의 표현과 압축에 대한 설명으로 옳지 않은 것은?",o:["비트맵 이미지는 픽셀의 집합으로 표현되어 확대 시 계단 현상이 생기고, 벡터는 수식으로 표현되어 확대해도 깨지지 않는다.", "JPEG는 사람 눈에 둔감한 정보를 버리는 손실 압축을, PNG·GIF는 무손실 압축을 사용한다.", "MPEG는 동영상 압축 표준으로, 프레임 간 중복(시간적 중복)을 제거하는 방식으로 압축률을 높인다.", "샘플링 주파수가 높고 양자화 비트 수가 클수록 디지털 오디오의 음질은 낮아지고 파일 용량은 작아진다."],a:3,e:"샘플링 주파수·양자화 비트가 <b>클수록 음질은 좋아지고 용량은 커진다</b>. 지문은 반대다."},
  {s:"컴퓨터일반",q:"다음 중 신기술 용어에 대한 설명으로 옳지 않은 것은?",o:["디지털 트윈은 현실 사물·시스템을 가상에 똑같이 구현해 시뮬레이션한다.", "RPA는 규칙 기반의 반복 업무를 소프트웨어 로봇으로 자동화한다.", "생성형 AI는 학습한 패턴으로 새로운 텍스트·이미지 등을 만들어 낸다.", "양자 컴퓨팅은 비트를 0 또는 1 중 하나로만 처리해 기존 컴퓨터와 동일하게 동작한다."],a:3,e:"양자 컴퓨팅은 큐비트가 0과 1을 '중첩'으로 동시에 가질 수 있어 특정 문제를 병렬적으로 빠르게 처리한다. 기존과 동일하다는 설명은 틀리다."},
  {s:"컴퓨터일반",q:"다음 중 자료 구조에 대한 설명으로 옳지 않은 것은?",o:["스택은 후입선출(LIFO) 구조로 push·pop 연산을 가진다.", "큐는 선입선출(FIFO) 구조로 한쪽에서 넣고 다른 쪽에서 꺼낸다.", "트리는 계층적 구조로 하나의 루트에서 가지가 뻗는다.", "스택은 함수 호출 반환보다는 운영체제의 작업 '예약(스케줄 대기)'에 주로 쓰인다."],a:3,e:"스택은 함수 호출·복귀, 수식 계산, 되돌리기 등에 쓰인다. 대기열(스케줄 대기)에 쓰이는 것은 큐(FIFO)이다."},
  {s:"컴퓨터일반",q:"다음 중 은행원 알고리즘(Banker's Algorithm)에 대한 설명으로 옳은 것은?",o:["자원을 할당해도 안전 상태가 유지되는지 미리 검사해 교착 상태를 '회피'한다.", "교착 상태가 생긴 뒤 프로세스를 강제 종료해 '복구'하는 기법이다.", "교착 상태의 네 조건 중 하나를 없애 '예방'하는 기법이다.", "자원 요청을 무조건 즉시 허용하는 기법이다."],a:0,e:"은행원 알고리즘은 자원 할당 시 시스템이 '안전 상태'를 유지하는지 검사해 불안전하면 할당을 미루는 교착 '회피' 기법이다."},
  {s:"컴퓨터일반",q:"다음 중 전자 서명(Digital Signature)에 대한 설명으로 옳은 것은?",o:["송신자의 개인키로 서명하고 수신자가 송신자의 공개키로 검증하여 무결성·부인 방지를 제공한다.", "수신자의 공개키로 서명하고 송신자의 개인키로 검증한다.", "전자 서명은 기밀성(내용 암호화)을 보장하는 것이 주된 목적이다.", "전자 서명에는 해시 함수가 사용되지 않는다."],a:0,e:"전자 서명은 보통 메시지의 해시값을 '송신자의 개인키'로 암호화(서명)하고, 수신자가 '송신자의 공개키'로 복호화해 검증한다. 이로써 무결성·인증·부인 방지를 제공한다(기밀성은 별도)."},
  {s:"컴퓨터일반",q:"다음 중 Windows의 바로 가기(Shortcut) 아이콘에 대한 설명으로 옳지 않은 것은?",o:["바로 가기 아이콘을 삭제해도 원본 파일에는 영향을 주지 않는다.", "한 원본 파일에 대해 여러 개의 바로 가기를 만들 수 있다.", "바로 가기 아이콘의 확장자는 <b>.LNK</b>이며 아이콘 왼쪽 아래에 화살표가 표시된다.", "바로 가기 아이콘을 다른 컴퓨터로 복사하면 원본 파일도 함께 복사된다."],a:3,e:"바로 가기는 원본의 '위치 정보(링크)'만 담고 있어 복사해도 원본은 따라가지 않는다. 그래서 링크가 끊기면 실행되지 않는다. 확장자는 .LNK, 원본과 독립적으로 삭제·다중 생성이 가능하다."},
  {s:"컴퓨터일반",q:"다음 중 문자 표현 코드에 대한 설명으로 옳지 않은 것은?",o:["유니코드 UTF-8은 문자에 따라 1~4바이트로 표현하는 가변 길이 인코딩이다.", "ASCII 문자는 UTF-8에서 1바이트로 표현되어 호환성이 높다.", "EBCDIC은 8비트 코드로 주로 대형 컴퓨터에서 사용된다.", "유니코드 UTF-8은 모든 문자를 항상 2바이트 고정 길이로 표현한다."],a:3,e:"UTF-8은 '가변 길이'(1~4바이트) 인코딩이다. 모든 문자를 2바이트 고정으로 보는 것은 UTF-16의 기본 평면에 가까운 설명이며 UTF-8과 다르다."},
  {s:"컴퓨터일반",q:"다음 중 인공지능(AI)에 대한 설명으로 옳지 않은 것은?",o:["인공지능은 학습·추론·인식 등 인간의 지적 능력을 컴퓨터로 구현하는 기술이다.", "약(좁은) 인공지능은 특정 작업에 특화된 AI로, 현재 상용 AI 대부분이 여기 속한다.", "강(범용) 인공지능은 인간 수준의 폭넓은 지능을 갖춘 AI를 말한다.", "머신러닝은 규칙을 사람이 일일이 입력해야만 동작하는 전통적 프로그래밍 방식이다."],a:3,e:"머신러닝은 <b>데이터로부터 규칙(패턴)을 스스로 학습</b>한다. 규칙을 일일이 입력하는 것은 전통적 방식이다."},
  {s:"컴퓨터일반",q:"다음 중 ASCII 코드에 대한 설명으로 옳지 않은 것은?",o:["데이터 처리·통신 시스템 상호 간 정보 교환에 사용된다.", "확장 ASCII 코드는 8비트를 사용한다.", "각 문자를 7비트로 표현하며 총 128개 문자를 표현한다.", "전 세계 모든 나라의 언어를 표현할 수 있다."],a:3,e:"전 세계 모든 언어를 표현하기 위한 코드는 유니코드(Unicode)이다. ASCII는 7비트(128자) 기반이며 확장 ASCII는 8비트(256자)로 주로 영문·기호를 다룬다."},
  {s:"컴퓨터일반",q:"다음 중 운영체제의 교착 상태 해결 전략 분류로 옳지 않은 것은?",o:["예방 — 교착 상태의 네 조건 중 하나 이상을 성립하지 못하게 한다.", "회피 — 안전 상태를 유지하도록 자원을 신중히 할당한다(은행원 알고리즘).", "탐지·회복 — 교착 상태 발생을 허용하되 발견하면 회복시킨다.", "무시 — 자원을 무제한 복제해 교착 상태를 원천 차단한다."],a:3,e:"교착 해결 전략은 예방·회피·탐지 및 회복, 그리고 '무시(타조 알고리즘)'가 있으나, 무시는 '아무 조치도 하지 않고 재부팅에 맡기는 것'이지 자원을 무제한 복제하는 것이 아니다."},
  {s:"컴퓨터일반",q:"다음 중 실수(부동 소수점) 데이터 표현에 대한 설명으로 옳지 않은 것은?",o:["부동 소수점은 부호·지수부·가수부로 구성된다.", "지수부는 음수 지수 표현을 위해 바이어스(초과) 표현을 사용한다.", "같은 비트 수에서 고정 소수점보다 표현 범위가 넓지만 연산 속도는 느리다.", "부동 소수점은 정수만 표현할 수 있어 소수점 이하를 나타낼 수 없다."],a:3,e:"부동 소수점은 매우 크거나 작은 '실수(소수 포함)'를 표현하기 위한 방식이다. 정수만 표현한다는 설명은 틀리다."},
  {s:"컴퓨터일반",q:"다음 중 Windows 11의 '설정'에서 할 수 있는 작업으로 옳지 않은 것은?",o:["디스플레이 해상도 변경", "기본 앱 지정", "네트워크·인터넷 설정", "엑셀 함수 라이브러리 편집"],a:3,e:"엑셀 함수는 엑셀 프로그램의 기능으로 Windows 설정과 무관하다."},
  {s:"컴퓨터일반",q:"다음 중 Windows 11의 사용자 인터페이스에 대한 설명으로 옳지 않은 것은?",o:["시작 단추와 작업 표시줄 아이콘이 기본적으로 화면 가운데에 정렬된다.", "작업 표시줄 설정에서 아이콘을 왼쪽 정렬로 바꿀 수 있다.", "창 모서리가 둥글게 처리되고, 밝은·어두운 테마를 선택할 수 있다.", "시작 메뉴의 '라이브 타일'이 강화되어 실시간 정보가 타일에 계속 표시된다."],a:3,e:"Windows 11의 시작 메뉴에서는 <b>라이브 타일이 사라지고</b> '고정된 앱 + 추천 항목' 형태로 바뀌었다. 실시간 타일은 이전 버전의 기능이다."},
  {s:"컴퓨터일반",q:"다음 중 Windows 11의 '스냅 레이아웃(Snap Layouts)'에 대한 설명으로 옳지 않은 것은?",o:["제목 표시줄의 최대화 단추 위에 마우스를 올리면 창 배치 틀이 나타난다.", "바로 가기 키 <b>Win+Z</b>로도 스냅 레이아웃을 호출할 수 있다.", "선택한 틀에 창을 배치하면 '스냅 그룹'으로 묶여 작업 표시줄에서 함께 전환된다.", "한 화면을 최대 두 개의 창으로만 분할할 수 있고 네 개 분할은 지원하지 않는다."],a:3,e:"스냅 레이아웃은 화면을 2·3·4분할 등 여러 형태로 나눌 수 있다. 두 개까지만 가능하다는 설명이 틀렸다. Win+Z로 호출하며, 배치된 창들은 스냅 그룹으로 묶인다."},
  {s:"컴퓨터일반",q:"다음 중 Windows의 '제어판/설정'에서 할 수 있는 작업으로 옳지 않은 것은?",o:["앱 제거 및 변경", "기본 앱 설정", "날짜·시간 변경", "엑셀 수식의 자동 계산 켜기"],a:3,e:"엑셀 수식의 자동 계산은 엑셀 '옵션'에서 설정하는 것으로 Windows 설정과 무관하다. 앱 제거·기본 앱·날짜·시간 등은 Windows 설정에서 한다."},
  {s:"컴퓨터일반",q:"다음 중 디지털 오디오의 음질에 대한 설명으로 옳지 않은 것은?",o:["샘플링 주파수가 높을수록 1초에 더 자주 표본을 추출해 원음에 가깝게 재현된다.", "양자화 비트 수가 클수록 소리의 세기를 더 세밀하게 표현해 음질이 좋아진다.", "샘플링 주파수와 양자화 비트가 커질수록 음질은 좋아지지만 파일 용량은 커진다.", "샘플링 주파수를 높이면 원음에 가까워지면서 파일 용량은 오히려 줄어든다."],a:3,e:"샘플링 주파수를 높이면 표본이 많아져 <b>용량은 커진다</b>. '원음에 가까워지면서 용량이 준다'는 설명은 틀리다."},
  {s:"컴퓨터일반",q:"다음 중 주소선(주소 버스)이 12개인 시스템이 직접 지정할 수 있는 최대 기억 공간(워드 수)으로 옳은 것은?",o:["8,192", "12,288", "4,096", "2,048"],a:2,e:"주소선 n개로 2ⁿ개의 주소를 지정한다 → 2^12 = <b>4,096</b>개."},
  {s:"컴퓨터일반",q:"다음 중 가로 640픽셀 × 세로 768픽셀, 한 픽셀을 24비트로 표현하는 비압축 비트맵 이미지의 용량으로 옳은 것은? (1KB=1,024Byte)",o:["34,560KB", "2,880KB", "480KB", "1,440KB"],a:3,e:"비트맵 용량 = 가로×세로×색 깊이(비트)÷8 = 640×768×24÷8 = <b>1,474,560 Byte</b> ≒ 1,440KB."},
  {s:"컴퓨터일반",q:"다음은 7비트 ASCII 코드에 짝수 패리티 비트를 '오른쪽 끝 1비트'로 붙인 8비트 코드이다. 전송 중 오류가 발생한(패리티가 어긋난) 것은?",o:["01100111", "01001000", "11000101", "11111100"],a:0,e:"짝수 패리티는 8비트 전체에서 1의 개수가 짝수가 되도록 패리티 비트를 정한다. 정답 코드 <b>01100111</b>는 1의 개수가 5개로 짝수가 아니어서 오류이다. (패리티 비트는 1비트 오류의 '발생 여부'만 검출하고 위치는 못 찾는다.)"},
  {s:"스프레드시트",q:"다음 VBA 프로시저를 실행한 후 메시지 박스에 출력되는 값으로 옳은 것은?",o:["14", "16", "15", "13"],a:0,fig:"<pre class=\"code\">Sub Test()\n  Dim i As Integer, S As Integer\n  S = 0\n  For i = 1 To 3\n    S = S + i * i\n  Next i\n  MsgBox S\nEnd Sub</pre>",e:"1²+2²+…+3² = 1+4+9 = <b>14</b>"},
  {s:"스프레드시트",q:"다음 중 차트의 오차 막대에 대한 설명으로 옳지 않은 것은?",o:["데이터 표식의 오차·불확실도를 나타내며 고정값·백분율·표준 편차·표준 오차로 설정한다.", "분산형·거품형에서는 X값과 Y값 모두에 오차 막대를 표시할 수 있다.", "3차원 세로 막대형 차트에서도 Y 오차 막대를 표시할 수 있다.", "2차원 세로·가로 막대형·꺾은선형 계열에 Y 오차 막대를 추가할 수 있다."],a:2,e:"오차 막대는 <b>3차원 차트에서 사용 불가</b>하다."},
  {s:"스프레드시트",q:"다음 중 차트 종류에 대한 설명으로 옳지 않은 것은?",o:["원형 차트는 항상 한 개의 계열만 가지며 축이 없고, 조각을 분리해 강조할 수 있다.", "분산형(XY)은 가로 축이 항목 축이 아닌 값 축 형태이며 3차원으로 작성할 수 없다.", "히스토그램은 구간(계급)별 빈도를 막대로 나타내며 항목 간 구성비 비교에 가장 적합하다.", "방사형은 가운데에서 뻗은 값 축을 가지며 3차원으로 작성할 수 없다."],a:2,e:"히스토그램은 <b>구간별 빈도 분포</b>용으로 구성비 비교엔 부적합(구성비는 원형·누적 막대형)."},
  {s:"스프레드시트",q:"다음 중 조회 결과가 #N/A 등 오류일 때만 \"확인요망\"을 표시하는 수식으로 가장 적절한 것은?",o:["=IF(ISERROR(VLOOKUP(E2,A:B,2,0)),\"확인요망\",\"\")", "=IF(ISERR(VLOOKUP(E2,A:B,2,0)),\"확인요망\",\"\")", "=IFERROR(VLOOKUP(E2,A:B,2,0),\"확인요망\")", "=IF(ISNA(\"확인요망\"),VLOOKUP(E2,A:B,2,0),\"\")"],a:0,e:"ISERROR는 <b>#N/A를 포함한 모든 오류</b>에 TRUE다. ISERR는 #N/A를 제외하므로 조회 오류(#N/A)를 놓친다."},
  {s:"스프레드시트",q:"다음 중 부분합과 데이터 통합에 대한 설명으로 옳지 않은 것은?",o:["부분합을 작성하려면 먼저 그룹화할 항목을 기준으로 정렬해야 하며, 합계·평균·개수 등 여러 함수를 쓸 수 있다.", "두 종류 이상의 함수로 부분합을 중첩하려면 두 번째 실행 시 '새로운 값으로 대치'를 해제해야 한다.", "데이터 통합은 여러 워크시트나 통합 문서의 데이터를 합계·평균 등으로 요약하며, '원본 데이터에 연결'을 켜면 원본 변경이 자동 반영된다.", "통합 시 '사용할 레이블'을 지정하면, 참조 영역마다 항목 위치가 서로 달라도 레이블이 같은 항목끼리는 통합되지 않고 각각 따로 표시된다."],a:3,e:"레이블을 지정하면 위치가 달라도 <b>같은 레이블끼리 통합</b>된다."},
  {s:"스프레드시트",q:"다음 중 '틀 고정'에 대한 설명으로 옳지 않은 것은?",o:["화면을 스크롤해도 지정한 행/열이 항상 보이도록 고정한다.", "셀을 선택하고 틀 고정하면 그 셀의 '위쪽 행'과 '왼쪽 열'이 고정된다.", "'첫 행 고정', '첫 열 고정'을 바로 적용할 수 있다.", "틀 고정 상태는 인쇄할 때도 각 페이지에 반복 적용된다."],a:3,e:"틀 고정은 '화면'에만 적용되고 인쇄에는 반영되지 않는다. 인쇄 시 제목 행을 반복하려면 [페이지 설정]-[시트]의 '반복할 행/열'을 사용한다."},
  {s:"스프레드시트",q:"다음 중 [찾기 및 바꾸기] 대화상자의 옵션에 대한 설명으로 옳지 않은 것은?",o:["'대/소문자 구분'을 체크하면 A와 a를 다른 것으로 구분해 찾는다.", "'전체 셀 내용 일치'를 체크하면 찾을 내용과 셀 내용이 '정확히 같은' 셀만 찾는다.", "'찾는 위치'를 시트/통합 문서 중에서 선택할 수 있다.", "'대/소문자 구분'은 기본적으로 항상 켜져 있어 해제할 수 없다."],a:3,e:"'대/소문자 구분'은 기본적으로 '꺼져' 있어(대소문자 구분 안 함) 필요할 때 체크한다. 체크하면 A와 a를 다르게 처리한다."},
  {s:"스프레드시트",q:"[B3:B8]에 학점(A,B,C…)이 있고 [D3]에 조회할 학점이 있을 때, 그 학점을 받은 학생 수를 [E3]에 구하는 수식으로 옳은 것은? (아래로 채우기 함)",o:["=COUNT(B3:B8,D3)", "=COUNTA($B$3:$B$8,D3)", "=COUNTIF(D3,$B$3:$B$8)", "=COUNTIF($B$3:$B$8,D3)"],a:3,e:"COUNTIF(<b>범위, 조건</b>) 순서이며, 아래로 채울 때 범위가 밀리지 않도록 <b>절대 참조($B$3:$B$8)</b>로 고정한다. ③은 인수 순서가 뒤바뀌었다."},
  {s:"스프레드시트",q:"아래 [A1:C7] 표에서 부서가 '기획부'이면서 점수가 70점 이상인 직원 수를 배열 수식으로 구하려고 한다. 가장 적절한 수식은?",o:["{=SUMPRODUCT((B2:B7=\"기획부\")*(C2:C7>70))}", "{=SUM((B2:B7=\"기획부\")+(C2:C7>=70))}", "{=SUM((B2:B7=\"기획부\")*(C2:C7>=70))}", "{=COUNT((B2:B7=\"기획부\")*(C2:C7>=70))}"],a:2,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">이름</td><td class=\"hd\">부서</td><td class=\"hd\">점수</td></tr><tr><td class=\"rh\">2</td><td>정하람</td><td class=\"l\">영업부</td><td>62</td></tr><tr><td class=\"rh\">3</td><td>남궁현</td><td class=\"l\">영업부</td><td>70</td></tr><tr><td class=\"rh\">4</td><td>신아라</td><td class=\"l\">총무부</td><td>66</td></tr><tr><td class=\"rh\">5</td><td>윤예린</td><td class=\"l\">영업부</td><td>75</td></tr><tr><td class=\"rh\">6</td><td>서다은</td><td class=\"l\">영업부</td><td>57</td></tr><tr><td class=\"rh\">7</td><td>권노아</td><td class=\"l\">기획부</td><td>56</td></tr></table>",e:"개수는 두 조건의 곱을 <b>SUM</b>으로 합산한다. <b>{=SUM((B2:B7=\"기획부\")*(C2:C7>=70))}</b> → 두 조건이 모두 참인 행마다 1을 더해 <b>0</b>명. (+는 OR가 되고, >70는 경계값을 빠뜨려 틀린다.)"},
  {s:"스프레드시트",q:"다음 중 문자 위치를 찾는 함수식의 결과로 옳은 것은? (FIND는 대/소문자 구분·와일드카드 불가, SEARCH는 구분 안 함·와일드카드 가능)\n\n=FIND(\"\",\"YOUNGPAJOK MASTER\")",o:["1", "#VALUE!", "0", "17"],a:0,e:"찾을 문자열이 <b>빈 문자열(\"\")</b>이면 FIND·SEARCH 모두 시작 위치인 <b>1</b>을 반환한다. 예: =FIND(\"\",\"YOUNGPAJOK MASTER\") → 1."},
  {s:"스프레드시트",q:"다음 중 REPT 함수로 문자를 반복한 결과로 옳은 것은?\n\n=REPT(\"●\",INT(93/10))",o:["●●●●●●●●", "●●●●●●●●●", "●●●●", "●●●●●●●●●●"],a:1,e:"INT(93/10)=9이므로 '●'를 <b>9번</b> 반복한다 → ●●●●●●●●●"},
  {s:"스프레드시트",q:"다음 중 SUBSTITUTE 함수를 사용한 수식의 실행 결과로 옳은 것은?\n\n=SUBSTITUTE(\"36-25-15-47\",\"-\",\".\")",o:["36.25-15-47", "36.25.15.47", "36.25.15-47", "36-25-15-47"],a:1,e:"SUBSTITUTE(문자열, 찾을값, 바꿀값)에서 네 번째 인수를 생략하면 '-'를 <b>모두</b> '.'로 바꾼다 → <b>36.25.15.47</b>."},
  {s:"스프레드시트",q:"다음 중 SUBSTITUTE 함수를 사용한 수식의 실행 결과로 옳은 것은?\n\n=SUBSTITUTE(\"97-97-27-31\",\"-\",\"/\",2)",o:["97/97/27-31", "97-97-27/31", "97-97/27-31", "97/97/27/31"],a:2,e:"네 번째 인수 2은(는) 2번째 '-'만 '/'로 바꾼다 → <b>97-97/27-31</b>. (인수를 생략하면 모든 '-'를 바꾼다.)"},
  {s:"스프레드시트",q:"다음 중 문자열을 연결하는 수식의 실행 결과로 옳은 것은?\n\n=CONCAT(\"YPJ\",\"D\",\"58\")",o:["YPJ D 58", "YPJD58", "DYPJ58", "YPJ-D-58"],a:1,e:"CONCAT는 구분기호 없이 문자열을 이어 붙인다 → <b>YPJD58</b>. 구분기호를 넣으려면 TEXTJOIN을 쓴다."},
  {s:"스프레드시트",q:"주민등록번호가 \"820917-3******\" 형태일 때, 다음 수식의 결과로 옳은 것은?\n\n=LEFT(\"820917-3******\",2)&\"년생 \"&IF(OR(MID(\"820917-3******\",8,1)=\"1\",MID(\"820917-3******\",8,1)=\"3\"),\"남\",\"여\")",o:["1982년생 남", "82년생 남", "82 남", "82년생 여"],a:1,e:"LEFT(…,2)로 출생연도 두 자리, MID(…,8,1)로 성별 부호를 꺼내 1·3이면 '남', 2·4이면 '여'로 판정해 연결한다 → <b>82년생 남</b>."},
  {s:"스프레드시트",q:"왼쪽 기준표([F2:G6], 오름차순)를 이용해 점수 85점의 등급을 구하려고 한다. 가장 적절한 수식은? (구간의 최저점 이상이면 해당 등급)",o:["=HLOOKUP(85,$F$2:$G$6,2,TRUE)", "=VLOOKUP(85,$F$2:$G$6,2,0)", "=VLOOKUP(85,$F$2:$G$6,2,FALSE)", "=VLOOKUP(85,$F$2:$G$6,2,TRUE)"],a:3,fig:"<table class=\"xg\"><tr><th></th><th>F</th><th>G</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">기준점수</td><td class=\"hd\">등급</td></tr><tr><td class=\"rh\">2</td><td>0</td><td class=\"l\">F</td></tr><tr><td class=\"rh\">3</td><td>60</td><td class=\"l\">D</td></tr><tr><td class=\"rh\">4</td><td>70</td><td class=\"l\">C</td></tr><tr><td class=\"rh\">5</td><td>80</td><td class=\"l\">B</td></tr><tr><td class=\"rh\">6</td><td>90</td><td class=\"l\">A</td></tr></table>",e:"구간(범위) 조회는 네 번째 인수를 <b>TRUE(생략 가능, 근사일치)</b>로 두고 기준표가 <b>오름차순</b>이어야 한다. 85점 → <b>B</b>등급. FALSE(정확히 일치)는 기준표에 없는 값이면 #N/A가 난다."},
  {s:"스프레드시트",q:"아래 [A1:C6] 표에서 부서가 '총무부'이면서 점수가 85점 이상인 직원 수를 배열 수식으로 구하려고 한다. 가장 적절한 수식은?",o:["{=SUM((B2:B6=\"총무부\")*(C2:C6>=85))}", "{=SUMPRODUCT((B2:B6=\"총무부\")*(C2:C6>85))}", "{=COUNT((B2:B6=\"총무부\")*(C2:C6>=85))}", "{=SUM((B2:B6=\"총무부\")+(C2:C6>=85))}"],a:0,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">이름</td><td class=\"hd\">부서</td><td class=\"hd\">점수</td></tr><tr><td class=\"rh\">2</td><td>서다은</td><td class=\"l\">영업부</td><td>76</td></tr><tr><td class=\"rh\">3</td><td>이준서</td><td class=\"l\">전산부</td><td>79</td></tr><tr><td class=\"rh\">4</td><td>구본길</td><td class=\"l\">전산부</td><td>80</td></tr><tr><td class=\"rh\">5</td><td>장서진</td><td class=\"l\">영업부</td><td>85</td></tr><tr><td class=\"rh\">6</td><td>배주한</td><td class=\"l\">영업부</td><td>72</td></tr></table>",e:"개수는 두 조건의 곱을 <b>SUM</b>으로 합산한다. <b>{=SUM((B2:B6=\"총무부\")*(C2:C6>=85))}</b> → 두 조건이 모두 참인 행마다 1을 더해 <b>0</b>명. (+는 OR가 되고, >85는 경계값을 빠뜨려 틀린다.)"},
  {s:"스프레드시트",q:"아래 시트([A1:C3])에서 다음 수식의 결과로 옳은 것은?\n\n=OFFSET(A1,1,2)",o:["15", "24", "30", "23"],a:0,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td>19</td><td>22</td><td>25</td></tr><tr><td class=\"rh\">2</td><td>30</td><td>4</td><td>15</td></tr><tr><td class=\"rh\">3</td><td>24</td><td>15</td><td>23</td></tr></table>",e:"OFFSET(A1,1,2)은 A1에서 아래로 1칸·오른쪽으로 2칸 이동한 셀 → <b>15</b>"},
  {s:"스프레드시트",q:"다음 중 문자 위치를 찾는 함수식의 결과로 옳은 것은? (FIND는 대/소문자 구분·와일드카드 불가, SEARCH는 구분 안 함·와일드카드 가능)\n\n=FIND(\"\",\"YOUNGPAJOK\")",o:["0", "1", "#VALUE!", "10"],a:1,e:"찾을 문자열이 <b>빈 문자열(\"\")</b>이면 FIND·SEARCH 모두 시작 위치인 <b>1</b>을 반환한다. 예: =FIND(\"\",\"YOUNGPAJOK\") → 1."},
  {s:"스프레드시트",q:"아래 시트에서 입력값에 주어진 표시 형식을 적용했을 때, [C2]의 결과로 옳은 것은?",o:["005", "3.14", "1,235", "abcabc"],a:1,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">입력값</td><td class=\"hd\">표시 형식</td><td class=\"hd\">결과</td></tr><tr><td class=\"rh\">2</td><td>3.14159</td><td class=\"l\">0.00</td><td>?</td></tr></table>",e:"소수 둘째 자리에서 반올림 → 3.14"},
  {s:"데이터베이스",q:"다음 중 폼의 '데이터 입력(Data Entry)' 속성을 '예'로 설정했을 때의 결과로 옳은 것은?",o:["폼을 열면 기존 레코드는 보이지 않고 새 레코드 입력 화면만 표시된다.", "기존 모든 레코드가 삭제된다.", "폼이 읽기 전용이 되어 아무 입력도 할 수 없다.", "모든 컨트롤이 잠겨 편집할 수 없다."],a:0,e:"'데이터 입력=예'는 폼을 '새 레코드 전용 입력' 상태로 연다. 기존 레코드는 표시되지 않고 새로 추가만 할 수 있어 대량 입력에 편리하다."},
  {s:"데이터베이스",q:"다음 중 Access 보고서의 구역과 정렬·그룹화에 대한 설명으로 옳지 않은 것은?",o:["보고서 머리글은 보고서 전체에서 맨 처음 한 번, 페이지 머리글은 매 페이지 상단에 반복 출력된다.", "그룹을 지정하면 그룹 머리글·바닥글이 생기며, 그룹 바닥글에서 그룹별 소계·개수 등을 요약할 수 있다.", "누적 합계(Running Sum) 속성을 이용하면 그룹별 또는 보고서 전체에 대한 누계를 표시할 수 있다.", "보고서의 '본문'은 레코드 수와 관계없이 보고서 전체에서 한 번만 출력되는 요약 영역이다."],a:3,e:"'본문'은 <b>레코드마다 반복 출력</b>된다. 전체에서 한 번 출력되는 것은 보고서 머리글/바닥글이다."},
  {s:"데이터베이스",q:"다음 중 Access의 '실행(액션) 쿼리'에 해당하지 않는 것은?",o:["테이블 만들기 쿼리", "추가 쿼리", "선택 쿼리", "업데이트 쿼리"],a:2,e:"실행(액션) 쿼리에는 테이블 만들기·추가·업데이트·삭제 쿼리가 있다. '선택 쿼리'는 데이터를 조회만 하는 쿼리로 실행 쿼리가 아니다."},
  {s:"데이터베이스",q:"다음 중 '유효성 검사 규칙'과 '유효성 검사 텍스트'에 대한 설명으로 옳은 것은?",o:["유효성 검사 규칙에 맞지 않는 값을 입력하면 '유효성 검사 텍스트'의 메시지가 표시된다.", "유효성 검사 텍스트는 입력값을 자동으로 수정해 준다.", "유효성 검사 규칙은 폼에서만 설정할 수 있다.", "유효성 검사 규칙에는 다른 필드를 참조할 수 없다."],a:0,e:"유효성 검사 규칙(예: >=0 And <=100)을 어기는 값을 입력하면, 유효성 검사 텍스트에 적어 둔 안내 메시지가 표시된다. 규칙은 테이블·폼 모두에서 설정할 수 있다."},
  {s:"데이터베이스",q:"다음 중 컨트롤의 '표시(Visible)' 속성에 대한 설명으로 옳은 것은?",o:["'아니요'로 설정하면 컨트롤이 화면·인쇄에서 보이지 않는다.", "'아니요'로 설정하면 컨트롤이 흐리게 표시된다.", "'아니요'로 설정하면 편집만 막힌다.", "'아니요'로 설정하면 Tab 키 순서만 바뀐다."],a:0,e:"'표시=아니요'는 컨트롤을 '숨긴다'(보이지 않음). 흐리게 표시는 '사용 가능=아니요', 편집 금지는 '잠금=예'이다."},
  {s:"데이터베이스",q:"다음 SQL의 실행 결과로 옳은 것은?\n\nSELECT 부서, COUNT(*) AS 인원\nFROM 사원\nGROUP BY 부서\nHAVING COUNT(*)>=3;",o:["부서에 상관없이 전체 사원 수를 센다.", "사원이 3명 이상인 부서별 인원수를 보여 준다.", "사원이 3명 이하인 부서만 보여 준다.", "부서별로 급여 합계를 보여 준다."],a:1,e:"부서별로 그룹화(GROUP BY)한 뒤 <b>인원이 3명 이상(HAVING)인 부서</b>만 표시한다."},
  {s:"데이터베이스",q:"다음 중 보고서의 '그룹화 및 정렬'에 대한 설명으로 옳지 않은 것은?",o:["하나 이상의 필드를 기준으로 그룹을 만들 수 있다.", "그룹 수준별로 머리글/바닥글을 표시할 수 있다.", "정렬은 최대 한 개 필드로만 지정할 수 있다.", "그룹 간격(값 전체·첫 문자 등)을 지정할 수 있다."],a:2,e:"보고서에서는 여러 필드를 기준으로 그룹화·정렬할 수 있다(최대 10개 수준). 한 필드로만 정렬된다는 설명은 틀리다."},
  {s:"데이터베이스",q:"다음 중 데이터 무결성에 대한 설명으로 옳지 않은 것은?",o:["개체 무결성은 기본키가 Null이거나 중복될 수 없다는 규칙이다.", "참조 무결성은 외래키 값이 참조하는 기본키에 존재하거나 Null이어야 한다는 규칙이다.", "도메인 무결성은 속성값이 정의된 도메인(형식·범위)에 속해야 한다는 규칙이다.", "참조 무결성이 설정되면 자식(외래키) 레코드가 있어도 부모(기본키) 레코드를 자유롭게 삭제할 수 있다."],a:3,e:"참조 무결성이 설정되면 자식이 참조 중인 <b>부모 레코드는 삭제할 수 없다</b>(연쇄 삭제를 켜지 않는 한)."},
