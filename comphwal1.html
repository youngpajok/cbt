<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영파족 CBT · 컴퓨터활용능력 1급 필기 모의고사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@600;700;900&display=swap" rel="stylesheet">
<style>
:root{
 --navy:#173C7C;--navy-d:#0E2756;--navy-2:#1C4E9C;--gold:#F2C94C;--gold-d:#B8891A;--gold-l:#FDF7E8;--gold-b:#ECD08A;
 --bg:#F5F2EB;--paper:#FFFFFF;--line:#E6E0D2;--txt:#1E2433;--sub:#6B7080;
 --red:#C62828;--red-l:#FDECEC;--green:#2E7D32;--green-l:#E9F5EA;
 --sans:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;--serif:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{font-family:var(--sans);background:var(--bg);color:var(--txt);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}

/* ---------- 헤더 ---------- */
header{background:var(--navy-d);border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:6}
header .in{max-width:880px;margin:0 auto;padding:.65rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:.6rem}
.brand{display:flex;align-items:center;gap:.55rem;text-align:left}
.badge-logo{display:inline-flex;align-items:center;gap:.35rem;background:rgba(14,39,86,.6);border:1.5px solid #B8913A;border-radius:999px;padding:.45rem 1.1rem;color:#fff;font-weight:700;font-size:.88rem;letter-spacing:.04em;white-space:nowrap}
.badge-logo:hover{border-color:var(--gold)}
.badge-logo .y{color:var(--gold);font-weight:900}
.badge-logo i{font-style:normal;color:#fff}
.badge-logo .s b{color:var(--gold);font-weight:900}
.cbt{font-size:.72rem;font-weight:900;letter-spacing:.12em;color:var(--navy-d);background:var(--gold);padding:.2rem .45rem;border-radius:4px}
.hbtn{display:flex;gap:.3rem}
.hbtn button{border:1px solid rgba(255,255,255,.28);color:#fff;padding:.35rem .55rem;font-size:.8rem;border-radius:6px}
.hbtn button:hover{border-color:var(--gold);color:var(--gold)}

.wrap{width:100%;max-width:880px;margin:0 auto;padding:1.1rem 1rem 1.5rem;flex:1}

/* ---------- 공통 패널 ---------- */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:1.25rem;margin-bottom:1rem;box-shadow:0 1px 2px rgba(23,60,124,.04)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.95rem}
.ph h2{font-family:var(--serif);font-size:1.12rem;font-weight:700;color:var(--navy-d);display:flex;align-items:center;gap:.5rem}
.ph h2::before{content:"";width:.5rem;height:.5rem;background:var(--gold);transform:rotate(45deg);flex:none}
.ph small{font-size:.8rem;color:var(--sub)}

/* ---------- 히어로 ---------- */
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,#0F1D44 0%,#162D63 55%,#1B3A7A 100%);border-radius:18px;padding:1.8rem 1.6rem;margin-bottom:1rem;color:#fff;display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;min-height:300px}
.hero::before,.rhero::before{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.06);right:-90px;top:-130px}
.hero::after,.rhero::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.05);left:-110px;bottom:-160px;pointer-events:none}
.hero .pillb{margin-bottom:1rem}
.greet{display:inline-block;margin:.2rem 0 .7rem;font-size:.86rem;color:#fff;background:rgba(242,201,76,.14);border:1px solid rgba(242,201,76,.45);border-radius:8px;padding:.35rem .7rem}
.greet b{color:var(--gold)}
.log .who{font-weight:700;color:var(--gold-d);font-size:.78rem}
.qd{display:block;margin:.7rem 0 .1rem;padding:.75rem .95rem;background:var(--gold-l);border:1px solid var(--gold-b);border-radius:8px;font-size:.93em;line-height:1.8;font-weight:400}
.qt{width:100%;border-collapse:collapse;margin:.7rem 0 .1rem;font-size:.86em;font-weight:400;table-layout:fixed}
.qt td,.qt th{word-break:keep-all;overflow-wrap:anywhere}
@media(max-width:600px){.qt{font-size:.68em}.qt th,.qt td{padding:.35rem .1rem}.qt th:nth-child(1){width:24%}.qt th:nth-child(2){width:17%}.qt th:nth-child(3){width:25%}.qt th:nth-child(4){width:20%}.qt th:nth-child(5){width:14%}}
.qt th,.qt td{border:1px solid var(--line);padding:.4rem .3rem;text-align:center}
.qt th{background:var(--navy);color:#fff;font-weight:700}
.buy{position:relative;display:inline-flex;align-items:center;gap:.85rem;margin-top:1.2rem;padding:.75rem 1.1rem .75rem .8rem;border-radius:14px;text-decoration:none;color:var(--navy-d);
 background:linear-gradient(135deg,#FBE7A6 0%,#F2C94C 45%,#D9A53A 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 6px 18px rgba(0,0,0,.28);overflow:hidden;transition:transform .15s,box-shadow .15s}
.buy::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);transition:left .6s}
.buy:hover{transform:translateY(-2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 10px 24px rgba(0,0,0,.32)}
.buy:hover::after{left:120%}
.buy .bi{width:2.4rem;height:2.4rem;border-radius:10px;background:var(--navy-d);color:var(--gold);display:flex;align-items:center;justify-content:center;flex:none}
.buy .bi svg{width:1.3rem;height:1.3rem}
.buy .bt{display:flex;flex-direction:column;line-height:1.3;text-align:left}
.buy .bt small{font-size:.7rem;font-weight:700;letter-spacing:.08em;color:#6A4A0C}
.buy .bt b{font-size:1rem;font-weight:900;letter-spacing:-.01em}
.buy .ba{margin-left:.3rem;font-size:.82rem;font-weight:900;padding:.3rem .6rem;border-radius:999px;background:var(--navy-d);color:var(--gold);white-space:nowrap}
.promo{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;background:#fff;border:1.5px solid var(--gold-b);border-radius:14px;padding:1.15rem 1.3rem;margin-bottom:1rem;background-image:linear-gradient(120deg,#FFFBF0 0%,#FFFFFF 60%)}
.promo::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(#F2C94C,#C8962A)}
.promo .pt{flex:1;min-width:15rem}
.promo .pk{font-size:.72rem;font-weight:900;letter-spacing:.12em;color:var(--gold-d)}
.promo h3{font-size:1.08rem;font-weight:900;color:var(--navy-d);margin:.2rem 0 .3rem;word-break:keep-all}
.promo p{font-size:.85rem;color:var(--sub);line-height:1.6;word-break:keep-all}
.promo .pkg{display:flex;gap:.3rem;margin-top:.5rem;flex-wrap:wrap}
.promo .pkg span{font-size:.68rem;font-weight:900;letter-spacing:.08em;color:var(--navy);border:1px solid var(--navy);border-radius:4px;padding:.12rem .4rem}
.promo .buy{margin-top:0}
footer .fl{display:inline-block;margin-top:.45rem;color:var(--gold-d);font-weight:700;text-decoration:none;border-bottom:1px solid var(--gold-b)}
footer .fl:hover{color:var(--navy)}
footer .fy{display:inline-flex;align-items:center;gap:.4rem;margin-top:.5rem;color:var(--sub);text-decoration:none;font-size:.8rem}
footer .fy b{color:var(--navy-d)}footer .fy:hover b{text-decoration:underline}
footer .fy svg{width:1.35rem;height:auto;display:block}
.ctas{display:flex;align-items:stretch;gap:.6rem;flex-wrap:wrap;margin-top:1.2rem}
.ctas .buy{margin-top:0}
.yt{display:inline-flex;align-items:center;gap:.6rem;padding:.6rem 1rem;border-radius:14px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;text-decoration:none;transition:background .15s,border-color .15s}
.yt:hover{background:rgba(255,255,255,.15);border-color:#fff}
.yt svg{width:2rem;height:auto;flex:none}
.yt span{display:flex;flex-direction:column;line-height:1.3}
.yt small{font-size:.68rem;color:rgba(255,255,255,.75);font-weight:700;letter-spacing:.04em}
.yt b{font-size:.92rem;font-weight:900}
.ytl{display:inline-flex;align-items:center;gap:.4rem;margin-top:.6rem;font-size:.82rem;font-weight:700;color:var(--navy);text-decoration:none}
.ytl svg{width:1.3rem;height:auto}.ytl:hover{text-decoration:underline}
@media(max-width:600px){.ctas{flex-direction:column}.yt{justify-content:center}.buy{width:100%}.buy .bt b{font-size:.92rem}.promo .buy{width:100%}}
.seg{grid-template-columns:repeat(3,1fr)}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;margin-bottom:1rem}
.sc-card{position:relative;border:1.5px solid var(--line);border-radius:12px;padding:.9rem .9rem .8rem;text-align:left;background:#fff;display:flex;flex-direction:column;gap:.15rem;transition:border-color .15s}
.sc-card:hover{border-color:var(--gold-d)}
.sc-card.on{border-color:var(--navy);background:#EEF2FA;box-shadow:inset 0 -3px 0 var(--gold)}
.sc-card .sn{font-weight:900;color:var(--navy-d);font-size:1.02rem}
.sc-card .sm,.sc-card .sa{font-size:.78rem;color:var(--sub)}
.sc-card .mini{height:4px;background:#E2DFD6;border-radius:4px;overflow:hidden;margin-top:.35rem}.sc-card .mini div{height:100%;background:var(--gold)}
.sc-card .ck{position:absolute;top:.6rem;right:.6rem;width:1.3rem;height:1.3rem;border-radius:50%;border:1.5px solid var(--line);font-size:.72rem;display:flex;align-items:center;justify-content:center;color:transparent;background:#fff}
.sc-card.on .ck{background:var(--navy);border-color:var(--navy);color:var(--gold)}
.weak{align-self:flex-start;font-size:.64rem;font-weight:900;color:#fff;background:var(--red);padding:.1rem .45rem;border-radius:4px;margin-bottom:.2rem}
.opt{display:flex;align-items:center;gap:.7rem;margin-bottom:.6rem;flex-wrap:wrap}
.ol{width:5rem;font-size:.85rem;font-weight:700;color:var(--navy-d);flex:none}
.chipg{display:flex;gap:.35rem;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:.38rem .85rem;font-size:.82rem;background:#fff}
.chip:hover{border-color:var(--navy)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.sgo{width:100%;margin-top:.7rem;padding:.95rem;border-radius:10px;background:var(--navy);color:#fff;font-weight:900;font-size:1rem;box-shadow:inset 0 -3px 0 var(--gold)}
.sgo:hover{background:var(--navy-2)}.sgo span{color:var(--gold)}
@media(max-width:600px){.seg{grid-template-columns:1fr!important}.sgrid{grid-template-columns:repeat(2,1fr)}.ol{width:100%}#subjP .ph small{display:none}}
.upd{display:inline-block;font-size:.7rem;font-weight:900;color:var(--navy-d);background:var(--gold);padding:.1rem .45rem;border-radius:4px;margin-right:.35rem;vertical-align:1px}
.oth{display:grid;gap:.5rem;margin:0 0 .35rem;padding:.45rem .8rem .45rem calc(3.15rem + 1.5px);font-size:.8rem;font-weight:700;color:#fff;background:var(--navy);border-radius:8px}
.oth span{text-align:center}.oth.tl span:first-child{text-align:left}
.ot{flex:1;display:grid;gap:.5rem;align-items:center;min-width:0}
.ot span{text-align:center;border-left:1px dashed var(--line);padding:0 .2rem;word-break:keep-all;overflow-wrap:anywhere}
.ot span:first-child{border-left:0}.ot.tl span:first-child{text-align:left}
.otx{flex:1;min-width:0}
.inv{display:grid;grid-template-columns:1.2fr 1fr .9fr 1.3fr;border:1px solid var(--line);border-radius:6px;overflow:hidden;font-size:.82em;background:#fff;margin:.1rem 0;font-weight:400;color:var(--txt)}
.inv span{padding:.3rem .3rem;text-align:center;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.inv span:nth-child(4n+1){border-left:0}
.inv .h{background:#EEF2FA;color:var(--navy-d);font-weight:700;border-top:0}
.inv .neg{color:var(--red);font-weight:700}
.invl{display:block;font-size:.72rem;font-weight:700;color:var(--sub);margin:.25rem 0 .1rem}
@media(max-width:600px){.ot.tl{font-size:.8em}.oth{font-size:.72rem;padding-left:calc(2.95rem + 1.5px);gap:.3rem}.ot{gap:.3rem;font-size:.92em}.inv{font-size:.72em}}
.grs{display:flex;gap:1rem;flex-wrap:wrap;margin:.7rem 0 .2rem}
.grs figure{margin:0;text-align:center;font-size:.85rem;color:var(--sub);font-weight:400}
.gr{width:9.5rem;height:auto;display:block;background:#fff;border:1px solid var(--line);border-radius:6px}
.gopt{display:flex;align-items:center;gap:.9rem}.gopt b{min-width:5.5rem}.gopt .gr{width:7.5rem}
.hero .gbar{width:3.2rem;height:3px;background:var(--gold);border-radius:2px;margin:.2rem 0 1rem}
.stats{display:flex;gap:.55rem;flex-wrap:wrap}
.stats div{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);border-radius:10px;padding:.55rem .85rem;text-align:center;min-width:5.4rem}
.stats b{display:block;color:var(--gold);font-size:1.15rem;font-weight:900}
.stats span{font-size:.74rem;color:rgba(255,255,255,.8)}
.hero .hx{position:relative;z-index:1;align-self:center}
.eyebrow{display:block;font-size:.85rem;font-weight:500;color:rgba(255,255,255,.8);margin-bottom:.35rem}
.hero h1{font-size:2.3rem;line-height:1.25;font-weight:900;margin-bottom:.4rem;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p{font-size:.92rem;color:rgba(255,255,255,.82);margin-bottom:1rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chips span{font-size:.78rem;font-weight:700;padding:.3rem .65rem;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(242,201,76,.55);color:#fff}
.hero .char{position:relative;z-index:1;width:200px;flex:none;margin:-.6rem .4rem -1.8rem 0;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
.char img,.char svg{width:100%;height:auto;display:block}

/* ---------- 설정 ---------- */
.fld{display:flex;align-items:center;gap:.7rem;margin-bottom:.85rem;font-size:.92rem;font-weight:500}
.fld input{flex:1;padding:.65rem .8rem;border:1px solid var(--line);border-radius:8px;background:#FCFBF8}
.fld input:focus{outline:none;border-color:var(--gold-d);box-shadow:0 0 0 3px rgba(242,201,76,.25)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:.55rem;margin-bottom:.8rem}
.seg button{border:1.5px solid var(--line);padding:.8rem .9rem;border-radius:10px;text-align:left;font-weight:700;background:#fff}
.seg button small{display:block;font-weight:400;font-size:.78rem;color:var(--sub);margin-top:.15rem}
.seg button.on{border-color:var(--navy);background:var(--navy);color:#fff;box-shadow:inset 0 -3px 0 var(--gold)}
.seg button.on small{color:rgba(255,255,255,.75)}
.chk{display:flex;align-items:center;gap:.5rem;font-size:.92rem}
.chk input{width:1.1rem;height:1.1rem;accent-color:var(--navy)}

/* ---------- 회차 카드 ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.65rem}
.rd{position:relative;border:1px solid var(--line);border-radius:12px;padding:.85rem .9rem .8rem;text-align:left;display:flex;flex-direction:column;gap:.2rem;background:#fff;transition:border-color .15s,transform .15s}
.rd:hover{border-color:var(--gold-d);transform:translateY(-2px)}
.rd .rn{font-family:var(--serif);font-size:1.3rem;font-weight:900;color:var(--navy-d)}
.rd .rs{font-size:.78rem;color:var(--sub)}
.rd .rb{font-size:.82rem;font-weight:700;color:var(--sub);margin-top:.25rem}
.rd .rb.done{color:var(--navy)}
.rd .mini{height:4px;background:#EEE9DC;border-radius:4px;overflow:hidden;margin-top:.35rem}
.rd .mini div{height:100%;background:var(--gold)}
.rd .new{position:absolute;top:.6rem;right:.6rem;font-size:.66rem;font-weight:900;color:var(--navy-d);background:var(--gold);padding:.12rem .4rem;border-radius:4px}
.rd.done-card{border-color:var(--gold-b);background:var(--gold-l)}
.rd.off{background:#F7F5F0;cursor:default}.rd.off:hover{border-color:var(--line);transform:none}
.rd.off .rn{color:#B5B2A8}

.sp{display:grid;grid-template-columns:1fr 1fr;gap:.65rem}
.spb{border:1.5px solid var(--gold-b);border-radius:12px;padding:1rem;text-align:left;background:var(--gold-l);display:flex;gap:.75rem;align-items:center}
.spb:hover{border-color:var(--gold-d)}
.spb .ic{width:2.4rem;height:2.4rem;border-radius:10px;background:var(--navy);color:var(--gold);display:flex;align-items:center;justify-content:center;flex:none}
.spb .ic svg{width:1.3rem;height:1.3rem}
.spb b{display:block;color:var(--navy-d);font-size:1rem}.spb span{font-size:.8rem;color:var(--sub)}

/* ---------- 기록 ---------- */
.bars{display:flex;flex-direction:column;gap:.6rem;margin-bottom:.9rem}
.br{display:grid;grid-template-columns:5.6rem 1fr 5rem;align-items:center;gap:.6rem;font-size:.86rem}
.br .tr{height:.6rem;background:#EEE9DC;border-radius:6px;overflow:hidden}
.br .fl{height:100%;background:var(--navy)}.br .fl.lo{background:#D9675F}
.br .pc{text-align:right;color:var(--sub);font-variant-numeric:tabular-nums}
.log{font-size:.84rem;border-top:1px solid var(--line)}
.log .lr{display:grid;grid-template-columns:1fr auto auto;gap:.8rem;padding:.55rem 0;border-bottom:1px dashed var(--line);align-items:center}
.log .lr b{font-weight:700;color:var(--navy-d)}
.log .lr .t{color:var(--sub);font-size:.78rem}
.log .lr .sc{font-weight:700;font-variant-numeric:tabular-nums}
.empty-t{font-size:.88rem;color:var(--sub);margin-bottom:.6rem}
.btn-o{border:1.5px solid var(--navy);color:var(--navy);padding:.45rem .8rem;border-radius:8px;font-size:.84rem;font-weight:700;background:#fff}
.btn-o:hover{background:var(--navy);color:#fff}
.link{font-size:.8rem;color:var(--sub);text-decoration:underline;margin-top:.6rem}
.msg{min-height:1.3rem;font-size:.86rem;color:var(--red);margin-top:.5rem}

/* ---------- 시험 화면 ---------- */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:.7rem;margin-bottom:.85rem;flex-wrap:wrap}
.qtitle{display:flex;align-items:center;gap:.7rem}
.qtitle .mini-char{width:3.4rem;height:3.4rem;border-radius:50%;background:var(--navy);border:2px solid var(--gold);overflow:hidden;flex:none}
.qtitle .mini-char img{width:100%;height:100%;object-fit:cover;object-position:50% 50%}
.stitle{font-family:var(--serif);font-size:1.15rem;font-weight:900;color:var(--navy-d)}
.qhead small{font-size:.78rem;color:var(--sub)}
.timer{display:flex;align-items:center;gap:.65rem;background:#fff;padding:.55rem 1rem;border:1px solid var(--line);border-radius:10px;font-size:.88rem;line-height:1.5}
.timer svg{width:1.7rem;height:1.7rem;color:var(--navy)}
.timer b{margin-right:.35rem;color:var(--navy-d)}
#tm{color:var(--red);font-weight:700;font-variant-numeric:tabular-nums}
.timer.warn{border-color:var(--red);background:var(--red-l)}
.pbadge{background:var(--gold-l);border:1px solid var(--gold-b);color:var(--gold-d);font-size:.84rem;font-weight:700;padding:.45rem .85rem;border-radius:8px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.qbox{padding:1.5rem 1.5rem 1rem;min-height:300px}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--sub);margin-bottom:.8rem;gap:.5rem}
.tag{background:var(--navy);color:#fff;padding:.18rem .65rem;border-radius:6px;font-weight:700;font-size:.76rem}
.qno{font-variant-numeric:tabular-nums;font-weight:700;color:var(--navy-d)}
.star{border:1px solid var(--line);border-radius:999px;padding:.22rem .75rem;font-size:.8rem;color:var(--sub)}
.star.on{border-color:var(--gold-d);background:var(--gold-l);color:var(--gold-d);font-weight:700}
.src{font-size:.78rem;color:var(--sub);margin-bottom:.4rem}
.qtext{font-size:1.1rem;line-height:1.8;margin-bottom:1.15rem;word-break:keep-all;font-weight:500}
.qtext .n{font-family:var(--serif);font-weight:900;color:var(--navy);margin-right:.25rem}

  {s:"컴퓨터일반",q:"다음 중 Windows 11의 작업 관리자에 대한 설명으로 옳지 않은 것은?",o:["<b>Ctrl+Shift+Esc</b>로 바로 실행할 수 있다.", "'프로세스' 탭에서 CPU·메모리·디스크·네트워크 사용률을 확인할 수 있다.", "응답하지 않는 프로그램을 선택해 '작업 끝내기'로 강제 종료할 수 있다.", "작업 관리자에서는 시작프로그램을 사용 안 함으로 바꿀 수 없어 설정 앱에서만 가능하다."],a:3,e:"작업 관리자의 '시작프로그램' 탭에서 부팅 시 자동 실행 항목을 '사용 안 함'으로 바꿀 수 있다. Ctrl+Shift+Esc로 실행하며 자원 사용률 확인과 강제 종료가 가능하다."},
  {s:"컴퓨터일반",q:"다음 중 운영체제의 프로세스 관리 및 교착 상태(Deadlock)에 대한 설명으로 옳지 않은 것은?",o:["교착 상태는 둘 이상의 프로세스가 서로 상대방이 점유한 자원을 무한정 기다려 어느 쪽도 진행하지 못하는 상태를 말한다.", "교착 상태가 발생하기 위한 필요 조건으로는 상호 배제, 점유와 대기, 비선점, 환형 대기의 네 가지가 모두 동시에 성립해야 한다.", "교착 상태의 해결 기법 중 '회피'는 은행원 알고리즘처럼 자원 할당 시점에 안전 상태를 유지하도록 제어하는 방식이다.", "네 가지 필요 조건 중 '환형 대기' 하나만 성립해도 교착 상태는 반드시 발생하므로, 이를 위해 자원을 선점(Preemption)할 수 있게 하면 된다."],a:3,e:"네 조건은 <b>모두 동시에 성립해야</b> 교착이 발생한다. 하나만으로는 발생하지 않으며, 선점 허용은 '비선점' 조건을 깨는 예방 기법이다."},
  {s:"컴퓨터일반",q:"다음 중 한글 Windows의 시스템 관리 기능에 대한 설명으로 옳지 않은 것은?",o:["작업 관리자에서는 실행 중인 앱·프로세스의 자원 사용량을 확인하고 응답 없는 프로그램을 강제 종료할 수 있다.", "장치 관리자에서는 하드웨어 목록을 확인하고 드라이버를 업데이트하거나 사용 안 함으로 설정할 수 있다.", "레지스트리는 환경 설정과 시스템 정보가 저장된 계층형 데이터베이스로, regedit로 편집할 수 있다.", "디스크 조각 모음은 SSD의 수명을 늘리고 속도를 높이므로, SSD에 대해 매일 수행하는 것이 권장된다."],a:3,e:"디스크 조각 모음은 <b>SSD에는 권장되지 않는다</b>(불필요한 쓰기로 수명 단축). SSD는 Trim으로 관리한다."},
  {s:"컴퓨터일반",q:"다음 중 운영체제의 기억장치 관리 기법에 대한 설명으로 옳지 않은 것은?",o:["연속 할당에서 '최초 적합'은 적재 가능한 첫 번째 공간에 배치한다.", "'최적 적합'은 들어갈 수 있는 공간 중 가장 작은 공간에 배치한다.", "'최악 적합'은 들어갈 수 있는 공간 중 가장 큰 공간에 배치한다.", "최적 적합은 항상 최악 적합보다 단편화가 적고 속도도 빠르다."],a:3,e:"최적 적합은 남는 조각이 작아 보이지만 작은 조각이 많이 생겨 외부 단편화가 심할 수 있고, 매번 전체를 탐색해 느릴 수 있다. '항상' 우수하다고 할 수 없다."},
  {s:"컴퓨터일반",q:"다음 중 AI 윤리에 대한 설명으로 옳지 않은 것은?",o:["AI는 특정 집단에 불리한 편향(차별)을 주지 않도록 공정성을 지켜야 한다.", "AI의 판단 근거를 사람이 이해할 수 있어야 한다는 설명 가능성(투명성)이 요구된다.", "개인정보 보호와 데이터 보안은 AI 활용의 중요한 윤리 원칙이다.", "AI의 결정은 항상 사람의 판단보다 우선하므로 사람이 개입하면 안 된다."],a:3,e:"AI 윤리는 <b>사람의 감독·개입(인간 중심)</b>을 중시한다. AI 판단을 무조건 우선시하지 않는다."},
  {s:"컴퓨터일반",q:"다음 중 멀티미디어 데이터와 압축에 대한 설명으로 옳지 않은 것은?",o:["샘플링은 아날로그 신호를 일정 간격으로 추출해 디지털로 바꾸는 과정이다.", "샘플링 주파수가 높고 양자화 비트가 클수록 음질은 좋아지고 파일 용량은 커진다.", "무손실 압축은 원본을 완벽히 복원할 수 있고, 손실 압축은 일부 정보를 버려 압축률을 높인다.", "MP3는 무손실 압축을 사용하므로 원본 WAV와 음질·용량이 완전히 동일하다."],a:3,e:"MP3는 사람이 잘 못 듣는 영역을 제거하는 <b>손실 압축</b>이라 WAV보다 용량이 작고 음질 손실이 있다. 무손실·동일 음질이라는 설명은 틀리다."},
  {s:"컴퓨터일반",q:"다음 중 대칭키 암호화와 공개키 암호화에 대한 설명으로 옳지 않은 것은?",o:["대칭키는 암·복호화에 같은 키를 사용해 속도가 빠르지만 키 분배가 어렵다.", "공개키는 공개키로 암호화하고 대응하는 개인키로 복호화한다.", "대표적 대칭키 알고리즘으로 DES·AES·SEED가 있다.", "공개키 방식은 대칭키보다 암·복호화 속도가 빨라 대용량 데이터 암호화에 주로 쓰인다."],a:3,e:"공개키(비대칭) 방식은 연산이 복잡해 속도가 '느리다'. 그래서 실제로는 공개키로 '대칭키를 교환'하고 본문은 빠른 대칭키로 암호화하는 하이브리드 방식을 쓴다."},
  {s:"컴퓨터일반",q:"다음 중 펌웨어(Firmware)에 대한 설명으로 옳은 것은?",o:["주로 하드디스크의 부트 레코드 영역에 저장되어 운영체제를 불러온다.", "원시 코드를 인터프리터 방식으로 한 줄씩 번역하여 실행된다.", "ROM 등에 저장되어 특정 하드웨어를 제어하며, 업그레이드만으로 기능을 향상시킬 수 있다.", "운영체제의 일부로서 입출력 작업을 전담하는 장치 드라이버를 가리킨다."],a:2,e:"펌웨어는 <b>ROM 등 비휘발성 메모리에 저장된 하드웨어 제어 프로그램</b>으로, 하드웨어와 소프트웨어의 중간 성격을 갖는다. 소프트웨어처럼 업그레이드해 기능을 개선할 수 있어 ③이 옳다."},
  {s:"컴퓨터일반",q:"다음 중 객체지향에서 '정보 은닉(Information Hiding)'과 '캡슐화'에 대한 설명으로 옳지 않은 것은?",o:["캡슐화된 객체는 공개된 인터페이스(메서드)를 통해서만 내부 데이터에 접근하도록 한다.", "정보 은닉은 객체 내부의 구체적인 구현을 외부에 숨겨, 변경이 다른 부분에 미치는 영향을 줄인다.", "캡슐화를 통해 코드의 재사용성과 유지보수성이 높아진다.", "정보 은닉을 적용하면 객체의 모든 속성을 외부에서 자유롭게 직접 수정할 수 있게 된다."],a:3,e:"정보 은닉은 외부의 <b>직접 접근·수정을 제한</b>하는 것이다. '자유롭게 직접 수정'은 은닉의 목적과 반대다."},
  {s:"컴퓨터일반",q:"다음 중 클라우드 서비스 모델에 대한 설명으로 옳지 않은 것은?",o:["IaaS는 서버·스토리지·네트워크 등 인프라를 제공한다.", "PaaS는 개발·실행 플랫폼(런타임·DB 등)을 제공한다.", "SaaS는 완성된 소프트웨어를 웹으로 제공한다.", "책임 범위는 SaaS가 가장 넓어 사용자가 OS·미들웨어까지 직접 관리한다."],a:3,e:"SaaS는 사용자가 애플리케이션만 쓰고 OS·미들웨어·인프라는 제공자가 관리해 사용자 책임이 가장 '좁다'. 사용자 관리 범위가 가장 넓은 것은 IaaS이다."},
  {s:"컴퓨터일반",q:"다음 중 CPU의 제어 장치와 마이크로 연산에 대한 설명으로 옳지 않은 것은?",o:["제어 장치는 명령어를 해독해 각 장치에 제어 신호를 보낸다.", "한 명령어는 여러 개의 마이크로 연산(인출·간접·실행 등)으로 수행된다.", "마이크로프로그래밍은 제어 신호를 제어 기억장치의 마이크로 명령으로 구현한다.", "제어 장치는 산술·논리 연산을 직접 수행하는 핵심 연산 장치이다."],a:3,e:"산술·논리 연산은 ALU가 수행한다. 제어 장치는 명령 해독과 제어 신호 발생을 담당한다."},
  {s:"컴퓨터일반",q:"다음 중 운영체제의 프로세스 스케줄링에 대한 설명으로 옳지 않은 것은?",o:["선점형 스케줄링은 실행 중인 프로세스의 CPU를 운영체제가 강제로 회수할 수 있다.", "비선점형은 한 프로세스가 CPU를 할당받으면 끝나거나 스스로 양보할 때까지 사용한다.", "SJF(최단 작업 우선)는 실행 시간이 짧은 작업에 CPU를 먼저 할당한다.", "라운드 로빈(RR)은 비선점형 방식으로, 우선순위가 높은 작업이 끝날 때까지 CPU를 독점한다."],a:3,e:"라운드 로빈은 <b>시간 할당량(Time Quantum)마다 CPU를 교체하는 선점형</b> 방식으로, 모든 프로세스에 공평하게 CPU를 분배한다. CPU 독점과는 반대다."},
  {s:"컴퓨터일반",q:"다음 중 소프트웨어 개발 방법론·모델에 대한 설명으로 옳지 않은 것은?",o:["폭포수 모델은 단계를 순차적으로 진행하며 앞 단계로 되돌아가기 어렵다.", "프로토타입 모델은 시제품을 만들어 요구사항을 구체화한다.", "애자일은 짧은 주기로 반복·점진적으로 개발하며 변화에 유연하게 대응한다.", "나선형(Spiral) 모델은 위험 분석 없이 한 번에 개발을 끝내는 모델이다."],a:3,e:"나선형 모델은 '위험 분석'을 핵심으로 계획-위험분석-개발-평가를 반복하며 점진적으로 완성한다."},
  {s:"컴퓨터일반",q:"다음 중 가산기·플립플롭 등 논리 회로에 대한 설명으로 옳지 않은 것은?",o:["반가산기는 두 비트를 더해 합(S)과 자리올림(C)을 출력한다.", "전가산기는 하위 자리올림까지 고려해 세 입력을 더한다.", "플립플롭은 1비트를 기억하는 순차 논리 회로이다.", "반가산기는 아랫자리에서 올라온 자리올림(Carry-in)을 입력으로 받는다."],a:3,e:"반가산기는 Carry-in 입력이 '없다'. 아랫자리 자리올림까지 받는 것은 전가산기이다."},
  {s:"컴퓨터일반",q:"다음 중 해시 함수(Hash)에 대한 설명으로 옳지 않은 것은?",o:["임의 길이의 입력을 고정 길이의 출력으로 변환한다.", "같은 입력은 항상 같은 해시값을 만든다.", "해시값으로부터 원래 입력을 쉽게 복원할 수 있어야 한다.", "입력이 조금만 바뀌어도 해시값이 크게 달라지는 성질이 있다(눈사태 효과)."],a:2,e:"해시 함수는 '단방향'이어서 해시값으로 원래 입력을 복원하기 어려워야 한다(복원이 쉬우면 보안에 취약). 무결성 검증·전자 서명에 사용된다."},
  {s:"컴퓨터일반",q:"다음 중 컴퓨터의 세대별·분류 개념에 대한 설명으로 옳지 않은 것은?",o:["디지털 컴퓨터는 이산적인 값을, 아날로그 컴퓨터는 연속적인 물리량을 다룬다.", "하이브리드 컴퓨터는 디지털과 아날로그의 특성을 결합한다.", "범용 컴퓨터는 다양한 목적에, 전용 컴퓨터는 특정 목적에 사용된다.", "아날로그 컴퓨터는 사칙연산과 논리 연산 중심으로 프로그램을 저장해 처리한다."],a:3,e:"사칙·논리 연산과 프로그램 저장 방식은 '디지털 컴퓨터'의 특징이다. 아날로그 컴퓨터는 전압·전류 등 연속량을 증폭·적분 등으로 처리한다."},
  {s:"컴퓨터일반",q:"다음 중 터치스크린(Touch Screen)의 작동 방식으로 옳지 않은 것은?",o:["저항식(감압식)", "정전식", "광학식(적외선식)", "래스터 방식"],a:3,e:"터치스크린은 정전식·저항식·광학식·초음파식 등 사용자의 접촉을 감지하는 방식이다. '래스터 방식'은 화면에 픽셀을 주사하는 디스플레이 표현 방식으로 터치 감지 방식이 아니다."},
  {s:"컴퓨터일반",q:"다음은 7비트 ASCII 코드에 홀수 패리티 비트를 '오른쪽 끝 1비트'로 붙인 8비트 코드이다. 전송 중 오류가 발생한(패리티가 어긋난) 것은?",o:["01111100", "10111010", "01010111", "01111000"],a:3,e:"홀수 패리티는 8비트 전체에서 1의 개수가 홀수가 되도록 패리티 비트를 정한다. 정답 코드 <b>01111000</b>는 1의 개수가 4개로 홀수가 아니어서 오류이다. (패리티 비트는 1비트 오류의 '발생 여부'만 검출하고 위치는 못 찾는다.)"},
  {s:"컴퓨터일반",q:"다음 중 샘플링 44kHz, 양자화 16비트, 모노(1채널)로 30초간 녹음한 비압축 디지털 오디오의 용량으로 가장 가까운 것은?",o:["약 1.3MB", "약 5.0MB", "약 2.5MB", "약 40.3MB"],a:2,e:"오디오 용량 = 샘플링 주파수 × (양자화 비트÷8) × 채널 수 × 시간 = 44,000 × 2 × 1 × 30 = <b>2,640,000 Byte</b> ≒ 약 2.5MB."},
  {s:"컴퓨터일반",q:"다음 중 주소선(주소 버스)이 20개인 시스템이 직접 지정할 수 있는 최대 기억 공간(워드 수)으로 옳은 것은?",o:["1,048,576", "524,288", "2,097,152", "20,480"],a:0,e:"주소선 n개로 2ⁿ개의 주소를 지정한다 → 2^20 = <b>1,048,576</b>개."},
  {s:"스프레드시트",q:"다음 VBA 프로시저를 실행한 후 메시지 박스에 출력되는 값으로 옳은 것은?",o:["22", "23", "20", "21"],a:3,fig:"<pre class=\"code\">Sub Test()\n  Dim i As Integer, S As Integer\n  i = 1 : S = 0\n  Do While S &lt; 17\n    S = S + i\n    i = i + 1\n  Loop\n  MsgBox S\nEnd Sub</pre>",e:"S가 17 이상이 될 때까지 1,2,3…을 더한다 → 마지막엔 i=6까지 더해 S = <b>21</b>"},
  {s:"스프레드시트",q:"단가 [B2]에 수량 [C2]를 곱한 금액을 '백의 자리에서 올림'하여 천 원 단위로 만드는 수식으로 옳은 것은?",o:["=ROUNDUP(B2*C2,-3)", "=ROUND(B2*C2,-3)", "=ROUNDUP(B2*C2,3)", "=ROUNDDOWN(B2*C2,-3)"],a:0,e:"ROUNDUP(값, <b>-3</b>)은 <b>천 원 단위로 올림</b>한다(음수 자릿수는 정수부 자리). ROUND는 반올림, ROUNDDOWN은 내림이다."},
  {s:"스프레드시트",q:"다음 중 [찾기 및 바꾸기]로 찾을 수 있는 대상에 대한 설명으로 옳지 않은 것은?",o:["'찾는 대상'을 값·수식·메모 중에서 선택할 수 있다.", "셀 서식(글꼴 색 등)을 지정해 해당 서식의 셀을 찾을 수 있다.", "찾는 방향을 행/열 방향으로 지정할 수 있다.", "찾기는 숨겨진 워크시트의 내용까지 자동으로 모두 검색한다."],a:3,e:"숨겨진 시트는 기본적으로 찾기 대상에서 제외된다(시트를 다시 표시해야 검색됨). 값·수식·메모 검색, 서식 찾기, 방향 지정은 가능하다."},
  {s:"스프레드시트",q:"성([B2])과 이름([C2])을 공백으로 띄워 합치되, 두 셀 중 하나가 비어도 불필요한 공백이 남지 않게 하는 수식으로 가장 적절한 것은?",o:["=TEXTJOIN(\" \",TRUE,B2,C2)", "=CONCAT(B2,\" \",C2)", "=B2&\" \"&C2", "=TEXTJOIN(\" \",FALSE,B2,C2)"],a:0,e:"TEXTJOIN(구분자, <b>TRUE(빈 셀 무시)</b>, 문자들)은 빈 셀을 건너뛰어 공백 중복을 막는다. CONCAT·& 연결과 FALSE 옵션은 빈 셀 자리에 공백이 남는다."},
  {s:"스프레드시트",q:"매 페이지 상단에 같은 제목 행을 반복 인쇄하려고 한다. [시트] 탭에서 지정하는 항목으로 옳은 것은?",o:["'반복할 행'에 제목 행을 지정", "'인쇄 영역'에 전체 범위를 지정", "'눈금선'을 체크", "'메모'를 '시트 끝'으로 설정"],a:0,e:"여러 페이지로 나뉘어 인쇄될 때 각 페이지 맨 위에 제목 행을 반복하려면 [시트] 탭의 '인쇄 제목-반복할 행'에 해당 행(예: $1:$1)을 지정한다. 열 제목 반복은 '반복할 열'을 사용한다."},
  {s:"스프레드시트",q:"다음 중 그림과 같은 [데이터 표]에 대한 설명으로 옳지 않은 것은?",o:["한 개 또는 두 개의 입력값 변화에 따른 수식 결과를 한 번에 보여 준다.", "행 입력 셀·열 입력 셀에 변화시킬 셀 주소를 지정한다.", "데이터 표의 결과는 배열 수식({ })으로 입력되어 일부만 수정·삭제할 수 없다.", "원본 수식 값이 바뀌어도 데이터 표의 결과는 다시 계산되지 않는다."],a:3,fig:"<div class=\"dlg\"><div class=\"tb\"><span>데이터 표</span><span class=\"x\">? ✕</span></div><div class=\"bd\"><div class=\"row\"><span>행 입력 셀(R):</span><span class=\"inp\">$B$1</span></div><div class=\"row\"><span>열 입력 셀(C):</span><span class=\"inp\">$B$2</span></div><div class=\"btns\"><span class=\"btn pri\">확인</span><span class=\"btn\">취소</span></div></div></div>",e:"원본이 바뀌면 데이터 표 결과도 <b>자동 재계산</b>된다."},
  {s:"스프레드시트",q:"다음 중 차트 요소와 편집에 대한 설명으로 옳지 않은 것은?",o:["데이터 계열이 하나인 경우에도 원형 차트로 전체 대비 비율을 나타낼 수 있다.", "추세선은 비누적 2차원 세로 막대형·꺾은선형·분산형 등에 추가할 수 있다.", "차트에 사용된 데이터 범위의 값을 수정하면 차트에 즉시 반영된다.", "3차원 세로 막대형 차트에도 추세선과 오차 막대를 자유롭게 추가할 수 있다."],a:3,e:"추세선·오차 막대는 <b>3차원 차트에는 추가할 수 없다</b>(원형·도넛형·방사형·표면형도 추세선 불가)."},
  {s:"스프레드시트",q:"[B3:F3]에 5개 과목 점수가 모두 입력되었으면(공백이 하나도 없으면) \"우수\", 아니면 공백을 표시하는 수식으로 옳은 것은?",o:["=IF(COUNTA(B3:F3)=5,\"우수\",\" \")", "=IF(COUNTBLANK(B3:F3)=5,\"우수\",\" \")", "=IF(COUNT(B3:F3)=0,\"우수\",\" \")", "=IF(COUNTIF(B3:F3,\" \")=5,\" \",\"우수\")"],a:0,e:"비어 있지 않은 셀 수를 세는 <b>COUNTA</b>가 5면 모두 채워진 것이다. COUNTBLANK는 빈 셀 수, COUNT는 숫자 셀 수여서 조건이 맞지 않는다."},
  {s:"스프레드시트",q:"아래 [A1:D5] 표에서 '모니터'의 '4월' 값을 찾으려고 한다. 가장 적절한 수식은? (결과: 참고로 한 셀의 값)",o:["=INDEX(B2:D5,MATCH(\"모니터\",A2:A5,0),MATCH(\"4월\",B1:D1,0))", "=VLOOKUP(\"모니터\",A2:A5,MATCH(\"4월\",B1:D1,0),0)", "=INDEX(B2:D5,MATCH(\"4월\",B1:D1,0),MATCH(\"모니터\",A2:A5,0))", "=INDEX(B2:D5,MATCH(\"모니터\",A2:A5,0))"],a:0,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">품목</td><td class=\"hd\">1월</td><td class=\"hd\">3월</td><td class=\"hd\">4월</td></tr><tr><td class=\"rh\">2</td><td>프린터</td><td>71</td><td>39</td><td>25</td></tr><tr><td class=\"rh\">3</td><td>마우스</td><td>90</td><td>99</td><td>68</td></tr><tr><td class=\"rh\">4</td><td>모니터</td><td>96</td><td>70</td><td>79</td></tr><tr><td class=\"rh\">5</td><td>노트북</td><td>42</td><td>81</td><td>61</td></tr></table>",e:"<b>INDEX(데이터, 행번호, 열번호)</b> 형태에서 행·열 위치를 각각 <b>MATCH</b>로 찾는다. INDEX의 인수 순서는 (범위, 행, 열)이므로 행 MATCH가 먼저 와야 한다. '모니터'×'4월' 교차값은 <b>79</b>. VLOOKUP은 왼쪽 첫 열 기준이라 열 머리글 조회에 부적합하다."},
  {s:"스프레드시트",q:"다음 중 날짜 함수 수식의 실행 결과로 옳은 것은?\n\n=EDATE(\"2025-05-09\",1)",o:["2025-06-09", "2025-06-08", "2025-06-10", "2025-06-01"],a:0,e:"EDATE는 기준일에서 지정한 개월 수(1개월) 뒤의 '같은 날'을 반환한다 → <b>2025-06-09</b>."},
  {s:"스프레드시트",q:"다음 그림과 같이 [목표값 찾기]를 설정했을 때, 그 의미로 옳은 것은?",o:["평균(E4)이 50이 되려면 노트북 판매량(B4)이 얼마가 되어야 하는가?", "노트북 판매량(B4)이 50이 되려면 평균(E4)이 얼마가 되어야 하는가?", "노트북 판매량을 50으로 바꾸면 평균(E4)은 얼마가 되는가?", "평균이 50이 되려면 노트북 외 나머지 제품 판매량은 얼마가 되어야 하는가?"],a:0,fig:"<div class=\"figwrap\"><table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th></tr><tr><td class=\"rh\">1</td><td class=\"tt\" colspan=\"5\">제품별 판매현황</td></tr><tr><td class=\"rh\">3</td><td class=\"hd\">품목</td><td class=\"hd\">노트북</td><td class=\"hd\">프린터</td><td class=\"hd\">스캐너</td><td class=\"hd\">평균</td></tr><tr><td class=\"rh\">4</td><td class=\"hd\">판매량</td><td>71</td><td>31</td><td>16</td><td>39.33</td></tr></table><div class=\"dlg\"><div class=\"tb\"><span>목표값 찾기</span><span class=\"x\">? ✕</span></div><div class=\"bd\"><div class=\"row\"><span>수식 셀(E):</span><span class=\"inp\">$E$4</span></div><div class=\"row\"><span>찾는 값(V):</span><span class=\"inp\">50</span></div><div class=\"row\"><span>값을 바꿀 셀(C):</span><span class=\"inp\">$B$4</span></div><div class=\"btns\"><span class=\"btn pri\">확인</span><span class=\"btn\">취소</span></div></div></div></div>",e:"목표값 찾기는 <b>수식 셀(E4·평균)이 찾는 값(50)</b>이 되도록 <b>값을 바꿀 셀(B4·노트북)</b>을 역산한다."},
  {s:"스프레드시트",q:"셀 [A1:A9]에 다음 값이 입력되어 있다: 14, 47, 50, 65, 68, 73, 75, 81, 94\n다음 수식(50% 지점(백분위수))의 결과로 옳은 것은?\n\n=PERCENTILE.INC(A1:A9, 0.5)",o:["73", "68", "69", "67"],a:1,e:"PERCENTILE.INC(범위, 0.5)는 데이터를 오름차순 정렬했을 때 하위 50% 위치의 값을 구한다. 정렬된 9개 값에서 그 위치의 값은 <b>68</b>이다."},
  {s:"스프레드시트",q:"셀 값이 5,000 이상이면 '파랑', 5,000 미만 500 이상이면 '녹색', 500 미만이면 색을 지정하지 않고, 모든 구간에서 천 단위 구분 기호(,)와 소수 이하 첫째 자리까지 표시하려고 한다. 사용자 지정 표시 형식으로 옳은 것은? (예: 1234.56 → 1,234.6, 432 → 432.0)",o:["[파랑][>=5000]#,##0.0;[녹색][>=500]#,##0.0;#,##0.0", "[파랑][>=5000]#,##0.0;[녹색][>=500]#,##0.0", "[파랑][>=5000]#,###.#;[녹색][>=500]#,###.#;#,###.#", "[>=5000]<파랑>#,##0.0;[>=500]<녹색>#,##0.0;#,##0.0"],a:0,e:"사용자 지정 형식은 <b>[조건·색]양수서식;[조건·색]서식;나머지서식</b> 구조로, 색과 조건은 대괄호 [파랑][>=5000] 안에 넣는다. 소수 첫째 자리는 0을 써서 <b>#,##0.0</b>으로 해야 432가 432.0으로 나온다(#,###.#은 432를 432.로 만들어 틀림). 꺾쇠<>로 색을 넣는 문법은 없다. 정답: <b>[파랑][>=5000]#,##0.0;[녹색][>=500]#,##0.0;#,##0.0</b>"},
  {s:"스프레드시트",q:"아래 표의 점수 [A2:A8]를 구간([B2:B6]) 기준으로 도수분포를 구하기 위해 [C2:C6]에 FREQUENCY 배열 수식을 입력했다. '90 이상' 구간의 도수로 옳은 것은?",o:["1", "7", "2", "0"],a:3,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">점수</td><td class=\"hd\">구간</td><td class=\"hd\">도수</td></tr><tr><td class=\"rh\">2</td><td>31</td><td class=\"l\">60 미만</td><td>?</td></tr><tr><td class=\"rh\">3</td><td>32</td><td class=\"l\">60~69</td><td>?</td></tr><tr><td class=\"rh\">4</td><td>42</td><td class=\"l\">70~79</td><td>?</td></tr><tr><td class=\"rh\">5</td><td>49</td><td class=\"l\">80~89</td><td>?</td></tr><tr><td class=\"rh\">6</td><td>59</td><td class=\"l\">90 이상</td><td>?</td></tr><tr><td class=\"rh\">7</td><td>83</td><td class=\"l\"></td><td></td></tr><tr><td class=\"rh\">8</td><td>88</td><td class=\"l\"></td><td></td></tr></table>",e:"FREQUENCY(데이터배열, 구간배열)은 각 구간의 상한 이하 개수를 센다. '90 이상' 구간에 속한 점수는 <b>0</b>개. (결과 범위 전체를 선택하고 Ctrl+Shift+Enter로 한 번에 입력한다.)"},
  {s:"스프레드시트",q:"아래 표에서 전체 판매 금액(수량×단가의 합계)을 한 번에 구하려고 한다. 가장 적절한 수식은? (참고: 총액 84,000원)",o:["=SUM(B2:B4)*SUM(C2:C4)", "=SUMPRODUCT(B2:B4,C2:C4)", "=SUMPRODUCT(B2:B4+C2:C4)", "=SUM(B2:B4*C2:C4)"],a:1,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">품목</td><td class=\"hd\">수량</td><td class=\"hd\">단가</td></tr><tr><td class=\"rh\">2</td><td>풀</td><td>2</td><td>5,000</td></tr><tr><td class=\"rh\">3</td><td>펜</td><td>6</td><td>3,000</td></tr><tr><td class=\"rh\">4</td><td>자</td><td>7</td><td>8,000</td></tr></table>",e:"<b>SUMPRODUCT(배열1, 배열2)</b>는 대응하는 원소끼리 곱한 뒤 모두 더한다 → <b>84,000</b>원. =SUM(B*C)는 일반 입력 시 배열이 아니라 오류/단일값이 되고(배열 입력해야 함), SUM(B)*SUM(C)는 합끼리 곱해 의미가 다르다."},
  {s:"스프레드시트",q:"셀 [A1:A5]에 다음 값이 입력되어 있다: 20, 47, 74, 86, 98\n다음 수식(제3사분위수)의 결과로 옳은 것은?\n\n=QUARTILE.INC(A1:A5, 3)",o:["85", "98", "86", "87"],a:2,e:"QUARTILE.INC(범위, 3)는 제3사분위수(하위 75% 지점)를 구하며 PERCENTILE.INC(범위,0.75)와 같다. 정렬된 값에서 결과는 <b>86</b>이다."},
  {s:"스프레드시트",q:"아래 시트에서 입력값에 주어진 표시 형식을 적용했을 때, [C2]의 결과로 옳은 것은?",o:["005", "25.0%", "홍길동님", "abcabc"],a:0,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">입력값</td><td class=\"hd\">표시 형식</td><td class=\"hd\">결과</td></tr><tr><td class=\"rh\">2</td><td>5</td><td class=\"l\">000</td><td>?</td></tr></table>",e:"빈 자리를 0으로 채움 → 005"},
  {s:"스프레드시트",q:"아래 [A1:D7] 표에서 부서가 '영업부'이면서 직급이 '부장'인 직원의 급여 합계를 배열 수식으로 구하려고 한다. 가장 적절한 수식은?",o:["=SUMIF(B2:B7,\"영업부\",D2:D7)", "{=SUM((B2:B7=\"영업부\")*(C2:C7=\"부장\")*D2:D7)}", "{=SUM((B2:B7=\"영업부\")*D2:D7)}", "{=SUM((B2:B7=\"영업부\")+(C2:C7=\"부장\")*D2:D7)}"],a:1,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">이름</td><td class=\"hd\">부서</td><td class=\"hd\">직급</td><td class=\"hd\">급여</td></tr><tr><td class=\"rh\">2</td><td>최서연</td><td class=\"l\">전산부</td><td>부장</td><td class=\"l\">3,000,000</td></tr><tr><td class=\"rh\">3</td><td>정하람</td><td class=\"l\">인사부</td><td>과장</td><td class=\"l\">3,300,000</td></tr><tr><td class=\"rh\">4</td><td>문가온</td><td class=\"l\">인사부</td><td>부장</td><td class=\"l\">4,900,000</td></tr><tr><td class=\"rh\">5</td><td>구본길</td><td class=\"l\">영업부</td><td>과장</td><td class=\"l\">2,400,000</td></tr><tr><td class=\"rh\">6</td><td>홍지안</td><td class=\"l\">전산부</td><td>대리</td><td class=\"l\">3,200,000</td></tr><tr><td class=\"rh\">7</td><td>한지우</td><td class=\"l\">영업부</td><td>과장</td><td class=\"l\">5,400,000</td></tr></table>",e:"두 조건을 모두 만족시키려면 각 조건식을 <b>곱(*)</b>으로 연결한다. <b>{=SUM((B2:B7=\"영업부\")*(C2:C7=\"부장\")*D2:D7)}</b> → 조건이 모두 참(1)인 행의 급여만 더해 <b>0</b>원. (+로 연결하면 OR가 되어 틀리고, Ctrl+Shift+Enter로 입력해 중괄호가 생긴다.)"},
  {s:"스프레드시트",q:"아래 [A1:D5] 표에서 '키보드'의 '3월' 값을 찾으려고 한다. 가장 적절한 수식은? (결과: 참고로 한 셀의 값)",o:["=VLOOKUP(\"키보드\",A2:A5,MATCH(\"3월\",B1:D1,0),0)", "=INDEX(B2:D5,MATCH(\"3월\",B1:D1,0),MATCH(\"키보드\",A2:A5,0))", "=INDEX(B2:D5,MATCH(\"키보드\",A2:A5,0),MATCH(\"3월\",B1:D1,0))", "=INDEX(B2:D5,MATCH(\"키보드\",A2:A5,0))"],a:2,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">품목</td><td class=\"hd\">2월</td><td class=\"hd\">3월</td><td class=\"hd\">1월</td></tr><tr><td class=\"rh\">2</td><td>모니터</td><td>64</td><td>78</td><td>63</td></tr><tr><td class=\"rh\">3</td><td>프린터</td><td>20</td><td>59</td><td>49</td></tr><tr><td class=\"rh\">4</td><td>마우스</td><td>33</td><td>54</td><td>32</td></tr><tr><td class=\"rh\">5</td><td>키보드</td><td>43</td><td>69</td><td>73</td></tr></table>",e:"<b>INDEX(데이터, 행번호, 열번호)</b> 형태에서 행·열 위치를 각각 <b>MATCH</b>로 찾는다. INDEX의 인수 순서는 (범위, 행, 열)이므로 행 MATCH가 먼저 와야 한다. '키보드'×'3월' 교차값은 <b>69</b>. VLOOKUP은 왼쪽 첫 열 기준이라 열 머리글 조회에 부적합하다."},
  {s:"스프레드시트",q:"아래 시트([A1:C3])에서 다음 수식의 결과로 옳은 것은?\n\n=OFFSET(A1,1,0)",o:["26", "17", "9", "15"],a:1,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td>16</td><td>15</td><td>4</td></tr><tr><td class=\"rh\">2</td><td>17</td><td>26</td><td>17</td></tr><tr><td class=\"rh\">3</td><td>26</td><td>9</td><td>27</td></tr></table>",e:"OFFSET(A1,1,0)은 A1에서 아래로 1칸·오른쪽으로 0칸 이동한 셀 → <b>17</b>"},
  {s:"데이터베이스",q:"다음 중 Access에서 두 테이블을 연결해 양쪽에 모두 일치하는 레코드만 가져오는 조인은?",o:["내부 조인(Inner Join)", "왼쪽 외부 조인", "오른쪽 외부 조인", "카티션 곱"],a:0,e:"내부 조인은 두 테이블에서 조인 필드 값이 '일치하는' 레코드만 가져온다. 외부 조인은 한쪽의 일치하지 않는 레코드까지 포함한다."},
  {s:"데이터베이스",q:"다음 중 액세스 쿼리의 종류에 대한 설명으로 옳지 않은 것은?",o:["매개 변수 쿼리는 실행할 때 조건 값을 입력받아 조회한다.", "요약(그룹) 쿼리는 그룹별 합계·평균·개수 등을 구한다.", "크로스탭 쿼리는 행·열로 요약해 교차 집계표를 만든다.", "선택 쿼리를 실행하면 원본 테이블의 데이터가 실제로 변경·삭제된다."],a:3,e:"원본을 바꾸는 것은 <b>실행 쿼리(추가·삭제·업데이트·테이블 만들기)</b>다. 선택 쿼리는 조회만 한다."},
  {s:"데이터베이스",q:"다음 중 Access 컨트롤의 '잠금(Locked)' 속성에 대한 설명으로 옳은 것은?",o:["'예'로 설정하면 컨트롤의 값을 볼 수는 있지만 편집할 수 없다.", "'예'로 설정하면 컨트롤이 화면에서 사라진다.", "'예'로 설정하면 컨트롤에 포커스를 둘 수 없다.", "'예'로 설정하면 컨트롤의 글꼴이 회색으로 바뀐다."],a:0,e:"'잠금'을 '예'로 하면 데이터를 '읽기 전용'으로 만들어, 값은 표시되지만 수정할 수 없다. 포커스는 받을 수 있다(이 점이 '사용 가능'과 다름)."},
  {s:"데이터베이스",q:"다음 중 테이블 '디자인 보기'에서 설정하는 필드 속성에 대한 설명으로 옳지 않은 것은?",o:["'형식'은 데이터가 화면·인쇄에 표시되는 모양을 지정한다.", "'입력 마스크'는 데이터 입력 형식을 제한한다.", "'유효성 검사 규칙'은 입력값이 만족해야 할 조건을 지정한다.", "'캡션'은 실제 저장되는 필드의 이름을 바꾼다."],a:3,e:"'캡션'은 폼·보고서·데이터시트에 표시되는 '이름(레이블)'만 바꿀 뿐, 실제 필드 이름이나 저장 데이터는 바뀌지 않는다."},
  {s:"데이터베이스",q:"다음 중 정규화에 대한 설명으로 옳지 않은 것은?",o:["정규화는 데이터 중복과 이상(Anomaly) 현상을 줄이기 위한 과정이다.", "정규화 단계가 높아질수록 테이블이 분해되어 중복이 줄어든다.", "정규화를 지나치게 하면 조인이 늘어 조회 성능이 떨어질 수 있다.", "정규화를 하면 테이블이 합쳐져 하나의 큰 테이블이 된다."],a:3,e:"정규화는 테이블을 <b>여러 개로 분해</b>하는 과정이다. 합치는 것은 반정규화다."},
  {s:"데이터베이스",q:"다음 중 크로스탭 쿼리에 대한 설명으로 옳지 않은 것은?",o:["행 머리글·열 머리글·값(집계)의 세 요소로 교차 집계표를 만든다.", "값 영역에는 합계·평균·개수 등 집계 함수를 지정한다.", "행 머리글은 여러 개 지정할 수 있으나 열 머리글과 값은 각각 하나만 지정한다.", "크로스탭 쿼리는 원본 데이터를 직접 수정·삭제하는 실행 쿼리의 한 종류다."],a:3,e:"크로스탭은 데이터를 <b>요약·조회하는 선택 쿼리</b>이지 원본을 바꾸는 실행 쿼리가 아니다."},
  {s:"데이터베이스",q:"다음 SQL 문에 대한 설명으로 옳지 않은 것은?\n\nSELECT DISTINCT 지역 FROM 거래처 WHERE 매출 > 1000 ORDER BY 지역 DESC;",o:["DISTINCT는 중복된 지역을 한 번만 표시한다.", "WHERE 절로 매출이 1000을 초과하는 거래처만 대상으로 한다.", "ORDER BY … DESC로 지역을 내림차순 정렬한다.", "매출이 1000 이상(1000 포함)인 모든 거래처를 조회한다."],a:3,e:"'> 1000'은 <b>1000 초과(1000 미포함)</b>다. 1000을 포함하려면 >=1000이어야 하므로 ④가 틀리다."},
  {s:"데이터베이스",q:"다음 중 콤보 상자(Combo Box)와 목록 상자(List Box)에 대한 설명으로 옳지 않은 것은?",o:["콤보 상자는 목록을 펼쳐 하나를 선택하거나 직접 입력할 수 있다.", "목록 상자는 항상 목록이 펼쳐진 상태로 표시된다.", "목록 상자는 직접 타이핑으로 새 값을 입력하는 것이 기본이다.", "두 컨트롤 모두 '행 원본'으로 값 목록·테이블·쿼리를 쓸 수 있다."],a:2,e:"목록 상자는 미리 제시된 목록에서 '선택'만 할 수 있고, 직접 타이핑으로 새 값을 입력하는 것은 콤보 상자의 특징이다."},
  {s:"데이터베이스",q:"아래 '회원' 테이블에서 다음 도메인 집계 함수의 결과로 옳은 것은?\n\n=DSum(\"실적\",\"회원\",\"지역='대구'\")",o:["50", "2", "90", "140"],a:3,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">이름</td><td class=\"hd\">지역</td><td class=\"hd\">등급</td><td class=\"hd\">실적</td></tr><tr><td class=\"rh\">2</td><td class=\"l\">이두리</td><td>대구</td><td>우수</td><td>90</td></tr><tr><td class=\"rh\">3</td><td class=\"l\">박세찬</td><td>서울</td><td>우수</td><td>50</td></tr><tr><td class=\"rh\">4</td><td class=\"l\">윤서준</td><td>광주</td><td>우수</td><td>40</td></tr><tr><td class=\"rh\">5</td><td class=\"l\">강다온</td><td>대구</td><td>우수</td><td>50</td></tr><tr><td class=\"rh\">6</td><td class=\"l\">윤서준</td><td>부산</td><td>VIP</td><td>50</td></tr><tr><td class=\"rh\">7</td><td class=\"l\">김하늘</td><td>인천</td><td>VIP</td><td>20</td></tr></table>",e:"DSum은(는) 세 번째 인수(조건)를 만족하는 레코드에 대해 조건에 맞는 실적의 합계을(를) 구한다. 지역='대구'인 레코드는 2건이고, 그 실적으로 계산하면 결과는 <b>140</b>이다."},
  {s:"데이터베이스",q:"아래 '회원' 테이블에서 다음 SQL을 실행했을 때 '삭제되는 레코드 수'로 옳은 것은?\n\nDELETE FROM 회원 WHERE 실적<50;",o:["5", "6", "7", "2"],a:1,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">이름</td><td class=\"hd\">지역</td><td class=\"hd\">등급</td><td class=\"hd\">실적</td></tr><tr><td class=\"rh\">2</td><td class=\"l\">김하늘</td><td>대구</td><td>일반</td><td>30</td></tr><tr><td class=\"rh\">3</td><td class=\"l\">최나래</td><td>대구</td><td>VIP</td><td>10</td></tr><tr><td class=\"rh\">4</td><td class=\"l\">한소라</td><td>대구</td><td>일반</td><td>10</td></tr><tr><td class=\"rh\">5</td><td class=\"l\">YOUNGPAJOK</td><td>서울</td><td>VIP</td><td>10</td></tr><tr><td class=\"rh\">6</td><td class=\"l\">최나래</td><td>서울</td><td>VIP</td><td>90</td></tr><tr><td class=\"rh\">7</td><td class=\"l\">강다온</td><td>대구</td><td>일반</td><td>80</td></tr><tr><td class=\"rh\">8</td><td class=\"l\">강다온</td><td>대전</td><td>우수</td><td>10</td></tr><tr><td class=\"rh\">9</td><td class=\"l\">한소라</td><td>대구</td><td>우수</td><td>40</td></tr></table>",e:"실적<50 조건에 맞는 레코드가 삭제된다 → <b>6건</b>. (DELETE는 행만 삭제하고 테이블 구조는 남는다.)"},

  {s:"데이터베이스",q:"아래 '회원' 테이블에서 다음 SQL(Access 기준)의 '검색 결과 레코드 수'로 옳은 것은?\n\nSELECT * FROM 회원 WHERE 이름 LIKE '오*';",o:["2", "1", "0", "7"],a:1,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">이름</td><td class=\"hd\">지역</td><td class=\"hd\">등급</td><td class=\"hd\">실적</td></tr><tr><td class=\"rh\">2</td><td class=\"l\">이두리</td><td>서울</td><td>우수</td><td>30</td></tr><tr><td class=\"rh\">3</td><td class=\"l\">최나래</td><td>광주</td><td>우수</td><td>70</td></tr><tr><td class=\"rh\">4</td><td class=\"l\">김하늘</td><td>광주</td><td>VIP</td><td>10</td></tr><tr><td class=\"rh\">5</td><td class=\"l\">오지민</td><td>부산</td><td>VIP</td><td>70</td></tr><tr><td class=\"rh\">6</td><td class=\"l\">윤서준</td><td>광주</td><td>VIP</td><td>90</td></tr><tr><td class=\"rh\">7</td><td class=\"l\">박세찬</td><td>대구</td><td>우수</td><td>80</td></tr><tr><td class=\"rh\">8</td><td class=\"l\">이두리</td><td>광주</td><td>우수</td><td>60</td></tr></table>",e:"Access에서 * 는 임의 문자열 와일드카드이므로 이름이 '오'로 시작하는 레코드를 찾는다 → <b>1건</b>. (표준 SQL은 % 사용)"}
 ]},
{ name:'기출 2회', q:[
  {s:"컴퓨터일반",q:"다음 중 사물인터넷(IoT)·엣지 컴퓨팅에 대한 설명으로 옳지 않은 것은?",o:["IoT는 센서·통신 기능을 가진 사물을 인터넷으로 연결한다.", "엣지 컴퓨팅은 데이터를 발생 지점 가까이에서 처리해 지연을 줄인다.", "엣지 컴퓨팅은 모든 데이터를 반드시 중앙 클라우드로 보내 처리한 뒤 결과만 돌려준다.", "저전력·근거리 통신을 위해 블루투스·Zigbee 등이 활용된다."],a:2,e:"엣지 컴퓨팅은 중앙 클라우드로 모두 보내지 않고 '단말 근처(엣지)'에서 즉시 처리해 지연·대역폭 부담을 줄인다. 모두 중앙으로 보낸다는 설명은 틀리다."},
  {s:"컴퓨터일반",q:"PC에 수동(고정)으로 IP 주소를 설정할 때 '직접 입력할 필요가 없는' 항목은?",o:["서브넷 마스크", "기본 게이트웨이", "DNS 서버 주소", "DHCP 서버 주소"],a:3,e:"DHCP(Dynamic Host Configuration Protocol)는 IP 주소를 '자동'으로 할당해 주는 서버이다. 수동(고정) IP 설정 시에는 IP 주소·서브넷 마스크·기본 게이트웨이·DNS 서버 주소를 직접 입력하며, DHCP 서버 주소는 입력하지 않는다. (DHCP를 사용하면 이 값들을 자동으로 받아온다.)"},
  {s:"컴퓨터일반",q:"다음 중 생성형 AI 사용 시 유의할 점으로 옳지 않은 것은?",o:["생성물에 저작권·개인정보 문제가 있을 수 있으므로 주의한다.", "학습 데이터의 편향이 결과에 반영될 수 있다.", "잘못된 정보를 사실처럼 제시하는 환각(할루시네이션)에 유의한다.", "AI가 생성한 결과물은 검증 없이 그대로 보고서·논문에 인용해도 된다."],a:3,e:"AI 생성물은 <b>반드시 사실 확인·출처 검증</b> 후 활용해야 한다."},
  {s:"컴퓨터일반",q:"다음 중 블록체인(Blockchain)에 대한 설명으로 옳지 않은 것은?",o:["거래 기록을 블록에 담아 체인으로 연결한 분산 원장 기술이다.", "각 블록은 이전 블록의 해시값을 포함해 위·변조가 어렵다.", "중앙 관리 기관 없이 참여자들이 동일한 원장을 나눠 갖는다.", "한 블록의 내용을 바꿔도 다른 블록에 전혀 영향을 주지 않아 수정이 쉽다."],a:3,e:"블록은 이전 블록의 해시로 연결되어, 한 블록을 바꾸면 이후 모든 블록의 해시가 달라져 전체를 다시 계산해야 하므로 위·변조가 매우 어렵다."},
  {s:"컴퓨터일반",q:"다음 중 Windows의 '작업 표시줄'에 대한 설명으로 옳지 않은 것은?",o:["자주 쓰는 프로그램을 고정할 수 있다.", "위치를 화면 상·하·좌·우로 옮길 수 있다.", "자동 숨김을 설정할 수 있다.", "작업 표시줄에는 최대 5개의 아이콘만 고정할 수 있다."],a:3,e:"작업 표시줄에 고정할 수 있는 아이콘 수에 5개 같은 제한은 없다. 고정·위치 이동·자동 숨김은 모두 가능하다."},
  {s:"컴퓨터일반",q:"다음 중 프로세스 동기화 도구에 대한 설명으로 옳지 않은 것은?",o:["임계 구역은 공유 자원에 한 번에 하나의 프로세스만 들어갈 수 있는 영역이다.", "세마포어는 정수 변수와 P(wait)·V(signal) 연산으로 동기화를 구현한다.", "뮤텍스는 잠금을 소유한 프로세스만 해제할 수 있는 상호 배제 도구이다.", "교착 상태는 임계 구역을 사용하지 않을 때만 발생한다."],a:3,e:"교착 상태는 여러 프로세스가 서로의 자원을 점유·대기할 때 발생하며, 임계 구역·자원 경쟁과 밀접하다. 임계 구역을 안 쓸 때만 생긴다는 설명은 틀리다."},
  {s:"컴퓨터일반",q:"다음 중 멀티미디어 데이터 압축에 대한 설명으로 옳지 않은 것은?",o:["JPEG은 손실 압축으로 정지 영상에 적합하다.", "MPEG은 프레임 간 중복을 제거하는 손실 압축으로 동영상에 쓰인다.", "무손실 압축은 원본을 완전히 복원할 수 있다.", "손실 압축은 압축률이 낮고 무손실 압축보다 항상 파일 크기가 크다."],a:3,e:"손실 압축은 일부 정보를 버려 '압축률이 높고' 파일이 더 작아진다. 무손실보다 크다는 설명은 반대이다."},
  {s:"컴퓨터일반",q:"다음 중 Windows 11의 '집중 지원/방해 금지(Do not disturb)'와 알림에 대한 설명으로 옳지 않은 것은?",o:["방해 금지를 켜면 알림이 알림 센터에만 쌓이고 배너로 튀어나오지 않는다.", "빠른 설정은 <b>Win+A</b>로 열어 Wi-Fi·블루투스·볼륨 등을 조절한다.", "알림 센터와 달력은 작업 표시줄의 날짜·시간을 클릭하거나 <b>Win+N</b>으로 연다.", "방해 금지를 켜면 받은 알림이 모두 삭제되어 나중에 확인할 수 없다."],a:3,e:"방해 금지 중에도 알림은 삭제되지 않고 알림 센터(Win+N)에 모였다가 나중에 확인할 수 있다. 빠른 설정은 Win+A로 연다."},
  {s:"컴퓨터일반",q:"다음 중 시스템 소프트웨어와 언어 번역 과정에 대한 설명으로 옳지 않은 것은?",o:["컴파일러는 원시 프로그램 전체를 한 번에 번역해 목적 프로그램을 생성하므로, 번역 후 실행 속도가 빠르지만 전체를 다시 번역하면 시간이 오래 걸린다.", "인터프리터는 원시 프로그램을 한 행씩 해석·실행하여 목적 프로그램을 생성하지 않으므로, 디버깅은 쉽지만 반복 실행 시 속도가 느리다.", "링커(링케지 에디터)는 목적 프로그램과 라이브러리를 결합해 실행 가능한 로드 모듈을 만들고, 로더는 이를 주기억장치에 적재한다.", "어셈블러는 고급 언어를 기계어로 번역하는 프로그램으로, 번역 결과가 인터프리터보다 느리게 실행된다."],a:3,e:"어셈블러는 <b>어셈블리어(저급 언어)를 기계어로</b> 번역하며, 번역 결과(기계어)는 빠르게 실행된다."},
  {s:"컴퓨터일반",q:"다음 중 언어 번역 과정에 대한 설명으로 옳지 않은 것은?",o:["어휘 분석은 원시 코드를 토큰 단위로 분리한다.", "구문 분석은 토큰이 문법에 맞는지 검사해 파스 트리를 만든다.", "링커(Linker)는 목적 코드와 라이브러리를 결합해 실행 파일을 만든다.", "로더(Loader)는 원시 코드를 기계어로 번역하는 프로그램이다."],a:3,e:"로더는 실행 파일을 '주기억장치에 적재'하는 프로그램이다. 원시 코드를 기계어로 번역하는 것은 컴파일러/어셈블러이다."},
  {s:"컴퓨터일반",q:"다음 중 그래픽 데이터 표현에 대한 설명으로 옳지 않은 것은?",o:["비트맵은 픽셀의 집합으로 확대 시 계단 현상이 나타난다.", "벡터는 수학적 함수로 표현해 확대·축소에도 품질이 유지된다.", "해상도가 높고 색 깊이가 클수록 이미지 용량이 커진다.", "벡터 방식은 사진처럼 복잡하고 자연스러운 색감 표현에 비트맵보다 유리하다."],a:3,e:"사진처럼 복잡·사실적인 이미지는 픽셀 기반의 '비트맵'이 유리하다. 벡터는 도형·로고·글꼴 등 선명한 외곽선 표현에 적합하다."},
  {s:"컴퓨터일반",q:"다음 중 멀티미디어 관련 용어에 대한 설명으로 옳지 않은 것은?",o:["코덱(Codec)은 데이터를 부호화(압축)하고 복호화(복원)하는 기술이다.", "스트리밍은 전체 파일을 모두 내려받은 뒤에만 재생할 수 있는 방식이다.", "샘플링은 아날로그 신호를 일정 간격으로 표본화해 디지털로 바꾸는 과정이다.", "RGB는 빛의 삼원색을 이용한 색 표현 방식으로 모니터 등에 쓰인다."],a:1,e:"스트리밍은 데이터를 '내려받으면서 동시에 재생'하는 방식이다. 전부 받은 뒤 재생하는 것은 다운로드 방식이다."},
  {s:"컴퓨터일반",q:"다음 중 컴퓨터 구성 요소에 대한 설명으로 옳지 않은 것은?",o:["메인보드의 칩셋은 CPU·메모리·주변장치 간 데이터 흐름을 제어한다.", "GPU는 그래픽 연산에 특화된 병렬 처리 장치이다.", "파워 서플라이는 교류를 직류로 바꿔 부품에 전원을 공급한다.", "클록 주파수가 같으면 CPU의 코어 수가 많아도 전체 처리 능력은 전혀 차이가 없다."],a:3,e:"클록이 같아도 코어 수가 많으면 여러 작업을 병렬 처리해 전체 처리 능력이 커진다. 차이가 없다는 설명은 틀리다."},
  {s:"컴퓨터일반",q:"다음 중 생성형 AI를 학습에 활용할 때 바람직한 태도로 옳은 것은?",o:["답변을 그대로 복사해 과제로 제출한다.", "결과의 사실 여부와 출처를 스스로 확인한 뒤 참고한다.", "개인정보·회사 기밀을 자유롭게 입력한다.", "저작권이 있는 자료를 출처 없이 가져다 쓴다."],a:1,e:"생성형 AI 결과는 <b>사실·출처를 확인한 뒤 참고</b>해야 하며, 개인정보·저작권에 유의한다."},
  {s:"컴퓨터일반",q:"다음 중 Windows 11에서 여러 항목을 선택하는 방법에 대한 설명으로 옳은 것은?",o:["연속된 여러 파일은 첫 파일을 클릭한 뒤 <b>Ctrl</b>을 누른 채 마지막 파일을 클릭한다.", "떨어져 있는 여러 파일은 <b>Shift</b>를 누른 채 각각 클릭한다.", "현재 폴더의 모든 항목은 <b>Ctrl+A</b>로 한 번에 선택한다.", "선택을 해제하려면 반드시 Esc 키만 사용해야 한다."],a:2,e:"연속 선택은 Shift, 비연속(개별) 선택은 Ctrl, 전체 선택은 Ctrl+A이다. 보기 ①②는 Shift와 Ctrl이 서로 바뀌었다. 빈 공간 클릭으로도 선택을 해제할 수 있다."},
  {s:"컴퓨터일반",q:"다음 중 보조기억장치와 저장 기술에 대한 설명으로 옳지 않은 것은?",o:["SSD는 플래시 메모리를 사용해 기계적 구동부가 없으므로 HDD보다 소음·발열·충격에 강하고 속도가 빠르다.", "RAID는 여러 디스크를 묶어 성능을 높이거나 데이터를 이중화하는 기술로, RAID 0은 분산 저장으로 속도를 높이지만 복구 기능은 없다.", "광학 디스크는 레이저 파장이 짧을수록 더 많은 데이터를 기록할 수 있어, Blu-ray가 DVD보다 용량이 크다.", "자기 테이프는 임의 접근(Random Access) 방식이라 특정 데이터에 즉시 접근할 수 있어 백업보다 실시간 처리에 적합하다."],a:3,e:"자기 테이프는 <b>순차 접근(Sequential)</b> 방식이라 즉시 접근이 어려워 <b>대용량 백업</b>에 주로 쓰인다."},
  {s:"컴퓨터일반",q:"다음 중 인공지능·머신러닝·딥러닝의 관계에 대한 설명으로 옳지 않은 것은?",o:["인공지능은 가장 넓은 개념이고, 그 안에 머신러닝, 다시 그 안에 딥러닝이 포함된다.", "머신러닝은 데이터로부터 규칙(패턴)을 스스로 학습하는 방법이다.", "딥러닝은 인공 신경망을 여러 층으로 깊게 쌓아 특징을 자동으로 학습한다.", "딥러닝은 사람이 모든 특징(feature)을 일일이 지정해 주어야만 학습할 수 있다."],a:3,e:"딥러닝은 <b>특징을 스스로 추출·학습</b>하는 것이 핵심 장점이다. 사람이 특징을 일일이 지정하는 것은 전통적 머신러닝이다."},
  {s:"컴퓨터일반",q:"다음 중 가로 800픽셀 × 세로 600픽셀, 한 픽셀을 8비트로 표현하는 비압축 비트맵 이미지의 용량으로 옳은 것은? (1KB=1,024Byte)",o:["938KB", "3,750KB", "156KB", "469KB"],a:3,e:"비트맵 용량 = 가로×세로×색 깊이(비트)÷8 = 800×600×8÷8 = <b>480,000 Byte</b> ≒ 469KB."},
  {s:"컴퓨터일반",q:"다음 중 샘플링 44kHz, 양자화 8비트, 모노(1채널)로 30초간 녹음한 비압축 디지털 오디오의 용량으로 가장 가까운 것은?",o:["약 10.1MB", "약 2.5MB", "약 1.3MB", "약 0.6MB"],a:2,e:"오디오 용량 = 샘플링 주파수 × (양자화 비트÷8) × 채널 수 × 시간 = 44,000 × 1 × 1 × 30 = <b>1,320,000 Byte</b> ≒ 약 1.3MB."},
  {s:"컴퓨터일반",q:"다음 중 가로 800픽셀 × 세로 480픽셀, 한 픽셀을 8비트로 표현하는 비압축 비트맵 이미지의 용량으로 옳은 것은? (1KB=1,024Byte)",o:["375KB", "125KB", "3,000KB", "750KB"],a:0,e:"비트맵 용량 = 가로×세로×색 깊이(비트)÷8 = 800×480×8÷8 = <b>384,000 Byte</b> ≒ 375KB."},
  {s:"스프레드시트",q:"다음 VBA 프로시저를 실행한 후 메시지 박스에 출력되는 값으로 옳은 것은?",o:["43", "42", "44", "41"],a:1,fig:"<pre class=\"code\">Sub Test()\n  Dim i As Integer, S As Integer\n  S = 0\n  For i = 1 To 13\n    If i Mod 2 = 0 Then S = S + i\n  Next i\n  MsgBox S\nEnd Sub</pre>",e:"1~13 중 짝수(i Mod 2 = 0)만 더한다 → 2+4+6+8+10+12 = <b>42</b>"},
  {s:"스프레드시트",q:"다음 중 그림과 같은 [매크로 기록]에 대한 설명으로 옳지 않은 것은?",o:["매크로 이름의 첫 글자는 문자여야 하며 공백은 쓸 수 없다.", "바로 가기 키로 Ctrl+소문자 또는 Ctrl+Shift+대문자를 지정할 수 있다.", "매크로 저장 위치로 '개인용 매크로 통합 문서'를 선택할 수 있다.", "바로 가기 키는 반드시 지정해야 하며 비워 둘 수 없다."],a:3,fig:"<div class=\"dlg\"><div class=\"tb\"><span>매크로 기록</span><span class=\"x\">? ✕</span></div><div class=\"bd\"><div class=\"row\"><span>매크로 이름:</span><span class=\"inp\">매크로1</span></div><div class=\"row\"><span>바로 가기 키: Ctrl+</span><span class=\"inp\"></span></div><div class=\"row\"><span>매크로 저장 위치:</span><span class=\"sel\">현재 통합 문서</span></div><div class=\"btns\"><span class=\"btn pri\">확인</span><span class=\"btn\">취소</span></div></div></div>",e:"바로 가기 키는 <b>선택 사항</b>으로 비워 둘 수 있다."},
  {s:"스프레드시트",q:"[B2]에 숫자 1, [B4]에 텍스트 \"엑셀\"이 입력되어 있을 때, 다음 수식의 결과 설명으로 옳지 않은 것은?",o:["=TYPE(B2) → 1 (숫자이므로)", "=TYPE(B4) → 2 (텍스트이므로)", "=N(B2) → 1 (숫자는 그대로)", "=N(B4) → 1"],a:3,e:"N() 함수는 <b>텍스트에 대해 0</b>을 반환하므로 =N(B4)는 0이다. TYPE()은 숫자 1·텍스트 2·논리값 4·오류값 16·배열 64를 반환한다."},
  {s:"스프레드시트",q:"다음 중 [페이지 설정]-[시트] 탭에서 설정할 수 '없는' 것은?",o:["인쇄 영역 지정", "반복할 행/열(인쇄 제목)", "눈금선 인쇄 여부", "용지 방향(세로/가로)"],a:3,e:"용지 방향은 [페이지] 탭에서 설정한다. [시트] 탭에는 인쇄 영역, 인쇄 제목(반복할 행/열), 눈금선, 흑백, 간단하게(초안) 인쇄, 행/열 머리글, 메모, 셀 오류 표시, 페이지 순서가 있다."},
  {s:"스프레드시트",q:"다음 중 [페이지 설정]-[여백] 탭에 대한 설명으로 옳지 않은 것은?",o:["위쪽·아래쪽·왼쪽·오른쪽 여백을 지정할 수 있다.", "머리글과 바닥글의 여백을 별도로 지정할 수 있다.", "'페이지 가운데 맞춤'에서 가로·세로를 각각 선택할 수 있다.", "용지 방향과 인쇄 배율을 함께 지정할 수 있다."],a:3,e:"용지 방향과 인쇄 배율은 [페이지] 탭에서 설정한다. [여백] 탭에는 상하좌우 여백, 머리글/바닥글 여백, 페이지 가운데 맞춤(가로/세로)이 있다."},
  {s:"스프레드시트",q:"다음 중 워크시트 탭(시트 탭)에 대한 작업으로 옳지 않은 것은?",o:["탭을 더블클릭하면 시트 이름을 바꿀 수 있다.", "탭을 드래그하면 시트 순서를 옮길 수 있다.", "Ctrl을 누른 채 탭을 드래그하면 시트가 복사된다.", "시트 탭에는 색을 지정할 수 없다."],a:3,e:"시트 탭은 바로 가기 메뉴의 '탭 색'으로 색을 지정할 수 있다. 이름 바꾸기(더블클릭), 이동(드래그), 복사(Ctrl+드래그)는 모두 가능하다."},
  {s:"스프레드시트",q:"다음 중 그림과 같은 [통합] 도구에 대한 설명으로 옳지 않은 것은?",o:["'모든 참조 영역'에 다른 통합 문서의 워크시트도 추가할 수 있다.", "요약 함수로 합계·개수·평균·최대·최소·곱·표준편차 등을 쓸 수 있다.", "'원본 데이터에 연결'을 체크하지 않아도 원본이 바뀌면 결과가 항상 자동 갱신된다.", "'사용할 레이블'의 첫 행·왼쪽 열을 선택하면 레이블 위치가 달라도 같은 항목끼리 통합된다."],a:2,fig:"<div class=\"dlg\"><div class=\"tb\"><span>통합</span><span class=\"x\">? ✕</span></div><div class=\"bd\"><div class=\"row\"><span>함수(F):</span><span class=\"sel\">합계</span></div><div class=\"row\"><span>참조(R):</span><span class=\"inp\"></span></div><div class=\"row\" style=\"align-items:flex-start\"><span>모든 참조 영역:</span><div class=\"area\" style=\"flex:1\"></div></div><div style=\"font-size:.72rem;color:#333;font-weight:700\">사용할 레이블</div><div class=\"ck\"><i class=\"on\"></i> 첫 행(T)</div><div class=\"ck\"><i class=\"on\"></i> 왼쪽 열(L)</div><div class=\"ck\"><i class=\"\"></i> 원본 데이터에 연결(S)</div><div class=\"btns\"><span class=\"btn pri\">확인</span><span class=\"btn\">닫기</span></div></div></div>",e:"'원본 데이터에 연결'을 <b>체크해야</b> 원본 변경이 자동 반영된다."},
  {s:"스프레드시트",q:"아래 시트에서 부서가 '영업부'인 직원의 급여 합계를 [F2] 셀에 구하려고 한다. 입력할 수식으로 옳은 것은?",o:["=SUMIF(B2:B4,\"영업부\",D2:D4)", "=SUMIF(D2:D4,\"영업부\",B2:B4)", "=DSUM(B2:B4,\"영업부\",D2:D4)", "=COUNTIF(B2:B4,\"영업부\")"],a:0,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">이름</td><td class=\"hd\">부서</td><td class=\"hd\">직급</td><td class=\"hd\">급여</td></tr><tr><td class=\"rh\">2</td><td>김하나</td><td class=\"l\">영업부</td><td>대리</td><td>3,200,000</td></tr><tr><td class=\"rh\">3</td><td>이두리</td><td class=\"l\">총무부</td><td>과장</td><td>3,800,000</td></tr><tr><td class=\"rh\">4</td><td>박세찬</td><td class=\"l\">영업부</td><td>사원</td><td>2,700,000</td></tr></table>",e:"SUMIF(<b>조건범위, 조건, 합계범위</b>) → 부서(B)에서 '영업부'를 찾아 급여(D)를 더한다."},
  {s:"스프레드시트",q:"다음 중 문자 위치를 찾는 함수식의 결과로 옳은 것은? (FIND는 대/소문자 구분·와일드카드 불가, SEARCH는 구분 안 함·와일드카드 가능)\n\n=FIND(\"\",\"YoungPaJok CBT\")",o:["0", "14", "1", "#VALUE!"],a:2,e:"찾을 문자열이 <b>빈 문자열(\"\")</b>이면 FIND·SEARCH 모두 시작 위치인 <b>1</b>을 반환한다. 예: =FIND(\"\",\"YoungPaJok CBT\") → 1."},
  {s:"스프레드시트",q:"셀 [A1:A5]에 다음 값이 입력되어 있다: 17, 22, 42, 55, 85\n다음 수식(제1사분위수)의 결과로 옳은 것은?\n\n=QUARTILE.INC(A1:A5, 1)",o:["42", "22", "21", "23"],a:1,e:"QUARTILE.INC(범위, 1)는 제1사분위수(하위 25% 지점)를 구하며 PERCENTILE.INC(범위,0.25)와 같다. 정렬된 값에서 결과는 <b>22</b>이다."},
  {s:"스프레드시트",q:"아래 [A1:C6] 표에서 부서가 '총무부'인 직원 중 실적의 최소값을 배열 수식으로 구하려고 한다. 가장 적절한 수식은?",o:["=MINIF(B2:B6,\"총무부\",C2:C6)", "{=MIN(IF(B2:B6=\"총무부\",C2:C6,0))}", "{=MIN((B2:B6=\"총무부\")*C2:C6)}", "{=MIN(IF(B2:B6=\"총무부\",C2:C6))}"],a:3,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">이름</td><td class=\"hd\">부서</td><td class=\"hd\">실적</td></tr><tr><td class=\"rh\">2</td><td>서다은</td><td class=\"l\">인사부</td><td>58</td></tr><tr><td class=\"rh\">3</td><td>한지우</td><td class=\"l\">인사부</td><td>77</td></tr><tr><td class=\"rh\">4</td><td>문가온</td><td class=\"l\">총무부</td><td>84</td></tr><tr><td class=\"rh\">5</td><td>오시후</td><td class=\"l\">생산부</td><td>76</td></tr><tr><td class=\"rh\">6</td><td>홍지안</td><td class=\"l\">생산부</td><td>86</td></tr></table>",e:"<b>{=MIN(IF(B2:B6=\"총무부\",C2:C6))}</b> → 조건이 참인 행의 실적만 모아 최소값을 구한다. 결과는 <b>84</b>. IF의 거짓값을 0으로 두면 MIN에서 0이 섞여 틀리고, (B2:B6=\"총무부\")*C2:C6 방식도 MIN에서 0 때문에 틀린다. (Ctrl+Shift+Enter 배열 입력)"},
  {s:"스프레드시트",q:"아래 표의 점수 [A2:A8]를 구간([B2:B6]) 기준으로 도수분포를 구하기 위해 [C2:C6]에 FREQUENCY 배열 수식을 입력했다. '80~89' 구간의 도수로 옳은 것은?",o:["0", "3", "2", "1"],a:3,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">점수</td><td class=\"hd\">구간</td><td class=\"hd\">도수</td></tr><tr><td class=\"rh\">2</td><td>43</td><td class=\"l\">60 미만</td><td>?</td></tr><tr><td class=\"rh\">3</td><td>45</td><td class=\"l\">60~69</td><td>?</td></tr><tr><td class=\"rh\">4</td><td>51</td><td class=\"l\">70~79</td><td>?</td></tr><tr><td class=\"rh\">5</td><td>53</td><td class=\"l\">80~89</td><td>?</td></tr><tr><td class=\"rh\">6</td><td>57</td><td class=\"l\">90 이상</td><td>?</td></tr><tr><td class=\"rh\">7</td><td>76</td><td class=\"l\"></td><td></td></tr><tr><td class=\"rh\">8</td><td>86</td><td class=\"l\"></td><td></td></tr></table>",e:"FREQUENCY(데이터배열, 구간배열)은 각 구간의 상한 이하 개수를 센다. '80~89' 구간에 속한 점수는 <b>1</b>개. (결과 범위 전체를 선택하고 Ctrl+Shift+Enter로 한 번에 입력한다.)"},
  {s:"스프레드시트",q:"다음 중 SUBSTITUTE 함수를 사용한 수식의 실행 결과로 옳은 것은?\n\n=SUBSTITUTE(\"46-56-60-11\",\"-\",\":\",2)",o:["46-56:60-11", "46-56-60:11", "46:56:60:11", "46:56:60-11"],a:0,e:"네 번째 인수 2은(는) 2번째 '-'만 ':'로 바꾼다 → <b>46-56:60-11</b>. (인수를 생략하면 모든 '-'를 바꾼다.)"},
  {s:"스프레드시트",q:"아래 [A1:D5] 표에서 '키보드'의 '4월' 값을 찾으려고 한다. 가장 적절한 수식은? (결과: 참고로 한 셀의 값)",o:["=INDEX(B2:D5,MATCH(\"4월\",B1:D1,0),MATCH(\"키보드\",A2:A5,0))", "=INDEX(B2:D5,MATCH(\"키보드\",A2:A5,0))", "=INDEX(B2:D5,MATCH(\"키보드\",A2:A5,0),MATCH(\"4월\",B1:D1,0))", "=VLOOKUP(\"키보드\",A2:A5,MATCH(\"4월\",B1:D1,0),0)"],a:2,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">품목</td><td class=\"hd\">1월</td><td class=\"hd\">4월</td><td class=\"hd\">3월</td></tr><tr><td class=\"rh\">2</td><td>키보드</td><td>99</td><td>95</td><td>81</td></tr><tr><td class=\"rh\">3</td><td>마우스</td><td>51</td><td>42</td><td>97</td></tr><tr><td class=\"rh\">4</td><td>모니터</td><td>20</td><td>69</td><td>69</td></tr><tr><td class=\"rh\">5</td><td>노트북</td><td>54</td><td>79</td><td>77</td></tr></table>",e:"<b>INDEX(데이터, 행번호, 열번호)</b> 형태에서 행·열 위치를 각각 <b>MATCH</b>로 찾는다. INDEX의 인수 순서는 (범위, 행, 열)이므로 행 MATCH가 먼저 와야 한다. '키보드'×'4월' 교차값은 <b>95</b>. VLOOKUP은 왼쪽 첫 열 기준이라 열 머리글 조회에 부적합하다."},
  {s:"스프레드시트",q:"아래 시트([A1:C3])에서 다음 수식의 결과로 옳은 것은?\n\n=OFFSET(A1,2,2)",o:["17", "3", "26", "4"],a:2,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td>2</td><td>3</td><td>17</td></tr><tr><td class=\"rh\">2</td><td>30</td><td>15</td><td>19</td></tr><tr><td class=\"rh\">3</td><td>4</td><td>13</td><td>26</td></tr></table>",e:"OFFSET(A1,2,2)은 A1에서 아래로 2칸·오른쪽으로 2칸 이동한 셀 → <b>26</b>"},
  {s:"스프레드시트",q:"주민등록번호가 \"850928-3******\" 형태일 때, 다음 수식의 결과로 옳은 것은?\n\n=LEFT(\"850928-3******\",2)&\"년생 \"&IF(OR(MID(\"850928-3******\",8,1)=\"1\",MID(\"850928-3******\",8,1)=\"3\"),\"남\",\"여\")",o:["85년생 여", "85 남", "1985년생 남", "85년생 남"],a:3,e:"LEFT(…,2)로 출생연도 두 자리, MID(…,8,1)로 성별 부호를 꺼내 1·3이면 '남', 2·4이면 '여'로 판정해 연결한다 → <b>85년생 남</b>."},
  {s:"스프레드시트",q:"다음 중 수식의 결과가 옳지 않은 것은?",o:["=ISERROR(#N/A) → TRUE", "=ISNUMBER(2025) → TRUE", "=ISEVEN(6) → FALSE", "=ISNUMBER(\"2025\") → FALSE"],a:2,e:"=ISEVEN(6)의 올바른 결과는 <b>TRUE</b>이다. (ISERR는 #N/A 제외, ISBLANK는 빈 문자열에 FALSE)"},
  {s:"스프레드시트",q:"셀 값이 1,000 이상이면 '빨강', 1,000 미만 500 이상이면 '녹색', 500 미만이면 색을 지정하지 않고, 모든 구간에서 천 단위 구분 기호(,)와 소수 이하 첫째 자리까지 표시하려고 한다. 사용자 지정 표시 형식으로 옳은 것은? (예: 1234.56 → 1,234.6, 432 → 432.0)",o:["[>=1000]<빨강>#,##0.0;[>=500]<녹색>#,##0.0;#,##0.0", "[빨강][>=1000]#,##0.0;[녹색][>=500]#,##0.0;#,##0.0", "[빨강][>=1000]#,##0.0;[녹색][>=500]#,##0.0", "[빨강][>=1000]#,###.#;[녹색][>=500]#,###.#;#,###.#"],a:1,e:"사용자 지정 형식은 <b>[조건·색]양수서식;[조건·색]서식;나머지서식</b> 구조로, 색과 조건은 대괄호 [빨강][>=1000] 안에 넣는다. 소수 첫째 자리는 0을 써서 <b>#,##0.0</b>으로 해야 432가 432.0으로 나온다(#,###.#은 432를 432.로 만들어 틀림). 꺾쇠<>로 색을 넣는 문법은 없다. 정답: <b>[빨강][>=1000]#,##0.0;[녹색][>=500]#,##0.0;#,##0.0</b>"},
  {s:"스프레드시트",q:"아래 표의 점수 [A2:A10]를 구간([B2:B6]) 기준으로 도수분포를 구하기 위해 [C2:C6]에 FREQUENCY 배열 수식을 입력했다. '90 이상' 구간의 도수로 옳은 것은?",o:["3", "2", "4", "5"],a:2,fig:"<table class=\"xg\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><td class=\"rh\">1</td><td class=\"hd\">점수</td><td class=\"hd\">구간</td><td class=\"hd\">도수</td></tr><tr><td class=\"rh\">2</td><td>33</td><td class=\"l\">60 미만</td><td>?</td></tr><tr><td class=\"rh\">3</td><td>55</td><td class=\"l\">60~69</td><td>?</td></tr><tr><td class=\"rh\">4</td><td>58</td><td class=\"l\">70~79</td><td>?</td></tr><tr><td class=\"rh\">5</td><td>77</td><td class=\"l\">80~89</td><td>?</td></tr><tr><td class=\"rh\">6</td><td>79</td><td class=\"l\">90 이상</td><td>?</td></tr><tr><td class=\"rh\">7</td><td>91</td><td class=\"l\"></td><td></td></tr><tr><td class=\"rh\">8</td><td>92</td><td class=\"l\"></td><td></td></tr><tr><td class=\"rh\">9</td><td>94</td><td class=\"l\"></td><td></td></tr><tr><td class=\"rh\">10</td><td>96</td><td class=\"l\"></td><td></td></tr></table>",e:"FREQUENCY(데이터배열, 구간배열)은 각 구간의 상한 이하 개수를 센다. '90 이상' 구간에 속한 점수는 <b>4</b>개. (결과 범위 전체를 선택하고 Ctrl+Shift+Enter로 한 번에 입력한다.)"},
  {s:"스프레드시트",q:"다음 중 SUBSTITUTE 함수를 사용한 수식의 실행 결과로 옳은 것은?\n\n=SUBSTITUTE(\"76-50-44-65\",\"-\",\".\")",o:["76.50.44-65", "76.50.44.65", "76.50-44-65", "76-50-44-65"],a:1,e:"SUBSTITUTE(문자열, 찾을값, 바꿀값)에서 네 번째 인수를 생략하면 '-'를 <b>모두</b> '.'로 바꾼다 → <b>76.50.44.65</b>."},
  {s:"데이터베이스",q:"다음 중 보고서의 구역(Section)에 대한 설명으로 옳지 않은 것은?",o:["보고서 머리글은 보고서 전체에서 맨 처음 한 번만 출력된다.", "페이지 머리글은 매 페이지 상단에 반복 출력된다.", "그룹 바닥글에서 그룹별 합계 등 요약을 표시할 수 있다.", "본문은 보고서 전체에서 맨 끝에 한 번만 출력된다."],a:3,e:"본문은 <b>레코드마다 반복</b> 출력된다. 맨 끝 한 번은 보고서 바닥글이다."},
  {s:"데이터베이스",q:"다음 중 인덱스(Index)에 대한 설명으로 옳지 않은 것은?",o:["인덱스를 설정하면 검색·정렬 속도가 빨라진다.", "기본키를 지정하면 자동으로 인덱스가 만들어진다.", "인덱스를 '예(중복 불가)'로 하면 해당 필드에 중복 값을 넣을 수 없다.", "인덱스를 많이 만들수록 데이터 추가·수정 속도가 빨라진다."],a:3,e:"인덱스가 많으면 <b>추가·수정 시 인덱스도 갱신해야 해 느려진다</b>."},
  {s:"데이터베이스",q:"다음 중 폼의 '추가 가능(Allow Additions)' 속성에 대한 설명으로 옳은 것은?",o:["'아니요'로 설정하면 새 레코드를 입력(추가)할 수 없다.", "'아니요'로 설정하면 기존 레코드를 삭제할 수 없다.", "'아니요'로 설정하면 기존 레코드를 편집할 수 없다.", "'아니요'로 설정하면 폼이 읽기 전용으로 완전히 바뀐다."],a:0,e:"'추가 가능=아니요'는 '새 레코드 추가'만 막는다. 기존 레코드의 편집·삭제는 각각 '편집 가능'·'삭제 가능'이 제어한다."},
  {s:"데이터베이스",q:"다음 중 제3정규형(3NF)에 대한 설명으로 옳은 것은?",o:["제2정규형을 만족하면서 '이행적 함수 종속'을 제거한 상태이다.", "모든 속성이 원자값만 갖도록 한 상태이다.", "부분 함수 종속만 제거한 상태이다.", "모든 결정자가 후보 키가 되도록 한 상태이다."],a:0,e:"3NF는 2NF를 만족하면서 '이행적 함수 종속(A→B→C)'을 제거한 형태이다. ②는 1NF, ③은 2NF, ④는 BCNF에 대한 설명이다."},
  {s:"데이터베이스",q:"다음 중 폼의 '레코드 원본(Record Source)' 속성에 대한 설명으로 옳지 않은 것은?",o:["폼에 표시할 테이블이나 쿼리를 지정한다.", "SQL 문을 직접 입력해 레코드 원본으로 쓸 수 있다.", "레코드 원본을 비우면 바운드 컨트롤에 값이 표시되지 않는다.", "레코드 원본은 컨트롤의 글꼴 색을 지정하는 속성이다."],a:3,e:"레코드 원본은 폼이 표시할 데이터(테이블·쿼리·SQL)를 지정하는 속성이다. 글꼴 색과는 무관하다."},
  {s:"데이터베이스",q:"다음 중 SQL의 WHERE와 HAVING 절에 대한 설명으로 옳은 것은?",o:["WHERE는 그룹화 전 개별 행을, HAVING은 그룹화 후 집계 결과를 조건으로 거른다.", "WHERE 절에는 집계 함수를 사용할 수 있다.", "HAVING은 GROUP BY 없이 단독으로 개별 행을 거른다.", "WHERE와 HAVING은 기능이 완전히 같아 바꿔 써도 된다."],a:0,e:"WHERE는 그룹화 이전 개별 레코드 조건(집계 함수 불가), HAVING은 GROUP BY로 묶은 뒤 집계 결과에 대한 조건을 건다."},
  {s:"데이터베이스",q:"다음 중 Access 보고서의 구역(Section)에 대한 설명으로 옳지 않은 것은?",o:["'보고서 머리글'은 보고서의 맨 처음에 한 번만 인쇄된다.", "'페이지 머리글'은 매 페이지 상단에 반복 인쇄된다.", "'그룹 머리글'은 그룹이 바뀔 때마다 인쇄된다.", "'본문'은 보고서 맨 끝에 한 번만 인쇄된다."],a:3,e:"'본문'은 레코드마다 반복 인쇄되는 구역이다. 보고서 맨 끝에 한 번 인쇄되는 것은 '보고서 바닥글'이다."},
  {s:"데이터베이스",q:"다음 중 Access의 데이터 형식에 대한 설명으로 옳지 않은 것은?",o:["'일련 번호'는 레코드가 추가될 때 자동으로 1씩 증가하는 값이 부여된다.", "'예/아니요'는 True/False 같은 두 가지 값만 저장한다.", "'긴 텍스트(메모)'는 최대 255자까지만 저장할 수 있다.", "'하이퍼링크'는 웹 주소나 파일 경로를 저장한다."],a:2,e:"짧은 텍스트가 최대 255자이고, '긴 텍스트(메모)'는 약 63,999자(최대 1GB)까지 저장할 수 있다."},
