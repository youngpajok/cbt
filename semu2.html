<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영파족 CBT · 전산세무 2급 이론 모의고사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@600;700;900&display=swap" rel="stylesheet">
<style>
:root{
 --navy:#173C7C;--navy-d:#0E2756;--navy-2:#1C4E9C;--gold:#F2C94C;--gold-d:#B8891A;--gold-l:#FDF7E8;--gold-b:#ECD08A;
 --bg:#F5F2EB;--paper:#FFFFFF;--line:#E6E0D2;--txt:#1E2433;--sub:#6B7080;
 --red:#C62828;--red-l:#FDECEC;--green:#2E7D32;--green-l:#E9F5EA;
 --sans:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;--serif:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{font-family:var(--sans);background:var(--bg);color:var(--txt);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}

/* ---------- 헤더 ---------- */
header{background:var(--navy-d);border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:6}
header .in{max-width:880px;margin:0 auto;padding:.65rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:.6rem}
.brand{display:flex;align-items:center;gap:.55rem;text-align:left}
.badge-logo{display:inline-flex;align-items:center;gap:.35rem;background:rgba(14,39,86,.6);border:1.5px solid #B8913A;border-radius:999px;padding:.45rem 1.1rem;color:#fff;font-weight:700;font-size:.88rem;letter-spacing:.04em;white-space:nowrap}
.badge-logo:hover{border-color:var(--gold)}
.badge-logo .y{color:var(--gold);font-weight:900}
.badge-logo i{font-style:normal;color:#fff}
.badge-logo .s b{color:var(--gold);font-weight:900}
.cbt{font-size:.72rem;font-weight:900;letter-spacing:.12em;color:var(--navy-d);background:var(--gold);padding:.2rem .45rem;border-radius:4px}
.hbtn{display:flex;gap:.3rem}
.hbtn button{border:1px solid rgba(255,255,255,.28);color:#fff;padding:.35rem .55rem;font-size:.8rem;border-radius:6px}
.hbtn button:hover{border-color:var(--gold);color:var(--gold)}

.wrap{width:100%;max-width:880px;margin:0 auto;padding:1.1rem 1rem 1.5rem;flex:1}

/* ---------- 공통 패널 ---------- */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:1.25rem;margin-bottom:1rem;box-shadow:0 1px 2px rgba(23,60,124,.04)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.95rem}
.ph h2{font-family:var(--serif);font-size:1.12rem;font-weight:700;color:var(--navy-d);display:flex;align-items:center;gap:.5rem}
.ph h2::before{content:"";width:.5rem;height:.5rem;background:var(--gold);transform:rotate(45deg);flex:none}
.ph small{font-size:.8rem;color:var(--sub)}

/* ---------- 히어로 ---------- */
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,#0F1D44 0%,#162D63 55%,#1B3A7A 100%);border-radius:18px;padding:1.8rem 1.6rem;margin-bottom:1rem;color:#fff;display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;min-height:300px}
.hero::before,.rhero::before{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.06);right:-90px;top:-130px}
.hero::after,.rhero::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.05);left:-110px;bottom:-160px;pointer-events:none}
.hero .pillb{margin-bottom:1rem}
.greet{display:inline-block;margin:.2rem 0 .7rem;font-size:.86rem;color:#fff;background:rgba(242,201,76,.14);border:1px solid rgba(242,201,76,.45);border-radius:8px;padding:.35rem .7rem}
.greet b{color:var(--gold)}
.log .who{font-weight:700;color:var(--gold-d);font-size:.78rem}
.qd{display:block;margin:.7rem 0 .1rem;padding:.75rem .95rem;background:var(--gold-l);border:1px solid var(--gold-b);border-radius:8px;font-size:.93em;line-height:1.8;font-weight:400}
.qt{width:100%;border-collapse:collapse;margin:.7rem 0 .1rem;font-size:.86em;font-weight:400;table-layout:fixed}
.qt td,.qt th{word-break:keep-all;overflow-wrap:anywhere}
@media(max-width:600px){.qt{font-size:.68em}.qt th,.qt td{padding:.35rem .1rem}.qt th:nth-child(1){width:24%}.qt th:nth-child(2){width:17%}.qt th:nth-child(3){width:25%}.qt th:nth-child(4){width:20%}.qt th:nth-child(5){width:14%}}
.qt th,.qt td{border:1px solid var(--line);padding:.4rem .3rem;text-align:center}
.qt th{background:var(--navy);color:#fff;font-weight:700}
.buy{position:relative;display:inline-flex;align-items:center;gap:.85rem;margin-top:1.2rem;padding:.75rem 1.1rem .75rem .8rem;border-radius:14px;text-decoration:none;color:var(--navy-d);
 background:linear-gradient(135deg,#FBE7A6 0%,#F2C94C 45%,#D9A53A 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 6px 18px rgba(0,0,0,.28);overflow:hidden;transition:transform .15s,box-shadow .15s}
.buy::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);transition:left .6s}
.buy:hover{transform:translateY(-2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 10px 24px rgba(0,0,0,.32)}
.buy:hover::after{left:120%}
.buy .bi{width:2.4rem;height:2.4rem;border-radius:10px;background:var(--navy-d);color:var(--gold);display:flex;align-items:center;justify-content:center;flex:none}
.buy .bi svg{width:1.3rem;height:1.3rem}
.buy .bt{display:flex;flex-direction:column;line-height:1.3;text-align:left}
.buy .bt small{font-size:.7rem;font-weight:700;letter-spacing:.08em;color:#6A4A0C}
.buy .bt b{font-size:1rem;font-weight:900;letter-spacing:-.01em}
.buy .ba{margin-left:.3rem;font-size:.82rem;font-weight:900;padding:.3rem .6rem;border-radius:999px;background:var(--navy-d);color:var(--gold);white-space:nowrap}
.promo{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;background:#fff;border:1.5px solid var(--gold-b);border-radius:14px;padding:1.15rem 1.3rem;margin-bottom:1rem;background-image:linear-gradient(120deg,#FFFBF0 0%,#FFFFFF 60%)}
.promo::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(#F2C94C,#C8962A)}
.promo .pt{flex:1;min-width:15rem}
.promo .pk{font-size:.72rem;font-weight:900;letter-spacing:.12em;color:var(--gold-d)}
.promo h3{font-size:1.08rem;font-weight:900;color:var(--navy-d);margin:.2rem 0 .3rem;word-break:keep-all}
.promo p{font-size:.85rem;color:var(--sub);line-height:1.6;word-break:keep-all}
.promo .pkg{display:flex;gap:.3rem;margin-top:.5rem;flex-wrap:wrap}
.promo .pkg span{font-size:.68rem;font-weight:900;letter-spacing:.08em;color:var(--navy);border:1px solid var(--navy);border-radius:4px;padding:.12rem .4rem}
.promo .buy{margin-top:0}
footer .fl{display:inline-block;margin-top:.45rem;color:var(--gold-d);font-weight:700;text-decoration:none;border-bottom:1px solid var(--gold-b)}
footer .fl:hover{color:var(--navy)}
footer .fy{display:inline-flex;align-items:center;gap:.4rem;margin-top:.5rem;color:var(--sub);text-decoration:none;font-size:.8rem}
footer .fy b{color:var(--navy-d)}footer .fy:hover b{text-decoration:underline}
footer .fy svg{width:1.35rem;height:auto;display:block}
.ctas{display:flex;align-items:stretch;gap:.6rem;flex-wrap:wrap;margin-top:1.2rem}
.ctas .buy{margin-top:0}
.yt{display:inline-flex;align-items:center;gap:.6rem;padding:.6rem 1rem;border-radius:14px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;text-decoration:none;transition:background .15s,border-color .15s}
.yt:hover{background:rgba(255,255,255,.15);border-color:#fff}
.yt svg{width:2rem;height:auto;flex:none}
.yt span{display:flex;flex-direction:column;line-height:1.3}
.yt small{font-size:.68rem;color:rgba(255,255,255,.75);font-weight:700;letter-spacing:.04em}
.yt b{font-size:.92rem;font-weight:900}
.ytl{display:inline-flex;align-items:center;gap:.4rem;margin-top:.6rem;font-size:.82rem;font-weight:700;color:var(--navy);text-decoration:none}
.ytl svg{width:1.3rem;height:auto}.ytl:hover{text-decoration:underline}
@media(max-width:600px){.ctas{flex-direction:column}.yt{justify-content:center}.buy{width:100%}.buy .bt b{font-size:.92rem}.promo .buy{width:100%}}
.seg{grid-template-columns:repeat(3,1fr)}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;margin-bottom:1rem}
.sc-card{position:relative;border:1.5px solid var(--line);border-radius:12px;padding:.9rem .9rem .8rem;text-align:left;background:#fff;display:flex;flex-direction:column;gap:.15rem;transition:border-color .15s}
.sc-card:hover{border-color:var(--gold-d)}
.sc-card.on{border-color:var(--navy);background:#EEF2FA;box-shadow:inset 0 -3px 0 var(--gold)}
.sc-card .sn{font-weight:900;color:var(--navy-d);font-size:1.02rem}
.sc-card .sm,.sc-card .sa{font-size:.78rem;color:var(--sub)}
.sc-card .mini{height:4px;background:#E2DFD6;border-radius:4px;overflow:hidden;margin-top:.35rem}.sc-card .mini div{height:100%;background:var(--gold)}
.sc-card .ck{position:absolute;top:.6rem;right:.6rem;width:1.3rem;height:1.3rem;border-radius:50%;border:1.5px solid var(--line);font-size:.72rem;display:flex;align-items:center;justify-content:center;color:transparent;background:#fff}
.sc-card.on .ck{background:var(--navy);border-color:var(--navy);color:var(--gold)}
.weak{align-self:flex-start;font-size:.64rem;font-weight:900;color:#fff;background:var(--red);padding:.1rem .45rem;border-radius:4px;margin-bottom:.2rem}
.opt{display:flex;align-items:center;gap:.7rem;margin-bottom:.6rem;flex-wrap:wrap}
.ol{width:5rem;font-size:.85rem;font-weight:700;color:var(--navy-d);flex:none}
.chipg{display:flex;gap:.35rem;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:.38rem .85rem;font-size:.82rem;background:#fff}
.chip:hover{border-color:var(--navy)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.sgo{width:100%;margin-top:.7rem;padding:.95rem;border-radius:10px;background:var(--navy);color:#fff;font-weight:900;font-size:1rem;box-shadow:inset 0 -3px 0 var(--gold)}
.sgo:hover{background:var(--navy-2)}.sgo span{color:var(--gold)}
@media(max-width:600px){.seg{grid-template-columns:1fr!important}.sgrid{grid-template-columns:repeat(2,1fr)}.ol{width:100%}#subjP .ph small{display:none}}
.upd{display:inline-block;font-size:.7rem;font-weight:900;color:var(--navy-d);background:var(--gold);padding:.1rem .45rem;border-radius:4px;margin-right:.35rem;vertical-align:1px}
.oth{display:grid;gap:.5rem;margin:0 0 .35rem;padding:.45rem .8rem .45rem calc(3.15rem + 1.5px);font-size:.8rem;font-weight:700;color:#fff;background:var(--navy);border-radius:8px}
.oth span{text-align:center}.oth.tl span:first-child{text-align:left}
.ot{flex:1;display:grid;gap:.5rem;align-items:center;min-width:0}
.ot span{text-align:center;border-left:1px dashed var(--line);padding:0 .2rem;word-break:keep-all;overflow-wrap:anywhere}
.ot span:first-child{border-left:0}.ot.tl span:first-child{text-align:left}
.otx{flex:1;min-width:0}
.inv{display:grid;grid-template-columns:1.2fr 1fr .9fr 1.3fr;border:1px solid var(--line);border-radius:6px;overflow:hidden;font-size:.82em;background:#fff;margin:.1rem 0;font-weight:400;color:var(--txt)}
.inv span{padding:.3rem .3rem;text-align:center;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.inv span:nth-child(4n+1){border-left:0}
.inv .h{background:#EEF2FA;color:var(--navy-d);font-weight:700;border-top:0}
.inv .neg{color:var(--red);font-weight:700}
.invl{display:block;font-size:.72rem;font-weight:700;color:var(--sub);margin:.25rem 0 .1rem}
@media(max-width:600px){.ot.tl{font-size:.8em}.oth{font-size:.72rem;padding-left:calc(2.95rem + 1.5px);gap:.3rem}.ot{gap:.3rem;font-size:.92em}.inv{font-size:.72em}}
.grs{display:flex;gap:1rem;flex-wrap:wrap;margin:.7rem 0 .2rem}
.grs figure{margin:0;text-align:center;font-size:.85rem;color:var(--sub);font-weight:400}
.gr{width:9.5rem;height:auto;display:block;background:#fff;border:1px solid var(--line);border-radius:6px}
.gopt{display:flex;align-items:center;gap:.9rem}.gopt b{min-width:5.5rem}.gopt .gr{width:7.5rem}
.hero .gbar{width:3.2rem;height:3px;background:var(--gold);border-radius:2px;margin:.2rem 0 1rem}
.stats{display:flex;gap:.55rem;flex-wrap:wrap}
.stats div{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);border-radius:10px;padding:.55rem .85rem;text-align:center;min-width:5.4rem}
.stats b{display:block;color:var(--gold);font-size:1.15rem;font-weight:900}
.stats span{font-size:.74rem;color:rgba(255,255,255,.8)}
.hero .hx{position:relative;z-index:1;align-self:center}
.eyebrow{display:block;font-size:.85rem;font-weight:500;color:rgba(255,255,255,.8);margin-bottom:.35rem}
.hero h1{font-size:2.3rem;line-height:1.25;font-weight:900;margin-bottom:.4rem;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p{font-size:.92rem;color:rgba(255,255,255,.82);margin-bottom:1rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chips span{font-size:.78rem;font-weight:700;padding:.3rem .65rem;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(242,201,76,.55);color:#fff}
.hero .char{position:relative;z-index:1;width:200px;flex:none;margin:-.6rem .4rem -1.8rem 0;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
.char img,.char svg{width:100%;height:auto;display:block}

/* ---------- 설정 ---------- */
.fld{display:flex;align-items:center;gap:.7rem;margin-bottom:.85rem;font-size:.92rem;font-weight:500}
.fld input{flex:1;padding:.65rem .8rem;border:1px solid var(--line);border-radius:8px;background:#FCFBF8}
.fld input:focus{outline:none;border-color:var(--gold-d);box-shadow:0 0 0 3px rgba(242,201,76,.25)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:.55rem;margin-bottom:.8rem}
.seg button{border:1.5px solid var(--line);padding:.8rem .9rem;border-radius:10px;text-align:left;font-weight:700;background:#fff}
.seg button small{display:block;font-weight:400;font-size:.78rem;color:var(--sub);margin-top:.15rem}
.seg button.on{border-color:var(--navy);background:var(--navy);color:#fff;box-shadow:inset 0 -3px 0 var(--gold)}
.seg button.on small{color:rgba(255,255,255,.75)}
.chk{display:flex;align-items:center;gap:.5rem;font-size:.92rem}
.chk input{width:1.1rem;height:1.1rem;accent-color:var(--navy)}

/* ---------- 회차 카드 ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.65rem}
.rd{position:relative;border:1px solid var(--line);border-radius:12px;padding:.85rem .9rem .8rem;text-align:left;display:flex;flex-direction:column;gap:.2rem;background:#fff;transition:border-color .15s,transform .15s}
.rd:hover{border-color:var(--gold-d);transform:translateY(-2px)}
.rd .rn{font-family:var(--serif);font-size:1.3rem;font-weight:900;color:var(--navy-d)}
.rd .rs{font-size:.78rem;color:var(--sub)}
.rd .rb{font-size:.82rem;font-weight:700;color:var(--sub);margin-top:.25rem}
.rd .rb.done{color:var(--navy)}
.rd .mini{height:4px;background:#EEE9DC;border-radius:4px;overflow:hidden;margin-top:.35rem}
.rd .mini div{height:100%;background:var(--gold)}
.rd .new{position:absolute;top:.6rem;right:.6rem;font-size:.66rem;font-weight:900;color:var(--navy-d);background:var(--gold);padding:.12rem .4rem;border-radius:4px}
.rd.done-card{border-color:var(--gold-b);background:var(--gold-l)}
.rd.off{background:#F7F5F0;cursor:default}.rd.off:hover{border-color:var(--line);transform:none}
.rd.off .rn{color:#B5B2A8}

.sp{display:grid;grid-template-columns:1fr 1fr;gap:.65rem}
.spb{border:1.5px solid var(--gold-b);border-radius:12px;padding:1rem;text-align:left;background:var(--gold-l);display:flex;gap:.75rem;align-items:center}
.spb:hover{border-color:var(--gold-d)}
.spb .ic{width:2.4rem;height:2.4rem;border-radius:10px;background:var(--navy);color:var(--gold);display:flex;align-items:center;justify-content:center;flex:none}
.spb .ic svg{width:1.3rem;height:1.3rem}
.spb b{display:block;color:var(--navy-d);font-size:1rem}.spb span{font-size:.8rem;color:var(--sub)}

/* ---------- 기록 ---------- */
.bars{display:flex;flex-direction:column;gap:.6rem;margin-bottom:.9rem}
.br{display:grid;grid-template-columns:5.6rem 1fr 5rem;align-items:center;gap:.6rem;font-size:.86rem}
.br .tr{height:.6rem;background:#EEE9DC;border-radius:6px;overflow:hidden}
.br .fl{height:100%;background:var(--navy)}.br .fl.lo{background:#D9675F}
.br .pc{text-align:right;color:var(--sub);font-variant-numeric:tabular-nums}
.log{font-size:.84rem;border-top:1px solid var(--line)}
.log .lr{display:grid;grid-template-columns:1fr auto auto;gap:.8rem;padding:.55rem 0;border-bottom:1px dashed var(--line);align-items:center}
.log .lr b{font-weight:700;color:var(--navy-d)}
.log .lr .t{color:var(--sub);font-size:.78rem}
.log .lr .sc{font-weight:700;font-variant-numeric:tabular-nums}
.empty-t{font-size:.88rem;color:var(--sub);margin-bottom:.6rem}
.btn-o{border:1.5px solid var(--navy);color:var(--navy);padding:.45rem .8rem;border-radius:8px;font-size:.84rem;font-weight:700;background:#fff}
.btn-o:hover{background:var(--navy);color:#fff}
.link{font-size:.8rem;color:var(--sub);text-decoration:underline;margin-top:.6rem}
.msg{min-height:1.3rem;font-size:.86rem;color:var(--red);margin-top:.5rem}

/* ---------- 시험 화면 ---------- */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:.7rem;margin-bottom:.85rem;flex-wrap:wrap}
.qtitle{display:flex;align-items:center;gap:.7rem}
.qtitle .mini-char{width:3.4rem;height:3.4rem;border-radius:50%;background:var(--navy);border:2px solid var(--gold);overflow:hidden;flex:none}
.qtitle .mini-char img{width:100%;height:100%;object-fit:cover;object-position:50% 50%}
.stitle{font-family:var(--serif);font-size:1.15rem;font-weight:900;color:var(--navy-d)}
.qhead small{font-size:.78rem;color:var(--sub)}
.timer{display:flex;align-items:center;gap:.65rem;background:#fff;padding:.55rem 1rem;border:1px solid var(--line);border-radius:10px;font-size:.88rem;line-height:1.5}
.timer svg{width:1.7rem;height:1.7rem;color:var(--navy)}
.timer b{margin-right:.35rem;color:var(--navy-d)}
#tm{color:var(--red);font-weight:700;font-variant-numeric:tabular-nums}
.timer.warn{border-color:var(--red);background:var(--red-l)}
.pbadge{background:var(--gold-l);border:1px solid var(--gold-b);color:var(--gold-d);font-size:.84rem;font-weight:700;padding:.45rem .85rem;border-radius:8px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.qbox{padding:1.5rem 1.5rem 1rem;min-height:300px}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--sub);margin-bottom:.8rem;gap:.5rem}
.tag{background:var(--navy);color:#fff;padding:.18rem .65rem;border-radius:6px;font-weight:700;font-size:.76rem}
.qno{font-variant-numeric:tabular-nums;font-weight:700;color:var(--navy-d)}
.star{border:1px solid var(--line);border-radius:999px;padding:.22rem .75rem;font-size:.8rem;color:var(--sub)}
.star.on{border-color:var(--gold-d);background:var(--gold-l);color:var(--gold-d);font-weight:700}
.src{font-size:.78rem;color:var(--sub);margin-bottom:.4rem}
.qtext{font-size:1.1rem;line-height:1.8;margin-bottom:1.15rem;word-break:keep-all;font-weight:500}
.qtext .n{font-family:var(--serif);font-weight:900;color:var(--navy);margin-right:.25rem}
.op{display:flex;gap:.75rem;align-items:flex-start;width:100%;text-align:left;padding:.65rem .8rem;margin-bottom:.4rem;font-size:1.04rem;line-height:1.6;border-radius:10px;border:1.5px solid transparent;word-break:keep-all}
.op:hover{background:#F8F6F0}
.op.sel{background:#EEF2FA;border-color:var(--navy);color:var(--navy-d);font-weight:700}
.op.ok{background:var(--green-l);border-color:var(--green);color:var(--green);font-weight:700}
.op.ng{background:var(--red-l);border-color:var(--red);color:var(--red)}
.num{flex:none;width:1.6rem;height:1.6rem;border-radius:50%;border:1.5px solid #A5A9B4;display:inline-flex;align-items:center;justify-content:center;font-size:.84rem;margin-top:.12rem;font-weight:500;color:#555;background:#fff}
.sel .num,.num.on{background:var(--navy);border-color:var(--navy);color:#fff}
.ok .num{background:var(--green);border-color:var(--green);color:#fff}
.ng .num{background:var(--red);border-color:var(--red);color:#fff}
.op{position:relative}
.op .lbl{position:absolute;right:.6rem;top:-.8rem;z-index:1;font-size:.76rem;font-weight:700;padding:.15rem .6rem;border-radius:10px;color:#fff;white-space:nowrap}
.op.ok .lbl{background:var(--green)}.op.ng .lbl{background:var(--red)}
.exp{margin-top:.85rem;padding:.85rem 1rem;font-size:.94rem;line-height:1.75;border-left:4px solid;border-radius:0 8px 8px 0}
.exp.g{background:var(--green-l);border-color:var(--green)}.exp.r{background:var(--red-l);border-color:var(--red)}
.exp .eh{display:block;font-weight:700;margin-bottom:.2rem}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;padding:1rem 1.5rem 1.4rem;border-top:1px solid var(--line);background:#FCFBF8}
.nav button{padding:.9rem;font-size:1.02rem;font-weight:700;border-radius:10px}
.prev{background:#fff;border:1.5px solid var(--navy)!important;color:var(--navy)}
.next{background:var(--navy);color:#fff}

.tool{background:var(--navy-d);border-top:3px solid var(--gold);padding:.75rem 1rem;position:sticky;bottom:0;z-index:5}
.tool .in{max-width:880px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}
.tool button{border:1px solid rgba(255,255,255,.25);color:#E9ECF3;padding:.7rem .2rem;font-size:.88rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:.35rem;border-radius:8px}
.tool button:hover{border-color:var(--gold);color:var(--gold)}
.tool button svg{width:1.15rem;height:1.15rem;flex:none}
.tool .submit{background:var(--gold);border-color:var(--gold);color:var(--navy-d)}
.tool .submit:hover{color:var(--navy-d);filter:brightness(1.05)}

/* ---------- 답안 표기란 ---------- */
.omr-bg{position:fixed;inset:0;background:rgba(14,39,86,.65);display:none;align-items:flex-start;justify-content:center;padding:1.5rem .7rem;overflow:auto;z-index:10}
.omr-bg.show{display:flex}
.omr{background:#fff;width:100%;max-width:440px;border-radius:14px;overflow:hidden;border:2px solid var(--gold)}
.omr-h{background:var(--navy);color:var(--gold);font-family:var(--serif);font-size:1.25rem;font-weight:900;padding:1rem 1.3rem;display:flex;justify-content:space-between;align-items:center}
.omr-h button{color:#fff;font-size:1.8rem;line-height:1}
.row{display:flex;border-top:1px solid #EEE9DC}
.row .no{width:4.4rem;background:var(--gold-l);font-size:1.2rem;padding:.85rem 0;font-weight:700;position:relative;color:var(--navy-d)}
.row .no.empty{color:var(--red)}
.row .no i{position:absolute;top:.15rem;right:.3rem;font-style:normal;font-size:.78rem;color:var(--gold-d)}
.row .bubbles{display:flex;align-items:center;gap:1.2rem;padding:0 1.2rem}
.row .num{width:2rem;height:2rem;cursor:pointer}
.omr-f{padding:.75rem 1rem;font-size:.78rem;color:var(--sub);border-top:1px solid #EEE9DC}
.row.cur .no,.row.cur{background:#FCEFC7}
.side{display:none}
.side-h{background:var(--navy);color:var(--gold);font-family:var(--serif);font-weight:900;font-size:1.05rem;padding:.8rem 1rem;display:flex;justify-content:space-between;align-items:center}
.side-h small{font-family:var(--sans);font-size:.78rem;font-weight:700;color:#fff}
.side-p{height:4px;background:rgba(255,255,255,.15)}.side-p div{height:100%;background:var(--gold)}
@media(min-width:960px){
 body.exam-on .wrap,body.exam-on .tool .in,body.exam-on header .in{max-width:1200px}
 .side .row .bubbles{flex:1;justify-content:space-around}
 .xlay{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:1rem;align-items:start}
 .side{display:block;position:sticky;top:5rem;background:#fff;border:2px solid var(--gold);border-radius:14px;overflow:hidden;max-height:calc(100vh - 6rem);overflow-y:auto}
 .side .row .no{width:3.2rem;font-size:1rem;padding:.5rem 0}
 .side .row .bubbles{gap:.7rem;padding:0 .9rem}
 .side .row .num{width:1.75rem;height:1.75rem;font-size:.8rem}
 body.exam-on #b2{display:none}
 body.exam-on .tool .in{grid-template-columns:repeat(3,1fr)}
}

/* ---------- 결과 ---------- */
.rhero{position:relative;overflow:hidden;background:linear-gradient(160deg,#0F1D44 0%,#162D63 55%,#1B3A7A 100%);border-radius:18px;color:#fff;padding:1.5rem 1.6rem;margin-bottom:1rem;display:flex;justify-content:space-between;align-items:flex-end;gap:1rem}

.rhero .rx{position:relative;z-index:1;align-self:center}
.rhero .lab{font-size:.84rem;font-weight:700;color:var(--gold);letter-spacing:.06em}
.rhero .big{font-family:var(--serif);font-weight:900;line-height:1;margin:.35rem 0 .45rem;display:flex;align-items:baseline;gap:.4rem}
.rhero .big b{font-size:4rem;color:var(--gold)}
.rhero .big span{font-size:1.5rem;color:rgba(255,255,255,.85)}
.rhero .cap{font-size:.86rem;color:rgba(255,255,255,.82);margin-bottom:.7rem}
.pill{display:inline-block;font-size:.82rem;font-weight:700;padding:.3rem .75rem;border-radius:999px}
.pill.ok{background:var(--gold);color:var(--navy-d)}.pill.no{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);color:#fff}
.rhero .rc{position:relative;z-index:1;display:flex;flex-direction:column;align-items:flex-end;flex:none;width:200px;margin-bottom:-1.6rem}
.bubble{position:relative;background:#fff;color:var(--navy-d);font-size:.82rem;font-weight:700;line-height:1.5;padding:.55rem .75rem;border-radius:12px;border:2px solid var(--gold);margin-bottom:.4rem;max-width:200px;word-break:keep-all}
.bubble::after{content:"";position:absolute;bottom:-9px;right:46px;border:8px solid transparent;border-top-color:var(--gold);border-bottom:0}
.rhero .char{width:120px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-bottom:1rem}
.metrics div{background:#FCFBF8;border:1px solid var(--line);border-radius:10px;padding:.85rem;text-align:center}
.metrics small{display:block;font-size:.78rem;color:var(--sub);margin-bottom:.15rem}
.metrics b{font-family:var(--serif);font-size:1.45rem;font-weight:900;color:var(--navy-d)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:.55rem}
.acts button{padding:.85rem;font-weight:700;border:1.5px solid var(--navy);color:var(--navy);border-radius:10px;background:#fff}
.acts button.fill{background:var(--navy);color:#fff}
.acts button.kakao{background:#FEE500;border-color:#FEE500;color:#191919}
.acts button.kakao:hover{filter:brightness(.97)}
.acts button.gold{background:var(--gold);border-color:var(--gold);color:var(--navy-d)}
.ri{border-top:1px solid var(--line);padding:1rem 0}
.ri h3{font-size:.98rem;display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem;flex-wrap:wrap;color:var(--navy-d)}
.sbadge{font-size:.74rem;padding:.14rem .55rem;border-radius:6px;font-weight:700}
.ok-b{background:var(--green-l);color:var(--green)}.no-b{background:var(--red-l);color:var(--red)}
.ri .q{font-size:.94rem;line-height:1.65;margin-bottom:.35rem;color:#333}
.ri .a{font-size:.86rem;color:var(--sub);margin-bottom:.4rem}
.ri .e{font-size:.94rem;line-height:1.75;background:var(--gold-l);padding:.8rem .9rem;border-left:3px solid var(--gold-d);border-radius:0 8px 8px 0}

/* ---------- 전체 응시결과 ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th{background:var(--navy);color:#fff;font-weight:700;padding:.6rem .4rem;font-size:.8rem}
.tbl th:first-child{border-radius:8px 0 0 0}.tbl th:last-child{border-radius:0 8px 0 0}
.tbl td{padding:.6rem .4rem;border-bottom:1px solid var(--line);text-align:center;font-variant-numeric:tabular-nums}
.tbl td.rn{font-family:var(--serif);font-weight:900;color:var(--navy-d)}
.tbl td .sc{font-weight:700;color:var(--navy-d)}
.tbl td .sb{height:4px;background:#EEE9DC;border-radius:4px;overflow:hidden;margin-top:.25rem}
.tbl td .sb div{height:100%;background:var(--gold)}
.tbl tr.na td{color:#B5B2A8}
.tbl tr.go{cursor:pointer}.tbl tr.go:hover td{background:var(--gold-l)}

footer{text-align:center;font-size:.78rem;color:var(--sub);padding:1.1rem;border-top:1px solid var(--line)}
footer b{color:var(--navy-d)}

@media(max-width:600px){
 .badge-logo{font-size:.78rem;padding:.4rem .8rem}.cbt{display:none}
 .hero{padding:1.4rem 1.2rem;min-height:210px}.hero h1{font-size:1.65rem}
 .hero .char{position:absolute;right:.2rem;top:.6rem;bottom:auto;width:96px;margin:0}
 .hero .hx{padding-right:0;width:100%}.hero h1,.hero .eyebrow,.hero .greet{margin-right:6rem}.hero .buy{width:100%}.buy .bt small{font-size:.64rem}.hero h1{font-size:1.5rem}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.35rem}.stats div{min-width:0;padding:.45rem .2rem}.stats span{font-size:.66rem}.hero .pillb{display:none}.stats b{font-size:1rem}
 .qbox{padding:1.2rem 1rem .8rem}.nav{padding:.9rem 1rem 1.1rem}
 .tool button{flex-direction:column;font-size:.76rem;gap:.2rem;padding:.55rem .1rem}
 .timer{width:100%}.sp,.acts{grid-template-columns:1fr}
 .rhero{padding:1.3rem 1.1rem}.rhero .big b{font-size:3.2rem}
 .rhero .rc{width:130px}.rhero .char{width:110px}.bubble{font-size:.74rem;max-width:150px}
 .grid{grid-template-columns:repeat(2,1fr)}
 .tbl{font-size:.8rem}.tbl .hide-m{display:none}
 .log .lr{grid-template-columns:1fr auto}.log .lr .t{grid-column:1/-1}
}
